// ── LIBRARY ITEM ADDER ──────────────────────────────────────
// Shared by wizard equipment step and inventory tab.
// Two tabs: browse the weapon/gear library (with stats) or
// type a custom item.
// ────────────────────────────────────────────────────────────
const CATEGORY_LABELS = {
  simpleWeapon:     "Simple Weapons",
  simpleRanged:     "Simple Ranged",
  martialWeapon:    "Martial Weapons",
  martialRanged:    "Martial Ranged",
  lightArmor:       "Light Armor",
  mediumArmor:      "Medium Armor",
  heavyArmor:       "Heavy Armor",
  shield:           "Shields",
  musicalInstrument:"Musical Instruments",
  arcaneFocus:      "Arcane Foci",
  druidicFocus:     "Druidic Foci",
  holySymbol:       "Holy Symbols",
  artisanTool:      "Artisan's Tools",
  gamingSet:        "Gaming Sets",
  tool:             "Tools",
};

function LibraryItemAdder({ gameData, onAdd }) {
  const { weapons:weaponLib=[], gear:gearLib=[], armor:armorLib=[], itemTypes={} } = gameData;
  const [tab, setTab]           = useState("library");
  const [category, setCategory] = useState("simpleWeapon");
  const [search, setSearch]     = useState("");
  const [customName, setCustomName] = useState("");
  const [customType, setCustomType] = useState("weapon");
  const [customDesc, setCustomDesc] = useState("");
  const [qty, setQty]           = useState(1);
  const [added, setAdded]       = useState(null);

  const allLibrary = [...weaponLib, ...armorLib, ...gearLib];
  const categories = [...new Set(allLibrary.map(i => i.category))];

  const inCategory = allLibrary.filter(it =>
    it.category === category &&
    (!search || it.name.toLowerCase().includes(search.toLowerCase()))
  );

  const flashAdded = name => { setAdded(name); setTimeout(()=>setAdded(null), 1200); };

  const addFromLibrary = it => {
    const isWeapon = !!it.damage;
    const isArmor  = it._lib === "armor" || it.acBase !== undefined;
    const isShield  = it.category === "shield";
    const desc = it.damage
      ? `${it.damage} ${it.damageType}${it.properties?.length?" — "+it.properties.join(", "):""}${it.range?" — Range "+it.range:""}`
      : it.acFormula
        ? `AC: ${it.acFormula}${it.stealthDisadvantage?" — Stealth disadv.":""}${it.strengthReq?` — Str ${it.strengthReq}+ required`:""}`
        : (it.description||"");
    const type = isWeapon ? "weapon" : (isShield ? "shield" : (isArmor ? "armor" : "misc"));
    // Auto-equip: always for weapons; only if slot empty for armor/shield
    const autoEquip = isWeapon; // armor auto-equip handled at add-to-inventory level in onAdd
    onAdd({ id:Date.now()+Math.random(), name:it.name, type, quantity:qty, weight:it.weight||0, description:desc, equipped:autoEquip });
    flashAdded(it.name);
  };

  const addCustom = () => {
    if (!customName) return;
    onAdd({ id:Date.now(), name:customName, type:customType, quantity:qty, weight:0, description:customDesc, equipped:false });
    setCustomName(""); setCustomDesc("");
    flashAdded(customName);
  };

  const inp = { background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"8px 12px", borderRadius:6, fontSize:13, fontFamily:"var(--font-body)", boxSizing:"border-box" };
  const tabBtn = a => ({ padding:"6px 16px", borderRadius:"6px 6px 0 0", cursor:"pointer", fontSize:12, fontFamily:"var(--font-display)", transition:"all 0.15s", marginRight:4, border:`1px solid ${a?"var(--accent)":"var(--border)"}`, borderBottom:a?"1px solid var(--card)":"1px solid var(--border)", background:a?"var(--card)":"var(--surface)", color:a?"var(--accent)":"var(--text-muted)" });

  return (
    <div>
      <div style={{ display:"flex", marginBottom:0 }}>
        <button style={tabBtn(tab==="library")} onClick={()=>setTab("library")}>From Library</button>
        <button style={tabBtn(tab==="custom")}  onClick={()=>setTab("custom")}>Custom</button>
      </div>

      <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:"0 8px 8px 8px", padding:14 }}>

        {/* ── Library tab ── */}
        {tab==="library" && (
          <div>
            {/* Category pills */}
            <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:10 }}>
              {categories.map(cat=>(
                <button key={cat} onClick={()=>{ setCategory(cat); setSearch(""); }} style={{
                  padding:"3px 10px", borderRadius:20, cursor:"pointer", fontSize:11, transition:"all 0.15s",
                  border:`1px solid ${category===cat?"var(--accent)":"var(--border)"}`,
                  background:category===cat?"var(--accent)":"var(--surface)",
                  color:category===cat?"var(--bg)":"var(--text-muted)"
                }}>{CATEGORY_LABELS[cat]||cat}</button>
              ))}
            </div>

            {/* Search */}
            <input style={{...inp,width:"100%",marginBottom:10}} value={search}
              onChange={e=>setSearch(e.target.value)}
              placeholder={`Search ${CATEGORY_LABELS[category]||category}…`}/>

            {/* Item rows */}
            <div style={{ maxHeight:260, overflowY:"auto", display:"flex", flexDirection:"column", gap:4 }}>
              {inCategory.length===0 && <div style={{fontSize:13,color:"var(--text-dim)",padding:"8px 0"}}>No items found.</div>}
              {inCategory.map(it=>(
                  <div key={it.name} style={{ display:"flex", alignItems:"center", gap:10, padding:"7px 10px", background:"var(--surface)", borderRadius:6, border:`1px solid ${added===it.name?"var(--success)":"var(--border)"}`, transition:"border-color 0.3s" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <span style={{ fontSize:13, color:"var(--text)", fontWeight:500 }}>{it.name}</span>
                      <span style={{ fontSize:11, color:"var(--text-muted)", marginLeft:10 }}>
                        {it.damage && <span style={{color:"var(--danger)",marginRight:8}}>{it.damage} {it.damageType}</span>}
                        {it.acFormula && <span style={{color:"var(--info)",marginRight:8}}>AC: {it.acFormula}</span>}
                        {it.properties?.length>0 && <span style={{marginRight:8}}>{it.properties.join(", ")}</span>}
                        {it.range && <span style={{marginRight:8}}>Range {it.range}</span>}
                        {it.stealthDisadvantage && <span style={{color:"#e67e22",marginRight:8}}>Stealth disadv.</span>}
                        {it.strengthReq>0 && <span style={{color:"var(--text-dim)",marginRight:8}}>Str {it.strengthReq}+</span>}
                        {it.weight>0 && <span style={{color:"var(--text-dim)"}}>{it.weight} lb</span>}
                        {!it.damage && !it.acFormula && it.description && <span style={{color:"var(--text-dim)"}}>{it.description}</span>}
                      </span>
                    </div>
                    <button onClick={()=>addFromLibrary(it)} style={{
                      padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer", flexShrink:0,
                      border:`1px solid ${added===it.name?"var(--success)":"var(--accent)"}`,
                      background:added===it.name?"var(--success)":"var(--accent)",
                      color:"var(--bg)", transition:"all 0.2s"
                    }}>{added===it.name?"✓":"+ Add"}</button>
                  </div>
              ))}
            </div>

            {/* Qty */}
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:10, fontSize:12, color:"var(--text-muted)" }}>
              Quantity:
              <button onClick={()=>setQty(q=>Math.max(1,q-1))} style={{...inp,width:26,height:26,padding:0,textAlign:"center",cursor:"pointer",lineHeight:1}}>−</button>
              <span style={{fontFamily:"var(--font-display)",color:"var(--accent)",minWidth:20,textAlign:"center"}}>{qty}</span>
              <button onClick={()=>setQty(q=>q+1)} style={{...inp,width:26,height:26,padding:0,textAlign:"center",cursor:"pointer",lineHeight:1}}>+</button>
            </div>
          </div>
        )}

        {/* ── Custom tab ── */}
        {tab==="custom" && (
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <div>
                <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:4}}>Name</div>
                <input style={{...inp,width:"100%"}} value={customName} onChange={e=>setCustomName(e.target.value)}
                  placeholder="Item name…" onKeyDown={e=>e.key==="Enter"&&addCustom()}/>
              </div>
              <div>
                <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:4}}>Type</div>
                <select style={{...inp,width:"100%"}} value={customType} onChange={e=>setCustomType(e.target.value)}>
                  {Object.entries(itemTypes).map(([k,v])=><option key={k} value={k}>{v.label||k}</option>)}
                </select>
              </div>
            </div>
            <div>
              <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:4}}>Description (optional)</div>
              <input style={{...inp,width:"100%"}} value={customDesc} onChange={e=>setCustomDesc(e.target.value)} placeholder="Stats, notes…"/>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{fontSize:12,color:"var(--text-muted)"}}>Qty:</span>
              <button onClick={()=>setQty(q=>Math.max(1,q-1))} style={{...inp,width:26,height:26,padding:0,textAlign:"center",cursor:"pointer",lineHeight:1}}>−</button>
              <span style={{fontFamily:"var(--font-display)",color:"var(--accent)",minWidth:20,textAlign:"center"}}>{qty}</span>
              <button onClick={()=>setQty(q=>q+1)} style={{...inp,width:26,height:26,padding:0,textAlign:"center",cursor:"pointer",lineHeight:1}}>+</button>
              <button onClick={addCustom} style={{ marginLeft:"auto", padding:"8px 20px", background:"var(--accent)", border:"none", color:"var(--bg)", borderRadius:6, cursor:"pointer", fontFamily:"var(--font-display)", fontSize:13 }}>
                {added?"✓ Added!":"Add to Inventory"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function WizardSpellPicker({ char, setChar, gameData }) {
  const { classes } = gameData;
  const [spellFilter, setSpellFilter] = useState("all");
  const [search, setSearch] = useState("");
  const limits = getSpellLimits(char, classes);
  if (!limits) return <p style={{color:"var(--text-muted)",fontSize:13}}>This class doesn't use spells.</p>;
  const spellList = limits.spellList || char.class;
  const allClassSpells = Array.isArray(gameData?.spells)
    ? gameData.spells.filter(s => (s.classes||[]).includes(spellList))
    : [];
  const known = char.spells || [];
  const knownCantrips = known.filter(s => s.level === 0);
  const knownSpells   = known.filter(s => s.level > 0);
  const canAddCantrip = knownCantrips.length < (limits.cantripsKnown || 0);
  const canAddSpell   = knownSpells.length   < (limits.spellsKnown   || 0);
  const fBtn = a => ({padding:"4px 10px",borderRadius:20,cursor:"pointer",fontSize:12,transition:"all 0.15s",
    border:`1px solid ${a?"var(--accent)":"var(--border)"}`,background:a?"var(--accent)":"transparent",
    color:a?"var(--bg)":"var(--text-muted)"});
  const toggle = spell => {
    const isK = known.some(s => s.name === spell.name);
    if (isK) { setChar(c => ({...c, spells: known.filter(s => s.name !== spell.name)})); return; }
    if (spell.level === 0 && !canAddCantrip) return;
    if (spell.level > 0 && !canAddSpell) return;
    if (spell.level > limits.maxSlotLevel) return;
    setChar(c => ({...c, spells: [...known, {...spell, prepared:false}]}));
  };
  const displayed = allClassSpells
    .filter(sp => (spellFilter === "all" || sp.level === +spellFilter) && (!search || sp.name.toLowerCase().includes(search.toLowerCase())))
    .sort((a, b) => a.level !== b.level ? a.level - b.level : a.name.localeCompare(b.name));
  return (
    <div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:12,padding:"10px 14px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8}}>
        <span style={{fontSize:13,color:"var(--text-muted)"}}>Cantrips:</span>
        <strong style={{color:"var(--accent)"}}>{knownCantrips.length}/{limits.cantripsKnown}</strong>
        <span style={{fontSize:13,color:"var(--text-muted)",marginLeft:8}}>Spells known:</span>
        <strong style={{color:"var(--accent)"}}>{knownSpells.length}/{limits.spellsKnown ?? "∞"}</strong>
        <span style={{fontSize:11,color:"var(--text-dim)",marginLeft:8}}>Max slot level: {limits.maxSlotLevel}</span>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
        <input value={search} onChange={e=>{setSearch(e.target.value);setSpellFilter("all");}}
          placeholder="Search spells…"
          style={{flex:1,background:"var(--surface)",border:"1px solid var(--border)",color:"var(--text)",padding:"6px 12px",borderRadius:8,fontSize:13,fontFamily:"var(--font-body)"}}/>
        {search && <button onClick={()=>setSearch("")} style={{background:"transparent",border:"none",color:"var(--text-muted)",cursor:"pointer",fontSize:16,padding:"0 4px"}}>×</button>}
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
        <button style={fBtn(spellFilter==="all"&&!search)} onClick={()=>{setSpellFilter("all");setSearch("");}}>All</button>
        {limits.cantripsKnown > 0 && <button style={fBtn(spellFilter==="0")} onClick={()=>{setSpellFilter("0");setSearch("");}}>Cantrips</button>}
        {[1,2,3,4,5].filter(l=>l<=limits.maxSlotLevel).map(l=>(
          <button key={l} style={fBtn(spellFilter===String(l)&&!search)} onClick={()=>{setSpellFilter(String(l));setSearch("");}}>Lvl {l}</button>
        ))}
      </div>
      <div style={{maxHeight:420,overflowY:"auto"}}>
        {displayed.length === 0 && <div style={{fontSize:13,color:"var(--text-dim)",fontStyle:"italic",padding:"16px 0",textAlign:"center"}}>No spells match "{search}"</div>}
        {displayed.map(spell => {
          const isK = known.some(s => s.name === spell.name);
          const isCantrip = spell.level === 0;
          const capOk = isK || (isCantrip ? canAddCantrip : canAddSpell);
          const slotOk = isCantrip || spell.level <= limits.maxSlotLevel;
          const disabled = !isK && (!slotOk || !capOk);
          return (
            <SpellCard key={spell.name} spell={spell} charLevel={char.level}
              isKnown={isK} disabled={disabled}
              disabledReason={!isK&&(!slotOk?"slot too high":!capOk?"limit reached":null)}
              onToggle={()=>toggle(spell)} actionLabel={isK?"Remove":"+ Learn"}/>
          );
        })}
      </div>
    </div>
  );
}

function WizardEquipmentStep({ char, setChar, gameData }) {
  const { classes, backgrounds, itemTypes, weapons:weaponLib=[], gear:gearLib=[], armor:armorLib=[] } = gameData;
  const classData = classes?.[char.class];
  const bgData    = backgrounds?.[char.background];

  const [mode, setMode]         = useState("equipment");
  const [choices, setChoices]   = useState({});
  const [pickSels, setPickSels] = useState({});
  const [rolledGold, setRolledGold] = useState(null);
  const [customName, setCustomName] = useState("");
  const [customType, setCustomType] = useState("weapon");

  const goldDice  = classData?.startingGoldDice || "3d4";
  const diceMatch = goldDice.match(/^(\d+)d(\d+)$/);
  const numDice   = diceMatch ? +diceMatch[1] : 3;
  const dieSize   = diceMatch ? +diceMatch[2] : 4;

  const libraryForCategory = cat => {
    if (!cat) return [];
    return [...weaponLib, ...armorLib, ...gearLib].filter(w => w.category === cat);
  };

  const rollGold = () => {
    const total = Array.from({length:numDice}, ()=>Math.floor(Math.random()*dieSize)+1)
      .reduce((a,b)=>a+b,0) * 10;
    setRolledGold(total);
  };

  const resolveItem = (item, pickKey) => {
    if (!item.pick) return item;
    const selName = pickSels[pickKey];
    if (!selName) return null;
    const lib = libraryForCategory(item.pick);
    const found = lib.find(l => l.name === selName);
    if (!found) return null;
    return {
      name: found.name,
      qty: item.qty || 1,
      type: found.damage ? "weapon" : (found.acBase !== undefined ? (found.category==="shield"?"shield":"armor") : "misc"),
      weight: found.weight || 0,
      description: found.damage
        ? `${found.damage} ${found.damageType}${found.properties?.length ? " — " + found.properties.join(", ") : ""}${found.range ? " — Range " + found.range : ""}`
        : found.acFormula
          ? `AC: ${found.acFormula}${found.stealthDisadvantage?" — Stealth disadv.":""}${found.strengthReq?` — Str ${found.strengthReq}+ required`:""}`
          : (found.description || ""),
      personal: false,
    };
  };

  const getEquipmentItems = () => {
    const items = [];
    (classData?.startingEquipment || []).forEach((group, gi) => {
      if (!group) return;
      if (group.fixed) {
        (group.fixed || []).forEach((it, ii) => {
          if (!it) return;
          if (it.pick) {
            const resolved = resolveItem(it, `fixed-${gi}-${ii}`);
            if (resolved) items.push(resolved);
          } else {
            items.push(it);
          }
        });
      } else if (group.options) {
        const oi = choices[`class-${gi}`] ?? 0;
        const option = group.options[oi] || group.options[0] || [];
        option.forEach((it, ii) => {
          if (!it) return;
          if (it.pick) {
            const resolved = resolveItem(it, `class-${gi}-${oi}-${ii}`);
            if (resolved) items.push(resolved);
            // silently drop unresolved picks (player hasn't chosen yet)
          } else {
            items.push(it);
          }
        });
      }
    });
    (bgData?.startingItems || []).forEach(it => { if (it) items.push(it); });
    return items;
  };

  // Expand qty>1 items: "Two handaxes" → 2× "Handaxe" by matching the library
  const allLib = [...weaponLib, ...armorLib, ...gearLib];
  const expandItems = rawItems => {
    const expanded = [];
    for (const it of rawItems) {
      if (!it) continue;
      if (it.gold && !it.name) continue; // pure gold entry, handled separately
      if (!it.name) { expanded.push(it); continue; }
      const qty = it.qty || 1;
      if (qty <= 1) { expanded.push(it); continue; }
      const rawName  = String(it.name);
      const baseName = rawName.replace(/^\d+\s+/i, "").replace(/s$/i, "");
      const libMatch = allLib.find(l =>
        l.name.toLowerCase() === rawName.toLowerCase() ||
        l.name.toLowerCase() === baseName.toLowerCase()
      );
      if (libMatch) {
        for (let i = 0; i < qty; i++) {
          expanded.push({
            ...it,
            name: libMatch.name,
            qty: 1,
            type: libMatch.damage ? "weapon"
                : libMatch.acBase !== undefined ? (libMatch.category === "shield" ? "shield" : "armor")
                : (it.type || "misc"),
          });
        }
      } else {
        expanded.push(it);
      }
    }
    return expanded;
  };

  const applyEquipment = () => {
    try {
      const rawItems = expandItems(getEquipmentItems());
      let goldBonus = 0;
      const invItems = [], personalItems = [];
      const equippedArmor   = new Set();
      const equippedShields = new Set();

      rawItems.forEach(it => {
        if (!it) return;
        if (it.gold && !it.type?.match(/weapon|armor|shield/)) { goldBonus += (it.gold || 0); }
        if (!it.name) return; // skip nameless entries
        const type = it.type || "misc";
        let equip = false;
        if (type === "weapon") {
          equip = true;
        } else if (type === "armor") {
          if (!equippedArmor.has("armor")) { equip = true; equippedArmor.add("armor"); }
        } else if (type === "shield") {
          if (!equippedShields.has("shield")) { equip = true; equippedShields.add("shield"); }
        }
        const obj = {
          id: Date.now() + Math.random(),
          name: it.name,
          type,
          quantity: it.qty || 1,
          weight: it.weight || 0,
          description: it.description || "",
          equipped: equip,
        };
        if (it.personal) personalItems.push(obj);
        else invItems.push(obj);
      });

      setChar(c => ({
        ...c,
        inventory: [...(c.inventory || []), ...invItems],
        personalItems: [...(c.personalItems || []), ...personalItems],
        currencies: { ...c.currencies, gp: (c.currencies?.gp || 0) + goldBonus },
      }));
    } catch(err) {
      console.error("applyEquipment error:", err);
      alert("Something went wrong applying equipment. Check the console for details.");
    }
  };

  const applyGold = () => {
    if (rolledGold===null) return;
    setChar(c => ({ ...c, currencies:{...c.currencies,gp:(c.currencies?.gp||0)+rolledGold} }));
    setRolledGold(null);
  };

  const addCustom = () => {
    if (!customName) return;
    setChar(c => ({ ...c, inventory:[...(c.inventory||[]),{id:Date.now(),name:customName,type:customType,quantity:1,weight:0,description:"",equipped:false}] }));
    setCustomName("");
  };

  const removeItem = id => setChar(c => ({ ...c, inventory:c.inventory.filter(i=>i.id!==id) }));
  const setCurrency = (coin,val) => setChar(c => ({ ...c, currencies:{...c.currencies,[coin]:Math.max(0,+val||0)} }));

  const inp  = { background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"8px 12px", borderRadius:8, fontSize:14, fontFamily:"var(--font-body)", boxSizing:"border-box" };
  const mBtn = a => ({ padding:"10px 24px", borderRadius:8, cursor:"pointer", fontSize:13, fontFamily:"var(--font-display)", letterSpacing:0.5, transition:"all 0.2s", border:`1px solid ${a?"var(--accent)":"var(--border)"}`, background:a?"var(--accent)":"var(--surface)", color:a?"var(--bg)":"var(--text)" });

  const groups   = classData?.startingEquipment || [];
  const currency = char.currencies || {cp:0,sp:0,ep:0,gp:0,pp:0};
  const inv      = char.inventory || [];

  // Render one item in an option — handles pick items with dropdown
  const renderOptionItem = (it, pickKey) => {
    if (!it.pick) {
      return (
        <span key={it.name} style={{ color:"var(--text)" }}>
          {it.qty>1?`${it.qty}× `:""}
          <strong>{it.name}</strong>
          {it.description && <span style={{ color:"var(--text-dim)", fontSize:11, marginLeft:4 }}>{it.description}</span>}
        </span>
      );
    }
    const lib = libraryForCategory(it.pick);
    const selName = pickSels[pickKey] || "";
    const selItem = lib.find(l=>l.name===selName);
    return (
      <div key={pickKey} style={{ display:"flex", flexDirection:"column", gap:4 }}>
        <div style={{ fontSize:12, color:"var(--text-muted)" }}>Choose {it.name}:</div>
        <select value={selName} onChange={e=>setPickSels(p=>({...p,[pickKey]:e.target.value}))} style={{...inp,fontSize:13}}>
          <option value="">— select —</option>
          {lib.map(w=>(
            <option key={w.name} value={w.name}>
              {w.name}{w.damage?` (${w.damage} ${w.damageType}${w.properties?.length?" — "+w.properties.join(", "):""})`:""}
            </option>
          ))}
        </select>
        {selItem && (
          <div style={{ fontSize:11, color:"var(--text-dim)", paddingLeft:4 }}>
            {selItem.damage && <span style={{color:"var(--danger)",marginRight:8}}>{selItem.damage} {selItem.damageType}</span>}
            {selItem.properties?.length>0 && <span style={{marginRight:8}}>{selItem.properties.join(", ")}</span>}
            {selItem.range && <span>Range {selItem.range}</span>}
            {selItem.description && !selItem.damage && <span>{selItem.description}</span>}
          </div>
        )}
      </div>
    );
  };

  const renderedGroups = groups.map((group, gi) => {
    const chosenOi = choices[`class-${gi}`] ?? 0;
    const unresolved = (group.fixed||[]).filter((it,ii) => it.pick && !pickSels[`fixed-${gi}-${ii}`]);
    const hasIssue = unresolved.length > 0;
    if (group.fixed) return (
      <div key={gi} style={{marginBottom:12,padding:"10px 14px",background:"var(--surface)",
        border:`1px solid ${hasIssue?"#e67e22":"var(--border)"}`,borderRadius:8,
        boxShadow:hasIssue?"0 0 0 1px rgba(230,126,34,0.3)":undefined}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <div style={{fontSize:11,color:hasIssue?"#e67e22":"var(--text-muted)",textTransform:"uppercase",letterSpacing:1}}>You always get</div>
          {hasIssue && <div style={{fontSize:10,color:"#e67e22"}}>⚠ Choose {unresolved.length} item{unresolved.length>1?"s":""}</div>}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {group.fixed.map((it,ii)=>
            it.pick ? (
              <div key={`p-${gi}-${ii}`} style={{borderRadius:6,border:!pickSels[`fixed-${gi}-${ii}`]?"1px solid rgba(230,126,34,0.4)":"none",padding:!pickSels[`fixed-${gi}-${ii}`]?"4px":"0"}}>
                {renderOptionItem(it, `fixed-${gi}-${ii}`)}
                {!pickSels[`fixed-${gi}-${ii}`] && <div style={{fontSize:10,color:"#e67e22",marginTop:3}}>⚠ Selection required</div>}
              </div>
            ) : (
              <div key={it.name} style={{fontSize:13}}>
                {it.qty>1?`${it.qty}× `:""}
                <strong>{it.name}</strong>
                {it.description&&<span style={{color:"var(--text-dim)",fontSize:11,marginLeft:6}}>{it.description}</span>}
              </div>
            )
          )}
        </div>
      </div>
    );
    return (
      <div key={gi} style={{marginBottom:14}}>
        <div style={{fontSize:11,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Choice {gi+1} — pick one</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {group.options.map((option,oi)=>(
            <div key={oi} style={{padding:"12px 14px",borderRadius:8,transition:"all 0.15s",
              border:`1px solid ${chosenOi===oi?"var(--accent)":"var(--border)"}`,
              background:chosenOi===oi?"rgba(var(--accent-rgb,201,162,39),0.08)":"var(--surface)"}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:8,cursor:"pointer"}} onClick={()=>setChoices(ch=>({...ch,[`class-${gi}`]:oi}))}>
                <span style={{width:14,height:14,borderRadius:"50%",flexShrink:0,marginTop:2,display:"inline-block",border:`2px solid ${chosenOi===oi?"var(--accent)":"var(--border)"}`,background:chosenOi===oi?"var(--accent)":"transparent"}}/>
                <div style={{flex:1,display:"flex",flexDirection:"column",gap:8}}>
                  {option.map((it,ii)=>renderOptionItem(it,`class-${gi}-${oi}-${ii}`))}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  });

  return (
    <div>
      {/* Mode toggle */}
      <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
        <button style={mBtn(mode==="equipment")} onClick={()=>setMode("equipment")}>⚔️ Equipment</button>
        <button style={mBtn(mode==="gold")}      onClick={()=>setMode("gold")}>🪙 Gold</button>
        {(() => {
          const info = getSpellcastingInfo(char, classes);
          if (!info) return null;
          return <button style={mBtn(mode==="spells")} onClick={()=>setMode("spells")}>✨ Choose Spells</button>;
        })()}
      </div>

      {/* ── Spell picker mode ── */}
      {mode==="spells" && <WizardSpellPicker char={char} setChar={setChar} gameData={gameData}/>}

      {/* ── Equipment mode ── */}
      {mode==="equipment" && (
        <div>
          {!classData
            ? <p style={{color:"var(--text-muted)",fontSize:13}}>Select a class first.</p>
            : <>
              <div style={{fontFamily:"var(--font-display)",color:"var(--accent)",fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
                {char.class} Starting Equipment
              </div>
              {renderedGroups}

              {/* Background items */}
              {bgData?.startingItems?.length>0 && (
                <div style={{marginTop:16}}>
                  <div style={{fontFamily:"var(--font-display)",color:"var(--accent)",fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
                    {char.background} Background Items
                  </div>
                  <div style={{padding:"10px 14px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8}}>
                    {bgData.startingItems.map(it=>(
                      <div key={it.name} style={{marginBottom:6,fontSize:13}}>
                        {it.pick
                          ? renderOptionItem(it, `bg-${it.name}`)
                          : <>
                              <strong>{it.qty>1?`${it.qty}× `:""}{it.name}</strong>
                              {it.personal && <span style={{fontSize:10,color:"var(--info)",marginLeft:6,padding:"1px 6px",border:"1px solid var(--info)",borderRadius:8}}>personal</span>}
                              {it.gold && <span style={{fontSize:11,color:"var(--accent)",marginLeft:6}}>+{it.gold} gp</span>}
                              {it.description && <span style={{color:"var(--text-dim)",fontSize:11,marginLeft:6}}>{it.description}</span>}
                            </>
                        }
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Check for any unresolved picks across all groups */}
              {(() => {
                const unresolvedTotal = groups.reduce((sum, group, gi) => {
                  const fixedUnresolved = (group.fixed||[]).filter((it,ii)=>it.pick&&!pickSels[`fixed-${gi}-${ii}`]).length;
                  const chosenOi = choices[`class-${gi}`] ?? 0;
                  const optionUnresolved = group.options
                    ? (group.options[chosenOi]||[]).filter((it,ii)=>it.pick&&!pickSels[`class-${gi}-${chosenOi}-${ii}`]).length
                    : 0;
                  return sum + fixedUnresolved + optionUnresolved;
                }, 0);
                const isComplete = unresolvedTotal === 0;
                return (
                  <button onClick={isComplete ? applyEquipment : undefined}
                    disabled={!isComplete}
                    style={{marginTop:16,padding:"12px 28px",
                      background:isComplete?"var(--accent)":"var(--border)",
                      border:"none",color:isComplete?"var(--bg)":"var(--text-dim)",
                      borderRadius:8,cursor:isComplete?"pointer":"not-allowed",
                      fontFamily:"var(--font-display)",fontSize:14,width:"100%",
                      opacity:isComplete?1:0.6}}>
                    {isComplete ? "✓ Apply Starting Equipment to Inventory" : `⚠ Choose ${unresolvedTotal} item${unresolvedTotal!==1?"s":""} before applying`}
                  </button>
                );
              })()}
            </>
          }
        </div>
      )}

      {/* ── Gold mode ── */}
      {mode==="gold" && (
        <div>
          <div style={{fontFamily:"var(--font-display)",color:"var(--accent)",fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>
            Starting Gold — {char.class||"your class"} rolls {goldDice} × 10 gp
          </div>
          <div style={{display:"flex",gap:14,alignItems:"center",marginBottom:20,flexWrap:"wrap"}}>
            <button onClick={rollGold} style={{padding:"12px 28px",background:"var(--accent)",border:"none",color:"var(--bg)",borderRadius:8,cursor:"pointer",fontFamily:"var(--font-display)",fontSize:14}}>
              🎲 Roll {goldDice} × 10
            </button>
            {rolledGold!==null && (<>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:11,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:1}}>Result</div>
                <div style={{fontFamily:"var(--font-display)",color:"var(--accent)",fontSize:36}}>{rolledGold} gp</div>
              </div>
              <button onClick={applyGold} style={{padding:"12px 28px",background:"var(--surface)",border:"1px solid var(--accent)",color:"var(--accent)",borderRadius:8,cursor:"pointer",fontFamily:"var(--font-display)",fontSize:14}}>
                + Add to Wallet
              </button>
            </>)}
          </div>
          <p style={{fontSize:13,color:"var(--text-muted)",lineHeight:1.6}}>
            You can then buy equipment using the custom adder below, or manage your inventory on the character sheet.
          </p>
        </div>
      )}

      {/* ── Current inventory preview ── */}
      {inv.length>0 && (
        <div style={{marginTop:20}}>
          <div style={{fontSize:12,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Current Inventory ({inv.length})</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {inv.map(it=>(
              <span key={it.id} onClick={()=>removeItem(it.id)} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 10px",background:"var(--card)",border:"1px solid var(--border)",borderRadius:10,fontSize:12,cursor:"pointer"}}>
                {it.name}{it.quantity>1?` ×${it.quantity}`:""}<span style={{color:"var(--danger)",fontSize:14,lineHeight:1}}>×</span>
              </span>
            ))}
          </div>
        </div>
      )}

      {/* ── Currency editor ── */}
      <div style={{marginTop:20,padding:"14px 16px",background:"var(--card)",border:"1px solid var(--border)",borderRadius:10}}>
        <div style={{fontSize:12,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Currency</div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          {(gameData?.currencies||[{key:"cp",name:"Copper",color:"#b87333"},{key:"sp",name:"Silver",color:"#c0c0c0"},{key:"ep",name:"Electrum",color:"#a8bba8"},{key:"gp",name:"Gold",color:"#ffd700"},{key:"pp",name:"Platinum",color:"#e5e4e2"}]).map(cur=>(
            <div key={cur.key} style={{textAlign:"center"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:cur.color,margin:"0 auto 4px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:"bold",color:"#333"}}>{cur.key.toUpperCase()}</div>
              <input type="number" value={currency[cur.key]||0} onChange={e=>setCurrency(cur.key,e.target.value)} style={{...inp,width:72,textAlign:"center",fontSize:15,padding:"4px 0"}}/>
              <div style={{fontSize:10,color:"var(--text-muted)",marginTop:2}}>{cur.name}</div>
            </div>
          ))}
        </div>

      {/* ── Add Item ── */}
      <div style={{marginTop:16}}>
        <div style={{fontSize:12,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Add Item to Inventory</div>
        <LibraryItemAdder
          gameData={gameData}
          onAdd={item => setChar(c => ({ ...c, inventory:[...(c.inventory||[]), item] }))}
        />
      </div>
    </div>
  );
}


// ============================================================
// SPELL CARD — shared between WizardSpellPicker and SpellsTab
// Shows big damage/DC badges when collapsed, vertical details expanded
// ============================================================
function SpellCard({ spell, charLevel, isKnown, disabled, disabledReason, onToggle, actionLabel, extraSource }) {
  const [open, setOpen] = useState(false);
  const c = spell.combat || {};

  // Compute live damage string accounting for cantrip scaling
  const liveDamage = (() => {
    if (!c.damage) return null;
    if (!c.cantripScale) return c.damage;
    const tiers = [1, 5, 11, 17];
    const tier = tiers.filter(t => (charLevel || 1) >= t).length;
    const match = c.cantripScale.match(/^(\d+)(d\d+)$/);
    if (!match) return c.damage;
    return `${tier}${match[2]}`;
  })();

  const hasAttack = !!c.attack;
  const hasSave   = !!c.save;
  const hasDamage = !!liveDamage;
  const hasHeal   = !!c.healing;

  // Next cantrip tier label
  const nextTierLabel = (() => {
    if (!c.cantripScale) return null;
    const lvl = charLevel || 1;
    return lvl < 5 ? "+1 die at 5th" : lvl < 11 ? "+1 die at 11th" : lvl < 17 ? "+1 die at 17th" : null;
  })();

  const lvlTag = { display:"inline-block", padding:"2px 8px", borderRadius:10, fontSize:11,
    background: spell.level===0 ? "rgba(100,100,100,0.2)" : "rgba(var(--accent-rgb,201,162,39),0.12)",
    border:`1px solid ${spell.level===0 ? "var(--border)" : "var(--accent2)"}`,
    color: spell.level===0 ? "var(--text-muted)" : "var(--accent)" };

  // Big badge style — same height as the action button
  const badge = (bg, border, text) => ({
    display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
    padding:"4px 10px", borderRadius:8, border:`1px solid ${border}`,
    background: bg, minWidth:60, minHeight:44, flexShrink:0,
    color: text
  });

  return (
    <div style={{ background:"var(--card)", border:`1px solid ${isKnown?"var(--accent2)":"var(--border)"}`, borderRadius:10, padding:"10px 14px", marginBottom:8, opacity: disabled ? 0.45 : 1 }}>
      {/* Collapsed row */}
      <div style={{ display:"flex", alignItems:"center", gap:10 }}>

        {/* Spell name + tags — clickable to expand */}
        <div style={{ flex:1, cursor:"pointer", minWidth:0 }} onClick={() => !disabled && setOpen(o => !o)}>
          <div style={{ fontFamily:"var(--font-display)", fontSize:16, color: isKnown?"var(--accent)":disabled?"var(--text-dim)":"var(--text)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
            {spell.name}
            <span style={{ fontSize:12, color:"var(--text-dim)", marginLeft:6 }}>{open?"▲":"▼"}</span>
          </div>
          <div style={{ display:"flex", gap:6, alignItems:"center", marginTop:4, flexWrap:"wrap" }}>
            <span style={lvlTag}>{spell.level===0?"Cantrip":`Level ${spell.level}`}</span>
            <span style={{ fontSize:11, color:"var(--text-dim)" }}>{spell.school}</span>
            {disabledReason && <span style={{ fontSize:11, color:"var(--danger)" }}>{disabledReason}</span>}
            {extraSource && <span style={{ fontSize:10, color:"var(--accent2)", padding:"1px 6px", border:"1px solid var(--accent2)", borderRadius:8 }}>✦ {extraSource}</span>}
          </div>
        </div>

        {/* Combat badges — big and obvious */}
        <div style={{ display:"flex", gap:6, alignItems:"center", flexShrink:0 }}>
          {/* Damage badge */}
          {hasDamage && (
            <div style={badge("rgba(192,57,43,0.15)", "rgba(192,57,43,0.5)", "var(--danger)")}>
              <div style={{ fontSize:9, textTransform:"uppercase", letterSpacing:1, color:"rgba(192,57,43,0.7)", lineHeight:1 }}>Damage</div>
              <div style={{ fontFamily:"var(--font-display)", fontSize:17, lineHeight:1.2, marginTop:2 }}>
                {liveDamage}
              </div>
              <div style={{ fontSize:9, color:"rgba(192,57,43,0.8)", lineHeight:1, marginTop:1 }}>{c.damageType}</div>
              {c.slotScale && !c.cantripScale && <div style={{ fontSize:9, color:"rgba(192,57,43,0.6)", lineHeight:1 }}>{c.slotScale}</div>}
              {nextTierLabel && <div style={{ fontSize:9, color:"rgba(192,57,43,0.6)", lineHeight:1 }}>{nextTierLabel}</div>}
            </div>
          )}
          {/* Healing badge */}
          {hasHeal && !hasDamage && (
            <div style={badge("rgba(39,174,96,0.12)", "rgba(39,174,96,0.5)", "var(--success)")}>
              <div style={{ fontSize:9, textTransform:"uppercase", letterSpacing:1, color:"rgba(39,174,96,0.7)", lineHeight:1 }}>Heals</div>
              <div style={{ fontFamily:"var(--font-display)", fontSize:17, lineHeight:1.2, marginTop:2 }}>{c.healing}</div>
              {c.healSlotScale && <div style={{ fontSize:9, color:"rgba(39,174,96,0.6)", lineHeight:1 }}>{c.healSlotScale}</div>}
            </div>
          )}
          {/* Attack / Save badge */}
          {(hasAttack || hasSave) && (
            <div style={badge("rgba(41,128,185,0.12)", "rgba(41,128,185,0.5)", "var(--info)")}>
              {hasAttack && <>
                <div style={{ fontSize:9, textTransform:"uppercase", letterSpacing:1, color:"rgba(41,128,185,0.7)", lineHeight:1 }}>{c.attack === "ranged" ? "Ranged" : "Melee"}</div>
                <div style={{ fontFamily:"var(--font-display)", fontSize:13, lineHeight:1.3, marginTop:2, textAlign:"center" }}>Spell<br/>Attack</div>
              </>}
              {hasSave && !hasAttack && <>
                <div style={{ fontSize:9, textTransform:"uppercase", letterSpacing:1, color:"rgba(41,128,185,0.7)", lineHeight:1 }}>Save</div>
                <div style={{ fontFamily:"var(--font-display)", fontSize:17, lineHeight:1.2, marginTop:2 }}>{ABILITY_SHORT[c.save]}</div>
              </>}
            </div>
          )}
        </div>

        {/* Add / Remove button */}
        <button onClick={e => { e.stopPropagation(); onToggle(); }} disabled={disabled} style={{
          padding:"0 16px", height:44, borderRadius:8, fontSize:13, cursor: disabled?"not-allowed":"pointer",
          fontFamily:"var(--font-display)", letterSpacing:0.5, flexShrink:0,
          border:`1px solid ${isKnown?"var(--danger)":disabled?"var(--border)":"var(--accent)"}`,
          background: isKnown?"transparent":disabled?"var(--surface)":"var(--accent)",
          color: isKnown?"var(--danger)":disabled?"var(--text-dim)":"var(--bg)", opacity: disabled?0.5:1
        }}>{actionLabel || (isKnown ? "Remove" : "+ Add")}</button>
      </div>

      {/* Expanded details — vertical layout */}
      {open && (
        <div style={{ marginTop:12, paddingTop:12, borderTop:"1px solid var(--border)" }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"6px 24px", marginBottom:12 }}>
            {[
              ["Casting Time", spell.castingTime],
              ["Range",        spell.range],
              ["Components",   spell.components],
              ["Duration",     spell.duration],
            ].map(([label, val]) => (
              <div key={label}>
                <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{label}</div>
                <div style={{ fontSize:14, color:"var(--text)", marginTop:1 }}>{val}</div>
              </div>
            ))}
          </div>
          {c.notes && (
            <div style={{ fontSize:13, color:"var(--accent)", fontStyle:"italic", marginBottom:8 }}>{c.notes}</div>
          )}
          {c.slotScale && (
            <div style={{ fontSize:13, color:"var(--info)", marginBottom:8, padding:"6px 10px", background:"rgba(41,128,185,0.1)", border:"1px solid rgba(41,128,185,0.3)", borderRadius:6 }}>
              ⬆ Upcasting: {c.slotScale}
            </div>
          )}
          <p style={{ fontSize:14, color:"var(--text)", lineHeight:1.7, margin:0 }}>{spell.description}</p>
        </div>
      )}
    </div>
  );
}

function SourceBadge({ source }) {
  if (!source) return null;
  const colours = {
    PHB:  { bg:"rgba(139,0,0,0.15)",   border:"rgba(139,0,0,0.5)",   text:"#e07070" },
    XGtE: { bg:"rgba(0,80,139,0.15)",  border:"rgba(0,80,139,0.5)",  text:"#70aaee" },
    TCoE: { bg:"rgba(80,0,139,0.15)",  border:"rgba(80,0,139,0.5)",  text:"#cc88ee" },
    MotM: { bg:"rgba(0,100,80,0.15)",  border:"rgba(0,100,80,0.5)",  text:"#55ccaa" },
    SCAG: { bg:"rgba(100,80,0,0.15)",  border:"rgba(100,80,0,0.5)",  text:"#ccaa55" },
    MToF: { bg:"rgba(60,0,100,0.15)",  border:"rgba(60,0,100,0.5)",  text:"#bb77ee" },
    EGtW: { bg:"rgba(0,60,100,0.15)",  border:"rgba(0,60,100,0.5)",  text:"#55aacc" },
    VGM:  { bg:"rgba(100,50,0,0.15)",  border:"rgba(100,50,0,0.5)",  text:"#cc8844" },
    EEPC: { bg:"rgba(0,80,0,0.15)",    border:"rgba(0,80,0,0.5)",    text:"#66cc66" },
  };
  // Handle both plain string ("PHB") and object ({abbr:"PHB", book:"...", page:9})
  const abbr = typeof source === "string" ? source : source?.abbr;
  const page = typeof source === "object" ? source?.page : null;
  const book = typeof source === "object" ? source?.book : abbr;
  if (!abbr) return null;
  const c = colours[abbr] || { bg:"rgba(60,60,60,0.2)", border:"rgba(120,120,120,0.4)", text:"#aaa" };
  return (
    <span title={`${book || abbr}${page ? `, p.${page}` : ""}`}
      style={{ display:"inline-flex", alignItems:"center", gap:3, padding:"1px 6px", borderRadius:4, fontSize:10,
        background:c.bg, border:`1px solid ${c.border}`, color:c.text, letterSpacing:0.5, flexShrink:0 }}>
      {abbr}{page ? ` p.${page}` : ""}
    </span>
  );
}

function StepBar({ STEPS, step, setStep, stepComplete }) {
  return (
    <div style={{ display:"flex", gap:5, marginBottom:28, justifyContent:"center", flexWrap:"wrap" }}>
      {STEPS.map((name, i) => {
        const isCurrent = i === step;
        const incomplete = !stepComplete[i] && i <= step;
        return (
          <div key={i} onClick={() => setStep(i)} style={{
            position:"relative",
            padding:"5px 12px", borderRadius:20, fontSize:11, fontWeight:"bold",
            letterSpacing:0.5, whiteSpace:"nowrap", transition:"all 0.2s", cursor:"pointer",
            border: isCurrent ? "1px solid var(--accent)" : "1px solid var(--border)",
            background: isCurrent ? "var(--accent)" : i < step ? "var(--accent2)" : "var(--surface)",
            color: isCurrent ? "var(--bg)" : i < step ? "var(--bg)" : "var(--text-muted)"
          }}>
            {i+1}. {name}
            {incomplete && (
              <span style={{
                position:"absolute", top:-5, right:-5,
                width:14, height:14, borderRadius:"50%",
                background:"#e74c3c", border:"2px solid var(--bg)",
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:9, color:"#fff", fontWeight:"bold", lineHeight:1,
                pointerEvents:"none"
              }}>!</span>
            )}
          </div>
        );
      })}
    </div>
  );
}

function CharacterCreationWizard({ gameData, onSave, onCancel, editChar }) {
  const [step, setStep] = useState(0);
  const [char, setChar] = useState(editChar ? { ...editChar } : { ...DEFAULT_CHAR });
  const { species:speciesDb, classes, backgrounds, themes, alignments, languages:languageList, skills:allSkills } = gameData;

  const STEPS = ["Identity","Class","Background","Species","Abilities","Equipment & Spells","Finalise"];
  const speciesData  = speciesDb?.[char.species];
  const subraceData  = char.subrace ? speciesData?.subraces?.[char.subrace] : null;
  const classData    = classes?.[char.class];
  const bgData       = backgrounds?.[char.background];

  // Merged ability bonuses: species fixed + subrace fixed
  const mergedSpeciesBonuses = ab => {
    const base    = speciesData?.abilityBonuses?.[ab] || 0;
    const subrace = subraceData?.abilityBonuses?.[ab] || 0;
    return base + subrace;
  };

  // Combined features from species + subrace
  const allSpeciesFeatures = [
    ...(speciesData?.features || []),
    ...(subraceData?.features || []),
  ];

  // Effective ability = base + fixed species+subrace bonus + asi_points species choices + ASI from class features
  const totalAb = ab => {
    const base         = char.abilities[ab] || 10;
    const fixed        = mergedSpeciesBonuses(ab);
    const speciesPoints = char.speciesAbilityChoices?.[ab] || 0;
    const asi          = Object.values(char.asiChoices || {}).reduce((s, v) => s + (v?.[ab] || 0), 0);
    return base + fixed + speciesPoints + asi;
  };
  const maxHP = classData ? calcHP(classData, char.level || 1, calcMod(totalAb("con"))) : 0;

  // ── skillSources: { "Perception": "Ranger Class", "Stealth": "Background" } ──
  // Built from skillProfSources stored on char
  const skillSources = char.skillProfSources || {};

  // Toggle a skill for a given source label. Handles displacing from other sources.
  const toggleSkillForSource = (skill, sourceLabel) => {
    setChar(c => {
      const sources = { ...c.skillProfSources };
      const profs   = [...(c.skillProficiencies || [])];
      const exp     = (c.skillExpertise || []).filter(s => s !== skill); // drop expertise if skill removed
      if (sources[skill] === sourceLabel) {
        // Deselect: remove from this source
        delete sources[skill];
        return { ...c, skillProfSources: sources, skillProficiencies: profs.filter(s => s !== skill), skillExpertise: exp };
      } else {
        // Select or displace: assign to this source
        sources[skill] = sourceLabel;
        const newProfs = profs.includes(skill) ? profs : [...profs, skill];
        return { ...c, skillProfSources: sources, skillProficiencies: newProfs };
      }
    });
  };

  // Expertise toggle — auto-cleans stale entries not in current skillProficiencies
  const toggleExpertise = skill => setChar(c => {
    const validProfs = c.skillProficiencies || [];
    const cur = (c.skillExpertise || []).filter(s => validProfs.includes(s)); // clean stale
    return { ...c, skillExpertise: cur.includes(skill) ? cur.filter(s => s !== skill) : [...cur, skill] };
  });

  const setChoice      = (name, val) => setChar(c => ({ ...c, featureChoices:{ ...c.featureChoices, [name]:val } }));
  const setSubclass = sc => setChar(c => {
    // When switching subclass, strip ALL skill sources and expertise from the OLD subclass
    const oldSC = c.subclass;
    if (!oldSC || oldSC === sc) return { ...c, subclass: sc };
    const newSources = Object.fromEntries(
      Object.entries(c.skillProfSources || {}).filter(([, src]) => src !== oldSC)
    );
    const newProfs = (c.skillProficiencies || []).filter(sk => newSources[sk] !== undefined || !Object.keys(c.skillProfSources||{}).includes(sk) || c.skillProfSources[sk] !== oldSC);
    // Also clean feature choices that came from old subclass features
    const oldSubFeatureNames = new Set(
      (classData?.subclasses?.[oldSC]?.features || []).map(f => f.name)
    );
    const newChoices = Object.fromEntries(
      Object.entries(c.featureChoices || {}).filter(([k]) => !oldSubFeatureNames.has(k))
    );
    const newExpertise = (c.skillExpertise || []).filter(s => newProfs.includes(s));
    return { ...c, subclass: sc, skillProfSources: newSources, skillProficiencies: newProfs, skillExpertise: newExpertise, featureChoices: newChoices };
  });
  const toggleLanguage = (lang, sourceLabel) => setChar(c => {
    // Never allow toggling an auto-granted species language
    if (autoLangs.includes(lang)) return c;
    const cur = c.languages || [];
    const curSources = c.languageSources || {};
    if (cur.includes(lang)) {
      // Only allow deselect if this source owns it
      if (curSources[lang] && curSources[lang] !== sourceLabel) return c;
      const newSources = { ...curSources };
      delete newSources[lang];
      return { ...c, languages: cur.filter(l => l !== lang), languageSources: newSources };
    } else {
      return { ...c, languages: [...cur, lang], languageSources: { ...curSources, [lang]: sourceLabel } };
    }
  });
  const setAsi = (featureName, val) => setChar(c => ({
    ...c, asiChoices: { ...(c.asiChoices||{}), [featureName]: val }
  }));
  const setSpeciesAsi = (featureName, val) => {
    const merged = Object.keys(ABILITY_NAMES).reduce((acc, ab) => {
      acc[ab] = val[ab] || 0;
      return acc;
    }, {});
    setChar(c => ({ ...c, speciesAbilityChoices: merged }));
  };
  const setFeatChoice = (featureName, featName) => setChar(c => {
    const newFeats = { ...(c.featChoices||{}), [featureName]: featName };
    if (!featName) delete newFeats[featureName];
    // If switching back to ASI, clear the feat choice but keep asiChoices intact
    return { ...c, featChoices: newFeats };
  });
  const toggleRacialSpell = (spellName, sourceFeature, spellObj) => setChar(c => {
    const cur = c.racialSpells || [];
    const already = cur.some(s => s.name === spellName && s.sourceFeature === sourceFeature);
    if (already) {
      return { ...c, racialSpells: cur.filter(s => !(s.name === spellName && s.sourceFeature === sourceFeature)) };
    }
    // Don't add if the spell is already in racial spells from a different source
    const spell = spellObj || (gameData?.spells||[]).find(s=>s.name===spellName) || { name:spellName };
    return { ...c, racialSpells: [...cur, { ...spell, sourceFeature, racial:true }] };
  });

  const finalize = () => {
    const fa = Object.keys(char.abilities).reduce((acc, ab) => { acc[ab] = totalAb(ab); return acc; }, {});
    const lvl = char.level || 1;
    const isEdit = !!editChar;

    // Merge auto-languages from species/subrace into char.languages
    const existingLangs = char.languages || [];
    const existingSources = char.languageSources || {};
    const speciesAutoLangs = (speciesData?.autoLanguages || []);
    const subraceAutoLangs = (subraceData?.autoLanguages || []);
    const allAutoLangs = [...new Set([...speciesAutoLangs, ...subraceAutoLangs])];
    const newLangs = [...existingLangs];
    const newSources = { ...existingSources };
    for (const lang of allAutoLangs) {
      if (!newLangs.includes(lang)) {
        newLangs.push(lang);
        newSources[lang] = speciesAutoLangs.includes(lang) ? "Species" : "Subrace";
      }
    }

    onSave({
      ...char,
      id: isEdit ? char.id : Date.now().toString(),
      abilities: fa,
      hp: isEdit ? char.hp : { current: maxHP, max: maxHP, temp:0 },
      hitDice: isEdit ? char.hitDice : { current: lvl, max: lvl },
      languages: newLangs,
      languageSources: newSources,
      createdAt: isEdit ? char.createdAt : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
  };

  // All class features (base + subclass) sorted by level, with source label on subclass features
  const subclassName = char.subclass;
  const allClassFeatures = [
    ...(classData?.features || []).map(f => ({ ...f, _source: null })),
    ...((subclassName && classData?.subclasses?.[subclassName]?.features) || []).map(f => ({ ...f, _source: subclassName }))
  ].sort((a, b) => a.level - b.level);

  // Auto-granted languages from current species + subrace
  const autoLangs = [
    ...(speciesData?.autoLanguages || []),
    ...(subraceData?.autoLanguages || []),
  ];

  // Shared FeaturePanel props builder
  const fpProps = (sourceLabel, isSpecies = false) => ({
    choices: char.featureChoices, onChoice: setChoice,
    skillProfs: char.skillProficiencies,
    onSkillToggle: skill => toggleSkillForSource(skill, sourceLabel),
    expertiseProfs: (char.skillExpertise||[]).filter(s=>(char.skillProficiencies||[]).includes(s)),
    onExpertiseToggle: toggleExpertise,
    allSkills: allSkills || [],
    languages: char.languages,
    languageSources: char.languageSources || {},
    onLanguageChoice: lang => toggleLanguage(lang, sourceLabel),
    languageList: languageList || [],
    autoLanguages: autoLangs,
    thisLanguageSource: sourceLabel,
    subclass: char.subclass, onSubclassChoice: setSubclass,
    subclasses: classData?.subclasses,
    skillSources, thisSource: sourceLabel,
    asiChoices: isSpecies
      ? { "Ability Score Increase": char.speciesAbilityChoices || {} }
      : char.asiChoices || {},
    onAsiChange: isSpecies ? setSpeciesAsi : setAsi,
    currentAbilities: char.abilities,
    gameData,
    charLevel: char.level || 1,
    racialSpells: char.racialSpells || [],
    onRacialSpellToggle: toggleRacialSpell,
    featChoices: char.featChoices || {},
    onFeatChoice: isSpecies ? null : setFeatChoice, // feats only on class ASIs
  });

  // ── Per-step completeness ──
  // Checks whether each step has all its required choices made,
  // including detecting when proficiencies from one step have been
  // displaced by choices on another step.

  const skillsFromSource = src =>
    Object.entries(char.skillProfSources || {}).filter(([,s]) => s === src).map(([sk]) => sk);

  const requiredProfCountForStep = (stepIdx) => {
    // Returns { required, have } for skill proficiency on that step, or null if N/A
    if (stepIdx === 1 && classData) {
      const feat = classData.features?.find(f => f.type === "proficiency_choice");
      if (feat) return { required: feat.count || 0, have: skillsFromSource(`${char.class} Class`).length };
    }
    if (stepIdx === 2 && bgData) {
      const feat = bgData.features?.find(f => f.type === "proficiency_choice");
      if (feat) return { required: feat.count || 0, have: skillsFromSource("Background").length };
    }
    if (stepIdx === 3 && speciesData) {
      const feat = speciesData.features?.find(f => f.type === "proficiency_choice");
      if (feat) return { required: feat.count || 0, have: skillsFromSource("Species").length };
    }
    return null;
  };

  const stepComplete = STEPS.map((_, i) => {
    switch(i) {
      case 0: return !!char.name;
      case 1: {
        if (!char.class) return false;
        const pc = requiredProfCountForStep(1);
        if (pc && pc.have < pc.required) return false;
        // Also check required feature choices at this level are made
        const missingChoice = allClassFeatures.some(f => {
          if ((char.level||1) < f.level) return false; // locked, ignore
          if (f.type === "choice" || f.type === "subclass_choice") return !char.featureChoices?.[f.name] && f.type !== "subclass_choice" ? false : f.type === "subclass_choice" ? !char.subclass : !char.featureChoices?.[f.name];
          return false;
        });
        return true; // choices are indicated inline, not blocking step completion
      }
      case 2: {
        if (!char.background) return false;
        const pc = requiredProfCountForStep(2);
        if (pc && pc.have < pc.required) return false;
        // Check background language choices are complete
        const bgLangFeats = bgData?.features?.filter(f => f.type === "language_choice") || [];
        for (const feat of bgLangFeats) {
          const myPicks = (char.languages || []).filter(l =>
            (char.languageSources||{})[l] === "Background" && !(autoLangs||[]).includes(l)
          );
          if (myPicks.length < (feat.count || 0)) return false;
        }
        return true;
      }
      case 3: {
        if (!char.species) return false;
        // Require subrace selection if species has subraces
        if (speciesData?.subraces && Object.keys(speciesData.subraces).length > 0 && !char.subrace) return false;
        const pc = requiredProfCountForStep(3);
        if (pc && pc.have < pc.required) return false;
        // Check species language choices
        const spLangFeats = allSpeciesFeatures.filter(f => f.type === "language_choice");
        for (const feat of spLangFeats) {
          const myPicks = (char.languages || []).filter(l =>
            ["Species","Subrace"].includes((char.languageSources||{})[l]) && !(autoLangs||[]).includes(l)
          );
          if (myPicks.length < (feat.count || 0)) return false;
        }
        // Check asi_points complete (across species + subrace)
        const asiFeature = allSpeciesFeatures.find(f => f.type === "asi_points");
        if (asiFeature) {
          const chosen = Object.values(char.speciesAbilityChoices || {}).filter(v => v > 0).length;
          if (chosen < (asiFeature.points || 2)) return false;
        }
        return true;
      }
      case 4: return true; // Abilities optional
      case 5: return true; // Equipment optional
      case 6: return true;
      default: return true;
    }
  });


  // StepBar rendered as top-level component

  return (
    <TW themeKey={char.theme} themes={themes}>
      <div style={ws.page}>
        <div style={ws.title}>⚔️ Create Your Character</div>
        <StepBar STEPS={STEPS} step={step} setStep={setStep} stepComplete={stepComplete} />

        {/* ── STEP 0: Identity ── */}
        {step === 0 && (
          <div>
            {/* Name — full width */}
            <div style={ws.card}>
              <label style={ws.label}>Character Name</label>
              <input style={ws.input} value={char.name} placeholder="Enter your hero's name…"
                onChange={e => setChar({ ...char, name:e.target.value })} />
            </div>

            {/* Alignment + Appearance side by side */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 2fr", gap:14 }}>
              <div style={ws.card}>
                <label style={ws.label}>Alignment</label>
                <select style={ws.input} value={char.alignment} onChange={e => setChar({ ...char, alignment:e.target.value })}>
                  {(alignments || []).map(a => <option key={a} value={a}>{a}</option>)}
                </select>
              </div>
              <div style={ws.card}>
                <label style={ws.label}>Appearance / Description</label>
                <textarea style={{ ...ws.input, minHeight:80, resize:"vertical" }} value={char.appearance}
                  placeholder="Age, hair, eyes, notable features…" onChange={e => setChar({ ...char, appearance:e.target.value })} />
              </div>
            </div>

            {/* Sheet customisation */}
            <div style={ws.card}>
              <label style={ws.label}>Sheet Style</label>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>

                {/* Background preset */}
                <div>
                  <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Background</div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:6 }}>
                    {[
                      { id:"dungeon",  name:"Dungeon",   bg:"#0d0d0f", g1:"rgba(60,20,100,0.22)",  g2:"rgba(80,40,10,0.18)",   effect:null },
                      { id:"abyss",    name:"Void",      bg:"#050508", g1:"rgba(20,0,80,0.35)",    g2:"rgba(0,20,60,0.25)",    effect:null },
                      { id:"crimson",  name:"Crimson",   bg:"#0e0608", g1:"rgba(120,10,30,0.28)",  g2:"rgba(60,0,10,0.2)",     effect:null },
                      { id:"forest",   name:"Grove",     bg:"#050d07", g1:"rgba(10,60,20,0.30)",   g2:"rgba(30,80,10,0.18)",   effect:null },
                      { id:"ocean",    name:"Abyss Sea", bg:"#030810", g1:"rgba(0,40,120,0.30)",   g2:"rgba(10,20,80,0.22)",   effect:null },
                      { id:"desert",   name:"Desert",    bg:"#0e0c05", g1:"rgba(120,80,10,0.28)",  g2:"rgba(80,40,5,0.20)",    effect:null },
                      { id:"frost",    name:"Frost",     bg:"#050d10", g1:"rgba(0,80,120,0.25)",   g2:"rgba(60,120,140,0.15)", effect:null },
                      { id:"infernal", name:"Infernal",  bg:"#0e0403", g1:"rgba(160,20,0,0.30)",   g2:"rgba(80,10,0,0.22)",    effect:null },
                      { id:"arcane",   name:"Arcane",    bg:"#07050e", g1:"rgba(80,20,160,0.30)",  g2:"rgba(40,0,100,0.22)",   effect:null },
                      { id:"winter",      name:"Winter Dark",  bg:"#040c18", g1:"rgba(80,160,255,0.22)", g2:"rgba(40,100,200,0.15)",effect:"winter" },
                      { id:"winterlight", name:"Winter Light",  bg:"linear-gradient(180deg,#dbeeff 0%,#c2d8f0 35%,#b8cfe8 65%,#d0e4f5 100%)", g1:"rgba(255,255,255,0.45)", g2:"rgba(160,200,240,0.30)",effect:"winter-light" },
                      { id:"hearthfire",  name:"Hearthfire",    bg:"#0e0500", g1:"rgba(200,60,0,0.30)",   g2:"rgba(120,30,0,0.20)",  effect:"fire" },
                    ].map(p => {
                      const cur = (char.custom||{}).bgPreset || "dungeon";
                      const active = cur === p.id;
                      return (
                        <div key={p.id} onClick={()=>setChar(c=>({...c,custom:{...c.custom||{},bgPreset:p.id,bgColor:p.bg,bgG1:p.g1,bgG2:p.g2,bgEffect:p.effect}}))}
                          style={{ padding:"8px 4px", borderRadius:7, cursor:"pointer", textAlign:"center", transition:"all 0.2s",
                            border:`2px solid ${active?"var(--accent)":"var(--border)"}`,
                            background:`radial-gradient(ellipse at 30% 20%, ${p.g1} 0%, transparent 70%), ${p.bg}` }}>
                          <div style={{ fontSize:10, color:active?"var(--accent)":"var(--text-muted)", fontFamily:"var(--font-display)" }}>{p.name}</div>
                          {p.effect && <div style={{ fontSize:8, color:active?"var(--accent)":"var(--text-dim)", marginTop:1 }}>{p.effect==="fire"?"🔥":"❄"}</div>}
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Accent + symbols */}
                <div>
                  <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Accent Colour</div>
                  <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:16 }}>
                    {["var(--accent)","#e05252","#52a8e0","#52e07a","#b452e0","#e09a52","#e0d452","#52e0d4"].map(col=>(
                      <div key={col} onClick={()=>setChar(c=>({...c,custom:{...c.custom||{},accentColor:col}}))}
                        style={{ width:24, height:24, borderRadius:"50%", background:col, cursor:"pointer", flexShrink:0,
                          border:`3px solid ${((char.custom||{}).accentColor||"#c9a227")===col?"white":"transparent"}`,
                          boxShadow:((char.custom||{}).accentColor||"#c9a227")===col?"0 0 0 2px "+col:"none", transition:"all 0.15s" }}/>
                    ))}
                    <input type="color" value={(char.custom||{}).accentColor||"#c9a227"} onChange={e=>setChar(c=>({...c,custom:{...c.custom||{},accentColor:e.target.value}}))}
                      style={{ width:28,height:28,border:"1px solid var(--border)",borderRadius:6,cursor:"pointer",background:"transparent",padding:2 }} title="Custom"/>
                  </div>

                  <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Floating Symbols</div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                    {Object.keys(SYMBOL_PRESETS).map(preset => {
                      const cur = (char.custom||{}).symbolPreset || "All";
                      const active = cur === preset;
                      return (
                        <button key={preset} onClick={()=>setChar(c=>({...c,custom:{...c.custom||{},symbolPreset:preset,symbolSet:SYMBOL_PRESETS[preset],symbolDensity:preset==="None"?"off":"subtle"}}))}
                          style={{ padding:"4px 10px", borderRadius:16, cursor:"pointer", fontSize:11, transition:"all 0.15s",
                            border:`1px solid ${active?"var(--accent)":"var(--border)"}`,
                            background:active?"rgba(201,162,39,0.1)":"var(--surface)",
                            color:active?"var(--accent)":"var(--text-muted)" }}>
                          {preset}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── STEP 2: Background ── */}
        {step === 2 && (
          <div>
            <div style={ws.optGrid}>
              {Object.entries(backgrounds || {}).map(([n, d]) => (
                <div key={n} style={ws.optCard(char.background === n)} onClick={() => setChar(c => {
                  if (c.background === n) return c; // no change
                  // Strip skill proficiencies sourced from the old background
                  const newSources = Object.fromEntries(
                    Object.entries(c.skillProfSources || {}).filter(([, src]) => src !== "Background")
                  );
                  const newProfs = (c.skillProficiencies || []).filter(sk =>
                    (c.skillProfSources||{})[sk] !== "Background"
                  );
                  const newExpertise = (c.skillExpertise || []).filter(s => newProfs.includes(s));
                  // Clear feature choices from old background features
                  const oldBgFeatureNames = new Set(
                    (backgrounds?.[c.background]?.features || []).map(f => f.name)
                  );
                  const newChoices = Object.fromEntries(
                    Object.entries(c.featureChoices || {}).filter(([k]) => !oldBgFeatureNames.has(k))
                  );
                  // Reset languages chosen by the old background (keep species auto-langs and species choices)
                  const keptLanguages = (c.languages || []).filter(l =>
                    (speciesDb?.[c.species]?.autoLanguages || []).includes(l) ||
                    (c.languageSources||{})[l] === "Species"
                  );
                  const keptLangSources = Object.fromEntries(
                    Object.entries(c.languageSources || {}).filter(([l]) => keptLanguages.includes(l))
                  );
                  return {
                    ...c, background: n,
                    skillProfSources: newSources,
                    skillProficiencies: newProfs,
                    skillExpertise: newExpertise,
                    featureChoices: newChoices,
                    languages: keptLanguages,
                    languageSources: keptLangSources,
                  };
                })}>
                  <div style={{ fontFamily:"var(--font-display)", fontSize:14, color:"var(--text)", marginBottom:4 }}>{n}</div>
                  <div style={{ fontSize:11, color:"var(--text-muted)" }}>
                    {(d.features||[]).filter(f=>f.type==="proficiency_choice"||f.fixed).map(f=>{
                      if (f.displayText) return f.displayText;
                      const src = Array.isArray(f.fixed) ? f.fixed : Array.isArray(f.from) ? f.from : f.from === "all" ? ["Any 2 skills"] : [];
                      return src.slice(0,2).join(", ");
                    }).join(" • ")}
                  </div>
                  {d.source && <div style={{ marginTop:5 }}><SourceBadge source={d.source}/></div>}
                </div>
              ))}
            </div>
            {bgData && (
              <div style={{ marginTop:20 }}>
                <div style={{ ...ws.card }}>
                  <div style={ws.secTitle}>{char.background}</div>
                  {bgData.description && <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.6, margin:0 }}>{bgData.description}</p>}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:14 }}>
                  {[["personalityTraits","Personality Traits"],["ideals","Ideals"],["bonds","Bonds"],["flaws","Flaws"]].map(([f, l]) => (
                    <div key={f}>
                      <label style={ws.label}>{l}</label>
                      <textarea style={{ ...ws.input, minHeight:65, resize:"vertical", fontSize:13 }} value={char[f]}
                        placeholder={`Your character's ${l.toLowerCase()}…`} onChange={e => setChar({ ...char, [f]:e.target.value })} />
                    </div>
                  ))}
                </div>
                <div style={ws.secTitle}>Background Features</div>
                {(bgData.features || []).map(feat => (
                  <FeaturePanel key={feat.name} feature={feat} locked={false}
                    {...fpProps("Background")} />
                ))}
              </div>
            )}
          </div>
        )}

        {/* ── STEP 3: Species ── */}
        {step === 3 && (
          <div>
            <div style={ws.optGrid}>
              {Object.entries(speciesDb || {}).map(([n, d]) => (
                <div key={n} style={ws.optCard(char.species === n)}
                  onClick={() => setChar(c => {
                    if (c.species === n) return c;
                    // Strip everything sourced from the old species + old subrace features
                    const oldSubraceFeatureNames = new Set([
                      ...(speciesDb?.[c.species]?.features || []).map(f => f.name),
                      ...Object.values(speciesDb?.[c.species]?.subraces || {}).flatMap(sr => (sr.features||[]).map(f=>f.name))
                    ]);
                    const newSources = Object.fromEntries(
                      Object.entries(c.skillProfSources || {}).filter(([, src]) => src !== "Species" && src !== "Subrace")
                    );
                    const newProfs = (c.skillProficiencies || []).filter(sk =>
                      (c.skillProfSources||{})[sk] !== "Species" && (c.skillProfSources||{})[sk] !== "Subrace"
                    );
                    const newExpertise = (c.skillExpertise || []).filter(s => newProfs.includes(s));
                    const newChoices = Object.fromEntries(
                      Object.entries(c.featureChoices || {}).filter(([k]) => !oldSubraceFeatureNames.has(k))
                    );
                    const newLangs = (c.languages || []).filter(l =>
                      (c.languageSources||{})[l] !== "Species" && (c.languageSources||{})[l] !== "Subrace" &&
                      !(speciesDb?.[c.species]?.autoLanguages||[]).includes(l)
                    );
                    const newLangSources = Object.fromEntries(
                      Object.entries(c.languageSources || {}).filter(([l]) => newLangs.includes(l))
                    );
                    return {
                      ...c, species: n, subrace: "",
                      speciesAbilityChoices: {},
                      languages: newLangs,
                      languageSources: newLangSources,
                      skillProfSources: newSources,
                      skillProficiencies: newProfs,
                      skillExpertise: newExpertise,
                      featureChoices: newChoices,
                    };
                  })}>
                  <div style={{ fontFamily:"var(--font-display)", fontSize:14, color:"var(--text)", marginBottom:4 }}>{n}</div>
                  <div style={{ fontSize:11, color:"var(--text-muted)" }}>
                    {[
                      ...Object.entries(d.abilityBonuses || {}).map(([ab, v]) => `+${v} ${ABILITY_SHORT[ab]}`),
                      ...(d.features||[]).filter(f=>f.type==="asi_points").map(f=>`+${f.points} (flex)`)
                    ].join(", ")}
                  </div>
                  <div style={{ fontSize:11, color:"var(--text-dim)", marginTop:3 }}>
                    {d.speed}ft • {d.size}
                    {d.subraces && <span style={{ color:"var(--accent)", marginLeft:6 }}>▾ {Object.keys(d.subraces).length} subraces</span>}
                  </div>
                  {d.source && <div style={{ marginTop:5 }}><SourceBadge source={d.source}/></div>}
                </div>
              ))}
            </div>

            {speciesData && (
              <div style={{ marginTop:20 }}>
                {/* Subrace selector — shown when species has subraces */}
                {speciesData.subraces && Object.keys(speciesData.subraces).length > 0 && (
                  <div style={{ marginBottom:14 }}>
                    <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13, textTransform:"uppercase", letterSpacing:1, marginBottom:12 }}>
                      Choose your {char.species} subrace
                    </div>
                    <div style={ws.optGrid}>
                      {Object.entries(speciesData.subraces).map(([srName, srData]) => {
                        const isSel = char.subrace === srName;
                        return (
                          <div key={srName} style={ws.optCard(isSel)}
                            onClick={() => setChar(c => {
                              if (c.subrace === srName) return c;
                              const oldSrFeatureNames = new Set(
                                (speciesData.subraces?.[c.subrace]?.features || []).map(f => f.name)
                              );
                              const newChoices = Object.fromEntries(
                                Object.entries(c.featureChoices || {}).filter(([k]) => !oldSrFeatureNames.has(k))
                              );
                              const newSources = Object.fromEntries(
                                Object.entries(c.skillProfSources || {}).filter(([, src]) => src !== "Subrace")
                              );
                              const newProfs = (c.skillProficiencies || []).filter(sk =>
                                (c.skillProfSources||{})[sk] !== "Subrace"
                              );
                              return { ...c, subrace: srName, featureChoices: newChoices, skillProfSources: newSources, skillProficiencies: newProfs };
                            })}>
                            <div style={{ fontFamily:"var(--font-display)", fontSize:14, color:"var(--text)", marginBottom:4 }}>{srName}</div>
                            <div style={{ fontSize:11, color:"var(--text-muted)", marginBottom:3 }}>
                              {Object.entries(srData.abilityBonuses || {}).map(([ab, v]) => `+${v} ${ABILITY_SHORT[ab]}`).join(", ") || "No bonus"}
                            </div>
                            {srData.features?.length > 0 && (
                              <div style={{ fontSize:10, color:"var(--text-dim)" }}>
                                {srData.features.slice(0,2).map(f => f.name).join(" • ")}{srData.features.length>2?" +more":""}
                              </div>
                            )}
                            {srData.source && <div style={{ marginTop:5 }}><SourceBadge source={srData.source}/></div>}
                          </div>
                        );
                      })}
                    </div>
                    {!char.subrace && (
                      <div style={{ marginTop:8, fontSize:12, color:"#e67e22" }}>⚠ Please choose a subrace to continue</div>
                    )}
                  </div>
                )}

                {/* Auto-granted languages */}
                {autoLangs.length > 0 && (
                  <div style={{ ...ws.card, fontSize:13 }}>
                    <span style={{ color:"var(--text-muted)" }}>Automatically known (shown locked in language pickers): </span>
                    {autoLangs.map(l => (
                      <span key={l} style={{ display:"inline-flex", alignItems:"center", gap:4, padding:"3px 10px", background:"rgba(100,100,200,0.12)", border:"1px solid var(--info)", borderRadius:12, color:"var(--info)", fontSize:12, margin:"3px 4px 3px 0" }}>
                        🔒 {l}
                      </span>
                    ))}
                  </div>
                )}

                {/* Fixed ability bonuses (species + subrace combined) */}
                {(() => {
                  const allBonuses = {};
                  Object.entries(speciesData.abilityBonuses || {}).forEach(([ab,v]) => allBonuses[ab] = (allBonuses[ab]||0)+v);
                  Object.entries(subraceData?.abilityBonuses || {}).forEach(([ab,v]) => allBonuses[ab] = (allBonuses[ab]||0)+v);
                  return Object.keys(allBonuses).length > 0 ? (
                    <div style={{ ...ws.card, fontSize:13 }}>
                      <span style={{ color:"var(--text-muted)" }}>Fixed ability bonuses: </span>
