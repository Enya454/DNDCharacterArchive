                      {Object.entries(allBonuses).map(([ab, v]) => (
                        <span key={ab} style={{ color:"var(--accent)", marginRight:10 }}>+{v} {ABILITY_NAMES[ab]}</span>
                      ))}
                    </div>
                  ) : null;
                })()}

                {/* Speed and size */}
                <div style={{ ...ws.card, fontSize:13, display:"flex", gap:20, alignItems:"center" }}>
                  <span>
                    <span style={{ color:"var(--text-muted)" }}>Speed: </span>
                    <span style={{ color:"var(--accent)" }}>
                      {(() => {
                        const base = speciesData.speed || 30;
                        const sub  = subraceData?.speed;
                        const spd  = sub || base;
                        return `${spd}ft`;
                      })()}
                    </span>
                  </span>
                  <span>
                    <span style={{ color:"var(--text-muted)" }}>Size: </span>
                    <span style={{ color:"var(--accent)" }}>{subraceData?.size || speciesData.size || "Medium"}</span>
                  </span>
                  {(speciesData.climbSpeed || subraceData?.climbSpeed) && (
                    <span><span style={{ color:"var(--text-muted)" }}>Climb: </span><span style={{ color:"var(--accent)" }}>{subraceData?.climbSpeed || speciesData.climbSpeed}ft</span></span>
                  )}
                  {(speciesData.swimSpeed || subraceData?.swimSpeed) && (
                    <span><span style={{ color:"var(--text-muted)" }}>Swim: </span><span style={{ color:"var(--accent)" }}>{subraceData?.swimSpeed || speciesData.swimSpeed}ft</span></span>
                  )}
                  {(speciesData.flySpeed || subraceData?.flySpeed) && (
                    <span><span style={{ color:"var(--text-muted)" }}>Fly: </span><span style={{ color:"var(--accent)" }}>{subraceData?.flySpeed || speciesData.flySpeed}ft</span></span>
                  )}
                </div>

                {/* Species features */}
                <div style={ws.secTitle}>Species Features</div>
                {(speciesData.features || []).map(feat => (
                  <FeaturePanel key={feat.name} feature={feat} locked={false}
                    {...fpProps("Species", true)} />
                ))}

                {/* Subrace features */}
                {subraceData?.features?.length > 0 && (
                  <>
                    <div style={{ ...ws.secTitle, marginTop:12 }}>
                      {char.subrace} Features
                      <span style={{ fontSize:11, fontFamily:"var(--font-body)", color:"var(--accent2)", marginLeft:8, fontStyle:"italic" }}>Subrace</span>
                    </div>
                    {subraceData.features.map(feat => (
                      <FeaturePanel key={feat.name} feature={feat} locked={false}
                        {...fpProps("Subrace", true)} />
                    ))}
                  </>
                )}
              </div>
            )}
          </div>
        )}

        {/* ── STEP 1: Class ── */}
        {step === 1 && (
          <div>
            <div style={ws.optGrid}>
              {Object.entries(classes || {}).map(([n, d]) => (
                <div key={n} style={ws.optCard(char.class === n)}
                  onClick={() => {
                    if (char.class === n) return; // no change
                    const oldClass = char.class;
                    const oldSubclass = char.subclass;
                    // Labels used when storing class-sourced data
                    const oldClassLabel = oldClass ? `${oldClass} Class` : null;
                    setChar(c => {
                      // Build the set of source labels belonging to the old class
                      const oldLabels = new Set([
                        oldClassLabel,
                        oldSubclass,
                        // Also catch any variant label formats just in case
                        oldClass,
                      ].filter(Boolean));

                      // Strip skill profs sourced from old class or subclass
                      const newSources = Object.fromEntries(
                        Object.entries(c.skillProfSources || {}).filter(([, src]) => !oldLabels.has(src))
                      );
                      // Keep a skill only if it has a surviving source OR has no source record at all
                      // AND is not sourced from the old class
                      const newProfs = (c.skillProficiencies || []).filter(sk => {
                        const src = (c.skillProfSources || {})[sk];
                        if (!src) return true;          // no source tracking — keep it
                        return !oldLabels.has(src);     // keep only if not from old class
                      });
                      const newExpertise = (c.skillExpertise || []).filter(sk => newProfs.includes(sk));
                      // Strip languages sourced from old class/subclass
                      const newLangSources = Object.fromEntries(
                        Object.entries(c.languageSources || {}).filter(([, src]) => !oldLabels.has(src))
                      );
                      const newLangs = (c.languages || []).filter(l => {
                        const src = (c.languageSources || {})[l];
                        if (!src) return true;
                        return !oldLabels.has(src);
                      });
                      // Strip all class feature choices (keep species/background choices)
                      const oldClassFeatureNames = new Set([
                        ...(classes[oldClass]?.features || []).map(f => f.name),
                        ...Object.values(classes[oldClass]?.subclasses || {}).flatMap(sc => (sc.features || []).map(f => f.name)),
                      ]);
                      // Nuclear option: if old class had a proficiency_choice feature,
                      // drop ALL skills whose source isn't "Background", "Species", or "Subrace"
                      const oldClassHadProfChoice = (classes[oldClass]?.features || []).some(f => f.type === "proficiency_choice");
                      const safeSourcePrefixes = new Set(["Background", "Species", "Subrace"]);
                      const finalProfs = oldClassHadProfChoice
                        ? newProfs.filter(sk => {
                            const src = newSources[sk];
                            if (!src) return false; // no source = probably class, drop it
                            return safeSourcePrefixes.has(src) || src.startsWith("Species") || src.startsWith("Subrace");
                          })
                        : newProfs;
                      const finalExpertise = newExpertise.filter(sk => finalProfs.includes(sk));
                      const newFeatureChoices = Object.fromEntries(
                        Object.entries(c.featureChoices || {}).filter(([k]) => !oldClassFeatureNames.has(k))
                      );
                      // Strip ASI choices from class features
                      const newAsiChoices = Object.fromEntries(
                        Object.entries(c.asiChoices || {}).filter(([k]) => !oldClassFeatureNames.has(k))
                      );
                      // Strip feat choices from class ASI features
                      const newFeatChoices = Object.fromEntries(
                        Object.entries(c.featChoices || {}).filter(([k]) => !oldClassFeatureNames.has(k))
                      );
                      // Strip class spells (keep racial spells)
                      const newSpells = (c.spells || []).filter(s => s.racial);
                      return {
                        ...c,
                        class: n,
                        subclass: "",
                        skillProfSources: newSources,
                        skillProficiencies: finalProfs,
                        skillExpertise: finalExpertise,
                        languageSources: newLangSources,
                        languages: newLangs,
                        featureChoices: newFeatureChoices,
                        asiChoices: newAsiChoices,
                        featChoices: newFeatChoices,
                        spells: newSpells,
                      };
                    });
                  }}>
                  <div style={{ fontFamily:"var(--font-display)", fontSize:14, color:"var(--text)", marginBottom:4 }}>{n}</div>
                  <div style={{ fontSize:11, color:"var(--text-muted)" }}>d{d.hitDie} • {ABILITY_SHORT[d.primaryAbility]}</div>
                  <div style={{ fontSize:11, color:"var(--text-dim)", marginTop:3 }}>{d.spellcaster ? "✨ Spellcaster" : "⚔️ Martial"}</div>
                  {d.source && <div style={{ marginTop:5 }}><SourceBadge source={d.source}/></div>}
                </div>
              ))}
            </div>

            {classData && (
              <div style={{ marginTop:20 }}>
                {/* Level input — free typing */}
                <div style={{ ...ws.card, display:"flex", alignItems:"center", gap:24 }}>
                  <div>
                    <label style={ws.label}>Character Level</label>
                    <input
                      type="number" min={1} max={20}
                      value={char.level === 0 ? "" : char.level}
                      onChange={e => {
                        const raw = e.target.value;
                        if (raw === "") { setChar(c => ({ ...c, level:0 })); return; }
                        const n = parseInt(raw, 10);
                        if (!isNaN(n)) {
                          const newLevel = Math.min(20, Math.max(1, n));
                          setChar(c => {
                            // Strip feature choices that belong to features above the new level
                            const allFeatures = [
                              ...(classData?.features || []),
                              ...((c.subclass && classData?.subclasses?.[c.subclass]?.features) || [])
                            ];
                            const lockedFeatureNames = new Set(
                              allFeatures.filter(f => f.level > newLevel).map(f => f.name)
                            );
                            const newChoices = Object.fromEntries(
                              Object.entries(c.featureChoices || {}).filter(([k]) => !lockedFeatureNames.has(k))
                            );
                            // Strip ASI choices from features above new level
                            const newAsi = Object.fromEntries(
                              Object.entries(c.asiChoices || {}).filter(([k]) => {
                                const feat = allFeatures.find(f => f.name === k);
                                return !feat || feat.level <= newLevel;
                              })
                            );
                            // Strip subclass if its unlock level exceeds new level
                            const subclassUnlockLevel = allFeatures.find(f => f.type === "subclass_choice")?.level || 1;
                            const newSubclass = newLevel < subclassUnlockLevel ? "" : c.subclass;
                            // Strip spells that require a slot level the character no longer has
                            const newLimits = getSpellLimits({ ...c, level: newLevel, subclass: newSubclass }, classes);
                            const newMaxSlot = newLimits?.maxSlotLevel || 0;
                            const newCantripsMax = newLimits?.cantripsKnown || 0;
                            const newSpellsMax = newLimits?.spellsKnown || 99;
                            // Remove spells that are now too high level
                            let newSpells = (c.spells || []).filter(s => s.level === 0 || s.level <= newMaxSlot);
                            // Trim cantrips to new cap
                            const cantrips = newSpells.filter(s => s.level === 0);
                            const leveled  = newSpells.filter(s => s.level > 0);
                            if (cantrips.length > newCantripsMax) newSpells = [...cantrips.slice(0, newCantripsMax), ...leveled];
                            if (leveled.length  > newSpellsMax)  newSpells = [...newSpells.filter(s=>s.level===0), ...leveled.slice(0, newSpellsMax)];
                            return { ...c, level: newLevel, subclass: newSubclass, featureChoices: newChoices, asiChoices: newAsi, spells: newSpells };
                          });
                        }
                      }}
                      onBlur={e => { if (!e.target.value || +e.target.value < 1) setChar(c => ({ ...c, level:1 })); }}
                      style={{ ...ws.input, width:100, fontSize:28, fontFamily:"var(--font-display)", textAlign:"center", padding:"8px" }}
                    />
                  </div>
                  <div style={{ fontSize:13, color:"var(--text-muted)", lineHeight:2 }}>
                    <div>Proficiency Bonus: <strong style={{ color:"var(--accent)" }}>+{profBonus(char.level || 1)}</strong></div>
                    <div>Max HP: <strong style={{ color:"var(--success)" }}>{maxHP}</strong></div>
                    <div>Hit Die: <strong style={{ color:"var(--accent)" }}>d{classData.hitDie}</strong></div>
                  </div>
                </div>

                {/* All class features — unlocked up to level, locked above */}
                <div style={ws.secTitle}>Class Features</div>
                {allClassFeatures.map((feat, idx) => {
                  const locked = (char.level || 1) < feat.level;
                  const sourceLabel = feat._source ? feat._source : `${char.class} Class`;
                  return (
                    <FeaturePanel key={`${feat.name}-${idx}`} feature={feat} locked={locked}
                      source={feat._source ? feat._source : null}
                      {...fpProps(sourceLabel)} />
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ── STEP 4: Abilities ── */}
        {step === 4 && (
          <div>
            <AbilityRoller abilities={char.abilities} char={char} setChar={setChar} onChange={abs => setChar(c => ({ ...c, abilities:abs }))} />
            <div style={{ ...ws.card, marginTop:18 }}>
              <div style={{ color:"var(--text-muted)", fontSize:11, marginBottom:12, textTransform:"uppercase", letterSpacing:1 }}>
                Score Breakdown (Base + All Bonuses)
              </div>
              <div style={{ overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                  <thead>
                    <tr>
                      <td style={{ padding:"4px 8px", color:"var(--text-muted)", fontSize:11 }}>Source</td>
                      {Object.keys(char.abilities).map(ab => <td key={ab} style={{ padding:"4px 8px", textAlign:"center", color:"var(--text-muted)", fontSize:11, textTransform:"uppercase", letterSpacing:1 }}>{ABILITY_SHORT[ab]}</td>)}
                    </tr>
                  </thead>
                  <tbody>
                    <tr style={{ borderTop:"1px solid var(--border)" }}>
                      <td style={{ padding:"5px 8px", color:"var(--text-muted)" }}>Base (rolled/assigned)</td>
                      {Object.keys(char.abilities).map(ab => <td key={ab} style={{ padding:"5px 8px", textAlign:"center", fontFamily:"var(--font-display)", color:"var(--text)" }}>{char.abilities[ab]}</td>)}
                    </tr>
                    {speciesData && Object.keys(speciesData.abilityBonuses||{}).some(ab=>speciesData.abilityBonuses[ab]>0) && (
                      <tr style={{ borderTop:"1px solid var(--border)" }}>
                        <td style={{ padding:"5px 8px", color:"var(--text-muted)" }}>{char.species} (fixed)</td>
                        {Object.keys(char.abilities).map(ab => { const v=speciesData.abilityBonuses[ab]||0; return <td key={ab} style={{ padding:"5px 8px", textAlign:"center", color:v>0?"var(--success)":"var(--text-dim)" }}>{v>0?`+${v}`:""}</td>; })}
                      </tr>
                    )}
                    {subraceData && Object.keys(subraceData.abilityBonuses||{}).some(ab=>subraceData.abilityBonuses[ab]>0) && (
                      <tr style={{ borderTop:"1px solid var(--border)" }}>
                        <td style={{ padding:"5px 8px", color:"var(--text-muted)" }}>{char.subrace} (subrace)</td>
                        {Object.keys(char.abilities).map(ab => { const v=subraceData.abilityBonuses[ab]||0; return <td key={ab} style={{ padding:"5px 8px", textAlign:"center", color:v>0?"var(--success)":"var(--text-dim)" }}>{v>0?`+${v}`:""}</td>; })}
                      </tr>
                    )}
                    {Object.values(char.speciesAbilityChoices||{}).some(v=>v>0) && (
                      <tr style={{ borderTop:"1px solid var(--border)" }}>
                        <td style={{ padding:"5px 8px", color:"var(--text-muted)" }}>{char.species} (choice)</td>
                        {Object.keys(char.abilities).map(ab => { const v=char.speciesAbilityChoices?.[ab]||0; return <td key={ab} style={{ padding:"5px 8px", textAlign:"center", color:v>0?"var(--success)":"var(--text-dim)" }}>{v>0?`+${v}`:""}</td>; })}
                      </tr>
                    )}
                    {Object.entries(char.asiChoices||{}).filter(([,v])=>Object.values(v).some(n=>n>0)).map(([feat,vals]) => (
                      <tr key={feat} style={{ borderTop:"1px solid var(--border)" }}>
                        <td style={{ padding:"5px 8px", color:"var(--text-muted)" }}>ASI: {feat}</td>
                        {Object.keys(char.abilities).map(ab => { const v=vals[ab]||0; return <td key={ab} style={{ padding:"5px 8px", textAlign:"center", color:v>0?"var(--success)":"var(--text-dim)" }}>{v>0?`+${v}`:""}</td>; })}
                      </tr>
                    ))}
                    <tr style={{ borderTop:"2px solid var(--accent2)", fontWeight:"bold" }}>
                      <td style={{ padding:"5px 8px", color:"var(--accent)", fontFamily:"var(--font-display)", fontSize:12 }}>TOTAL</td>
                      {Object.keys(char.abilities).map(ab => {
                        const t = totalAb(ab);
                        const over = t > 20;
                        return <td key={ab} style={{ padding:"5px 8px", textAlign:"center", fontFamily:"var(--font-display)", color: over ? "var(--danger)" : "var(--accent)", fontSize:16 }}>
                          {t}
                          <span style={{ fontSize:11, color: over ? "var(--danger)" : "var(--text-muted)", marginLeft:3 }}>({modStr(calcMod(t))})</span>
                          {over && <div style={{ fontSize:10, color:"var(--danger)" }}>⚠ {t-20} wasted</div>}
                        </td>;
                      })}
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {/* ── STEP 5: Equipment & Spells ── */}
        {step === 5 && (
          <div>
            <WizardEquipmentStep char={char} setChar={setChar} gameData={gameData} />
            {getSpellcastingInfo(char, classes) && (
              <div style={{ ...ws.card, marginTop:20 }}>
                <div style={ws.secTitle}>Starting Spells</div>
                <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.6, margin:"0 0 14px" }}>
                  Pick spells from your class list. You can add more later on the sheet.
                </p>
                <WizardSpellPicker char={char} setChar={setChar} gameData={gameData} />
              </div>
            )}
          </div>
        )}

        {/* ── STEP 6: Finalise ── */}
        {step === 6 && (
          <div style={ws.card}>
            <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:22, marginBottom:18, textAlign:"center" }}>
              {char.name || "Unnamed Hero"}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:16 }}>
              {[
                ["Species", char.species || "—"],
                ["Class",   char.subclass ? `${char.class} (${char.subclass})` : char.class || "—"],
                ["Background", char.background || "—"],
                ["Level",   char.level || 1],
                ["Alignment", char.alignment],
                ["Max HP",  maxHP]
              ].map(([l, v]) => (
                <div key={l} style={{ textAlign:"center", padding:12, background:"var(--surface)", borderRadius:8, border:"1px solid var(--border)" }}>
                  <div style={{ color:"var(--text-muted)", fontSize:10, textTransform:"uppercase", letterSpacing:1 }}>{l}</div>
                  <div style={{ color:"var(--accent)", fontFamily:"var(--font-display)", fontSize:14, marginTop:4 }}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(6,1fr)", gap:8 }}>
              {Object.keys(char.abilities).map(ab => {
                const t = totalAb(ab);
                return (
                  <div key={ab} style={{ textAlign:"center", padding:10, background:"var(--surface)", borderRadius:8, border:"1px solid var(--border)" }}>
                    <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase" }}>{ABILITY_SHORT[ab]}</div>
                    <div style={{ fontSize:20, fontFamily:"var(--font-display)", color:"var(--accent)" }}>{t}</div>
                    <div style={{ fontSize:12, color:"var(--text-muted)" }}>{modStr(calcMod(t))}</div>
                  </div>
                );
              })}
            </div>
            {(char.skillProficiencies || []).length > 0 && (
              <div style={{ marginTop:14, fontSize:13 }}>
                <span style={{ color:"var(--text-muted)" }}>Skill Proficiencies: </span>
                {char.skillProficiencies.map(s => <span key={s} style={ws.tag}>{s}</span>)}
              </div>
            )}
            {(char.skillExpertise || []).length > 0 && (
              <div style={{ marginTop:8, fontSize:13 }}>
                <span style={{ color:"var(--text-muted)" }}>Expertise: </span>
                {char.skillExpertise.map(s => <span key={s} style={{ ...ws.tag, border:"1px solid var(--accent)" }}>{s} ×2</span>)}
              </div>
            )}
          </div>
        )}

        {/* Nav buttons */}
        <div style={{ display:"flex", justifyContent:"space-between", marginTop:28 }}>
          <button style={ws.navBtn(false)} onClick={() => step === 0 ? onCancel() : setStep(step - 1)}>
            {step === 0 ? (editChar ? "← Back to Sheet" : "Cancel") : "← Back"}
          </button>
          {step < STEPS.length - 1
            ? <button style={ws.navBtn(true)} onClick={() => setStep(step + 1)}>Next →</button>
            : <button style={ws.navBtn(true)} onClick={finalize}>{editChar ? "✓ Save Changes" : "⚔️ Create Character"}</button>}
        </div>
      </div>
    </TW>
  );
}

// ============================================================
// HP TRACKER
// ============================================================
function HPTracker({ hp, onUpdate }) {
  const [delta, setDelta] = useState("");
  const pct = Math.max(0, Math.min(100, (hp.current / Math.max(1, hp.max)) * 100));
  const bc  = pct > 50 ? "var(--success)" : pct > 25 ? "#f39c12" : "var(--danger)";
  const apply = heal => {
    const v = parseInt(delta);
    if (isNaN(v) || v <= 0) return;
    onUpdate({ ...hp, current: Math.min(hp.max, Math.max(0, hp.current + (heal ? v : -v))) });
    setDelta("");
  };
  return (
    <div style={{ display:"flex", alignItems:"center", gap:12 }}>
      {/* HP figure */}
      <div style={{ flexShrink:0, display:"flex", alignItems:"baseline", gap:4 }}>
        <span style={{ fontSize:28, fontFamily:"var(--font-display)", color: pct > 25 ? "var(--accent)" : "var(--danger)", lineHeight:1 }}>{hp.current}</span>
        <span style={{ color:"var(--text-dim)", fontSize:16 }}>/</span>
        <span style={{ fontSize:20, fontFamily:"var(--font-display)", color:"var(--text-muted)", lineHeight:1 }}>{hp.max}</span>
        {hp.temp > 0 && <span style={{ fontSize:11, color:"var(--info)", marginLeft:4 }}>+{hp.temp} tmp</span>}
        <span style={{ fontSize:10, color:"var(--text-dim)", marginLeft:4 }}>HP</span>
      </div>
      {/* Bar — flex-grow to fill space */}
      <div style={{ flex:1, height:10, background:"var(--bg)", borderRadius:5, overflow:"hidden", minWidth:60 }}>
        <div style={{ height:"100%", width:`${pct}%`, background:bc, borderRadius:5, transition:"all 0.3s" }}/>
      </div>
      {/* Controls */}
      <div style={{ display:"flex", gap:6, alignItems:"center", flexShrink:0 }}>
        <input value={delta} onChange={e=>setDelta(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&apply(false)}
          placeholder="±" style={{ width:48, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"4px 6px", borderRadius:6, fontSize:14, fontFamily:"var(--font-body)", textAlign:"center" }}/>
        <button onClick={()=>apply(false)} style={{ padding:"4px 9px", background:"rgba(192,57,43,0.15)", border:"1px solid var(--danger)", color:"var(--danger)", borderRadius:6, cursor:"pointer", fontSize:12 }}>DMG</button>
        <button onClick={()=>apply(true)}  style={{ padding:"4px 9px", background:"rgba(39,174,96,0.15)", border:"1px solid var(--success)", color:"var(--success)", borderRadius:6, cursor:"pointer", fontSize:12 }}>Heal</button>
        <button onClick={()=>onUpdate({...hp,current:hp.max})} style={{ padding:"4px 8px", background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text-muted)", borderRadius:5, cursor:"pointer", fontSize:11 }}>Short</button>
        <button onClick={()=>onUpdate({...hp,current:hp.max,temp:0})} style={{ padding:"4px 8px", background:"var(--surface)", border:"1px solid var(--accent2)", color:"var(--accent)", borderRadius:5, cursor:"pointer", fontSize:11 }}>Long</button>
        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
          <span style={{ fontSize:10, color:"var(--text-dim)" }}>Tmp:</span>
          <input type="number" value={hp.temp} min={0} onChange={e=>onUpdate({...hp,temp:Math.max(0,+e.target.value)})}
            style={{ width:40, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--info)", padding:"3px 4px", borderRadius:5, fontSize:12, textAlign:"center", fontFamily:"var(--font-body)" }}/>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// SPELLS TAB
// ============================================================
function SpellRow({ spell, badge, grant, char, onUpdate, limits, slotsSpent, slotsLeft, maxSlotLevel, racialUses, racialSpentKey, racialRemaining, spendRacialUse, setCasting, setUpcastLvl }) {
    const [open, setOpen] = useState(false);
    const isCantrip = spell.level === 0;
    const isRitual  = spell.ritual || (spell.castingTime||'').includes('ritual');
    const isHeritage = !!grant;
    const maxUses  = grant ? grant.uses : null;
    const remUses  = grant ? racialRemaining(spell.name, maxUses) : null;
    const recharge = grant?.recharge || null;
    const rechargeLabel = recharge === 'short' ? 'Short Rest' : recharge === 'long' ? 'Long Rest' : null;
    const hasSlot = isCantrip || isRitual ? true
      : limits.type === "pact"
        ? (slotsSpent["pact"]||0) < (limits.pactSlots||0)
        : slotsLeft(Math.min(spell.level, maxSlotLevel)) > 0;
    const canCast = isHeritage ? (maxUses === null || remUses > 0) : hasSlot;
    return (
      <div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 50px 72px 80px 140px", alignItems:"center",
        padding:"6px 10px", borderBottom: open ? "none" : "1px solid rgba(255,255,255,0.04)",
        cursor:"pointer" }} onClick={()=>setOpen(o=>!o)}>
        <div>
          <span style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:13 }}>{spell.name}</span>
          <span style={{ fontSize:10, color:"var(--text-dim)", marginLeft:5 }}>{open?"▲":"▼"}</span>
          {spell.school && <span style={{ fontSize:10, color:"var(--text-dim)", marginLeft:7 }}>{spell.school}</span>}
          {spell.combat?.damage && <span style={{ fontSize:10, color:"var(--danger)", marginLeft:7 }}>{spell.combat.damage} {spell.combat.damageType}</span>}
          {isRitual && <span style={{ fontSize:9, color:"rgba(100,160,255,0.7)", marginLeft:7 }}>ritual</span>}
          {badge && <span style={{ fontSize:9, color:"var(--accent2)", marginLeft:7, padding:"1px 5px", border:"1px solid var(--accent2)", borderRadius:4 }}>{badge}</span>}
        </div>
        <div style={{ fontSize:11, color:"var(--text-muted)", textAlign:"center" }} onClick={e=>e.stopPropagation()}>
          {isCantrip ? <span style={{ color:"var(--text-dim)" }}>—</span> : `L${spell.level}`}
        </div>
        <div style={{ fontSize:10, color:"var(--text-muted)" }} onClick={e=>e.stopPropagation()}>{spell.castingTime}</div>
        <div style={{ fontSize:10, color:"var(--text-muted)" }} onClick={e=>e.stopPropagation()}>{spell.range}</div>
        <div onClick={e=>e.stopPropagation()}>
          {isHeritage && maxUses !== null && (
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
              <div style={{ display:"flex", gap:3 }}>
                {Array.from({length: maxUses}).map((_,i) => {
                  const spent = i >= remUses;
                  return <div key={i} onClick={()=>{
                    if (!spent) spendRacialUse(spell.name);
                    else { const k=racialSpentKey(spell.name); onUpdate({...char,actionUses:{...racialUses,[k]:Math.max(0,(racialUses[k]||0)-1)}}); }
                  }} style={{ width:9,height:9,borderRadius:"50%",cursor:"pointer",transition:"all 0.15s",
                    border:`1.5px solid ${spent?"var(--border)":"var(--accent)"}`,background:spent?"transparent":"var(--accent)" }}/>;
                })}
              </div>
              {remUses < maxUses && rechargeLabel && (
                <button onClick={()=>{ const k=racialSpentKey(spell.name); onUpdate({...char,actionUses:{...racialUses,[k]:0}}); }}
                  style={{ padding:"1px 5px", borderRadius:4, fontSize:9, cursor:"pointer", whiteSpace:"nowrap",
                    border:"1px solid var(--success)", background:"rgba(39,174,96,0.1)", color:"var(--success)" }}>
                  ↺ {rechargeLabel}
                </button>
              )}
            </div>
          )}
          {isCantrip ? (
            <span style={{ fontSize:10, color:"var(--text-dim)", fontStyle:"italic" }}>At will</span>
          ) : isRitual ? (
            <span style={{ fontSize:10, color:"var(--text-dim)", fontStyle:"italic" }}>Ritual</span>
          ) : isHeritage ? (
            <button onClick={()=>{ if (canCast) spendRacialUse(spell.name); }} disabled={!canCast}
              style={{ padding:"3px 10px", borderRadius:6, fontSize:11, cursor:canCast?"pointer":"not-allowed",
                fontFamily:"var(--font-display)", border:`1px solid ${canCast?"var(--accent)":"var(--border)"}`,
                background:canCast?"rgba(var(--accent-rgb,201,162,39),0.12)":"transparent",
                color:canCast?"var(--accent)":"var(--text-dim)", opacity:canCast?1:0.5 }}>
              {canCast ? "Cast ▸" : "No uses"}
            </button>
          ) : limits.type === "pact" ? (
            <button onClick={()=>{ if (canCast) onUpdate({...char,spellSlots:{...slotsSpent,pact:(slotsSpent["pact"]||0)+1}}); }} disabled={!canCast}
              style={{ padding:"3px 10px", borderRadius:6, fontSize:11, cursor:canCast?"pointer":"not-allowed",
                fontFamily:"var(--font-display)", border:`1px solid ${canCast?"var(--accent)":"var(--border)"}`,
                background:canCast?"rgba(var(--accent-rgb,201,162,39),0.12)":"transparent",
                color:canCast?"var(--accent)":"var(--text-dim)", opacity:canCast?1:0.5 }}>
              {canCast ? `Cast L${limits.pactSlotLevel} ▸` : "No slots"}
            </button>
          ) : (
            <button onClick={()=>{ setCasting(spell); setUpcastLvl(spell.level); }} disabled={!canCast}
              style={{ padding:"3px 10px", borderRadius:6, fontSize:11, cursor:canCast?"pointer":"not-allowed",
                fontFamily:"var(--font-display)", border:`1px solid ${canCast?"var(--accent)":"var(--border)"}`,
                background:canCast?"rgba(var(--accent-rgb,201,162,39),0.12)":"transparent",
                color:canCast?"var(--accent)":"var(--text-dim)", opacity:canCast?1:0.5 }}>
              {canCast ? "Cast ▸" : "No slot"}
            </button>
          )}
        </div>
      </div>
      {/* Expanded description */}
      {open && (
        <div style={{ padding:"10px 14px 12px", borderBottom:"1px solid rgba(255,255,255,0.04)", background:"rgba(0,0,0,0.15)" }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"4px 20px", marginBottom:8 }}>
            {[["Casting Time",spell.castingTime],["Range",spell.range],["Components",spell.components],["Duration",spell.duration]]
              .filter(([,v])=>v).map(([l,v])=>(
              <div key={l}><span style={{fontSize:10,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:1}}>{l}: </span>
              <span style={{fontSize:12,color:"var(--text)"}}>{v}</span></div>
            ))}
          </div>
          {spell.combat?.slotScale && (
            <div style={{fontSize:12,color:"var(--info)",marginBottom:6,padding:"4px 8px",background:"rgba(41,128,185,0.1)",border:"1px solid rgba(41,128,185,0.3)",borderRadius:5}}>
              ⬆ Upcasting: {spell.combat.slotScale}
            </div>
          )}
          {spell.combat?.notes && <div style={{fontSize:12,color:"var(--accent)",fontStyle:"italic",marginBottom:6}}>{spell.combat.notes}</div>}
          <p style={{fontSize:13,color:"var(--text-muted)",lineHeight:1.7,margin:0}}>{spell.description}</p>
        </div>
      )}
      </div>
    );
  }

function SpellsTab({ char, gameData, onUpdate }) {
  const { classes, spells:spellDb } = gameData;
  const [managing,  setManaging]  = useState(false);
  const [filter,    setFilter]    = useState("all");
  const [search,    setSearch]    = useState("");
  const [casting,   setCasting]   = useState(null);
  const [upcastLvl, setUpcastLvl] = useState(null);

  const limits    = getSpellLimits(char, classes);
  const spellList = limits?.spellList || char.class;
  const known     = char.spells || [];
  const allSpells = Array.isArray(spellDb)
    ? spellDb.filter(s => (s.classes||[]).includes(spellList))
    : (spellDb?.[spellList] || []);

  // ── Extra spells from racial grants and class features (Pact of Tome, etc.) ──
  const racialSpells   = char.racialSpells || [];
  const tomeCantrips   = (char.featureChoices?.["pact_tome_cantrips"] || []);
  const basSpells      = [
    ...(char.featureChoices?.["bas_required"] || []),
    ...(char.featureChoices?.["bas_extra"]    || []),
  ];
  // Build extra spell objects — look them up in the spell db for full data
  const allSpellsDb = Array.isArray(spellDb) ? spellDb : [];
  const findSpell = name => allSpellsDb.find(s => s.name === name) || { name, level:0, school:"", castingTime:"", range:"", description:"" };

  const tomeSpells   = tomeCantrips.map(n => ({ ...findSpell(n), _source:"Pact of the Tome" }));
  const bookSpells   = basSpells.map(n    => ({ ...findSpell(n), _source:"Book of Ancient Secrets", ritual:true }));
  const heritageSpells = racialSpells.map(s => ({ ...s, _source: s.sourceFeature || "Heritage" }));

  // extraNames for marking in spell picker (built from new extraSpells below)

  const knownCantrips = known.filter(s => s.level === 0);
  const knownSpells   = known.filter(s => s.level > 0);
  const spellDC       = calcSpellDC(char, classes);
  const spellAtk      = calcSpellAtk(char, classes);
  const maxSlotLevel  = limits?.maxSlotLevel || 0;
  const canAddCantrip = !limits || knownCantrips.length < (limits.cantripsKnown || 0);
  const canAddSpell   = !limits || knownSpells.length   < (limits.spellsKnown   || 0);

  const slots      = limits?.slots || [];
  const slotsSpent = char.spellSlots || {};
  const slotsLeft  = lvl => Math.max(0, (slots[lvl-1] || 0) - (slotsSpent[String(lvl)] || 0));
  const spendSlot  = lvl => {
    if (slotsLeft(lvl) <= 0) return;
    onUpdate({ ...char, spellSlots: { ...slotsSpent, [String(lvl)]: (slotsSpent[String(lvl)]||0) + 1 } });
    setCasting(null); setUpcastLvl(null);
  };
  const recoverSlots = () => onUpdate({ ...char, spellSlots: {} });

  const toggleKnown = spell => {
    const isK = known.some(s => s.name === spell.name);
    if (isK) { onUpdate({ ...char, spells: known.filter(s => s.name !== spell.name) }); return; }
    if (spell.level === 0 && !canAddCantrip) return;
    if (spell.level > 0 && !canAddSpell) return;
    if (spell.level > maxSlotLevel) return;
    onUpdate({ ...char, spells: [...known, { ...spell, prepared:false }] });
  };

  if (!limits) return (
    <div style={{ textAlign:"center", padding:50, color:"var(--text-muted)" }}>
      <div style={{ fontSize:48, marginBottom:14 }}>⚔️</div>
      <div style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:18 }}>Non-Spellcaster</div>
      <div style={{ marginTop:6 }}>{char.class || "This class"} doesn't use spells.</div>
    </div>
  );

  const fBtn = a => ({ padding:"4px 10px", borderRadius:20, cursor:"pointer", fontSize:12, transition:"all 0.15s",
    border:`1px solid ${a?"var(--accent)":"var(--border)"}`, background:a?"var(--accent)":"transparent", color:a?"var(--bg)":"var(--text-muted)" });

  // SpellRow — one row in the known-spells table
  const SpellRow_ = (props) => <SpellRow {...props} char={char} onUpdate={onUpdate} limits={limits} slotsSpent={slotsSpent} slotsLeft={slotsLeft} maxSlotLevel={maxSlotLevel} racialUses={racialUses} racialSpentKey={racialSpentKey} racialRemaining={racialRemaining} spendRacialUse={spendRacialUse} setCasting={setCasting} setUpcastLvl={setUpcastLvl}/>;

  // ── Filter state ──

  // ── Filter state ──
  const [levelFilter, setLevelFilter] = useState("all");

  // ── Build usage map for heritage spells from char.actionUses ──
  // Key: "racial_{spellName}"
  const racialUses = char.actionUses || {};
  const racialSpentKey  = name => `racial_${name}`;
  const racialRemaining = (name, uses) => {
    if (uses === null || uses === undefined) return null; // at will
    return Math.max(0, uses - (racialUses[racialSpentKey(name)] || 0));
  };
  const spendRacialUse  = name => {
    const key = racialSpentKey(name);
    onUpdate({ ...char, actionUses: { ...racialUses, [key]: (racialUses[key] || 0) + 1 } });
  };
  const recoverRacialUses = (recharge) => {
    // Clear all racial uses that match the given recharge type
    const newUses = { ...racialUses };
    // Build lookup of which spells have which recharge
    extraSpells.forEach(sp => {
      const grant = sp._grant;
      if (grant && grant.recharge === recharge) {
        delete newUses[racialSpentKey(sp.name)];
      }
    });
    onUpdate({ ...char, actionUses: newUses });
  };

  // Rebuild extraSpells with grant info attached
  const allGrantsByName = {};
  (char.racialSpells || []).forEach(sp => {
    // Find the grant that produced this spell by looking through species/subrace data
    allGrantsByName[sp.name] = sp._grant || null;
  });

  const heritageSpellsWithGrants = racialSpells.map(s => {
    // Try to find grant info from the species data
    const speciesD = gameData?.species?.[char.species];
    const subraceD = char.subrace ? speciesD?.subraces?.[char.subrace] : null;
    let grant = null;
    for (const src of [speciesD, subraceD]) {
      if (!src) continue;
      for (const feat of (src.features || [])) {
        if (feat.type === 'spell_grant') {
          const g = (feat.grants || []).find(g => g.spellName === s.name);
          if (g) { grant = g; break; }
        }
      }
      if (grant) break;
    }
    return { ...s, _source: s.sourceFeature || "Heritage", _grant: grant };
  });

  const extraSpells = [
    ...heritageSpellsWithGrants,
    ...tomeSpells,
    ...bookSpells,
  ];
  const extraNames  = new Set(extraSpells.map(s => s.name));
  const displayed   = allSpells
    .filter(sp => (filter === "all" || sp.level === +filter) && (!search || sp.name.toLowerCase().includes(search.toLowerCase())))
    .sort((a,b) => a.level !== b.level ? a.level - b.level : a.name.localeCompare(b.name));
  const extraDisplayed  = levelFilter === "all" ? extraSpells : extraSpells.filter(sp => sp.level === +levelFilter);
  const knownDisplayed  = levelFilter === "all" ? known : known.filter(sp => sp.level === +levelFilter);
  const knownCantripsD  = knownDisplayed.filter(s => s.level === 0);
  const knownSpellsD    = knownDisplayed.filter(s => s.level > 0);

  return (
    <div>
      {/* ── Upcast modal ── */}
      {casting && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"var(--card)", border:"1px solid var(--accent)", borderRadius:14, padding:24, maxWidth:420, width:"90%", boxShadow:"0 8px 40px rgba(0,0,0,0.6)" }}>
            <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:18, marginBottom:6 }}>Cast {casting.name}</div>
            <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:16 }}>Choose a spell slot level to use:</div>
            <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
              {Array.from({length: maxSlotLevel}, (_,i)=>i+1).filter(lvl => lvl >= casting.level).map(lvl => {
                const left = slotsLeft(lvl);
                const isBase = lvl === casting.level;
                return (
                  <button key={lvl} onClick={() => spendSlot(lvl)} disabled={left <= 0}
                    style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                      padding:"10px 14px", borderRadius:8, cursor:left>0?"pointer":"not-allowed",
                      border:`1px solid ${upcastLvl===lvl?"var(--accent)":left>0?"var(--border)":"var(--border)"}`,
                      background:left>0?"var(--surface)":"rgba(0,0,0,0.2)",
                      opacity:left>0?1:0.4, transition:"all 0.15s" }}>
                    <div style={{ textAlign:"left" }}>
                      <div style={{ fontFamily:"var(--font-display)", color:left>0?"var(--accent)":"var(--text-dim)", fontSize:14 }}>
                        Level {lvl} Slot {isBase?"":"(Upcast +".concat(lvl-casting.level," tier)")}
                      </div>
                      {casting.combat?.slotScale && !isBase && (
                        <div style={{ fontSize:11, color:"var(--text-muted)", marginTop:2 }}>
                          {casting.combat.slotScale} per slot above {casting.level}
                        </div>
                      )}
                    </div>
                    <div style={{ fontFamily:"var(--font-display)", color:left>0?"var(--success)":"var(--danger)", fontSize:16 }}>
                      {left}/{slots[lvl-1]||0}
                    </div>
                  </button>
                );
              })}
            </div>
            <button onClick={()=>{setCasting(null);setUpcastLvl(null);}} style={{ width:"100%", padding:"8px", borderRadius:8, border:"1px solid var(--border)", background:"transparent", color:"var(--text-muted)", cursor:"pointer", fontSize:13 }}>Cancel</button>
          </div>
        </div>
      )}

      {/* ── Manage Spells modal ── */}
      {managing && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"var(--card)", border:"1px solid var(--accent)", borderRadius:14, padding:20, maxWidth:560, width:"94%", maxHeight:"80vh", display:"flex", flexDirection:"column", boxShadow:"0 8px 40px rgba(0,0,0,0.6)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:16 }}>Manage Spells</div>
              <div style={{ fontSize:12, color:"var(--text-muted)" }}>
                {knownCantrips.length}/{limits.cantripsKnown} cantrips · {knownSpells.length}/{limits.spellsKnown??'∞'} spells
              </div>
              <button onClick={()=>setManaging(false)} style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--text-muted)", padding:"4px 10px", borderRadius:6, cursor:"pointer", fontSize:12 }}>Done</button>
            </div>
            {/* Level filter */}
            <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:10 }}>
              <button style={fBtn(filter==="all")} onClick={()=>setFilter("all")}>All</button>
              {limits.cantripsKnown > 0 && <button style={fBtn(filter==="0")} onClick={()=>setFilter("0")}>Cantrips</button>}
              {[1,2,3,4,5,6,7,8,9].filter(l=>l<=maxSlotLevel).map(l=>(
                <button key={l} style={fBtn(filter===String(l))} onClick={()=>setFilter(String(l))}>Lvl {l}</button>
              ))}
            </div>
            {/* Spell list */}
            <div style={{ overflowY:"auto", flex:1 }}>
              {displayed.map(spell => {
                const isK = known.some(s => s.name === spell.name);
                const isExtra = extraNames.has(spell.name);
                const isCantrip = spell.level === 0;
                const capOk = isK || (isCantrip ? canAddCantrip : canAddSpell);
                const slotOk = isCantrip || spell.level <= maxSlotLevel;
                const disabled = !isK && (!slotOk || !capOk);
                return (
                  <SpellCard key={spell.name} spell={spell} charLevel={char.level}
                    isKnown={isK}
                    disabled={disabled && !isExtra}
                    disabledReason={!isK&&!isExtra&&(!slotOk?"slot too high":!capOk?"limit reached":null)}
                    extraSource={isExtra && !isK ? extraSpells.find(s=>s.name===spell.name)?._source : null}
                    onToggle={()=>toggleKnown(spell)}
                    actionLabel={isK ? "Remove" : isExtra ? "+ Also learn" : "+ Learn"}/>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* ── Header stats row ── */}
      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:10, alignItems:"center" }}>
        {[
          ["Spell DC",  spellDC ?? "—"],
          ["Spell Atk", modStr(spellAtk ?? 0)],
          ["Ability",   limits.ability ? ABILITY_SHORT[limits.ability] : "—"],
        ].map(([l,v]) => (
          <div key={l} style={{ padding:"5px 12px", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, textAlign:"center", minWidth:64 }}>
            <div style={{ fontSize:9, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{l}</div>
            <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:17 }}>{v}</div>
          </div>
        ))}
        <button onClick={()=>setManaging(true)} style={{ marginLeft:"auto", padding:"7px 16px", borderRadius:8, cursor:"pointer", fontSize:13, fontFamily:"var(--font-display)", border:"1px solid var(--accent)", background:"rgba(201,162,39,0.1)", color:"var(--accent)" }}>
          ✦ Manage Spells
        </button>
      </div>

      {/* ── Level filter ── */}
      <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:12 }}>
        {[["all","All"],["0","Cantrips"],...[1,2,3,4,5,6,7,8,9].filter(l=>l<=maxSlotLevel).map(l=>[String(l),`Level ${l}`])].map(([val,lbl])=>(
          <button key={val} style={{ padding:"4px 11px", borderRadius:20, cursor:"pointer", fontSize:12, transition:"all 0.15s",
            border:`1px solid ${levelFilter===val?"var(--accent)":"var(--border)"}`,
            background:levelFilter===val?"rgba(201,162,39,0.1)":"var(--surface)",
            color:levelFilter===val?"var(--accent)":"var(--text-muted)" }}
            onClick={()=>setLevelFilter(val)}>{lbl}</button>
        ))}
      </div>

      {/* ── Spell slots ── */}
      <div style={{ marginBottom:14 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
          <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>Spell Slots</div>
          {Object.keys(slotsSpent).some(k=>slotsSpent[k]>0) && (
            <button onClick={recoverSlots} style={{ fontSize:11, padding:"2px 8px", borderRadius:5, border:"1px solid var(--success)", background:"rgba(39,174,96,0.1)", color:"var(--success)", cursor:"pointer" }}>↺ Long Rest</button>
          )}
        </div>
        {limits.type === "pact" ? (
          <div style={{ display:"flex", gap:6 }}>
            {Array.from({length: limits.pactSlots||0}, (_,i) => {
              const used = (slotsSpent["pact"]||0) > i;
              return <div key={i} onClick={()=>{
                if(!used) onUpdate({...char,spellSlots:{...slotsSpent,pact:(slotsSpent.pact||0)+1}});
                else onUpdate({...char,spellSlots:{...slotsSpent,pact:Math.max(0,(slotsSpent.pact||0)-1)}});
              }} style={{ width:18, height:18, borderRadius:"50%", cursor:"pointer", border:`2px solid ${used?"var(--border)":"var(--accent)"}`, background:used?"transparent":"var(--accent)", transition:"all 0.15s" }}/>;
            })}
            <span style={{ fontSize:11, color:"var(--text-muted)", alignSelf:"center", marginLeft:6 }}>Pact slots (Lvl {limits.pactSlotLevel})</span>
          </div>
        ) : (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            {slots.map((count, idx) => {
              if (!count) return null;
              const lvl = idx+1;
              const left = slotsLeft(lvl);
              return (
                <div key={lvl} style={{ padding:"6px 12px", background:left>0?"var(--surface)":"rgba(0,0,0,0.2)", border:`1px solid ${left>0?"var(--border)":"rgba(255,255,255,0.05)"}`, borderRadius:8, textAlign:"center", minWidth:52 }}>
                  <div style={{ fontSize:9, color:"var(--text-muted)" }}>Lvl {lvl}</div>
                  <div style={{ fontFamily:"var(--font-display)", color:left>0?"var(--accent)":"var(--text-dim)", fontSize:18 }}>{left}</div>
                  <div style={{ fontSize:9, color:"var(--text-dim)" }}>/ {count}</div>
                  {/* Pip row for spending */}
                  <div style={{ display:"flex", gap:3, justifyContent:"center", marginTop:4 }}>
                    {Array.from({length:count},(_,i)=>{
                      const spent = i >= left;
                      return <div key={i} onClick={()=>{
                        if(!spent&&left>0) spendSlot(lvl);
                        else if(spent) onUpdate({...char,spellSlots:{...slotsSpent,[String(lvl)]:Math.max(0,(slotsSpent[String(lvl)]||0)-1)}});
                      }} style={{ width:10,height:10,borderRadius:"50%",cursor:"pointer",border:`1.5px solid ${spent?"var(--border)":"var(--accent)"}`,background:spent?"transparent":"var(--accent)",transition:"all 0.15s" }}/>;
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ── Known spells table ── */}
      {(known.length === 0 && extraSpells.length === 0) ? (
        <div style={{ padding:"28px", textAlign:"center", color:"var(--text-muted)", fontSize:13, fontStyle:"italic", border:"1px dashed var(--border)", borderRadius:8 }}>
          No spells selected. Click <strong style={{ color:"var(--accent)" }}>Manage Spells</strong> to add some.
        </div>
      ) : (
        <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, overflow:"hidden" }}>
          {/* Table header */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 50px 72px 80px 140px", padding:"5px 10px",
            background:"rgba(0,0,0,0.25)", borderBottom:"1px solid var(--border)" }}>
            {["Spell","Lvl","Cast Time","Range","Uses / Cast"].map(h=>(
              <div key={h} style={{ fontSize:9, color:"var(--text-dim)", textTransform:"uppercase", letterSpacing:1 }}>{h}</div>
            ))}
          </div>

          {/* ── Extra spells (racial, tome, book) — shown first ── */}
          {extraDisplayed.length > 0 && (<>
            <div style={{ padding:"3px 10px", fontSize:10, color:"var(--accent2)", background:"rgba(0,0,0,0.2)", borderBottom:"1px solid var(--border)" }}>
              Always Known — Heritage &amp; Class Features
            </div>
            {extraDisplayed.map(sp=><SpellRow_ key={`extra-${sp.name}`} spell={sp} badge={sp._source} grant={sp._grant||null}/>)}
          </>)}

          {/* ── Chosen cantrips ── */}
          {knownCantripsD.length > 0 && (<>
            <div style={{ padding:"3px 10px", fontSize:10, color:"var(--text-muted)", background:"rgba(0,0,0,0.15)", borderBottom:"1px solid var(--border)", borderTop:extraDisplayed.length?"1px solid var(--border)":"none" }}>Cantrips</div>
            {knownCantripsD.map(sp=><SpellRow_ key={sp.name} spell={sp}/>)}
          </>)}

          {/* ── Leveled spells grouped ── */}
          {[1,2,3,4,5,6,7,8,9].map(lvl => {
            if (levelFilter !== "all" && levelFilter !== String(lvl)) return null;
            const atLvl = knownSpellsD.filter(s=>s.level===lvl);
            if (!atLvl.length) return null;
            return (<React.Fragment key={lvl}>
              <div style={{ padding:"3px 10px", fontSize:10, color:"var(--text-muted)", background:"rgba(0,0,0,0.15)", borderBottom:"1px solid var(--border)", borderTop:"1px solid var(--border)" }}>
                Level {lvl} — {slotsLeft(lvl)}/{slots[lvl-1]||0} slots
                {maxSlotLevel > lvl && <span style={{ fontSize:9, color:"var(--text-dim)", marginLeft:8 }}>(can upcast to L{maxSlotLevel})</span>}
              </div>
              {atLvl.map(sp=><SpellRow_ key={sp.name} spell={sp}/>)}
            </React.Fragment>);
          })}
        </div>
      )}
    </div>
  );
}
