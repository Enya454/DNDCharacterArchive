                  }} style={{ background:"transparent", border:"1px solid var(--accent)", color:"var(--accent-text)", padding:"3px 8px", borderRadius:6, cursor:"pointer", fontSize:11 }}>
                    {dmCopied ? "✓" : "🎲 DM Link"}
                  </button>
                </div>
              )}
              <button onClick={()=>{ if(confirm("Delete this character permanently?")) onDelete(char.id); }} style={{ background:"transparent", border:`1px solid ${theme.danger}`, color:theme.danger, padding:"3px 8px", borderRadius:6, cursor:"pointer", fontSize:11 }}>Delete</button>
            </>}
          </div>
        </div>
      </div>

      {/* ── Shared fixed tooltip for senses/defenses ── */}
      <div id="sense-tip" style={{ display:"none", position:"fixed", zIndex:9999, maxWidth:260, background:"var(--card)",
        border:"1px solid var(--border)", borderRadius:9, padding:"10px 12px",
        boxShadow:"0 6px 24px rgba(0,0,0,0.6)", pointerEvents:"none", lineHeight:1 }}/>

      {/* ── Two-column body ── */}
      <div style={{ padding:"10px 12px 12px", height:"calc(100vh - 56px)", boxSizing:"border-box", overflow:"hidden", maxWidth:1200, margin:"0 auto", width:"100%" }}>
        <div style={{ display:"grid", gridTemplateColumns:"260px 1fr", height:"100%", gap:10, overflow:"hidden" }}>

        {/* ══ LEFT COLUMN: portrait + everything static ══ */}
        <div style={{ borderRadius:12, border:`1px solid ${"var(--border)"}`, background:"var(--card)", overflowY:"auto", padding:"14px 12px", display:"flex", flexDirection:"column", gap:0 }}>

          {/* Portrait */}
          <div style={{ textAlign:"center", marginBottom:12 }}>
            <div onClick={()=>fileRef.current.click()} title="Click to upload portrait"
              style={{ width:110, height:110, borderRadius:10, margin:"0 auto", cursor:"pointer", position:"relative", overflow:"hidden", border:"2px solid var(--accent)", background:"var(--surface)", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:`0 0 16px rgba(var(--accent-rgb,201,162,39),0.2)`, transition:"box-shadow 0.2s" }}
              onMouseEnter={e=>e.currentTarget.style.boxShadow="0 0 24px var(--accent)44"}
              onMouseLeave={e=>e.currentTarget.style.boxShadow="0 0 16px rgba(var(--accent-rgb,201,162,39),0.2)"}>
              {char.profileImage && !imgError
                ? <img src={char.profileImage} alt="portrait" onError={()=>setImgError(true)} style={{ width:"100%",height:"100%",objectFit:"cover" }}/>
                : <div style={{ textAlign:"center", color:"var(--text-dim)" }}><div style={{ fontSize:28 }}>🧙</div><div style={{ fontSize:9, marginTop:4, color:"var(--text-muted)" }}>Add portrait</div></div>
              }
            </div>
          </div>

          {/* Ability scores — 3 col compact */}
          {sectionLabel("Abilities")}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:5, marginBottom:4 }}>
            {Object.keys(char.abilities).map(ab => {
              const score = char.abilities[ab];
              return (
                <div key={ab} style={{ textAlign:"center", background:"var(--surface)", border:`1px solid ${"var(--border)"}`, borderRadius:7, padding:"5px 2px" }}>
                  <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{ABILITY_SHORT[ab]}</div>
                  <div style={{ fontSize:20, fontFamily:theme.fontDisplay, color:"var(--accent-text)", lineHeight:1.2 }}>{score}</div>
                  <div style={{ fontSize:13, color:"var(--text)" }}>{modStr(calcMod(score))}</div>
                </div>
              );
            })}
          </div>

          {/* Saving throws */}
          {sectionLabel("Saving Throws")}
          <div style={{ display:"flex", flexDirection:"column", gap:2, marginBottom:4 }}>
            {Object.entries(saves).map(([ab, sv]) => (
              <div key={ab} style={{ display:"flex", alignItems:"center", gap:5, padding:"3px 6px", borderRadius:4 }}>
                <span style={{ width:7, height:7, borderRadius:"50%", flexShrink:0, background:sv.proficient?theme.accent:"transparent", border:`2px solid ${sv.proficient?theme.accent:"var(--border)"}` }}/>
                <span style={{ flex:1, fontSize:12, color:sv.proficient?"var(--text)":"var(--text-muted)" }}>{ABILITY_NAMES[ab]}</span>
                <span style={{ fontFamily:theme.fontDisplay, color:"var(--accent-text)", fontSize:13 }}>{modStr(sv.value)}</span>
              </div>
            ))}
          </div>

          {/* Skills */}
          {sectionLabel("Skills")}
          <div style={{ display:"flex", flexDirection:"column", gap:1, marginBottom:4 }}>
            {Object.entries(skills).map(([sk, d]) => (
              <div key={sk} style={{ display:"flex", alignItems:"center", gap:5, padding:"2px 4px", borderRadius:3, background:d.expertise?"rgba(201,162,39,0.05)":d.proficient?"rgba(201,162,39,0.02)":"transparent" }}>
                <span style={{ width:7, height:7, flexShrink:0, display:"inline-block", borderRadius:d.expertise?0:"50%", transform:d.expertise?"rotate(45deg)":"none", background:d.proficient||d.expertise?theme.accent:"transparent", border:`2px solid ${d.proficient||d.expertise?theme.accent:"var(--border)"}` }}/>
                <span style={{ flex:1, fontSize:12, color:d.proficient?"var(--text)":"var(--text-muted)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{sk}</span>
                <span style={{ fontSize:10, color:"var(--text-dim)", marginRight:2 }}>{ABILITY_SHORT[SKILLS_MAP[sk]]}</span>
                <span style={{ fontFamily:theme.fontDisplay, color:"var(--accent-text)", fontSize:13, minWidth:22, textAlign:"right" }}>{modStr(d.value)}</span>
              </div>
            ))}
          </div>

          {/* Proficiencies */}
          {classData && (<>
            {sectionLabel("Proficiencies")}
            <div style={{ fontSize:13, lineHeight:2, marginBottom:4 }}>
              <div><span style={{ color:"var(--text-muted)" }}>Armor: </span><span style={{ color:"var(--text)" }}>{(classData.armorProficiencies||[]).join(", ")||"None"}</span></div>
              <div><span style={{ color:"var(--text-muted)" }}>Weapons: </span><span style={{ color:"var(--text)" }}>{(classData.weaponProficiencies||[]).join(", ")||"None"}</span></div>
              <div><span style={{ color:"var(--text-muted)" }}>Saves: </span><span style={{ color:"var(--text)" }}>{(classData.savingThrows||[]).map(ab=>ABILITY_SHORT[ab]).join(", ")}</span></div>
              {char.skillProficiencies?.length>0 && <div><span style={{ color:"var(--text-muted)" }}>Skills: </span><span style={{ color:"var(--text)" }}>{char.skillProficiencies.join(", ")}</span></div>}
            </div>
          </>)}

          {/* Warnings */}
          {stealthDisadv && <div style={{ marginTop:8, padding:"4px 8px", background:"rgba(230,126,34,0.12)", border:"1px solid #e67e22", borderRadius:5, fontSize:10, color:"#e67e22" }}>⚠ Stealth disadvantage</div>}
          {strWarnings.map(msg=><div key={msg} style={{ marginTop:4, padding:"4px 8px", background:"rgba(192,57,43,0.12)", border:`1px solid ${theme.danger}`, borderRadius:5, fontSize:10, color:theme.danger }}>⚠ {msg}</div>)}

          {/* Senses */}
          {(() => {
            const allFeats = [
              ...(speciesData?.features  || []).map(f=>({...f,_src:char.species})),
              ...(subraceData?.features  || []).map(f=>({...f,_src:char.subrace})),
              ...(classData?.features    || []).map(f=>({...f,_src:char.class})),
              ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || []).map(f=>({...f,_src:char.subclass})),
            ].filter(f => f.category === "sense");
            if (!allFeats.length) return null;
            return (<>
              {sectionLabel("Senses")}
              <div style={{ fontSize:12, lineHeight:1.9, marginBottom:4 }}>
                {allFeats.map(f => {
                  const rangeMatch = f.description?.match(/(\d+)[\s-]foot/i);
                  const range = rangeMatch ? ` ${rangeMatch[1]}ft` : "";
                  const icon = f.name.toLowerCase().includes("dark") ? "🌑"
                             : f.name.toLowerCase().includes("blind") ? "🔵"
                             : f.name.toLowerCase().includes("true")  ? "👁"
                             : f.name.toLowerCase().includes("tremo") ? "🌍"
                             : "✦";
                  return (
                    <div key={f.name} style={{ marginBottom:2, position:"relative" }}
                      onMouseEnter={e => {
                        const t=document.getElementById("sense-tip");
                        if(!t) return;
                        const r=e.currentTarget.getBoundingClientRect();
                        t.style.left=(r.right+10)+"px";
                        t.style.top=Math.max(8,r.top-10)+"px";
                        t.innerHTML=`<div style="font-family:var(--font-display);color:var(--accent);font-size:12px;margin-bottom:4px">${f.name}</div><div style="font-size:11px;color:var(--text-muted);line-height:1.6">${f.description||""}</div>${f._src?`<div style="font-size:10px;color:var(--text-dim);margin-top:6px;font-style:italic">From: ${f._src}</div>`:""}`;
                        t.style.display="block";
                      }}
                      onMouseLeave={() => { const t=document.getElementById("sense-tip"); if(t) t.style.display="none"; }}>
                      <div style={{ display:"flex", alignItems:"center", gap:6, cursor:"help" }}>
                        <span style={{ fontSize:14, flexShrink:0 }}>{icon}</span>
                        <span style={{ color:"var(--text)" }}>{f.name}{range}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>);
          })()}

          {/* Resistances & Defenses */}
          {(() => {
            const allFeats = [
              ...(speciesData?.features  || []).map(f=>({...f,_src:char.species})),
              ...(subraceData?.features  || []).map(f=>({...f,_src:char.subrace})),
              ...(classData?.features    || []).map(f=>({...f,_src:char.class})),
              ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || []).map(f=>({...f,_src:char.subclass})),
            ].filter(f => f.category === "defense");
            if (!allFeats.length) return null;
            return (<>
              {sectionLabel("Resistances & Defenses")}
              <div style={{ fontSize:12, lineHeight:1.9, marginBottom:4 }}>
                {allFeats.map(f => {
                  const desc  = f.description || "";
                  const icon  = desc.toLowerCase().includes("resistance") ? "🔰"
                              : desc.toLowerCase().includes("immune")     ? "🛡"
                              : desc.toLowerCase().includes("advantage")  ? "🎲"
                              : desc.toLowerCase().includes("charmed")    ? "💜"
                              : desc.toLowerCase().includes("sleep")      ? "💤"
                              : "✦";
                  const summary = (() => {
                    const lower = desc.toLowerCase();
                    if (lower.includes("resistance to necrotic") && lower.includes("radiant")) return "Radiant & necrotic resistance";
                    if (lower.includes("resistance to necrotic")) return "Necrotic resistance";
                    if (lower.includes("resistance to cold and poison")) return "Cold & poison resistance";
                    if (lower.includes("resistance to fire")) return "Fire resistance";
                    if (lower.includes("resistance to poison")) return "Poison resistance";
                    const resMatch = desc.match(/resistance to ([^.]+?) damage/i);
                    if (resMatch) return `${resMatch[1].trim()} resistance`;
                    if (lower.includes("can't be put to sleep") || lower.includes("magic can't put you to sleep")) return "Immune to magical sleep";
                    if (lower.includes("advantage on saving throws against being charmed")) return "Adv. vs charmed";
                    if (lower.includes("advantage on saving throws against poison")) return "Adv. vs poison";
                    if (lower.includes("advantage on saving throws against illusion")) return "Adv. vs illusions";
                    if (lower.includes("advantage on saving throws against magic") || lower.includes("intelligence, wisdom, and charisma saving throws")) return "Adv. vs magic";
                    if (lower.includes("relentless endurance")) return "Drop to 1 HP (1/LR)";
                    if (lower.includes("stonecunning")) return "Stonecunning";
                    if (lower.includes("brave")) return "Adv. vs frightened";
                    if (lower.includes("fey ancestry")) return "Adv. vs charmed, immune sleep";
                    return f.name;
                  })();
                  return (
                    <div key={f.name} style={{ marginBottom:2 }}
                      onMouseEnter={e => {
                        const t=document.getElementById("sense-tip");
                        if(!t) return;
                        const r=e.currentTarget.getBoundingClientRect();
                        t.style.left=(r.right+10)+"px";
                        t.style.top=Math.max(8,r.top-10)+"px";
                        t.innerHTML=`<div style="font-family:var(--font-display);color:var(--accent);font-size:12px;margin-bottom:4px">${f.name}</div><div style="font-size:11px;color:var(--text-muted);line-height:1.6">${f.description||""}</div>${f._src?`<div style="font-size:10px;color:var(--text-dim);margin-top:6px;font-style:italic">From: ${f._src}</div>`:""}`;
                        t.style.display="block";
                      }}
                      onMouseLeave={() => { const t=document.getElementById("sense-tip"); if(t) t.style.display="none"; }}>
                      <div style={{ display:"flex", alignItems:"center", gap:6, cursor:"help" }}>
                        <span style={{ fontSize:14, flexShrink:0 }}>{icon}</span>
                        <span style={{ color:"var(--text)" }}>{summary}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>);
          })()}


          {/* Languages */}
          {(char.languages||[]).length > 0 && (<>
            {sectionLabel("Languages")}
            <div style={{ display:"flex", flexWrap:"wrap", gap:4, marginBottom:4 }}>
              {[...(char.languages||[])].sort().map(lang => (
                <span key={lang} style={{ padding:"2px 8px", background:"rgba(80,120,200,0.08)", border:"1px solid rgba(80,120,200,0.25)", borderRadius:12, fontSize:11, color:"var(--text-muted)" }}>
                  {lang}
                </span>
              ))}
            </div>
          </>)}
        </div>

        {/* ══ RIGHT SIDE: combat stats grid + tab panel ══ */}
        <div style={{ display:"flex", flexDirection:"column", height:"100%", overflow:"hidden", borderRadius:12, border:`1px solid ${"var(--border)"}`, background:"var(--card)" }}>

          {/* ── Combat stats grid ── */}
          <div style={{ padding:"10px 16px", borderBottom:`1px solid ${"var(--border)"}`, flexShrink:0, background:`rgba(0,0,0,0.12)` }}>
            <div style={{ display:"grid", gridTemplateColumns:`repeat(${combatStats.length + 1}, 1fr)`, gap:8 }}>
              {/* Speed — special dropdown box */}
              {(() => {
                return (
                  <div key="speed" style={{ textAlign:"center", padding:"6px 4px", background:"var(--surface)", border:`1px solid ${"var(--border)"}`, borderRadius:8, position:"relative", cursor: allSpeeds.length > 1 ? "pointer" : "default" }}
                    onClick={() => allSpeeds.length > 1 && setSpeedOpen(o => !o)}>
                    <div style={{ fontSize:9, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1.5, marginBottom:3, whiteSpace:"nowrap" }}>
                      Speed {allSpeeds.length > 1 && <span style={{ color:"var(--accent)" }}>▾</span>}
                    </div>
                    <div style={{ fontFamily:theme.fontDisplay, color:"var(--accent-text)", fontSize:24, lineHeight:1 }}>{allSpeeds[0].value}</div>
                    {speedOpen && allSpeeds.length > 1 && (
                      <div style={{ position:"absolute", top:"100%", left:0, right:0, zIndex:30, background:"var(--card)",
                        border:`1px solid ${"var(--border)"}`, borderRadius:8, marginTop:4, overflow:"hidden", boxShadow:"0 4px 16px rgba(0,0,0,0.4)" }}>
                        {allSpeeds.map(s => (
                          <div key={s.label} style={{ padding:"6px 10px", display:"flex", justifyContent:"space-between", borderBottom:`1px solid ${"var(--border)"}`, fontSize:12 }}>
                            <span style={{ color:"var(--text-muted)" }}>{s.label}</span>
                            <span style={{ color:"var(--accent)", fontFamily:theme.fontDisplay }}>{s.value}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })()}
              {combatStats.map(s=>(
                <div key={s.l} style={{ textAlign:"center", padding:"6px 4px", background:"var(--surface)", border:`1px solid ${"var(--border)"}`, borderRadius:8 }}>
                  <div style={{ fontSize:9, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1.5, marginBottom:3, whiteSpace:"nowrap" }}>{s.l}</div>
                  <div style={{ fontFamily:theme.fontDisplay, color:"var(--accent-text)", fontSize:24, lineHeight:1 }}>{s.v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* ── Tab panel: fills remaining height ── */}
          <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
            {/* Tab bar */}
            <div style={{ display:"flex", borderBottom:`1px solid ${"var(--border)"}`, flexShrink:0, paddingLeft:12, paddingTop:10, background:"transparent" }}>
              {TABS.map(t=><button key={t.id} style={ts(tab===t.id)} onClick={()=>setTab(t.id)}>{t.l}</button>)}
            </div>
            {/* Tab content — scrolls independently */}
            <div style={{ flex:1, overflowY:"auto", padding:16 }}>
              {tab==="actions"    && <ActionsTab     char={char} gameData={gameData} onUpdate={upd}/>}
              {tab==="spells"    && <SpellsTab    char={char} gameData={gameData} onUpdate={upd}/>}
              {tab==="inventory" && <InventoryTab  char={char} gameData={gameData} onUpdate={upd}/>}
              {tab==="features"  && <FeaturesTab   char={char} gameData={gameData}/>}
              {tab==="background"&& (
                <div>
                  {(() => {
                    const bg = gameData.backgrounds?.[char.background];
                    if (!bg) return <p style={{ fontSize:13, color:"var(--text-dim)", fontStyle:"italic" }}>No background data available.</p>;

                    const features     = bg.features || [];
                    // The special feature: the unique passive that defines the background
                    const specialFeat = features.find(f => f.feature_type === "background_feature")
                      || features.filter(f =>
                          f.type === "passive" &&
                          !f.name.toLowerCase().includes("tool") &&
                          !f.name.toLowerCase().includes("proficien") &&
                          !f.name.toLowerCase().includes("kit") &&
                          !f.name.toLowerCase().includes("vehicle") &&
                          !f.name.toLowerCase().includes("instrument")
                        ).pop();
                    // Skill proficiencies
                    const skillFeat    = features.find(f => f.type === "proficiency_choice");
                    // Language features
                    const langFeats    = features.filter(f => f.type === "language_choice");
                    // Other features (tool proficiencies, choices, etc.)
                    const otherFeats   = features.filter(f =>
                      f !== specialFeat && f !== skillFeat && !langFeats.includes(f)
                    );

                    // What skills did the character actually choose for this background?
                    // Background skills are stored in skillProfSources with source "Background"
                    const chosenSkills = Object.entries(char.skillProfSources || {})
                      .filter(([, src]) => src === "Background" || src === char.background)
                      .map(([sk]) => sk);
                    // Fallback: if fixed (not "all"), show those
                    const fixedSkills = Array.isArray(skillFeat?.fixed) ? skillFeat.fixed
                      : (Array.isArray(skillFeat?.from) && skillFeat.from !== "all") ? skillFeat.from : null;

                    const displaySkills = chosenSkills.length > 0 ? chosenSkills : fixedSkills;

                    const divider = (txt) => (
                      <div style={{ display:"flex", alignItems:"center", gap:10, margin:"20px 0 12px" }}>
                        <div style={{ fontFamily:"var(--font-display)", color:"var(--accent-text)", fontSize:11, textTransform:"uppercase", letterSpacing:2, flexShrink:0 }}>{txt}</div>
                        <div style={{ flex:1, height:1, background:"rgba(201,162,39,0.2)" }}/>
                      </div>
                    );

                    return (<>
                      {/* ── Background name & description ── */}
                      <div style={{ fontFamily:"var(--font-display)", color:"var(--accent-text)", fontSize:18, marginBottom: bg.description ? 10 : 16 }}>{char.background}</div>
                      {bg.description && <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.75, marginBottom:16 }}>{bg.description}</p>}

                      {/* ── Special feature — pinned at top ── */}
                      {specialFeat && (<>
                        {divider("Background Feature")}
                        <div style={{ background:"rgba(201,162,39,0.06)", border:"1px solid var(--accent)", borderRadius:10, padding:"14px 16px", marginBottom:4 }}>
                          <div style={{ fontFamily:"var(--font-display)", color:"var(--accent-text)", fontSize:15, marginBottom:8 }}>{specialFeat.name}</div>
                          <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.75, margin:0 }}>{specialFeat.description}</p>
                        </div>
                      </>)}

                      {/* ── Skill proficiencies ── */}
                      {skillFeat && (<>
                        {divider("Skill Proficiencies")}
                        <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, padding:"12px 16px" }}>
                          {displaySkills && displaySkills.length > 0 ? (
                            <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                              {displaySkills.map(sk => (
                                <span key={sk} style={{ padding:"4px 12px", background:"rgba(var(--accent-rgb,201,162,39),0.08)", border:"1px solid rgba(201,162,39,0.3)", borderRadius:20, fontSize:13, color:"var(--accent-text)", fontFamily:"var(--font-display)" }}>
                                  {sk}
                                </span>
                              ))}
                            </div>
                          ) : (
                            <p style={{ fontSize:13, color:"var(--text-muted)", margin:0, fontStyle:"italic" }}>
                              {skillFeat.from === "all" ? "Any 2 skills of your choice" : skillFeat.description}
                            </p>
                          )}
                        </div>
                      </>)}

                      {/* ── Languages ── */}
                      {langFeats.length > 0 && (<>
                        {divider("Languages")}
                        <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, padding:"12px 16px" }}>
                          {(() => {
                            const bgLangSrc = char.background + "_lang";
                            const bgLangs = (char.languages || []).filter(l =>
                              (char.languageSources||{})[l] === "Background"
                            );
                            const autoLangs = bg.autoLanguages || [];
                            const allLangs = [...new Set([...autoLangs, ...bgLangs])];
                            return allLangs.length > 0 ? (
                              <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                                {allLangs.map(l => (
                                  <span key={l} style={{ padding:"4px 12px", background:"rgba(80,120,200,0.08)", border:"1px solid rgba(80,120,200,0.3)", borderRadius:20, fontSize:13, color:"var(--info)" }}>{l}</span>
                                ))}
                              </div>
                            ) : (
                              <p style={{ fontSize:13, color:"var(--text-muted)", margin:0 }}>{langFeats[0]?.description}</p>
                            );
                          })()}
                        </div>
                      </>)}

                      {/* ── Other features (tool proficiencies, etc.) ── */}
                      {otherFeats.length > 0 && (<>
                        {divider("Additional Proficiencies & Traits")}
                        {otherFeats.map(f => (
                          <div key={f.name} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10, padding:"12px 16px", marginBottom:8 }}>
                            <div style={{ fontFamily:"var(--font-display)", color:"var(--accent-text)", fontSize:14, marginBottom:6 }}>{f.name}</div>
                            <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.7, margin:0 }}>{f.description}</p>
                            {f.type === "choice" && char.featureChoices?.[f.name] && (
                              <div style={{ marginTop:8, padding:"5px 10px", background:"rgba(201,162,39,0.06)", border:"1px solid var(--accent)", borderRadius:6, fontSize:13, color:"var(--accent-text)" }}>
                                Chosen: {char.featureChoices[f.name]}
                              </div>
                            )}
                          </div>
                        ))}
                      </>)}

                      {/* ── Personal effects ── */}
                      {char.personalItems?.length > 0 && (<>
                        {divider("Personal Effects & Mementos")}
                        <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                          {char.personalItems.map(p=>(
                            <span key={p.id} style={{ padding:"4px 10px", background:"rgba(100,100,200,0.08)", border:"1px solid rgba(100,100,200,0.3)", borderRadius:8, fontSize:13, color:"var(--text)" }}>{p.name}</span>
                          ))}
                        </div>
                      </>)}
                    </>);
                  })()}
                </div>
              )}
              {tab==="notes"     && <NotesTab       char={char} onUpdate={upd}/>}
              {tab==="documents" && <DocumentsTab   char={char} onUpdate={upd} session={session} readOnly={readOnly}/>}
              {tab==="settings"  && <SettingsTab    char={char} gameData={gameData} onUpdate={upd} onEdit={onEdit}/>}
            </div>
          </div>
        </div>
        </div>{/* end grid */}
      </div>{/* end padding wrapper */}
    </TW>
  );
}

];

function GodRays({ colour = "rgba(160,210,255,0.06)" }) {
  const rays = React.useMemo(() => Array.from({length: 7}, (_, i) => ({
    id: i,
    left: 8 + i * 13,
    width: 60 + (i * 37) % 120,
    height: 55 + (i * 23) % 30,
    delay: i * 1.8,
    dur: 8 + (i * 2.3) % 7,
    phase: i % 2 === 0 ? "godRaySweep" : "godRaySweep2",
    skew: -15 + i * 5,
  })), []);

  return (
    <>
      {rays.map(r => (
        <div key={r.id} className="god-ray" style={{
          left: `${r.left}%`,
          width: `${r.width}px`,
          height: `${r.height}vh`,
          background: `linear-gradient(180deg, ${colour} 0%, transparent 100%)`,
          transform: `skewX(${r.skew}deg)`,
          animation: `${r.phase} ${r.dur}s ease-in-out ${r.delay}s infinite`,
        }}/>
      ))}
    </>
  );
}

const SNOWFLAKES = ["❄","❅","❆","✦","·","*","⬡"];

function MysticBackground({ density = "normal", symbolSet, symbolOpacity, backgroundEffect }) {
  const isWinterDark  = backgroundEffect === "winter";
  const isWinterLight = backgroundEffect === "winter-light";
  const isWinter      = isWinterDark || isWinterLight;
  const isFire        = backgroundEffect === "fire";
  const count     = density === "subtle" ? 12 : density === "off" ? 0 : 20;
  const snowCount = isWinter ? (density === "off" ? 0 : density === "subtle" ? 30 : 50) : 0;
  const emberCount= isFire   ? (density === "off" ? 0 : density === "subtle" ? 35 : 55) : 0;
  const pool      = symbolSet?.length > 0 ? symbolSet : (isWinter ? SNOWFLAKES : SYMBOLS);
  const opMul     = symbolOpacity !== undefined ? symbolOpacity : 1;

  const symbols = React.useMemo(() => {
    if (count === 0 && !isWinter && !isFire) return [];
    const total = isWinter ? snowCount : isFire ? emberCount : count;
    if (total === 0) return [];
    return Array.from({ length: total }, (_, i) => {
      const left     = (i * 97 + 11) % 100;
      const startTop = (isWinter || isFire) ? (100 + (i * 7) % 25) : 100 + (i * 37) % 40;
      const delay    = (i * 1.9) % 20;
      const dur      = isWinter ? (8 + (i * 3.1) % 18)
                     : isFire   ? (4 + (i * 2.3) % 10)
                     : (18 + (i * 4.1) % 22);
      const size     = isWinter ? (8 + (i * 5) % 16)
                     : isFire   ? (3 + (i * 3) % 8)
                     : (12 + (i * 7) % 18);
      const sym      = isFire ? (i % 4 === 0 ? "✦" : i % 4 === 1 ? "·" : i % 4 === 2 ? "•" : "◦") : pool[i % pool.length];
      const anim     = isWinter ? (i % 3 === 0 ? "snowfall" : "snowfallSway")
                     : isFire   ? (i % 2 === 0 ? "emberRise" : "emberRiseSway")
                     : (i % 2 === 0 ? "floatUp" : "floatUpSway");

      const colour = isWinterDark
        ? `rgba(${160 + (i*7)%60},${210 + (i*5)%40},255,${((0.25 + (i*0.03)%0.35)*opMul).toFixed(2)})`
        : isWinterLight
        ? `rgba(${100 + (i*11)%60},${140 + (i*7)%60},${200 + (i*5)%40},${((0.20 + (i*0.04)%0.30)*opMul).toFixed(2)})`
        : isFire
        ? `rgba(${220 + (i*5)%35},${50 + (i*11)%80},${5 + (i*3)%20},${((0.55 + (i*0.04)%0.35)*opMul).toFixed(2)})`
        : [
            `rgba(201,162,39,${(0.28*opMul).toFixed(2)})`,
            `rgba(180,130,255,${(0.22*opMul).toFixed(2)})`,
            `rgba(120,180,255,${(0.20*opMul).toFixed(2)})`,
            `rgba(255,245,210,${(0.22*opMul).toFixed(2)})`,
            `rgba(255,255,255,${(0.15*opMul).toFixed(2)})`,
          ][i % 5];

      return { sym, left, startTop, delay, dur, size, colour, anim, id: i };
    });
  }, [count, snowCount, emberCount, isWinter, isWinterLight, isFire, pool.join(""), opMul]);

  return (
    <>
      {isFire ? (
        <FireAtmosphere/>
      ) : isWinterDark ? (
        <>
          <div className="frost-overlay"/>
          <GodRays colour="rgba(100,160,240,0.08)"/>
          <div style={{ position:"fixed", top:"-20%", left:"20%", width:"60vw", height:"60vw",
            background:"radial-gradient(ellipse, rgba(80,140,220,0.08) 0%, transparent 65%)",
            pointerEvents:"none", zIndex:0 }}/>
          <div style={{ position:"fixed", bottom:"-20%", right:"10%", width:"50vw", height:"50vw",
            background:"radial-gradient(ellipse, rgba(100,180,255,0.06) 0%, transparent 65%)",
            pointerEvents:"none", zIndex:0 }}/>
        </>
      ) : isWinterLight ? (
        <>
          {/* Sun behind clouds — bright diffuse source top-right */}
          <div style={{ position:"fixed", top:"-15%", right:"15%", width:"55vw", height:"55vw",
            background:"radial-gradient(ellipse, rgba(255,255,255,0.55) 0%, rgba(220,238,255,0.25) 40%, transparent 70%)",
            pointerEvents:"none", zIndex:0 }}/>
          {/* Bright sky glow across top */}
          <div style={{ position:"fixed", top:0, left:0, right:0, height:"40vh",
            background:"linear-gradient(180deg, rgba(220,240,255,0.45) 0%, transparent 100%)",
            pointerEvents:"none", zIndex:0 }}/>
          {/* Snow-ground reflection — bright along the bottom */}
          <div style={{ position:"fixed", bottom:0, left:0, right:0, height:"30vh",
            background:"linear-gradient(0deg, rgba(235,245,255,0.35) 0%, transparent 100%)",
            pointerEvents:"none", zIndex:0 }}/>
          {/* Subtle mid-depth atmospheric haze */}
          <div style={{ position:"fixed", top:"30%", left:"-10%", width:"70vw", height:"50vh",
            background:"radial-gradient(ellipse, rgba(200,225,245,0.18) 0%, transparent 65%)",
            pointerEvents:"none", zIndex:0 }}/>
          <div style={{ position:"fixed", top:"20%", right:"-5%", width:"50vw", height:"60vh",
            background:"radial-gradient(ellipse, rgba(180,215,240,0.14) 0%, transparent 60%)",
            pointerEvents:"none", zIndex:0 }}/>
          {/* Pale god rays from sun source */}
          <GodRays colour="rgba(255,255,255,0.12)"/>
          {/* Frost vignette at edges */}
          <div style={{ position:"fixed", inset:0, pointerEvents:"none", zIndex:0,
            background:"radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(180,210,240,0.18) 100%)" }}/>
        </>
      ) : (
        <>
          <div className="bg-glow-tl"/>
          <div className="bg-glow-br"/>
          <div className="bg-glow-center"/>
        </>
      )}
      {symbols.map(s => (
        <span key={s.id} className="mystic-symbol" style={{
          left:      `${s.left}%`,
          top:       `${s.startTop}vh`,
          fontSize:  `${s.size}px`,
          color:     s.colour,
          animation: `${s.anim} ${s.dur}s linear ${s.delay}s infinite`,
        }}>{s.sym}</span>
      ))}
    </>
  );
}

function CharacterCard({ char, gameData, onClick, onEdit, onDelete }) {
  const { themes } = gameData;
  const theme = themes?.[char.theme] || themes?.[Object.keys(themes || {})[0]] || {};
  const hp    = char.hp || { current:0, max:1 };
  const pct   = Math.min(100, (hp.current / Math.max(1, hp.max)) * 100);
  const hpC   = pct > 50 ? theme.success : pct > 25 ? "#f39c12" : theme.danger;
  const label = char.subclass ? `${char.class} (${char.subclass})` : char.class;

  return (
    <div style={{ background:theme.card, border:`1px solid ${theme.border}`, borderRadius:14, padding:20, transition:"all 0.22s", position:"relative", overflow:"hidden" }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = theme.accent; e.currentTarget.style.transform = "translateY(-3px)"; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = theme.border; e.currentTarget.style.transform = "translateY(0)"; }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:3, background:`linear-gradient(90deg,${theme.accent},${theme.accentSecondary || theme.accent})` }} />
      {/* Main clickable area */}
      <div onClick={onClick} style={{ cursor:"pointer" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12, gap:12 }}>
          {/* Portrait */}
          <div style={{ width:56, height:56, borderRadius:8, flexShrink:0, overflow:"hidden",
            border:`2px solid ${theme.accent}`, background:theme.surface }}>
            {char.profileImage
              ? <img src={char.profileImage} alt={char.name}
                  style={{ width:"100%", height:"100%", objectFit:"cover", objectPosition:"top" }}
                  onError={e=>e.target.style.display="none"}/>
              : <div style={{ width:"100%", height:"100%", display:"flex", alignItems:"center",
                  justifyContent:"center", fontFamily:"'Cinzel Decorative',serif", fontSize:22, color:theme.accent }}>
                  {(char.name||"?")[0].toUpperCase()}
                </div>
            }
          </div>
          {/* Name + class */}
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:"'Cinzel Decorative',serif", color:theme.accent, fontSize:20, lineHeight:1.2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{char.name}</div>
            <div style={{ fontSize:13, color:theme.textMuted, marginTop:4 }}>
              <span style={{ color:theme.text }}>{char.species}</span>
              {char.species && label ? " · " : ""}<span>{label}</span>
            </div>
          </div>

          {/* Level badge */}
          <div style={{ textAlign:"center", flexShrink:0, background:`rgba(0,0,0,0.2)`,
            border:`1px solid ${theme.border}`, borderRadius:8, padding:"6px 10px" }}>
            <div style={{ fontFamily:"'Cinzel Decorative',serif", color:theme.accent, fontSize:24, lineHeight:1 }}>{char.level}</div>
            <div style={{ fontSize:9, color:theme.textMuted, textTransform:"uppercase", letterSpacing:1.5, marginTop:2 }}>LVL</div>
          </div>
        </div>
        <div style={{ marginBottom:12 }}>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:theme.textMuted, marginBottom:4 }}>
            <span>Hit Points</span><span style={{ color:hpC }}>{hp.current}/{hp.max}</span>
          </div>
          <div style={{ height:5, background:theme.bg, borderRadius:3, overflow:"hidden" }}>
            <div style={{ height:"100%", width:`${pct}%`, background:hpC, borderRadius:3, transition:"width 0.3s" }} />
          </div>
        </div>
        <div style={{ fontSize:12, color:theme.textMuted, marginBottom:12 }}>
          <span>{char.background}</span>
          <span style={{ color:theme.textDim, marginLeft:8 }}>{char.alignment}</span>
        </div>
      </div>
      {/* Action buttons */}
      <div style={{ display:"flex", gap:8, borderTop:`1px solid ${theme.border}`, paddingTop:10 }}>
        <button onClick={e=>{e.stopPropagation();onClick();}} style={{ flex:1, padding:"6px", borderRadius:6, border:`1px solid ${theme.accent}`, background:"rgba(var(--accent-rgb,201,162,39),0.08)", color:theme.accent, cursor:"pointer", fontSize:12, fontFamily:theme.fontBody }}>
          Open
        </button>
        <button onClick={e=>{e.stopPropagation();onEdit();}} style={{ flex:1, padding:"6px", borderRadius:6, border:`1px solid ${theme.border}`, background:"transparent", color:theme.textMuted, cursor:"pointer", fontSize:12 }}>
          ✏️ Edit
        </button>
        <button onClick={e=>{e.stopPropagation();if(confirm(`Delete ${char.name}? This cannot be undone.`)) onDelete(char.id);}} style={{ padding:"6px 10px", borderRadius:6, border:`1px solid ${theme.danger}`, background:"transparent", color:theme.danger, cursor:"pointer", fontSize:12 }}>
          🗑
        </button>
      </div>
    </div>
  );
}

function AccountModal({ session, onClose }) {
  const providers   = session?.user?.app_metadata?.providers || [session?.user?.app_metadata?.provider].filter(Boolean);
  const hasEmail    = providers.includes("email");
  const hasGoogle   = providers.includes("google") && session?.user?.identities?.some(i => i.provider === "google");
  const [tab,       setTab]        = useState(hasEmail ? "password" : "delete");
  const [newEmail,    setNewEmail]     = useState("");
  const [newPassword, setNewPassword]  = useState("");
  const [confirm,     setConfirm]      = useState("");
  const [deleteWord,  setDeleteWord]   = useState("");
  const [loading,     setLoading]      = useState(false);
  const [msg,         setMsg]          = useState(null);  // { type: "ok"|"err", text }

  const flash = (type, text) => { setMsg({ type, text }); setTimeout(() => setMsg(null), 4000); };

  const changePassword = async () => {
    if (!newPassword) return;
    if (newPassword !== confirm) { flash("err", "Passwords don't match."); return; }
    if (newPassword.length < 8)  { flash("err", "Password must be at least 8 characters."); return; }
    setLoading(true);
    const { error } = await sb.auth.updateUser({ password: newPassword });
    setLoading(false);
    if (error) flash("err", error.message);
    else { flash("ok", "Password updated."); setNewPassword(""); setConfirm(""); }
  };

  const deleteAccount = async () => {
    if (deleteWord !== "DELETE") { flash("err", 'Type DELETE (all caps) to confirm.'); return; }
    setLoading(true);
    // Delete all characters first, then the user via admin API isn't available client-side —
    // so we sign out and call a Supabase edge function or just delete chars and inform user
    await sb.from("characters").delete().eq("user_id", session.user.id);
    // Supabase doesn't allow client-side user deletion — sign out and show instructions
    await signOut();
    setLoading(false);
  };

  const inp = { width:"100%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(201,162,39,0.2)", color:"#e8e0d0", padding:"10px 14px", borderRadius:7, fontSize:14, fontFamily:"'Crimson Pro',serif", boxSizing:"border-box", marginBottom:10 };
  const tabBtn = (t) => ({ padding:"7px 16px", borderRadius:6, cursor:"pointer", fontSize:13, fontFamily:"'Cinzel Decorative',serif", transition:"all 0.15s", border:`1px solid ${tab===t?"var(--accent)":"rgba(255,255,255,0.1)"}`, background:tab===t?"rgba(201,162,39,0.1)":"transparent", color:tab===t?"var(--accent)":"#8a8070" });
  const btn = (danger) => ({ width:"100%", padding:"11px", borderRadius:7, cursor:loading?"not-allowed":"pointer", fontSize:14, fontFamily:"'Cinzel Decorative',serif", letterSpacing:0.5, border:`1px solid ${danger?"#c0392b":"var(--accent)"}`, background:danger?"rgba(192,57,43,0.12)":"rgba(201,162,39,0.1)", color:danger?"#e74c3c":"var(--accent)", opacity:loading?0.6:1 });

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center" }}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:"#1a1a1f", border:"1px solid rgba(var(--accent-rgb,201,162,39),0.25)", borderRadius:14, padding:28, maxWidth:420, width:"90%", boxShadow:"0 8px 48px rgba(0,0,0,0.7)" }}>
        {/* Header */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
          <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"var(--accent)", fontSize:15 }}>Account Settings</div>
          <button onClick={onClose} style={{ background:"transparent", border:"none", color:"#554f45", cursor:"pointer", fontSize:20, lineHeight:1 }}>×</button>
        </div>

        <div style={{ fontSize:12, color:"#554f45", marginBottom:16, fontStyle:"italic", display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
          {hasEmail  && <span style={{ fontSize:11, background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:4, padding:"2px 7px", color:"#8a8070", fontStyle:"normal" }}>✉ Email</span>}
          {hasGoogle && <span style={{ fontSize:11, background:"rgba(66,133,244,0.12)", border:"1px solid rgba(66,133,244,0.3)", borderRadius:4, padding:"2px 7px", color:"#7ab3f5", fontStyle:"normal" }}>G Google</span>}
          {session.user.email}
        </div>

        {/* Tab selector — password only if email is linked, no email change tab */}
        <div style={{ display:"flex", gap:8, marginBottom:20 }}>
          {hasEmail && <button style={tabBtn("password")} onClick={()=>{setTab("password");setMsg(null);}}>Password</button>}
          <button style={tabBtn("delete")} onClick={()=>{setTab("delete");setMsg(null);}}>Delete Account</button>
        </div>

        {/* Feedback */}
        {msg && (
          <div style={{ padding:"9px 14px", borderRadius:7, marginBottom:14, fontSize:13,
            background: msg.type==="ok" ? "rgba(39,174,96,0.12)" : "rgba(192,57,43,0.12)",
            border: `1px solid ${msg.type==="ok" ? "#27ae60" : "#c0392b"}`,
            color: msg.type==="ok" ? "#27ae60" : "#e74c3c" }}>
            {msg.text}
          </div>
        )}

        {/* Change password */}
        {tab === "password" && (
          <div>
            <input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)}
              placeholder="New password (min 8 characters)" style={inp}/>
            <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)}
              placeholder="Confirm new password" style={inp}
              onKeyDown={e=>e.key==="Enter"&&changePassword()}/>
            <button onClick={changePassword} style={btn(false)} disabled={loading}>
              {loading ? "Updating…" : "Change Password"}
            </button>
          </div>
        )}

        {/* Delete account */}
        {tab === "delete" && (
          <div>
            <div style={{ padding:"10px 14px", background:"rgba(192,57,43,0.1)", border:"1px solid rgba(192,57,43,0.3)", borderRadius:7, marginBottom:14, fontSize:13, color:"#e74c3c", lineHeight:1.6 }}>
              ⚠ This will permanently delete all your characters from the database. This cannot be undone.
            </div>
            <input value={deleteWord} onChange={e=>setDeleteWord(e.target.value)}
              placeholder='Type DELETE to confirm' style={{...inp, borderColor:"rgba(192,57,43,0.4)", color:"#e74c3c"}}
              onKeyDown={e=>e.key==="Enter"&&deleteAccount()}/>
            <button onClick={deleteAccount} style={btn(true)} disabled={loading}>
              {loading ? "Deleting…" : "Delete My Account & Characters"}
            </button>
            <div style={{ fontSize:11, color:"#554f45", marginTop:10, textAlign:"center" }}>
              Note: you will be signed out immediately.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [showEmail, setShowEmail]   = useState(false);
  const [email,     setEmail]       = useState("");
  const [password,  setPassword]    = useState("");
  const [mode,      setMode]        = useState("login");
  const [loading,   setLoading]     = useState(false);
  const [error,     setError]       = useState(null);
  const [msg,       setMsg]         = useState(null);

  const handleGoogle = async () => {
    setLoading(true); setError(null);
    const { error: err } = await signInWithGoogle();
    if (err) { setError(err.message); setLoading(false); }
    // On success, Supabase redirects — no need to call onLogin()
  };

  const handleEmail = async () => {
    if (!email || !password) { setError("Please enter your email and password."); return; }
    setLoading(true); setError(null); setMsg(null);
    try {
      const { data, error: err } = mode === "login"
        ? await signIn(email, password)
        : await signUp(email, password);

      if (err) {
        setError(err.message);
      } else if (mode === "signup") {
        setMsg("Check your email to confirm your account, then log in.");
        setMode("login");
      } else {
        onLogin();
      }
    } finally { setLoading(false); }
  };

  const inp = { width:"100%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(201,162,39,0.25)", color:"#e8e0d0", padding:"12px 16px", borderRadius:8, fontSize:15, fontFamily:"'Crimson Pro',serif", boxSizing:"border-box", marginBottom:12 };

            <span style={{ color:"rgba(201,162,39,0.4)", fontSize:14 }}>✦</span>

            <button onClick={handleEmail} disabled={loading}
              style={{ width:"100%", padding:"13px", borderRadius:8, cursor:loading?"not-allowed":"pointer",
                fontSize:15, fontFamily:"'Cinzel Decorative',serif", letterSpacing:1, transition:"all 0.2s",
                border:"1px solid #c9a227", background:"#c9a227", color:"#0d0d0f", opacity:loading?0.6:1, marginBottom:12 }}>
              {loading ? "…" : mode === "login" ? "Enter the Tome" : "Create Account"}
            </button>
            <div style={{ textAlign:"center", fontSize:13, color:"#554f45", marginBottom:8 }}>
              {mode === "login"
                ? <><span>No account? </span><span onClick={()=>{setMode("signup");setError(null);}} style={{ color:"#c9a227", cursor:"pointer" }}>Sign up</span></>
                : <><span>Have an account? </span><span onClick={()=>{setMode("login");setError(null);}} style={{ color:"#c9a227", cursor:"pointer" }}>Log in</span></>
              }
            </div>
            <div style={{ textAlign:"center" }}>
              <span onClick={()=>{setShowEmail(false);setError(null);setGoogleLinked(false);}} style={{ fontSize:12, color:"#554f45", cursor:"pointer" }}>← Back</span>
            </div>
          </>)}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// SHARED CHARACTER VIEW — read-only, no auth required
// ============================================================
function SharedCharacterView({ token, gameData }) {
  const [char,    setChar]    = useState(null);
  const [loading, setLoading] = useState(true);
  const [error,   setError]   = useState(null);

  useEffect(() => {
    fetchSharedChar(token).then(c => {
      if (c) setChar(c);
      else setError("Character not found. The share link may have expired or been removed.");
      setLoading(false);
    });
  }, [token]);

  if (loading) return (
    <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0", fontFamily:"serif" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"var(--accent)", fontSize:24, marginBottom:12 }}>⚔️ Tome of Heroes</div>
        <div style={{ color:"#8a8070" }}>Loading character…</div>
      </div>
    </div>
  );

  if (error || !char) return (
    <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0", fontFamily:"serif" }}>
      <div style={{ textAlign:"center", maxWidth:440, padding:32 }}>
        <div style={{ fontSize:48, marginBottom:16 }}>🔗</div>
        <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"var(--accent)", fontSize:20, marginBottom:12 }}>Link Not Found</div>
        <div style={{ color:"#8a8070", fontSize:14 }}>{error || "This share link is invalid or has been removed."}</div>
        <button onClick={()=>window.location.href=window.location.pathname} style={{ marginTop:20, padding:"8px 20px", borderRadius:8, border:"1px solid #c9a227", background:"transparent", color:"var(--accent)", cursor:"pointer", fontSize:14 }}>Go to Tome of Heroes</button>
      </div>
    </div>
  );

  // Render CharacterSheet in read-only mode (no edit callbacks)
  return (
    <div style={{ position:"relative" }}>
      {/* Read-only banner */}
      <div style={{ position:"fixed", bottom:16, right:16, zIndex:999, padding:"8px 16px", background:"rgba(26,26,31,0.95)", border:"1px solid rgba(201,162,39,0.3)", borderRadius:20, fontSize:12, color:"#8a8070", backdropFilter:"blur(8px)" }}>
        👁 Viewing shared character — read only
      </div>
      <CharacterSheet
        char={char}
        gameData={gameData}
        onBack={()=>window.location.href=window.location.pathname}
        onDelete={()=>{}}
        onEdit={null}
        cloudSync={null}
        readOnly={true}
      />
    </div>
  );
}

function App() {
  const { data:gameData, error:gameError } = useGameData();
  const [session,    setSession]    = useState(undefined);
  const [characters, setCharacters] = useState([]);
  const [view,       setView]       = useState("home");
  const [selId,      setSelId]      = useState(null);
  const [charLoading,setCharLoading]= useState(false);
  const [showAccount, setShowAccount] = useState(false);
  const selChar = characters.find(c => c.id === selId);

  // Check for share token — AFTER all hooks
  const shareToken = new URLSearchParams(window.location.search).get("share");

  // ── cloudSyncChar — must be defined before any early returns (hook rule) ──
  const cloudSyncChar = useCallback(async char => {
    setCharacters(prev => prev.map(c => c.id === char.id ? char : c));
    saveChars(loadChars().map(c => c.id === char.id ? char : c));
    await dbSaveChar(char);
  }, []);

  // ── Auth state listener ──
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, sess) => {
      setSession(sess);
      if (!sess) {
        setCharacters([]);
        saveChars([]); // clear localStorage so next user doesn't see stale chars
        setView("home");
      }
    });
    return () => subscription.unsubscribe();
  }, []);

  // ── Load characters when session appears ──
  useEffect(() => {
    if (!session) return;
    setCharLoading(true);
    dbLoadChars().then(chars => {
      if (chars.length > 0) {
        // Supabase is authoritative
        const seen = new Set();
        const deduped = chars.filter(c => { if (seen.has(c.id)) return false; seen.add(c.id); return true; });
        setCharacters(deduped);
        saveChars(deduped);
      } else {
        // No Supabase chars — check localStorage for migration (first login with existing local data)
        const local = loadChars();
        if (local.length > 0) {
          Promise.all(local.map(c => dbSaveChar(c))).then(() => saveChars([]));
          setCharacters(local);
        }
      }
    }).catch(e => {
      console.error("dbLoadChars error:", e);
      // Only fall back to localStorage if Supabase fails entirely
      const local = loadChars();
      if (local.length > 0) setCharacters(local);
    }).finally(() => setCharLoading(false));
  }, [session?.user?.id]);

  // ── Loading states ──
  if (shareToken) {
    if (!gameData && !gameError) return (
      <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0" }}>
        <div style={{ textAlign:"center" }}>
          <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"var(--accent)", fontSize:24, marginBottom:12 }}>⚔️ Tome of Heroes</div>
          <div style={{ color:"#8a8070" }}>Loading…</div>
        </div>
      </div>
    );
    if (gameData) return <SharedCharacterView token={shareToken} gameData={gameData} />;
  }

  if (session === undefined || (!gameData && !gameError)) return (
    <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0", fontFamily:"serif" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"var(--accent)", fontSize:28, marginBottom:12 }}>⚔️ Tome of Heroes</div>
        <div style={{ color:"#8a8070" }}>Loading…</div>
      </div>
    </div>
  );

  if (gameError) return (
    <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0", fontFamily:"serif" }}>
      <div style={{ textAlign:"center", maxWidth:560, padding:32 }}>
        <div style={{ fontSize:48, marginBottom:16 }}>⚠️</div>
        <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"var(--accent)", fontSize:22, marginBottom:12 }}>Could Not Load Game Data</div>
        <div style={{ background:"#1a0a0a", border:"1px solid #5a1a1a", borderRadius:8, padding:16, marginBottom:20, fontSize:13, color:"#c0392b", textAlign:"left", fontFamily:"monospace", wordBreak:"break-all" }}>{gameError}</div>
        <div style={{ color:"#8a8070", fontSize:14, lineHeight:1.8 }}>
          Make sure <strong style={{ color:"var(--accent)" }}>tome-data.json</strong> is in the same folder and you are using a local server.<br />
          Quick server: <code style={{ color:"var(--accent)" }}>python -m http.server 8000</code><br />
          Then visit: <code style={{ color:"var(--accent)" }}>http://localhost:8000</code>
        </div>
      </div>
    </div>
  );

  // ── Not logged in ──
  if (!session) return <LoginScreen onLogin={() => {}} />;

  // ── Save / delete ──
  const saveChar = async char => {
    const list = characters.find(c => c.id === char.id)
      ? characters.map(c => c.id === char.id ? char : c)
      : [...characters, char];
    setCharacters(list);
    saveChars(list); // local backup
    await dbSaveChar(char);
    setSelId(char.id); setView("sheet");
  };

  const delChar = async id => {
    const list = characters.filter(c => c.id !== id);
    setCharacters(list);
    saveChars(list);
    await dbDeleteChar(id);
    setView("home");
  };

  // ── Routing ──

  if (view === "create") return <CharacterCreationWizard gameData={gameData} onSave={saveChar} onCancel={() => setView("home")} />;
  if (view === "edit" && selChar) return <CharacterCreationWizard gameData={gameData} onSave={saveChar} onCancel={() => setView("sheet")} editChar={selChar} />;
  if (view === "sheet" && selChar) return <CharacterSheet char={selChar} gameData={gameData} session={session} onBack={() => setView("home")} onDelete={delChar} onEdit={() => setView("edit")} cloudSync={cloudSyncChar} />;

  const themes = gameData.themes || {};
  const dt     = themes[Object.keys(themes)[0]] || {};

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Philosopher:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
      `}</style>
      <div style={{ background: `radial-gradient(ellipse at 20% 10%, rgba(70,30,120,0.28) 0%, transparent 55%), radial-gradient(ellipse at 80% 90%, rgba(100,60,20,0.22) 0%, transparent 55%), ${dt.bg || "#0d0d0f"}`, minHeight:"100vh", fontFamily:dt.fontBody || "serif", color:dt.text || "#e8e0d0", position:"relative", overflow:"hidden" }}>

        {/* Floating runes + glow pools */}
        <MysticBackground density="normal" backgroundEffect={dt.backgroundEffect}/>

        {/* Hero banner */}
        <div style={{ position:"relative", zIndex:1, borderBottom:`1px solid rgba(var(--accent-rgb,201,162,39),0.18)`, padding:"52px 24px 40px", textAlign:"center", overflow:"hidden",
          background:"linear-gradient(180deg, rgba(40,15,80,0.45) 0%, rgba(20,10,40,0.25) 60%, transparent 100%)" }}>

          {/* User info + account + logout — top right */}
          <div style={{ position:"absolute", top:16, right:20, display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ fontSize:12, color:dt.textMuted || "#8a8070" }}>{session.user.email}</span>
            <button onClick={()=>setShowAccount(true)} style={{ padding:"5px 12px", borderRadius:6, border:"1px solid rgba(201,162,39,0.3)", background:"transparent", color:"var(--accent)", cursor:"pointer", fontSize:12, fontFamily:dt.fontBody||"serif" }}>Account</button>
            <button onClick={()=>signOut()} style={{ padding:"5px 12px", borderRadius:6, border:"1px solid rgba(255,255,255,0.15)", background:"transparent", color:dt.textMuted||"#8a8070", cursor:"pointer", fontSize:12, fontFamily:dt.fontBody||"serif" }}>Log out</button>
          </div>

          {/* Inner hero radial glow */}
          <div style={{ position:"absolute", inset:0, background:"radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb,201,162,39),0.12) 0%, transparent 65%)", animation:"heroGlow 4s ease-in-out infinite", pointerEvents:"none" }}/>

          {/* Ornamental divider line */}
          <div style={{ position:"absolute", top:0, left:"10%", right:"10%", height:1, background:"linear-gradient(90deg, transparent, rgba(201,162,39,0.4), rgba(180,120,255,0.3), rgba(201,162,39,0.4), transparent)" }}/>

          <div className="tome-title-text" style={{ fontFamily:"'Cinzel Decorative',serif", fontSize:"clamp(28px,5.5vw,56px)", letterSpacing:3, position:"relative" }}>
            ⚔️ TOME OF HEROES
          </div>
          <div style={{ color:dt.textMuted, fontSize:15, marginTop:10, fontStyle:"italic", position:"relative", letterSpacing:0.5 }}>
            Your personal D&amp;D 5e character compendium
          </div>

          {/* Ornamental rule below subtitle */}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:12, margin:"18px auto 20px", maxWidth:320 }}>
            <div style={{ flex:1, height:1, background:"linear-gradient(90deg, transparent, rgba(var(--accent-rgb,201,162,39),0.35))" }}/>
            <span style={{ color:"rgba(201,162,39,0.5)", fontSize:16 }}>✦</span>
            <div style={{ flex:1, height:1, background:"linear-gradient(90deg, rgba(var(--accent-rgb,201,162,39),0.35), transparent)" }}/>
          </div>

          <button onClick={() => setView("create")} style={{
            padding:"14px 40px", border:"1px solid rgba(201,162,39,0.5)", color:dt.bg || "#0d0d0f",
            borderRadius:10, cursor:"pointer", fontFamily:"'Cinzel Decorative',serif", fontSize:15, letterSpacing:1.5, position:"relative",
            background:"linear-gradient(135deg, #c9a227 0%, #e8c84a 40%, #c9a227 70%, #8b6914 100%)",
            boxShadow:"0 4px 24px rgba(var(--accent-rgb,201,162,39),0.35), 0 0 60px rgba(var(--accent-rgb,201,162,39),0.08)", transition:"all 0.25s"
          }}
            onMouseEnter={e => { e.currentTarget.style.transform="scale(1.05)"; e.currentTarget.style.boxShadow="0 6px 32px rgba(201,162,39,0.5), 0 0 80px rgba(var(--accent-rgb,201,162,39),0.12)"; }}
            onMouseLeave={e => { e.currentTarget.style.transform="scale(1)";   e.currentTarget.style.boxShadow="0 4px 24px rgba(var(--accent-rgb,201,162,39),0.35), 0 0 60px rgba(var(--accent-rgb,201,162,39),0.08)"; }}>
            + Create New Character
          </button>

          {/* Bottom ornamental line */}
          <div style={{ position:"absolute", bottom:0, left:"10%", right:"10%", height:1, background:"linear-gradient(90deg, transparent, rgba(var(--accent-rgb,201,162,39),0.25), transparent)" }}/>
        </div>

        {/* Character grid */}
        <div style={{ maxWidth:1100, margin:"0 auto", padding:"36px 24px", position:"relative", zIndex:1 }}>
          {characters.length === 0 ? (
            <div style={{ textAlign:"center", padding:"80px 20px" }}>
              <div style={{ fontSize:72, marginBottom:18, filter:"drop-shadow(0 0 20px rgba(201,162,39,0.3))" }}>📖</div>
              <div style={{ fontFamily:"'Cinzel Decorative',serif", fontSize:24, color:dt.textMuted, marginBottom:10, letterSpacing:1 }}>The tome is empty</div>
              <div style={{ color:dt.textDim, fontSize:15, fontStyle:"italic" }}>Create your first character to begin your adventure</div>
            </div>
          ) : (
            <>
              <div style={{ fontFamily:"'Cinzel Decorative',serif", color:dt.textMuted, fontSize:11, textTransform:"uppercase", letterSpacing:3, marginBottom:20 }}>
                {characters.length} {characters.length === 1 ? "Hero" : "Heroes"} Registered
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))", gap:18 }}>
                {characters.map(c => <CharacterCard key={c.id} char={c} gameData={gameData}
                  onClick={() => { setSelId(c.id); setView("sheet"); }}
                  onEdit={() => { setSelId(c.id); setView("edit"); }}
                  onDelete={delChar}
                />)}
              </div>
            </>
          )}
        </div>

        <div style={{ position:"relative", zIndex:1, textAlign:"center", padding:24, borderTop:`1px solid rgba(var(--accent-rgb,201,162,39),0.12)`, color:dt.textDim, fontSize:12, fontStyle:"italic" }}>
          <span style={{ color:"rgba(201,162,39,0.3)", marginRight:8 }}>✦</span>
          Tome of Heroes • Edit <strong style={{ color:dt.textMuted }}>tome-data.json</strong> to customise species, classes, spells, themes &amp; more
          <span style={{ color:"rgba(201,162,39,0.3)", marginLeft:8 }}>✦</span>
        </div>
      </div>
      {/* AccountModal rendered at root level so it's above all stacking contexts */}
      {showAccount && <AccountModal session={session} onClose={()=>setShowAccount(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
