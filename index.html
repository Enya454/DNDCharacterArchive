    <div style={{ textAlign:"center", padding:50, color:"var(--text-muted)" }}>
      <div style={{ fontSize:48, marginBottom:14 }}>⚔️</div>
      <div style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:18 }}>Non-Spellcaster</div>
      <div style={{ marginTop:6 }}>{char.class || "This class"} doesn't use spells.</div>
    </div>
  );

  const fBtn = a => ({ padding:"4px 10px", borderRadius:20, cursor:"pointer", fontSize:12, transition:"all 0.15s",
    border:`1px solid ${a?"var(--accent)":"var(--border)"}`, background:a?"var(--accent)":"transparent", color:a?"var(--bg)":"var(--text-muted)" });

  // ── Spell row for the known-spells table ──
  const SpellRow = ({ spell }) => {
    const isCantrip = spell.level === 0;
    const canUpcast = !isCantrip && maxSlotLevel > spell.level;
    const hasSlot   = isCantrip || slotsLeft(spell.level) > 0;
    return (
      <div style={{ display:"grid", gridTemplateColumns:"1fr 44px 70px 80px 90px", alignItems:"center",
        padding:"6px 10px", borderBottom:"1px solid rgba(255,255,255,0.04)",
        background:"transparent" }}>
        {/* Name + school */}
        <div>
          <span style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13 }}>{spell.name}</span>
          <span style={{ fontSize:10, color:"var(--text-dim)", marginLeft:7 }}>{spell.school}</span>
          {spell.combat?.damage && <span style={{ fontSize:10, color:"var(--danger)", marginLeft:7 }}>{spell.combat.damage} {spell.combat.damageType}</span>}
          {spell.combat?.save && <span style={{ fontSize:10, color:"var(--info)", marginLeft:7 }}>Save: {ABILITY_SHORT[spell.combat.save]}</span>}
        </div>
        {/* Level */}
        <div style={{ fontSize:11, color:"var(--text-muted)", textAlign:"center" }}>
          {isCantrip ? <span style={{ color:"var(--text-dim)" }}>—</span> : `Lvl ${spell.level}`}
        </div>
        {/* Casting time */}
        <div style={{ fontSize:10, color:"var(--text-muted)" }}>{spell.castingTime}</div>
        {/* Range */}
        <div style={{ fontSize:10, color:"var(--text-muted)" }}>{spell.range}</div>
        {/* Cast button */}
        <div>
          {isCantrip ? (
            <span style={{ fontSize:10, color:"var(--text-dim)", fontStyle:"italic" }}>At will</span>
          ) : (
            <button onClick={() => { setCasting(spell); setUpcastLvl(spell.level); }}
              disabled={!hasSlot}
              style={{ padding:"3px 10px", borderRadius:6, fontSize:11, cursor:hasSlot?"pointer":"not-allowed",
                fontFamily:"var(--font-display)", transition:"all 0.15s",
                border:`1px solid ${hasSlot?"var(--accent)":"var(--border)"}`,
                background:hasSlot?"rgba(201,162,39,0.12)":"transparent",
                color:hasSlot?"var(--accent)":"var(--text-dim)", opacity:hasSlot?1:0.5 }}>
              {hasSlot ? "Cast ▸" : "No slot"}
            </button>
          )}
        </div>
      </div>
    );
  };

  const displayed = allSpells.filter(sp => filter === "all" || sp.level === +filter);

  return (
    <div>
      {/* ── Upcast modal ── */}
      {casting && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"var(--card)", border:"1px solid var(--accent)", borderRadius:14, padding:24, maxWidth:420, width:"90%", boxShadow:"0 8px 40px rgba(0,0,0,0.6)" }}>
            <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:18, marginBottom:6 }}>Cast {casting.name}</div>
            <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:16 }}>Choose a spell slot level to use:</div>
            <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
              {Array.from({length: maxSlotLevel}, (_,i)=>i+1).filter(lvl => lvl >= casting.level).map(lvl => {
                const left = slotsLeft(lvl);
                const isBase = lvl === casting.level;
                return (
                  <button key={lvl} onClick={() => spendSlot(lvl)} disabled={left <= 0}
                    style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                      padding:"10px 14px", borderRadius:8, cursor:left>0?"pointer":"not-allowed",
                      border:`1px solid ${upcastLvl===lvl?"var(--accent)":left>0?"var(--border)":"var(--border)"}`,
                      background:left>0?"var(--surface)":"rgba(0,0,0,0.2)",
                      opacity:left>0?1:0.4, transition:"all 0.15s" }}>
                    <div style={{ textAlign:"left" }}>
                      <div style={{ fontFamily:"var(--font-display)", color:left>0?"var(--accent)":"var(--text-dim)", fontSize:14 }}>
                        Level {lvl} Slot {isBase?"":"(Upcast +".concat(lvl-casting.level," tier)")}
                      </div>
                      {casting.combat?.slotScale && !isBase && (
                        <div style={{ fontSize:11, color:"var(--text-muted)", marginTop:2 }}>
                          {casting.combat.slotScale} per slot above {casting.level}
                        </div>
                      )}
                    </div>
                    <div style={{ fontFamily:"var(--font-display)", color:left>0?"var(--success)":"var(--danger)", fontSize:16 }}>
                      {left}/{slots[lvl-1]||0}
                    </div>
                  </button>
                );
              })}
            </div>
            <button onClick={()=>{setCasting(null);setUpcastLvl(null);}} style={{ width:"100%", padding:"8px", borderRadius:8, border:"1px solid var(--border)", background:"transparent", color:"var(--text-muted)", cursor:"pointer", fontSize:13 }}>Cancel</button>
          </div>
        </div>
      )}

      {/* ── Manage Spells modal ── */}
      {managing && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"var(--card)", border:"1px solid var(--accent)", borderRadius:14, padding:20, maxWidth:560, width:"94%", maxHeight:"80vh", display:"flex", flexDirection:"column", boxShadow:"0 8px 40px rgba(0,0,0,0.6)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:16 }}>Manage Spells</div>
              <div style={{ fontSize:12, color:"var(--text-muted)" }}>
                {knownCantrips.length}/{limits.cantripsKnown} cantrips · {knownSpells.length}/{limits.spellsKnown??'∞'} spells
              </div>
              <button onClick={()=>setManaging(false)} style={{ background:"transparent", border:"1px solid var(--border)", color:"var(--text-muted)", padding:"4px 10px", borderRadius:6, cursor:"pointer", fontSize:12 }}>Done</button>
            </div>
            {/* Level filter */}
            <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:10 }}>
              <button style={fBtn(filter==="all")} onClick={()=>setFilter("all")}>All</button>
              {limits.cantripsKnown > 0 && <button style={fBtn(filter==="0")} onClick={()=>setFilter("0")}>Cantrips</button>}
              {[1,2,3,4,5,6,7,8,9].filter(l=>l<=maxSlotLevel).map(l=>(
                <button key={l} style={fBtn(filter===String(l))} onClick={()=>setFilter(String(l))}>Lvl {l}</button>
              ))}
            </div>
            {/* Spell list */}
            <div style={{ overflowY:"auto", flex:1 }}>
              {displayed.map(spell => {
                const isK = known.some(s => s.name === spell.name);
                const isCantrip = spell.level === 0;
                const capOk = isK || (isCantrip ? canAddCantrip : canAddSpell);
                const slotOk = isCantrip || spell.level <= maxSlotLevel;
                const disabled = !isK && (!slotOk || !capOk);
                return (
                  <SpellCard key={spell.name} spell={spell} charLevel={char.level}
                    isKnown={isK} disabled={disabled}
                    disabledReason={!isK&&(!slotOk?"slot too high":!capOk?"limit reached":null)}
                    onToggle={()=>toggleKnown(spell)} actionLabel={isK?"Remove":"+ Learn"}/>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* ── Header stats row ── */}
      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14, alignItems:"center" }}>
        {[
          ["Spell DC",  spellDC ?? "—"],
          ["Spell Atk", modStr(spellAtk ?? 0)],
          ["Ability",   limits.ability ? ABILITY_SHORT[limits.ability] : "—"],
        ].map(([l,v]) => (
          <div key={l} style={{ padding:"5px 12px", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, textAlign:"center", minWidth:64 }}>
            <div style={{ fontSize:9, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{l}</div>
            <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:17 }}>{v}</div>
          </div>
        ))}
        <button onClick={()=>setManaging(true)} style={{ marginLeft:"auto", padding:"7px 16px", borderRadius:8, cursor:"pointer", fontSize:13, fontFamily:"var(--font-display)", border:"1px solid var(--accent)", background:"rgba(201,162,39,0.1)", color:"var(--accent)" }}>
          ✦ Manage Spells
        </button>
      </div>

      {/* ── Spell slots ── */}
      <div style={{ marginBottom:14 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
          <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>Spell Slots</div>
          {Object.keys(slotsSpent).some(k=>slotsSpent[k]>0) && (
            <button onClick={recoverSlots} style={{ fontSize:11, padding:"2px 8px", borderRadius:5, border:"1px solid var(--success)", background:"rgba(39,174,96,0.1)", color:"var(--success)", cursor:"pointer" }}>↺ Long Rest</button>
          )}
        </div>
        {limits.type === "pact" ? (
          <div style={{ display:"flex", gap:6 }}>
            {Array.from({length: limits.pactSlots||0}, (_,i) => {
              const used = (slotsSpent["pact"]||0) > i;
              return <div key={i} onClick={()=>{
                if(!used) onUpdate({...char,spellSlots:{...slotsSpent,pact:(slotsSpent.pact||0)+1}});
                else onUpdate({...char,spellSlots:{...slotsSpent,pact:Math.max(0,(slotsSpent.pact||0)-1)}});
              }} style={{ width:18, height:18, borderRadius:"50%", cursor:"pointer", border:`2px solid ${used?"var(--border)":"var(--accent)"}`, background:used?"transparent":"var(--accent)", transition:"all 0.15s" }}/>;
            })}
            <span style={{ fontSize:11, color:"var(--text-muted)", alignSelf:"center", marginLeft:6 }}>Pact slots (Lvl {limits.pactSlotLevel})</span>
          </div>
        ) : (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            {slots.map((count, idx) => {
              if (!count) return null;
              const lvl = idx+1;
              const left = slotsLeft(lvl);
              return (
                <div key={lvl} style={{ padding:"6px 12px", background:left>0?"var(--surface)":"rgba(0,0,0,0.2)", border:`1px solid ${left>0?"var(--border)":"rgba(255,255,255,0.05)"}`, borderRadius:8, textAlign:"center", minWidth:52 }}>
                  <div style={{ fontSize:9, color:"var(--text-muted)" }}>Lvl {lvl}</div>
                  <div style={{ fontFamily:"var(--font-display)", color:left>0?"var(--accent)":"var(--text-dim)", fontSize:18 }}>{left}</div>
                  <div style={{ fontSize:9, color:"var(--text-dim)" }}>/ {count}</div>
                  {/* Pip row for spending */}
                  <div style={{ display:"flex", gap:3, justifyContent:"center", marginTop:4 }}>
                    {Array.from({length:count},(_,i)=>{
                      const spent = i >= left;
                      return <div key={i} onClick={()=>{
                        if(!spent&&left>0) spendSlot(lvl);
                        else if(spent) onUpdate({...char,spellSlots:{...slotsSpent,[String(lvl)]:Math.max(0,(slotsSpent[String(lvl)]||0)-1)}});
                      }} style={{ width:10,height:10,borderRadius:"50%",cursor:"pointer",border:`1.5px solid ${spent?"var(--border)":"var(--accent)"}`,background:spent?"transparent":"var(--accent)",transition:"all 0.15s" }}/>;
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ── Known spells table ── */}
      {known.length === 0 ? (
        <div style={{ padding:"28px", textAlign:"center", color:"var(--text-muted)", fontSize:13, fontStyle:"italic", border:"1px dashed var(--border)", borderRadius:8 }}>
          No spells selected. Click <strong style={{ color:"var(--accent)" }}>Manage Spells</strong> to add some.
        </div>
      ) : (
        <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, overflow:"hidden" }}>
          {/* Table header */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 44px 70px 80px 90px", padding:"5px 10px",
            background:"rgba(0,0,0,0.25)", borderBottom:"1px solid var(--border)" }}>
            {["Spell","Lvl","Cast Time","Range",""].map(h=>(
              <div key={h} style={{ fontSize:9, color:"var(--text-dim)", textTransform:"uppercase", letterSpacing:1 }}>{h}</div>
            ))}
          </div>
          {/* Cantrips */}
          {knownCantrips.length > 0 && (<>
            <div style={{ padding:"3px 10px", fontSize:10, color:"var(--text-muted)", background:"rgba(0,0,0,0.15)", borderBottom:"1px solid var(--border)" }}>Cantrips</div>
            {knownCantrips.map(sp=><SpellRow key={sp.name} spell={sp}/>)}
          </>)}
          {/* Leveled spells grouped */}
          {[1,2,3,4,5,6,7,8,9].map(lvl => {
            const atLvl = knownSpells.filter(s=>s.level===lvl);
            if (!atLvl.length) return null;
            return (<React.Fragment key={lvl}>
              <div style={{ padding:"3px 10px", fontSize:10, color:"var(--text-muted)", background:"rgba(0,0,0,0.15)", borderBottom:"1px solid var(--border)", borderTop:"1px solid var(--border)" }}>
                Level {lvl} — {slotsLeft(lvl)}/{slots[lvl-1]||0} slots
              </div>
              {atLvl.map(sp=><SpellRow key={sp.name} spell={sp}/>)}
            </React.Fragment>);
          })}
        </div>
      )}
    </div>
  );
}

// ============================================================
// PERSONAL ITEMS SECTION (used in InventoryTab)
// ============================================================
function PersonalItemsSection({ char, onUpdate }) {
  const [newPersonal, setNewPersonal] = useState("");
  const personal = char.personalItems || [];
  const add = () => {
    if (!newPersonal) return;
    onUpdate({ ...char, personalItems:[...personal, {id:Date.now(), name:newPersonal, description:""}] });
    setNewPersonal("");
  };
  const rem = id => onUpdate({ ...char, personalItems: personal.filter(p => p.id !== id) });
  return (
    <div style={{ marginTop:24 }}>
      <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:10, paddingTop:16, borderTop:"1px solid var(--border)" }}>
        Personal Effects &amp; Mementos
        <span style={{ color:"var(--text-dim)", fontSize:10, marginLeft:8, textTransform:"none", letterSpacing:0 }}>Trinkets, tokens, and flavour items</span>
      </div>
      {personal.length === 0 && <div style={{ fontSize:13, color:"var(--text-dim)", marginBottom:10 }}>None yet.</div>}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
        {personal.map(p => (
          <div key={p.id} style={{ display:"flex", alignItems:"center", gap:6, padding:"5px 10px", background:"rgba(100,100,200,0.08)", border:"1px solid rgba(100,100,200,0.3)", borderRadius:8, fontSize:13 }}>
            <span style={{ color:"var(--text)" }}>{p.name}</span>
            <button onClick={() => rem(p.id)} style={{ background:"transparent", border:"none", color:"var(--danger)", cursor:"pointer", fontSize:14, lineHeight:1, padding:0 }}>×</button>
          </div>
        ))}
      </div>
      <div style={{ display:"flex", gap:8 }}>
        <input value={newPersonal} onChange={e => setNewPersonal(e.target.value)} placeholder="Add personal item, memento, or trinket…"
          onKeyDown={e => e.key==="Enter"&&add()}
          style={{ flex:1, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"7px 12px", borderRadius:6, fontSize:13, fontFamily:"var(--font-body)" }}/>
        <button onClick={add} style={{ padding:"7px 16px", background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text-muted)", borderRadius:6, cursor:"pointer", fontSize:13 }}>Add</button>
      </div>
    </div>
  );
}

// ============================================================
// INVENTORY TAB
// ============================================================
function InventoryTab({ char, gameData, onUpdate }) {
  const { itemTypes } = gameData;
  const [showAdd, setShowAdd] = useState(false);
  const inv  = char.inventory || [];
  const curr = char.currencies || { cp:0, sp:0, ep:0, gp:0, pp:0 };
  const tw   = inv.reduce((s, i) => s + (i.weight || 0) * (i.quantity || 1), 0);
  const cap  = char.abilities.str * 15;

  const rem  = id      => onUpdate({ ...char, inventory:inv.filter(i => i.id !== id) });
  const teq  = id      => onUpdate({ ...char, inventory:inv.map(i => i.id === id ? { ...i, equipped:!i.equipped } : i) });
  const uq   = (id,qty)=> onUpdate({ ...char, inventory:inv.map(i => i.id === id ? { ...i, quantity:Math.max(1,qty) } : i) });
  const ucu  = (t, v)  => onUpdate({ ...char, currencies:{ ...curr, [t]:Math.max(0, +v || 0) } });

  const inp  = { background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"8px 10px", borderRadius:6, fontSize:14, fontFamily:"var(--font-body)", width:"100%", boxSizing:"border-box" };
  const lbl  = { display:"block", color:"var(--text-muted)", fontSize:11, textTransform:"uppercase", letterSpacing:1, marginBottom:4 };
  const tc   = t => itemTypes?.[t]?.color || "var(--text-muted)";
  const tl   = t => itemTypes?.[t]?.label || t;

  const grouped = {};
  inv.forEach(item => { const g = item.type || "misc"; if (!grouped[g]) grouped[g] = []; grouped[g].push(item); });

  return (
    <div>
      {/* Currency */}
      <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:10, padding:16, marginBottom:18 }}>
        <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", marginBottom:12, fontSize:13 }}>CURRENCY</div>
        <div style={{ display:"flex", gap:14, flexWrap:"wrap" }}>
          {[["cp","Copper","#b87333"],["sp","Silver","#c0c0c0"],["ep","Electrum","#a8bba8"],["gp","Gold","#ffd700"],["pp","Platinum","#e5e4e2"]].map(([t, n, c]) => (
            <div key={t} style={{ textAlign:"center", minWidth:64 }}>
              <div style={{ width:30, height:30, borderRadius:"50%", background:c, margin:"0 auto 4px", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:"bold", color:"#333" }}>{t.toUpperCase()}</div>
              <input type="number" value={curr[t]} onChange={e => ucu(t, e.target.value)}
                style={{ ...inp, width:64, textAlign:"center", fontSize:16, padding:"4px 0" }} />
              <div style={{ fontSize:10, color:"var(--text-muted)", marginTop:2 }}>{n}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <span style={{ fontSize:13, color:"var(--text-muted)" }}>
          Weight: <strong style={{ color: tw > cap ? "var(--danger)" : "var(--text)" }}>{tw} lbs</strong>
          <span style={{ color:"var(--text-dim)" }}> / {cap} lbs</span>
        </span>
        <button onClick={() => setShowAdd(!showAdd)} style={{ padding:"8px 16px", background:"var(--accent)", border:"none", color:"var(--bg)", borderRadius:8, cursor:"pointer", fontFamily:"var(--font-display)", fontSize:13 }}>
          {showAdd ? "▲ Hide Adder" : "+ Add Item"}
        </button>
      </div>

      {showAdd && (
        <div style={{ marginBottom:16 }}>
          <LibraryItemAdder
            gameData={gameData}
            onAdd={item => { onUpdate({ ...char, inventory:[...inv, item] }); }}
          />
        </div>
      )}

      {inv.length === 0 && !showAdd && (
        <div style={{ textAlign:"center", padding:44, color:"var(--text-muted)" }}>
          <div style={{ fontSize:44, marginBottom:12 }}>🎒</div>
          <div>Your pack is empty.</div>
        </div>
      )}

      {Object.entries(grouped).map(([type, items]) => (
        <div key={type} style={{ marginBottom:16 }}>
          <div style={{ fontSize:11, color:tc(type), textTransform:"uppercase", letterSpacing:1, marginBottom:7, paddingBottom:4, borderBottom:"1px solid var(--border)" }}>
            {tl(type)} ({items.length})
          </div>
          {items.map(item => {
            const lib = lookupLibraryItem(item.name, gameData);
            const proficient = lib ? isItemProficient(lib, char, gameData.classes) : null;
            const isEquippable = ["weapon","armor","shield"].includes(item.type) || lib?.category?.includes("Armor") || lib?.category === "shield";
            const canEquip = isEquippable || (lib && (lib._lib === "armor" || lib._lib === "weapon"));
            const showEquip = canEquip || ["weapon","armor","shield"].includes(item.type);
            const stealthDisadv = item.equipped && lib?.stealthDisadvantage;
            const strReq = item.equipped && lib?.strengthReq && (char.abilities?.str||10) < lib.strengthReq;
            return (
              <div key={item.id} style={{ background:"var(--card)", border:`1px solid ${item.equipped?"var(--accent2)":"var(--border)"}`, borderRadius:10, padding:12, marginBottom:7 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ width:8, height:8, borderRadius:"50%", background:tc(item.type), flexShrink:0 }} />
                  <div style={{ flex:1, minWidth:0 }}>
                    {/* Name row */}
                    <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                      <span style={{ fontFamily:"var(--font-display)", fontSize:14 }}>{item.name}</span>
                      {item.equipped && <span style={{ fontSize:10, padding:"2px 6px", background:"rgba(39,174,96,0.15)", border:"1px solid var(--success)", borderRadius:4, color:"var(--success)" }}>Equipped</span>}
                      {/* Proficiency badge */}
                      {proficient !== null && (
                        <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4,
                          background: proficient ? "rgba(39,174,96,0.12)" : "rgba(230,126,34,0.12)",
                          border:`1px solid ${proficient?"var(--success)":"#e67e22"}`,
                          color: proficient ? "var(--success)" : "#e67e22" }}>
                          {proficient ? "✓ Proficient" : "⚠ Not proficient"}
                        </span>
                      )}
                      {/* Stealth disadvantage badge */}
                      {stealthDisadv && <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4, background:"rgba(230,126,34,0.12)", border:"1px solid #e67e22", color:"#e67e22" }}>⚠ Stealth disadv.</span>}
                      {/* Str requirement warning */}
                      {strReq && <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4, background:"rgba(192,57,43,0.12)", border:"1px solid var(--danger)", color:"var(--danger)" }}>⚠ STR {lib.strengthReq} required</span>}
                    </div>
                    {/* Stats row from library */}
                    {lib && (
                      <div style={{ fontSize:11, color:"var(--text-muted)", marginTop:3, display:"flex", gap:10, flexWrap:"wrap" }}>
                        {lib.damage && (() => {
                          const isRanged = lib.range && !lib.properties?.includes("thrown");
                          const isFin = lib.properties?.includes("finesse");
                          const mod = isFin
                            ? Math.max(calcMod(char.abilities.str), calcMod(char.abilities.dex))
                            : isRanged ? calcMod(char.abilities.dex) : calcMod(char.abilities.str);
                          const sign = mod > 0 ? "+" : "−";
                          const dmgStr = mod === 0 ? `${lib.damage} ${lib.damageType}`
                            : `${lib.damage} ${sign} ${Math.abs(mod)} ${lib.damageType}`;
                          return <span style={{ color:"var(--danger)" }}>{dmgStr}</span>;
                        })()}
                        {lib.acFormula && <span style={{ color:"var(--info)" }}>AC: {lib.acFormula}</span>}
                        {lib.properties?.length > 0 && <span>{lib.properties.join(", ")}</span>}
                        {lib.range && <span>Range {lib.range}</span>}
                        {lib.stealthDisadvantage && !item.equipped && <span style={{ color:"#e67e22" }}>Stealth disadvantage</span>}
                        {lib.strengthReq > 0 && <span style={{ color:"var(--text-dim)" }}>Str {lib.strengthReq}+</span>}
                        {(item.weight||lib.weight) > 0 && <span style={{ color:"var(--text-dim)" }}>{item.weight||lib.weight} lb</span>}
                      </div>
                    )}
                    {/* Custom description (if no library entry or extra notes) */}
                    {item.description && !lib && <div style={{ fontSize:12, color:"var(--text-muted)", marginTop:2 }}>{item.description}</div>}
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
                    <input type="number" value={item.quantity} min={1} onChange={e => uq(item.id, +e.target.value)}
                      style={{ ...inp, width:50, textAlign:"center", padding:"4px 0" }} />
                    {showEquip && (
                      <button onClick={() => teq(item.id)} style={{ padding:"4px 10px", borderRadius:6, fontSize:12, cursor:"pointer", background:"transparent",
                        border:`1px solid ${item.equipped ? "var(--success)" : "var(--border)"}`,
                        color: item.equipped ? "var(--success)" : "var(--text-muted)" }}>
                        {item.equipped ? "Unequip" : "Equip"}
                      </button>
                    )}
                    <button onClick={() => rem(item.id)} style={{ width:28, height:28, borderRadius:6, border:"1px solid var(--danger)", background:"transparent", color:"var(--danger)", cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ))}

      {/* Personal Items */}
      <PersonalItemsSection char={char} onUpdate={onUpdate} />
    </div>
  );
}

// ============================================================
// FEATURES TAB (character sheet view)
// ============================================================
function FeaturesTab({ char, gameData }) {
  const { classes, species:speciesDb, feats:featList=[] } = gameData;
  const classData   = classes?.[char.class];
  const speciesData = speciesDb?.[char.species];
  const subraceData = char.subrace ? speciesData?.subraces?.[char.subrace] : null;
  const [open, setOpen] = useState({});
  const toggle = name => setOpen(o => ({ ...o, [name]:!o[name] }));

  const allFeatures = [
    ...(classData?.features || []),
    ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || [])
  ].sort((a, b) => a.level - b.level);

  const FeatureRow = ({ feat, isSpecies, isSubrace }) => {
    const locked  = !isSpecies && !isSubrace && char.level < feat.level;
    const chosen  = char.featureChoices?.[feat.name];
    const chosenFeat = char.featChoices?.[feat.name];
    const toggleKey = feat.name + (isSpecies ? "_sp" : isSubrace ? "_sr" : "");
    const isOpen = open[toggleKey];
    return (
      <div style={ws.fCard(locked)}>
        <div style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer" }} onClick={() => toggle(toggleKey)}>
          <span style={{ fontFamily:"var(--font-display)", color: locked ? "var(--text-dim)" : "var(--accent)", fontSize:14, flex:1 }}>{feat.name}</span>
          {feat.type === "asi" && chosenFeat && chosenFeat !== "__pending__" && (
            <span style={{ fontSize:11, padding:"1px 8px", borderRadius:10, background:"rgba(201,162,39,0.12)", border:"1px solid var(--accent)", color:"var(--accent)" }}>🏆 {chosenFeat}</span>
          )}
          {feat.type === "asi" && !chosenFeat && (
            <span style={{ fontSize:11, padding:"1px 8px", borderRadius:10, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text-dim)" }}>ASI</span>
          )}
          {locked   && <span style={ws.lockBadge}>Lvl {feat.level}</span>}
          {!locked && feat.level > 1 && !isSpecies && !isSubrace && <span style={{ fontSize:10, color:"var(--text-dim)" }}>Lvl {feat.level}</span>}
          {chosen   && <span style={{ fontSize:11, color:"var(--success)", padding:"1px 8px", borderRadius:10, border:"1px solid var(--success)" }}>{chosen.split("—")[0].trim()}</span>}
          <span style={{ color:"var(--text-dim)", fontSize:11 }}>{isOpen ? "▲" : "▼"}</span>
        </div>
        {isOpen && (
          <div style={{ marginTop:10, paddingTop:10, borderTop:"1px solid var(--border)" }}>
            <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.6, margin:0 }}>{feat.description}</p>
            {chosen && (
              <div style={{ marginTop:8, padding:"6px 10px", background:"rgba(201,162,39,0.08)", borderRadius:6, fontSize:12, color:"var(--accent)" }}>✓ Chosen: {chosen}</div>
            )}
            {feat.type === "asi" && chosenFeat && chosenFeat !== "__pending__" && (
              <div style={{ marginTop:8, padding:"8px 12px", background:"rgba(201,162,39,0.08)", border:"1px solid var(--accent)", borderRadius:8 }}>
                <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:14, marginBottom:4 }}>🏆 {chosenFeat}</div>
                <div style={{ fontSize:12, color:"var(--text-muted)", lineHeight:1.5 }}>
                  {featList.find(f=>f.name===chosenFeat)?.description}
                </div>
              </div>
            )}
            {feat.type === "asi" && !chosenFeat && (() => {
              const asi = char.asiChoices?.[feat.name] || {};
              const bonuses = Object.entries(asi).filter(([,v])=>v>0);
              return bonuses.length > 0 ? (
                <div style={{ marginTop:8, padding:"6px 10px", background:"rgba(39,174,96,0.08)", borderRadius:6, fontSize:12, color:"var(--success)" }}>
                  ✓ {bonuses.map(([ab,v])=>`+${v} ${ABILITY_SHORT[ab]}`).join(", ")}
                </div>
              ) : null;
            })()}
          </div>
        )}
      </div>
    );
  };

  // Collect taken feats for summary
  const takenFeats = Object.entries(char.featChoices||{})
    .filter(([,v]) => v && v !== "__pending__")
    .map(([asiFeature, featName]) => ({ asiFeature, featName, feat: featList.find(f=>f.name===featName) }));

  // Racial spells
  const racialSpells = char.racialSpells || [];

  return (
    <div>
      {/* Feats summary */}
      {takenFeats.length > 0 && (
        <div style={{ marginBottom:24 }}>
          <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13, textTransform:"uppercase", letterSpacing:1, marginBottom:10 }}>
            Feats
          </div>
          {takenFeats.map(({featName, feat}) => (
            <div key={featName} style={{ background:"var(--card)", border:"1px solid var(--accent2)", borderRadius:10, padding:"10px 14px", marginBottom:8 }}>
              <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:14, marginBottom:4 }}>🏆 {featName}</div>
              <div style={{ fontSize:12, color:"var(--text-muted)", lineHeight:1.5 }}>{feat?.description}</div>
            </div>
          ))}
        </div>
      )}

      {/* Racial spells */}
      {racialSpells.length > 0 && (
        <div style={{ marginBottom:24 }}>

  return (
    <div style={{ marginBottom:2 }}>
      {/* Compact row */}

        border:`1px solid ${open?"var(--accent)":"var(--border)"}`,

          {!proficient && <span style={{ fontSize:9, color:"#e67e22", padding:"1px 4px", border:"1px solid #e67e22", borderRadius:3, flexShrink:0 }}>!</span>}
        </div>
        {/* Range */}
        <div style={{ fontSize:11, color:"var(--text-muted)" }}>{lib?.range || "5 ft"}</div>
        {/* To Hit */}
        <div style={{ fontFamily:"var(--font-display)", color:"var(--info)", fontSize:15 }}>{modStr(hitBonus)}</div>
        {/* Damage */}
        <div style={{ fontSize:12, color:"var(--danger)" }}>

        <div style={{ padding:"10px 14px", background:"rgba(0,0,0,0.15)", border:"1px solid var(--accent)", borderTop:"none", borderRadius:"0 0 6px 6px", marginBottom:4 }}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:8 }}>

              ["Hit Bonus",  modStr(hitBonus)],

// ── FeatureAction — with uses tracking and rest buttons ──
function FeatureAction({ feat, char, onUpdate }) {
  const [open, setOpen] = useState(false);

  // Compute max uses
  const computeMax = uses => {
    if (!uses) return null;
    let max = uses.max;
    if (max === "charismaModifier")    max = Math.max(1, calcMod(char.abilities.cha));
    else if (max === "charismaModifier+1") max = Math.max(1, calcMod(char.abilities.cha) + 1);
    else if (max === "level*5")        max = char.level * 5;
    return max;
  };

  const maxUses = computeMax(feat.uses);
  const usesKey = `uses_${feat.name}`;
  const spentKey = `spent_${feat.name}`;

  // Spent uses stored on char.actionUses: { "uses_Rage": 2, ... }
  const spent = char.actionUses?.[spentKey] || 0;
  const remaining = maxUses !== null ? Math.max(0, maxUses - spent) : null;

  const markUsed = () => {
    if (remaining === null || remaining <= 0) return;
    onUpdate({ ...char, actionUses: { ...(char.actionUses||{}), [spentKey]: spent + 1 } });
  };
  const recover = (n) => {
    const newSpent = Math.max(0, spent - (n || maxUses));
    onUpdate({ ...char, actionUses: { ...(char.actionUses||{}), [spentKey]: newSpent } });
  };

  const restLabel = feat.uses?.per === "short" ? "Short Rest" : feat.uses?.per === "long" ? "Long Rest" : feat.uses?.per === "turn" ? "Next Turn" : null;

  return (
    <div style={{ background:"var(--surface)", border:`1px solid ${open?"var(--accent)":"var(--border)"}`, borderRadius:8, padding:"10px 12px", marginBottom:6, transition:"border-color 0.15s" }}>
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        {/* Name + note — click to expand */}
        <div style={{ flex:1, cursor:"pointer" }} onClick={()=>setOpen(o=>!o)}>
          <span style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:14 }}>{feat.name}</span>
          {feat.note && <span style={{ fontSize:11, color:"var(--text-muted)", marginLeft:8 }}>{feat.note}</span>}
        </div>

        {/* Uses tracker — only if limited */}
        {maxUses !== null && (
          <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
            {/* Pip dots — filled = available, empty = spent. Click filled to spend, click empty to restore */}
            <div style={{ display:"flex", gap:4 }}>
              {Array.from({length: maxUses}).map((_, i) => {
                const isSpent = i >= remaining; // pips filled from left, spent from right
                return (
                  <div key={i}
                    onClick={() => {
                      if (!isSpent) markUsed();     // filled pip → spend one
                      else if (spent > 0) recover(1); // empty pip → restore one
                    }}
                    style={{ width:14, height:14, borderRadius:"50%", cursor:"pointer",
                      border:`2px solid ${isSpent ? "var(--border)" : "var(--accent)"}`,
                      background: isSpent ? "transparent" : "var(--accent)",
                      transition:"all 0.15s" }}/>
                );
              })}
            </div>
            {/* Remaining count */}
            <span style={{ fontSize:12, color: remaining > 0 ? "var(--accent)" : "var(--text-dim)", fontFamily:"var(--font-display)", minWidth:28, textAlign:"center" }}>
              {remaining}/{maxUses}
            </span>
            {/* Use button */}
            {remaining > 0 && (
              <button onClick={markUsed} style={{ padding:"2px 8px", borderRadius:5, fontSize:11, cursor:"pointer", background:"rgba(201,162,39,0.15)", border:"1px solid var(--accent)", color:"var(--accent)" }}>Use</button>
            )}
            {/* Recover button */}
            {spent > 0 && restLabel && (
              <button onClick={recover} style={{ padding:"2px 8px", borderRadius:5, fontSize:11, cursor:"pointer", background:"rgba(39,174,96,0.1)", border:"1px solid var(--success)", color:"var(--success)" }}>↺ {restLabel}</button>
            )}
          </div>
        )}
        <span style={{ color:"var(--text-dim)", fontSize:10, cursor:"pointer", flexShrink:0 }} onClick={()=>setOpen(o=>!o)}>{open?"▲":"▼"}</span>
      </div>
      {open && feat.description && (
        <div style={{ marginTop:8, paddingTop:8, borderTop:"1px solid var(--border)", fontSize:13, color:"var(--text-muted)", lineHeight:1.6 }}>
          {feat.description}
        </div>
      )}
    </div>
  );
}

  const allClassFeats = [
    ...(classData?.features || []),
    ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || []),
  ];
  const extraAttackFeat = allClassFeats
    .filter(f => f.attackCount && char.level >= f.level)
    .sort((a, b) => b.attackCount - a.attackCount)[0];
  const attackCount = extraAttackFeat?.attackCount || 1;

  const weaponStats = item => {
    const lib = lookupLibraryItem(item.name, gameData);
    const proficient = lib ? isItemProficient(lib, char, classes) : false;
    const abilMod = lib?.properties?.includes("finesse")
      ? Math.max(calcMod(char.abilities.str), calcMod(char.abilities.dex))
      : lib?.category?.includes("Ranged") || lib?.category === "simpleRanged" || lib?.category === "martialRanged"
        ? calcMod(char.abilities.dex)
        : calcMod(char.abilities.str);
    const hitBonus = abilMod + (proficient ? pb : 0);
    return { lib, proficient, hitBonus, abilMod };
  };

  const allFeatures = [
    ...(classData?.features || []),
    ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || []),
    ...(speciesData?.features || []),
    ...(subraceData?.features || []),
  ].filter(f => f.actionType && char.level >= (f.level || 1));

  const byType = type => allFeatures.filter(f => f.actionType === type);

  const sHead = label => (
    <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase",
      letterSpacing:2, margin:"18px 0 8px", paddingBottom:5, borderBottom:"1px solid rgba(201,162,39,0.2)" }}>
      {label}
    </div>
  );

  const NAV = [
    ["all",      "All"],
    ["weapons",  "⚔️ Weapons"],
    ["standard", "📋 Standard"],
    ["class",    "⭐ Class & Racial"],
    ["bonus",    "⚡ Bonus"],
    ["reaction", "🔄 Reactions"],
  ];

  return (
    <div>
      {/* ── Category filter ── */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:4, paddingBottom:10, borderBottom:"1px solid var(--border)" }}>
        {NAV.map(([key, label]) => {
          const active = section === key;
          return (
            <button key={key} onClick={()=>setSection(key)} style={{
              padding:"5px 12px", borderRadius:20, cursor:"pointer", fontSize:12,
              fontFamily:"var(--font-display)", transition:"all 0.15s",
              border:`1px solid ${active?"var(--accent)":"var(--border)"}`,
              background:active?"rgba(201,162,39,0.1)":"var(--surface)",
              color:active?"var(--accent)":"var(--text-muted)" }}>
              {label}
            </button>
          );
        })}
      </div>

      {show("weapons") && (<>
        {sHead(`⚔️ Weapon Attacks${attackCount > 1 ? ` — ${attackCount} per Attack Action` : ""}`)}
        {equippedWeapons.length === 0
          ? <div style={{ fontSize:13, color:"var(--text-dim)", fontStyle:"italic" }}>No weapons equipped. Equip in Inventory.</div>
          : <><WeaponTableHeader/>{equippedWeapons.map(item => {
              const { lib, proficient, hitBonus, abilMod } = weaponStats(item);
              return <WeaponCard key={item.id} item={item} lib={lib} proficient={proficient} hitBonus={hitBonus} abilMod={abilMod}/>;
            })}</>
        }
      </>)}

      {show("standard") && (<>
        {sHead("📋 Standard Actions")}
        <StandardActionList actions={standardActions.filter(a=>a.actionType==="action")} />
      </>)}

      {show("class") && (byType("action").length > 0 || byType("special").length > 0) && (<>
        {sHead("⭐ Class & Racial Actions")}
        {byType("action").map(f=><FeatureAction key={f.name} feat={f} char={char} onUpdate={onUpdate}/>)}
        {byType("special").map(f=><FeatureAction key={f.name} feat={f} char={char} onUpdate={onUpdate}/>)}
      </>)}

      {show("bonus") && (<>
        {sHead("⚡ Bonus Actions")}
        <StandardActionList actions={standardActions.filter(a=>a.actionType==="bonus")} />
        {byType("bonus").map(f=><FeatureAction key={f.name} feat={f} char={char} onUpdate={onUpdate}/>)}
      </>)}

      {show("reaction") && (<>
        {sHead("🔄 Reactions")}
        <StandardActionList actions={standardActions.filter(a=>a.actionType==="reaction")} />
        {byType("reaction").map(f=><FeatureAction key={f.name} feat={f} char={char} onUpdate={onUpdate}/>)}
      </>)}

      {section === "all" && standardActions.filter(a=>a.actionType==="free").length > 0 && (<>
        {sHead("Other")}
        <StandardActionList actions={standardActions.filter(a=>a.actionType==="free")} />
      </>)}
    </div>
  );
}

function CharacterSheet({ char:initial, gameData, onBack, onDelete, onEdit, cloudSync }) {
  const [char, setChar]   = useState(initial);
  const [tab,  setTab]    = useState("actions");
  const [saved, setSaved] = useState(false);
  const [imgError, setImgError] = useState(false);
  const saveTimer = useRef(null);
  const fileRef   = useRef(null);

  const { classes, species:speciesDb, themes, music } = gameData;
  const theme       = themes?.[char.theme] || themes?.[Object.keys(themes || {})[0]] || {};
  const classData   = classes?.[char.class];
  const speciesData = speciesDb?.[char.species];
  const subraceData = char.subrace ? speciesData?.subraces?.[char.subrace] : null;
  const pb          = profBonus(char.level);
  const saves       = getSavingThrows(char, classes);
  const skills      = getSkillBonuses(char);
  const isSpellcaster = !!getSpellcastingInfo(char, classes);

  const upd = useCallback(u => {
    const s = { ...u, updatedAt: new Date().toISOString() };
    setChar(s);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const all = loadChars();
      const idx = all.findIndex(c => c.id === s.id);
      if (idx >= 0) all[idx] = s; else all.push(s);
      saveChars(all);
      if (cloudSync) cloudSync(s);
      setSaved(true); setTimeout(() => setSaved(false), 2000);
    }, 800);
  }, [cloudSync]);



  // Profile picture upload
  const handleImageUpload = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    // Reset input so the same file can be re-selected if needed
    e.target.value = "";
    const reader = new FileReader();
    reader.onload = ev => {
      const img = ev.target.result;
      // Update display state directly
      setChar(c => ({ ...c, profileImage: img, updatedAt: new Date().toISOString() }));
      setImgError(false);
      // Save to localStorage immediately (outside the state updater — keeps it pure)
      const all = loadChars();
      const cur = all.find(x => x.id === initial.id);
      if (cur) {
        cur.profileImage = img;
        cur.updatedAt = new Date().toISOString();
        saveChars(all);
      }
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    };
    reader.readAsDataURL(file);
  };

  const TABS = [
    { id:"actions",    l:"⚔️ Actions"    },
    ...(isSpellcaster ? [{ id:"spells", l:"✨ Spells" }] : []),
    { id:"inventory",  l:"🎒 Inventory"  },
    { id:"features",   l:"⭐ Features"   },
    { id:"background", l:"📜 Background" },
    { id:"notes",      l:"✏️ Notes"      },
    { id:"settings",   l:"⚙️ Settings"  },
  ];

  const ts = active => ({
    padding:"7px 12px", cursor:"pointer", fontSize:12, whiteSpace:"nowrap",
    transition:"all 0.15s", fontFamily:theme.fontBody || "serif",
    background: active ? theme.card : "transparent",
    color:      active ? theme.accent : theme.textMuted,
    border:     `1px solid ${active ? theme.border : "transparent"}`,
    borderBottom: active ? `1px solid ${theme.card}` : "none",
    borderRadius:"6px 6px 0 0",
  });

  const T = k => theme[k] || "var(--"+k.replace(/([A-Z])/g,m=>"-"+m.toLowerCase())+")";

  // HP colour
  const hpPct = char.hp.max > 0 ? char.hp.current / char.hp.max : 0;
  const hpColour = hpPct > 0.5 ? theme.success : hpPct > 0.25 ? "#f39c12" : theme.danger;

  // Stealthy / str warnings
  const stealthDisadv = hasStealthDisadvantage(char, gameData);
  const strWarnings   = strRequirementMet(char, gameData);

  // Quick combat stats (beside HP)
  const combatStats = [
    { l:"AC",       v: calcAC(char, gameData) },
    { l:"Init",     v: modStr(calcMod(char.abilities.dex)) },
    { l:"Speed",    v: `${speciesData?.speed || 30}ft` },
    { l:"Prof",     v: `+${pb}` },
    { l:"Pass Perc",v: 10 + (skills["Perception"]?.value || 0) },
    ...(isSpellcaster ? [
      { l:"Spell DC",  v: calcSpellDC(char, classes) ?? "—" },
      { l:"Spell Atk", v: modStr(calcSpellAtk(char, classes) ?? 0) },
    ] : []),
  ];

  const sectionLabel = txt => (
    <div style={{ fontFamily:theme.fontDisplay, color:theme.accent, fontSize:10, textTransform:"uppercase", letterSpacing:2, marginBottom:8, marginTop:16, paddingBottom:4, borderBottom:`1px solid rgba(201,162,39,0.15)` }}>{txt}</div>
  );

  return (
    <TW themeKey={char.theme} themes={themes} charCustom={char.custom || {}}>
      <input ref={fileRef} type="file" accept="image/*" onChange={handleImageUpload} style={{ display:"none" }}/>

      {/* ── Sticky top bar ── */}
      <div style={{ background:theme.bg, borderBottom:`1px solid ${theme.border}`, padding:"8px 16px", position:"sticky", top:0, zIndex:20, display:"flex", alignItems:"center", gap:10 }}>
        <button onClick={onBack} style={{ background:"transparent", border:`1px solid ${theme.border}`, color:theme.textMuted, padding:"4px 10px", borderRadius:6, cursor:"pointer", fontFamily:theme.fontBody, fontSize:12, flexShrink:0 }}>← Back</button>
        <div style={{ flex:1, minWidth:0 }}>
          <span style={{ fontFamily:theme.fontDisplay, fontSize:18, color:theme.accent }}>{char.name}</span>
          <span style={{ fontSize:11, color:theme.textMuted, marginLeft:10 }}>
            {[char.species && (char.subrace ? `${char.species} (${char.subrace})` : char.species), char.subclass ? `${char.class} (${char.subclass})` : char.class, `Level ${char.level}`, char.background].filter(Boolean).join(" · ")}
          </span>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
          <div style={{ opacity:saved?1:0, transition:"opacity 0.3s", padding:"2px 9px", borderRadius:20, background:"rgba(39,174,96,0.15)", border:`1px solid ${theme.success}`, color:theme.success, fontSize:11 }}>✓ Saved</div>
          <div onClick={()=>upd({...char,inspiration:!char.inspiration})} title="Inspiration" style={{ width:24,height:24,borderRadius:5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,transition:"all 0.2s", border:`2px solid ${char.inspiration?"#ffd700":theme.border}`, background:char.inspiration?"rgba(255,215,0,0.2)":"transparent" }}>{char.inspiration?"✦":"✧"}</div>
          <button onClick={()=>{ if(confirm("Delete this character permanently?")) onDelete(char.id); }} style={{ background:"transparent", border:`1px solid ${theme.danger}`, color:theme.danger, padding:"4px 9px", borderRadius:6, cursor:"pointer", fontSize:11 }}>Delete</button>
        </div>
      </div>

      {/* ── Two-column body ── */}
      <div style={{ padding:"10px 12px 12px", height:"calc(100vh - 44px)", boxSizing:"border-box", overflow:"hidden", maxWidth:1200, margin:"0 auto", width:"100%" }}>
        <div style={{ display:"grid", gridTemplateColumns:"260px 1fr", height:"100%", gap:10, overflow:"hidden" }}>

        {/* ══ LEFT COLUMN: portrait + everything static ══ */}
        <div style={{ borderRadius:12, border:`1px solid ${theme.border}`, background:theme.card, overflowY:"auto", padding:"14px 12px", display:"flex", flexDirection:"column", gap:0 }}>

          {/* Portrait */}
          <div style={{ textAlign:"center", marginBottom:12 }}>
            <div onClick={()=>fileRef.current.click()} title="Click to upload portrait"
              style={{ width:110, height:110, borderRadius:10, margin:"0 auto", cursor:"pointer", position:"relative", overflow:"hidden", border:`2px solid ${theme.accent}`, background:theme.surface, display:"flex", alignItems:"center", justifyContent:"center", boxShadow:`0 0 16px rgba(201,162,39,0.2)`, transition:"box-shadow 0.2s" }}
              onMouseEnter={e=>e.currentTarget.style.boxShadow="0 0 24px rgba(201,162,39,0.45)"}
              onMouseLeave={e=>e.currentTarget.style.boxShadow="0 0 16px rgba(201,162,39,0.2)"}>
              {char.profileImage && !imgError
                ? <img src={char.profileImage} alt="portrait" onError={()=>setImgError(true)} style={{ width:"100%",height:"100%",objectFit:"cover" }}/>
                : <div style={{ textAlign:"center", color:theme.textDim }}><div style={{ fontSize:28 }}>🧙</div><div style={{ fontSize:9, marginTop:4, color:theme.textMuted }}>Add portrait</div></div>
              }
            </div>
          </div>

          {/* Ability scores — 3 col compact */}
          {sectionLabel("Abilities")}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:5, marginBottom:4 }}>
            {Object.keys(char.abilities).map(ab => {
              const score = char.abilities[ab];
              return (
                <div key={ab} style={{ textAlign:"center", background:theme.surface, border:`1px solid ${theme.border}`, borderRadius:7, padding:"5px 2px" }}>
                  <div style={{ fontSize:9, color:theme.textMuted, textTransform:"uppercase", letterSpacing:1 }}>{ABILITY_SHORT[ab]}</div>
                  <div style={{ fontSize:18, fontFamily:theme.fontDisplay, color:theme.accent, lineHeight:1.2 }}>{score}</div>
                  <div style={{ fontSize:11, color:theme.text }}>{modStr(calcMod(score))}</div>
                </div>
              );
            })}
          </div>

          {/* Saving throws */}
          {sectionLabel("Saving Throws")}
          <div style={{ display:"flex", flexDirection:"column", gap:2, marginBottom:4 }}>
            {Object.entries(saves).map(([ab, sv]) => (
              <div key={ab} style={{ display:"flex", alignItems:"center", gap:5, padding:"3px 6px", borderRadius:4 }}>
                <span style={{ width:7, height:7, borderRadius:"50%", flexShrink:0, background:sv.proficient?theme.accent:"transparent", border:`2px solid ${sv.proficient?theme.accent:theme.border}` }}/>
                <span style={{ flex:1, fontSize:11, color:sv.proficient?theme.text:theme.textMuted }}>{ABILITY_NAMES[ab]}</span>
                <span style={{ fontFamily:theme.fontDisplay, color:theme.accent, fontSize:12 }}>{modStr(sv.value)}</span>
              </div>
            ))}
          </div>

          {/* Proficiencies */}
          {classData && (<>
            {sectionLabel("Proficiencies")}
            <div style={{ fontSize:11, lineHeight:1.85, marginBottom:4 }}>
              <div><span style={{ color:theme.textMuted }}>Armor: </span><span style={{ color:theme.text }}>{(classData.armorProficiencies||[]).join(", ")||"None"}</span></div>
              <div><span style={{ color:theme.textMuted }}>Weapons: </span><span style={{ color:theme.text }}>{(classData.weaponProficiencies||[]).join(", ")||"None"}</span></div>
              <div><span style={{ color:theme.textMuted }}>Saves: </span><span style={{ color:theme.text }}>{(classData.savingThrows||[]).map(ab=>ABILITY_SHORT[ab]).join(", ")}</span></div>
              {char.skillProficiencies?.length>0 && <div><span style={{ color:theme.textMuted }}>Skills: </span><span style={{ color:theme.text }}>{char.skillProficiencies.join(", ")}</span></div>}
            </div>
          </>)}

          {/* Skills */}
          {sectionLabel("Skills")}
          <div style={{ display:"flex", flexDirection:"column", gap:1 }}>
            {Object.entries(skills).map(([sk, d]) => (
              <div key={sk} style={{ display:"flex", alignItems:"center", gap:5, padding:"2px 4px", borderRadius:3, background:d.expertise?"rgba(201,162,39,0.05)":d.proficient?"rgba(201,162,39,0.02)":"transparent" }}>
                <span style={{ width:7, height:7, flexShrink:0, display:"inline-block", borderRadius:d.expertise?0:"50%", transform:d.expertise?"rotate(45deg)":"none", background:d.proficient||d.expertise?theme.accent:"transparent", border:`2px solid ${d.proficient||d.expertise?theme.accent:theme.border}` }}/>
                <span style={{ flex:1, fontSize:11, color:d.proficient?theme.text:theme.textMuted, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{sk}</span>
                <span style={{ fontSize:9, color:theme.textDim, marginRight:2 }}>{ABILITY_SHORT[SKILLS_MAP[sk]]}</span>
                <span style={{ fontFamily:theme.fontDisplay, color:theme.accent, fontSize:12, minWidth:22, textAlign:"right" }}>{modStr(d.value)}</span>
              </div>
            ))}
          </div>

          {/* Warnings */}
          {stealthDisadv && <div style={{ marginTop:8, padding:"4px 8px", background:"rgba(230,126,34,0.12)", border:"1px solid #e67e22", borderRadius:5, fontSize:10, color:"#e67e22" }}>⚠ Stealth disadvantage</div>}
          {strWarnings.map(msg=><div key={msg} style={{ marginTop:4, padding:"4px 8px", background:"rgba(192,57,43,0.12)", border:`1px solid ${theme.danger}`, borderRadius:5, fontSize:10, color:theme.danger }}>⚠ {msg}</div>)}
        </div>

        {/* ══ RIGHT SIDE: top strip + tab panel ══ */}
        <div style={{ display:"flex", flexDirection:"column", height:"100%", overflow:"hidden", borderRadius:12, border:`1px solid ${theme.border}`, background:theme.card }}>

          {/* ── Top strip: HP + combat stats ── */}
          <div style={{ padding:"10px 14px", borderBottom:`1px solid ${theme.border}`, flexShrink:0, display:"flex", alignItems:"center", gap:12, borderRadius:"12px 12px 0 0", background:`rgba(0,0,0,0.15)`, flexWrap:"nowrap", overflow:"hidden" }}>
            {/* HP tracker — fixed width, never shrinks */}
            <div style={{ flexShrink:0 }}>
              <HPTracker hp={char.hp} onUpdate={hp=>upd({...char,hp})}/>
            </div>
            {/* Combat stat pills — scrollable row so they never wrap onto a new line */}
            <div style={{ display:"flex", gap:8, marginLeft:"auto", flexShrink:0, overflowX:"auto", paddingBottom:2 }}>
              {combatStats.map(s=>(
                <div key={s.l} style={{ textAlign:"center", padding:"6px 12px", background:theme.surface, border:`1px solid ${theme.border}`, borderRadius:8, flexShrink:0, minWidth:52 }}>
                  <div style={{ fontSize:9, color:theme.textMuted, textTransform:"uppercase", letterSpacing:1, whiteSpace:"nowrap", marginBottom:2 }}>{s.l}</div>
                  <div style={{ fontFamily:theme.fontDisplay, color:theme.accent, fontSize:22, lineHeight:1 }}>{s.v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* ── Tab panel: fills remaining height ── */}
          <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
            {/* Tab bar */}
            <div style={{ display:"flex", borderBottom:`1px solid ${theme.border}`, flexShrink:0, paddingLeft:12, paddingTop:10, background:"transparent" }}>
              {TABS.map(t=><button key={t.id} style={ts(tab===t.id)} onClick={()=>setTab(t.id)}>{t.l}</button>)}
            </div>
            {/* Tab content — scrolls independently */}
            <div style={{ flex:1, overflowY:"auto", padding:16 }}>
              {tab==="actions"    && <ActionsTab     char={char} gameData={gameData} onUpdate={upd}/>}
              {tab==="spells"    && <SpellsTab    char={char} gameData={gameData} onUpdate={upd}/>}
              {tab==="inventory" && <InventoryTab  char={char} gameData={gameData} onUpdate={upd}/>}
              {tab==="features"  && <FeaturesTab   char={char} gameData={gameData}/>}
              {tab==="background"&& (
                <div>
                  <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:16, marginBottom:14 }}>{char.background}</div>
                  {gameData.backgrounds?.[char.background]?.description
                    ? <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.7, marginBottom:16 }}>{gameData.backgrounds[char.background].description}</p>
                    : <p style={{ fontSize:13, color:"var(--text-dim)", fontStyle:"italic" }}>No background description available.</p>}
                  {gameData.backgrounds?.[char.background]?.features?.length > 0 && (<>
                    <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, marginBottom:10 }}>Background Features</div>
                    {gameData.backgrounds[char.background].features.map(f=>(
                      <div key={f.name} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, padding:"10px 14px", marginBottom:8 }}>
                        <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:14, marginBottom:4 }}>{f.name}</div>
                        <div style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.6 }}>{f.description}</div>
                      </div>
                    ))}
                  </>)}
                  {char.personalItems?.length > 0 && (<>
                    <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, margin:"16px 0 10px" }}>Personal Effects & Mementos</div>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                      {char.personalItems.map(p=>(
                        <span key={p.id} style={{ padding:"4px 10px", background:"rgba(100,100,200,0.08)", border:"1px solid rgba(100,100,200,0.3)", borderRadius:8, fontSize:13, color:"var(--text)" }}>{p.name}</span>
                      ))}
                    </div>
                  </>)}
                </div>
              )}
              {tab==="notes"     && <NotesTab       char={char} onUpdate={upd}/>}
              {tab==="settings"  && <SettingsTab    char={char} gameData={gameData} onUpdate={upd} onEdit={onEdit}/>}
            </div>
          </div>
        </div>
        </div>{/* end grid */}
      </div>{/* end padding wrapper */}
    </TW>
  );
}

function CharacterCard({ char, gameData, onClick }) {
  const { themes } = gameData;
  const theme = themes?.[char.theme] || themes?.[Object.keys(themes || {})[0]] || {};
  const hp    = char.hp || { current:0, max:1 };
  const pct   = Math.min(100, (hp.current / Math.max(1, hp.max)) * 100);
  const hpC   = pct > 50 ? theme.success : pct > 25 ? "#f39c12" : theme.danger;
  const label = char.subclass ? `${char.class} (${char.subclass})` : char.class;

  return (
    <div onClick={onClick} style={{ background:theme.card, border:`1px solid ${theme.border}`, borderRadius:14, padding:20, cursor:"pointer", transition:"all 0.22s", position:"relative", overflow:"hidden" }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = theme.accent; e.currentTarget.style.transform = "translateY(-3px)"; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = theme.border; e.currentTarget.style.transform = "translateY(0)"; }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:3, background:`linear-gradient(90deg,${theme.accent},${theme.accentSecondary || theme.accent})` }} />
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
        <div>
          <div style={{ fontFamily:theme.fontDisplay, color:theme.accent, fontSize:20, lineHeight:1.2 }}>{char.name}</div>
          <div style={{ fontSize:13, color:theme.textMuted, marginTop:4 }}>
            <span style={{ color:theme.text }}>{char.species}</span>
            {char.species && label ? " · " : ""}<span>{label}</span>
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontFamily:theme.fontDisplay, color:theme.accent, fontSize:28 }}>{char.level}</div>
          <div style={{ fontSize:10, color:theme.textMuted, textTransform:"uppercase", letterSpacing:1 }}>Level</div>
        </div>
      </div>
      <div style={{ marginBottom:12 }}>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:theme.textMuted, marginBottom:4 }}>

// MYSTIC BACKGROUND — floating runes / symbols, subtle glows
// Renders fixed behind everything, pointer-events:none
// ============================================================
const SYMBOLS = [
  // Musical / bardic
  "♩","♪","♫","♬",
  // Celestial / holy
  "✦","✧","★","☆","✴","⊕",
  // Runic / magical
  "ᛏ","ᚨ","ᛉ","ᚱ","ᛊ","ᛗ","ᛟ","ᚷ","ᛒ","ᚦ",
  // Arcane
  "⊗","⊙","◈","⬡","⬟","⌘",
  // Geometric / holy
  "△","▽","◇","⬦","✩","⁕",
];

function MysticBackground({ density = "normal", symbolSet, symbolOpacity }) {
  const count  = density === "subtle" ? 12 : density === "off" ? 0 : 20;
  const pool   = symbolSet?.length > 0 ? symbolSet : SYMBOLS;
  const opMul  = symbolOpacity !== undefined ? symbolOpacity : 1;
  const symbols = React.useMemo(() => {
    if (count === 0) return [];
    return Array.from({ length: count }, (_, i) => {
      const left     = (i * 97 + 11) % 100;
      const startTop = 100 + (i * 37) % 40;
      const delay    = (i * 3.7) % 20;
      const dur      = 18 + (i * 4.1) % 22;
      const size     = 12 + (i * 7) % 18;
      const sym      = pool[i % pool.length];
      const anim     = i % 2 === 0 ? "floatUp" : "floatUpSway";
      const baseA    = [0.28, 0.22, 0.20, 0.22, 0.15];
      const colours  = [
        `rgba(201,162,39,${(baseA[0]*opMul).toFixed(2)})`,
        `rgba(180,130,255,${(baseA[1]*opMul).toFixed(2)})`,
        `rgba(120,180,255,${(baseA[2]*opMul).toFixed(2)})`,
        `rgba(255,245,210,${(baseA[3]*opMul).toFixed(2)})`,
        `rgba(255,255,255,${(baseA[4]*opMul).toFixed(2)})`,
      ];
      const colour = colours[i % colours.length];
      return { sym, left, startTop, delay, dur, size, colour, anim, id: i };
    });
  }, [count, pool.join(""), opMul]);

  return (
    <>
      <div className="bg-glow-tl"/>
      <div className="bg-glow-br"/>
      <div className="bg-glow-center"/>
      {symbols.map(s => (
        <span
          key={s.id}
          className="mystic-symbol"
          style={{
            left:      `${s.left}%`,
            top:       `${s.startTop}vh`,
            fontSize:  `${s.size}px`,
            color:     s.colour,
            animation: `${s.anim} ${s.dur}s linear ${s.delay}s infinite`,
          }}>
          {s.sym}
        </span>
      ))}
    </>
  );
}

function AccountModal({ session, onClose }) {
  const [tab,         setTab]         = useState("password");
  const [newEmail,    setNewEmail]     = useState("");
  const [newPassword, setNewPassword]  = useState("");
  const [confirm,     setConfirm]      = useState("");
  const [deleteWord,  setDeleteWord]   = useState("");
  const [loading,     setLoading]      = useState(false);
  const [msg,         setMsg]          = useState(null);  // { type: "ok"|"err", text }

  const flash = (type, text) => { setMsg({ type, text }); setTimeout(() => setMsg(null), 4000); };

  const changeEmail = async () => {
    if (!newEmail) return;
    setLoading(true);
    const { error } = await sb.auth.updateUser({ email: newEmail });
    setLoading(false);
    if (error) flash("err", error.message);
    else { flash("ok", "Confirmation sent to both addresses. Check your inbox."); setNewEmail(""); }
  };

  const changePassword = async () => {
    if (!newPassword) return;
    if (newPassword !== confirm) { flash("err", "Passwords don't match."); return; }
    if (newPassword.length < 8)  { flash("err", "Password must be at least 8 characters."); return; }
    setLoading(true);
    const { error } = await sb.auth.updateUser({ password: newPassword });
    setLoading(false);
    if (error) flash("err", error.message);
    else { flash("ok", "Password updated."); setNewPassword(""); setConfirm(""); }
  };

  const deleteAccount = async () => {
    if (deleteWord !== "DELETE") { flash("err", 'Type DELETE (all caps) to confirm.'); return; }
    setLoading(true);
    // Delete all characters first, then the user via admin API isn't available client-side —
    // so we sign out and call a Supabase edge function or just delete chars and inform user
    await sb.from("characters").delete().eq("user_id", session.user.id);
    // Supabase doesn't allow client-side user deletion — sign out and show instructions
    await signOut();
    setLoading(false);
  };

  const inp = { width:"100%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(201,162,39,0.2)", color:"#e8e0d0", padding:"10px 14px", borderRadius:7, fontSize:14, fontFamily:"'Crimson Pro',serif", boxSizing:"border-box", marginBottom:10 };

  const btn = (danger) => ({ width:"100%", padding:"11px", borderRadius:7, cursor:loading?"not-allowed":"pointer", fontSize:14, fontFamily:"'Cinzel Decorative',serif", letterSpacing:0.5, border:`1px solid ${danger?"#c0392b":"#c9a227"}`, background:danger?"rgba(192,57,43,0.12)":"rgba(201,162,39,0.1)", color:danger?"#e74c3c":"#c9a227", opacity:loading?0.6:1 });

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center" }}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:"#1a1a1f", border:"1px solid rgba(201,162,39,0.25)", borderRadius:14, padding:28, maxWidth:420, width:"90%", boxShadow:"0 8px 48px rgba(0,0,0,0.7)" }}>
        {/* Header */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
          <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"#c9a227", fontSize:15 }}>Account Settings</div>
          <button onClick={onClose} style={{ background:"transparent", border:"none", color:"#554f45", cursor:"pointer", fontSize:20, lineHeight:1 }}>×</button>
        </div>

        <div style={{ fontSize:12, color:"#554f45", marginBottom:16, fontStyle:"italic" }}>Logged in as {session.user.email}</div>

        {/* Tab selector */}
        <div style={{ display:"flex", gap:8, marginBottom:20 }}>
          <button style={tabBtn("password")} onClick={()=>{setTab("password");setMsg(null);}}>Password</button>
          <button style={tabBtn("email")}    onClick={()=>{setTab("email");setMsg(null);}}>Email</button>
          <button style={tabBtn("delete")}   onClick={()=>{setTab("delete");setMsg(null);}}>Delete</button>
        </div>

        {/* Feedback */}
        {msg && (
          <div style={{ padding:"9px 14px", borderRadius:7, marginBottom:14, fontSize:13,
            background: msg.type==="ok" ? "rgba(39,174,96,0.12)" : "rgba(192,57,43,0.12)",
            border: `1px solid ${msg.type==="ok" ? "#27ae60" : "#c0392b"}`,
            color: msg.type==="ok" ? "#27ae60" : "#e74c3c" }}>
            {msg.text}

        )}

        {/* Change password */}
        {tab === "password" && (
          <div>
            <input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)}
              placeholder="New password (min 8 characters)" style={inp}/>
            <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)}
              placeholder="Confirm new password" style={inp}
              onKeyDown={e=>e.key==="Enter"&&changePassword()}/>
            <button onClick={changePassword} style={btn(false)} disabled={loading}>
              {loading ? "Updating…" : "Change Password"}

          </div>

        {/* Change email */}
        {tab === "email" && (
          <div>
            <div style={{ fontSize:13, color:"#8a8070", marginBottom:12, lineHeight:1.6 }}>

              onKeyDown={e=>e.key==="Enter"&&deleteAccount()}/>

            </button>
            <div style={{ fontSize:11, color:"#554f45", marginTop:10, textAlign:"center" }}>
              Note: you will be signed out immediately.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {

  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState(null);
  const [msg,      setMsg]      = useState(null);

  const submit = async () => {
    if (!email || !password) { setError("Please enter your email and password."); return; }
    setLoading(true); setError(null); setMsg(null);
    try {
      const { error: err } = mode === "login" ? await signIn(email, password) : await signUp(email, password);
      if (err) { setError(err.message); }

  const inp = { width:"100%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(201,162,39,0.25)", color:"#e8e0d0", padding:"12px 16px", borderRadius:8, fontSize:15, fontFamily:"'Crimson Pro',serif", boxSizing:"border-box", marginBottom:12 };

      <div style={{ position:"relative", zIndex:1, width:"100%", maxWidth:420, padding:"0 24px" }}>
        {/* Title */}
        <div style={{ textAlign:"center", marginBottom:36 }}>
          <div className="tome-title-text" style={{ fontFamily:"'Cinzel Decorative',serif", fontSize:36, letterSpacing:3, marginBottom:8 }}>⚔️ TOME OF HEROES</div>
          <div style={{ color:"#8a8070", fontSize:14, fontStyle:"italic" }}>Your personal D&D 5e character compendium</div>

            <span style={{ color:"rgba(201,162,39,0.4)", fontSize:14 }}>✦</span>

        {/* Card */}
        <div style={{ background:"rgba(26,26,31,0.92)", border:"1px solid rgba(201,162,39,0.2)", borderRadius:14, padding:32, backdropFilter:"blur(8px)", boxShadow:"0 8px 48px rgba(0,0,0,0.6)" }}>
          <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"#c9a227", fontSize:16, textAlign:"center", marginBottom:24 }}>

          {error && <div style={{ background:"rgba(192,57,43,0.15)", border:"1px solid #c0392b", borderRadius:7, padding:"10px 14px", marginBottom:14, fontSize:13, color:"#e74c3c" }}>{error}</div>}

function App() {
  const { data:gameData, error } = useGameData();
  const [session,    setSession]    = useState(undefined); // undefined = checking, null = logged out
  const [characters, setCharacters] = useState([]);
  const [view,       setView]       = useState("home");
  const [selId,      setSelId]      = useState(null);
  const [charLoading,setCharLoading]= useState(false);
  const [showAccount, setShowAccount] = useState(false);

  // ── Auth state listener ──
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, sess) => {
      setSession(sess);
      if (!sess) { setCharacters([]); setView("home"); }
    });
    return () => subscription.unsubscribe();
  }, []);

  // ── Load characters when session appears ──
  useEffect(() => {
    if (!session) return;
    setCharLoading(true);
    dbLoadChars().then(chars => {
      setCharacters(chars);
      // Migrate any local chars on first login (offer once)
      const local = loadChars();
      if (local.length > 0 && chars.length === 0) {
        Promise.all(local.map(c => dbSaveChar(c))).then(() => {
          saveChars([]); // clear local after migration
        });
        setCharacters(local);
      }
    }).finally(() => setCharLoading(false));
  }, [session?.user?.id]);

  // ── Loading states ──
  if (session === undefined || (!gameData && !error)) return (
    <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0", fontFamily:"serif" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"#c9a227", fontSize:28, marginBottom:12 }}>⚔️ Tome of Heroes</div>
        <div style={{ color:"#8a8070" }}>Loading…</div>
      </div>
    </div>
  );

  if (error) return (
    <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0", fontFamily:"serif" }}>
      <div style={{ textAlign:"center", maxWidth:560, padding:32 }}>
        <div style={{ fontSize:48, marginBottom:16 }}>⚠️</div>
        <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"#c9a227", fontSize:22, marginBottom:12 }}>Could Not Load Game Data</div>
        <div style={{ background:"#1a0a0a", border:"1px solid #5a1a1a", borderRadius:8, padding:16, marginBottom:20, fontSize:13, color:"#c0392b", textAlign:"left", fontFamily:"monospace", wordBreak:"break-all" }}>{error}</div>
        <div style={{ color:"#8a8070", fontSize:14, lineHeight:1.8 }}>
          Make sure <strong style={{ color:"#c9a227" }}>tome-data.json</strong> is in the same folder and you are using a local server.<br />
          Quick server: <code style={{ color:"#c9a227" }}>python -m http.server 8000</code><br />
          Then visit: <code style={{ color:"#c9a227" }}>http://localhost:8000</code>
        </div>
      </div>
    </div>
  );

  // ── Not logged in ──
  if (!session) return <LoginScreen onLogin={() => {}} />;

  // ── Save / delete ──
  const saveChar = async char => {
    const list = characters.find(c => c.id === char.id)
      ? characters.map(c => c.id === char.id ? char : c)
      : [...characters, char];
    setCharacters(list);
    saveChars(list); // local backup
    await dbSaveChar(char);
    setSelId(char.id); setView("sheet");
  };

  const delChar = async id => {
    const list = characters.filter(c => c.id !== id);
    setCharacters(list);
    saveChars(list);
    await dbDeleteChar(id);
    setView("home");
  };

  // Also wire upd in CharacterSheet to cloud-save — handled via saveChar above for full saves.
  // For live edits (HP, spells etc) we piggyback on the debounced local save + push to cloud.

    const list = characters.map(c => c.id === char.id ? char : c);
    setCharacters(list);
    saveChars(list);
    await dbSaveChar(char);
  };

  if (view === "create") return <CharacterCreationWizard gameData={gameData} onSave={saveChar} onCancel={() => setView("home")} />;
  if (view === "edit" && selChar) return <CharacterCreationWizard gameData={gameData} onSave={saveChar} onCancel={() => setView("sheet")} editChar={selChar} />;
  if (view === "sheet" && selChar) return <CharacterSheet char={selChar} gameData={gameData} onBack={() => setView("home")} onDelete={delChar} onEdit={() => setView("edit")} cloudSync={cloudSyncChar} />;

      `}</style>
      <div style={{ background: `radial-gradient(ellipse at 20% 10%, rgba(70,30,120,0.28) 0%, transparent 55%), radial-gradient(ellipse at 80% 90%, rgba(100,60,20,0.22) 0%, transparent 55%), ${dt.bg || "#0d0d0f"}`, minHeight:"100vh", fontFamily:dt.fontBody || "serif", color:dt.text || "#e8e0d0", position:"relative", overflow:"hidden" }}>

        {/* Floating runes + glow pools */}
        <MysticBackground density="normal"/>

        {/* Hero banner */}
        <div style={{ position:"relative", zIndex:1, borderBottom:`1px solid rgba(201,162,39,0.18)`, padding:"52px 24px 40px", textAlign:"center", overflow:"hidden",
          background:"linear-gradient(180deg, rgba(40,15,80,0.45) 0%, rgba(20,10,40,0.25) 60%, transparent 100%)" }}>

          {/* User info + account + logout — top right */}
          <div style={{ position:"absolute", top:16, right:20, display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ fontSize:12, color:dt.textMuted || "#8a8070" }}>{session.user.email}</span>
            <button onClick={()=>setShowAccount(true)} style={{ padding:"5px 12px", borderRadius:6, border:"1px solid rgba(201,162,39,0.3)", background:"transparent", color:"#c9a227", cursor:"pointer", fontSize:12, fontFamily:dt.fontBody||"serif" }}>Account</button>
            <button onClick={()=>signOut()} style={{ padding:"5px 12px", borderRadius:6, border:"1px solid rgba(255,255,255,0.15)", background:"transparent", color:dt.textMuted||"#8a8070", cursor:"pointer", fontSize:12, fontFamily:dt.fontBody||"serif" }}>Log out</button>
          </div>

          <div style={{ position:"absolute", inset:0, background:"radial-gradient(ellipse at 50% 0%, rgba(201,162,39,0.12) 0%, transparent 65%)", animation:"heroGlow 4s ease-in-out infinite", pointerEvents:"none" }}/>

          <button onClick={() => setView("create")} style={{
            padding:"14px 40px", border:"1px solid rgba(201,162,39,0.5)", color:dt.bg || "#0d0d0f",
            borderRadius:10, cursor:"pointer", fontFamily:dt.fontDisplay, fontSize:15, letterSpacing:1.5, position:"relative",
            background:"linear-gradient(135deg, #c9a227 0%, #e8c84a 40%, #c9a227 70%, #8b6914 100%)",
            boxShadow:"0 4px 24px rgba(201,162,39,0.35), 0 0 60px rgba(201,162,39,0.08)", transition:"all 0.25s"
          }}
            onMouseEnter={e => { e.currentTarget.style.transform="scale(1.05)"; e.currentTarget.style.boxShadow="0 6px 32px rgba(201,162,39,0.5), 0 0 80px rgba(201,162,39,0.12)"; }}
            onMouseLeave={e => { e.currentTarget.style.transform="scale(1)";   e.currentTarget.style.boxShadow="0 4px 24px rgba(201,162,39,0.35), 0 0 60px rgba(201,162,39,0.08)"; }}>
            + Create New Character
          </button>

          {/* Bottom ornamental line */}
          <div style={{ position:"absolute", bottom:0, left:"10%", right:"10%", height:1, background:"linear-gradient(90deg, transparent, rgba(201,162,39,0.25), transparent)" }}/>
        </div>

        {/* Character grid */}
        <div style={{ maxWidth:1100, margin:"0 auto", padding:"36px 24px", position:"relative", zIndex:1 }}>
          {characters.length === 0 ? (
            <div style={{ textAlign:"center", padding:"80px 20px" }}>
              <div style={{ fontSize:72, marginBottom:18, filter:"drop-shadow(0 0 20px rgba(201,162,39,0.3))" }}>📖</div>
              <div style={{ fontFamily:dt.fontDisplay, fontSize:24, color:dt.textMuted, marginBottom:10, letterSpacing:1 }}>The tome is empty</div>
              <div style={{ color:dt.textDim, fontSize:15, fontStyle:"italic" }}>Create your first character to begin your adventure</div>
            </div>
          ) : (
            <>
              <div style={{ fontFamily:dt.fontDisplay, color:dt.textMuted, fontSize:11, textTransform:"uppercase", letterSpacing:3, marginBottom:20 }}>
                {characters.length} {characters.length === 1 ? "Hero" : "Heroes"} Registered
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))", gap:18 }}>
                {characters.map(c => <CharacterCard key={c.id} char={c} gameData={gameData} onClick={() => { setSelId(c.id); setView("sheet"); }} />)}
              </div>
            </>
          )}
        </div>

        <div style={{ position:"relative", zIndex:1, textAlign:"center", padding:24, borderTop:`1px solid rgba(201,162,39,0.12)`, color:dt.textDim, fontSize:12, fontStyle:"italic" }}>
          <span style={{ color:"rgba(201,162,39,0.3)", marginRight:8 }}>✦</span>
          Tome of Heroes • Edit <strong style={{ color:dt.textMuted }}>tome-data.json</strong> to customise species, classes, spells, themes &amp; more
          <span style={{ color:"rgba(201,162,39,0.3)", marginLeft:8 }}>✦</span>
        </div>
      </div>
      {/* AccountModal rendered at root level so it's above all stacking contexts */}
      {showAccount && <AccountModal session={session} onClose={()=>setShowAccount(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
