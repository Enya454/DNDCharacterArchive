                    <div style={{ display:"flex", flexWrap:"wrap", gap:5, maxHeight:180, overflowY:"auto" }}>
                      {sub.options.map(opt => {
                        const isPicked = picked.includes(opt);
                        const canPick  = isPicked || picked.length < sub.count;
                        return (
                          <div key={opt} onClick={() => canPick && toggle(opt)}
                            style={{ padding:"3px 10px", borderRadius:16, cursor:canPick?"pointer":"not-allowed",
                              fontSize:12, transition:"all 0.15s",
                              border:`1px solid ${isPicked?"var(--accent)":"var(--border)"}`,
                              background:isPicked?"rgba(var(--accent-rgb,201,162,39),0.15)":"var(--surface)",
                              color:isPicked?"var(--accent)":canPick?"var(--text)":"var(--text-dim)",
                              opacity:!canPick&&!isPicked?0.45:1 }}>
                            {isPicked?"✓ ":""}{opt}
                          </div>
                        );
                      })}
                    </div>
                    {picked.length > 0 && (
                      <div style={{ marginTop:8, fontSize:12, color:"var(--accent)" }}>
                        Selected: {picked.join(", ")}
                      </div>
                    )}
                  </div>
                );
              })()}

              {/* Pact of the Tome — choose 3 cantrips from any class */}
              {feature.name === "Pact Boon" && chosen?.includes("Tome") && (() => {
                const allCantrips = (gameData?.spells || []).filter(s => s.level === 0);
                const tomeKey = "pact_tome_cantrips";
                const tomeCantrips = (choices?.[tomeKey] || []);
                const maxTome = 3;
                const toggleTome = spell => {
                  const isIn = tomeCantrips.includes(spell.name);
                  const next = isIn
                    ? tomeCantrips.filter(n => n !== spell.name)
                    : tomeCantrips.length < maxTome ? [...tomeCantrips, spell.name] : tomeCantrips;
                  onChoice && onChoice(tomeKey, next);
                };
                return (
                  <div style={{ marginTop:14, padding:"12px 14px", background:"rgba(0,0,0,0.2)", border:"1px solid var(--accent2)", borderRadius:8 }}>
                    <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13, marginBottom:8 }}>
                      Pact of the Tome — Choose 3 Cantrips ({tomeCantrips.length}/{maxTome})
                    </div>
                    <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:10 }}>
                      Your Book of Shadows contains 3 cantrips from any class's spell list. They count as Warlock cantrips for you.
                    </div>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6, maxHeight:200, overflowY:"auto" }}>
                      {allCantrips.map(spell => {
                        const isPicked = tomeCantrips.includes(spell.name);
                        const canPick = isPicked || tomeCantrips.length < maxTome;
                        return (
                          <div key={spell.name} onClick={() => canPick && toggleTome(spell)}
                            style={{ padding:"4px 10px", borderRadius:16, cursor:canPick?"pointer":"not-allowed",
                              fontSize:12, transition:"all 0.15s",
                              border:`1px solid ${isPicked?"var(--accent)":"var(--border)"}`,
                              background:isPicked?"rgba(var(--accent-rgb,201,162,39),0.15)":"var(--surface)",
                              color:isPicked?"var(--accent)":canPick?"var(--text)":"var(--text-dim)",
                              opacity:!canPick&&!isPicked?0.5:1 }}>
                            {isPicked?"✓ ":""}{spell.name}
                            <span style={{fontSize:10,color:"var(--text-dim)",marginLeft:5}}>{spell.school}</span>
                          </div>
                        );
                      })}
                    </div>
                    {tomeCantrips.length > 0 && (
                      <div style={{ marginTop:8, fontSize:12, color:"var(--accent)" }}>
                        Selected: {tomeCantrips.join(", ")}
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>
            );
          })()}

          {/* Subclass choice */}
          {!locked && feature.type === "subclass_choice" && subclasses && (
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:8 }}>
              {Object.entries(subclasses).map(([sc, scData]) => (
                <div key={sc} onClick={() => onSubclassChoice(sc)} style={{
                  padding:"10px 14px", borderRadius:8, cursor:"pointer", fontSize:13, transition:"all 0.15s",
                  border:`1px solid ${subclass === sc ? "var(--accent)" : "var(--border)"}`,
                  background: subclass === sc ? "rgba(201,162,39,0.1)" : "var(--surface)",
                  color: subclass === sc ? "var(--accent)" : "var(--text)"
                }}>
                  {subclass === sc && "✓ "}{sc}
                  {scData?.features?.[0] && <div style={{ fontSize:11, color:"var(--text-muted)", marginTop:3 }}>{scData.features[0].name}…</div>}
                  {scData?.source && <div style={{ marginTop:5 }}><SourceBadge source={scData.source}/></div>}
                </div>
              ))}
            </div>
          )}

          {/* Skill proficiency picker */}
          {!locked && feature.type === "proficiency_choice" && (
            <SkillPicker title="Skill proficiencies" count={feature.count}
              from={feature.from} allSkills={allSkills}
              current={skillProfs} onToggle={onSkillToggle}
              skillSources={skillSources} thisSource={thisSource}
              ownedByThis={skillSources && thisSource
                ? Object.entries(skillSources).filter(([,s]) => s === thisSource).map(([sk]) => sk)
                : undefined} />
          )}

          {/* Expertise — only shows currently proficient skills, fixing the stale-state bug */}
          {!locked && feature.type === "expertise_choice" && (
            <div>
              <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
                Choose <strong style={{ color:"var(--accent)" }}>{feature.count}</strong> proficient skills for expertise (×2 prof bonus).
                {(expertiseProfs||[]).length >= feature.count && <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>}
              </div>
              {(skillProfs||[]).length === 0
                ? <p style={{ fontSize:12, color:"var(--text-dim)" }}>Select skill proficiencies first.</p>
                : <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:6 }}>
                    {(skillProfs||[]).map(skill => {
                      const isSel = (expertiseProfs||[]).includes(skill);
                      const canAdd = isSel || (expertiseProfs||[]).length < feature.count;
                      return (
                        <div key={skill} onClick={() => canAdd && onExpertiseToggle(skill)} style={{
                          display:"flex", alignItems:"center", gap:8, padding:"7px 12px", borderRadius:6,
                          cursor: canAdd ? "pointer" : "not-allowed", transition:"all 0.15s",
                          background: isSel ? "rgba(var(--accent-rgb,201,162,39),0.12)" : "var(--surface)",
                          border:`1px solid ${isSel ? "var(--accent)" : "var(--border)"}`,
                          opacity: !canAdd ? 0.4 : 1
                        }}>
                          <span style={{ width:12, height:12, borderRadius:0, transform:"rotate(45deg)", flexShrink:0, display:"inline-block",
                            background: isSel ? "var(--accent)" : "transparent",
                            border:`2px solid ${isSel ? "var(--accent)" : "var(--border)"}` }}/>
                          <span style={{ fontSize:13 }}>{skill} ×2</span>
                        </div>
                      );
                    })}
                  </div>
              }
            </div>
          )}

          {/* Language choice */}
          {!locked && feature.type === "language_choice" && (() => {
            const autoLangs = autoLanguages || [];
            const sources   = languageSources || {};
            const mySource  = thisLanguageSource || "";

            // Languages this source has chosen
            const myChosen = (languages || []).filter(l => sources[l] === mySource && !autoLangs.includes(l));
            // Languages chosen by OTHER sources (shown as taken but not mine to deselect)
            const otherChosen = (languages || []).filter(l => sources[l] && sources[l] !== mySource && !autoLangs.includes(l));
            // Languages that were picked by me but are now auto-granted (slot freed)
            const coveredBySpecies = myChosen.filter(l => autoLangs.includes(l)); // shouldn't happen but safety

            const remaining = feature.count - myChosen.length;
            const isComplete = remaining <= 0;

            return (
              <div>
                <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
                  Choose <strong style={{ color:"var(--accent)" }}>{feature.count}</strong> language(s) for <em>{mySource}</em>.
                  {isComplete
                    ? <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>
                    : <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({remaining} remaining)</span>}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:6 }}>
                  {(languageList || []).slice().sort().map(lang => {
                    const isAuto    = autoLangs.includes(lang);
                    const isMine    = myChosen.includes(lang);
                    const isOthers  = otherChosen.includes(lang);
                    // Can add if: not auto, not taken by another source, (mine already OR have remaining slots)
                    const canAdd    = !isAuto && !isOthers && (isMine || remaining > 0);
                    return (
                      <div key={lang} onClick={() => !isAuto && !isOthers && canAdd && onLanguageChoice(lang)} style={{
                        padding:"6px 10px", borderRadius:6, fontSize:13, transition:"all 0.15s",
                        cursor: isAuto || isOthers ? "default" : canAdd ? "pointer" : "not-allowed",
                        background: isAuto
                          ? "rgba(100,100,200,0.12)"
                          : isMine
                            ? "rgba(var(--accent-rgb,201,162,39),0.08)"
                            : isOthers
                              ? "rgba(100,100,100,0.08)"
                              : "var(--surface)",
                        border:`1px solid ${isAuto ? "var(--info)" : isMine ? "var(--accent)" : isOthers ? "var(--border)" : "var(--border)"}`,
                        opacity: (!isAuto && !isMine && (!canAdd || isOthers)) ? 0.4 : 1,
                        display:"flex", alignItems:"center", justifyContent:"space-between", gap:4
                      }}>
                        <span>{isAuto ? "🔒 " : isMine ? "✓ " : ""}{lang}</span>
                        {isAuto   && <span style={{ fontSize:10, color:"var(--info)" }}>species</span>}
                        {isOthers && <span style={{ fontSize:10, color:"var(--text-dim)" }}>{sources[lang]}</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}

          {/* ASI — +2 to one ability or +1/+1 to two, capped at 20 */}
          {/* asi rendered inside the feat-or-ASI block below */}

          {/* asi_points — species flexible bonus e.g. Half-Elf +1/+1, stackable */}
          {!locked && feature.type === "asi_points" && (() => {
            const totalPts  = feature.points || 2;
            const flexible  = feature.mode === "flexible"; // allows +2 to one, +1 to others
            const asi       = asiChoices?.[feature.name] || {};
            const spent     = Object.values(asi).reduce((s,v)=>s+(v||0),0);
            const rem       = totalPts - spent;
            const excluded  = feature.exclude || [];
            return (
              <div>
                <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:12 }}>
                  {flexible
                    ? <>Increase one score by <strong style={{ color:"var(--accent)" }}>2</strong> and another by <strong style={{ color:"var(--accent)" }}>1</strong>, or three different scores by <strong style={{ color:"var(--accent)" }}>1</strong> each.</>
                    : <>Spend <strong style={{ color:"var(--accent)" }}>{totalPts} point{totalPts>1?"s":""}</strong> — one point per ability across {totalPts} different abilities{excluded.length?` (not ${excluded.map(ab=>ABILITY_SHORT[ab]).join(", ")})`:""}</>
                  }
                  {rem > 0 ? <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({rem} point{rem>1?"s":""} left)</span>
                           : <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
                  {Object.keys(ABILITY_NAMES).filter(ab => !excluded.includes(ab)).map(ab => {
                    const base  = currentAbilities?.[ab] || 10;
                    const bonus = asi[ab] || 0;
                    const total = base + bonus;
                    // Flexible: max 2 per ability; standard: max 1 per ability
                    const maxBonus = flexible ? 2 : 1;
                    const atMax    = bonus >= maxBonus;
                    // In flexible mode: can't put +2 on a second ability if another already has +2
                    const someHasTwo = flexible && Object.values(asi).some(v => v >= 2);
                    const canAdd = rem > 0 && (!atMax) && !(flexible && bonus >= 1 && someHasTwo && bonus < 2);
                    return (
                      <div key={ab} style={{ padding:10, borderRadius:8, textAlign:"center",
                        background:"var(--surface)", border:`1px solid ${bonus>0?"var(--accent)":"var(--border)"}` }}>
                        <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{ABILITY_SHORT[ab]}</div>
                        <div style={{ fontSize:18, fontFamily:"var(--font-display)", color:bonus>0?"var(--accent)":"var(--text)" }}>
                          {total}{bonus>0&&<span style={{ fontSize:12 }}> (+{bonus})</span>}
                        </div>
                        <div style={{ display:"flex", gap:4, justifyContent:"center", marginTop:6 }}>
                          <button onClick={() => { if(bonus<=0)return; onAsiChange(feature.name,{...asi,[ab]:bonus-1}); }}
                            style={{ width:24,height:24,borderRadius:4,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",cursor:bonus>0?"pointer":"not-allowed",fontSize:14,opacity:bonus>0?1:0.3,lineHeight:1 }}>−</button>
                          <button onClick={() => { if(!canAdd)return; onAsiChange(feature.name,{...asi,[ab]:bonus+1}); }}
                            style={{ width:24,height:24,borderRadius:4,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",cursor:canAdd?"pointer":"not-allowed",fontSize:14,opacity:canAdd?1:0.3,lineHeight:1 }}>+</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}

          {/* spell_grant — racial spells auto-granted at certain levels */}

          {/* ── Ancestral Legacy (Dhampir) — pick another race to inherit skill profs ── */}
          {!locked && feature.type === "ancestral_legacy" && (() => {
            const stored    = choices?.[feature.name] || {};
            const chosenRace = stored.race || null;
            const standalone = stored.standalone || false;
            const allSpecies = Object.entries(gameData?.species || {}).filter(([name]) => name !== "Dhampir");

            const setLegacy = patch => onChoice && onChoice(feature.name, { ...stored, ...patch });

            // Get skill proficiency features from the chosen ancestral race
            const ancestralSpecies = chosenRace ? gameData?.species?.[chosenRace] : null;
            const ancestralSkillFeat = (ancestralSpecies?.features || []).find(f =>
              f.type === "proficiency_choice"
            );

            return (
              <div>
                {/* Mode selector */}
                <div style={{ display:"flex", gap:8, marginBottom:12 }}>
                  <div onClick={()=>setLegacy({standalone:false, race:null})}
                    style={{ flex:1, padding:"8px 10px", borderRadius:8, cursor:"pointer", textAlign:"center",
                      border:`1px solid ${!standalone?"var(--accent)":"var(--border)"}`,
                      background:!standalone?"rgba(var(--accent-rgb,201,162,39),0.1)":"var(--surface)",
                      fontSize:13, color:!standalone?"var(--accent)":"var(--text-muted)", transition:"all 0.15s" }}>
                    🧬 Inherit from a race
                  </div>
                  <div onClick={()=>setLegacy({standalone:true, race:null})}
                    style={{ flex:1, padding:"8px 10px", borderRadius:8, cursor:"pointer", textAlign:"center",
                      border:`1px solid ${standalone?"var(--accent)":"var(--border)"}`,
                      background:standalone?"rgba(var(--accent-rgb,201,162,39),0.1)":"var(--surface)",
                      fontSize:13, color:standalone?"var(--accent)":"var(--text-muted)", transition:"all 0.15s" }}>
                    ✦ Standalone (2 free skills)
                  </div>
                </div>

                {!standalone && (<>
                  <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:8 }}>
                    Choose which race's heritage your Dhampir lineage replaces:
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))", gap:6, marginBottom:12 }}>
                    {allSpecies.map(([name, sp]) => (
                      <div key={name} onClick={()=>setLegacy({race:name, standalone:false})}
                        style={{ padding:"7px 10px", borderRadius:7, cursor:"pointer", fontSize:13,
                          border:`1px solid ${chosenRace===name?"var(--accent)":"var(--border)"}`,
                          background:chosenRace===name?"rgba(var(--accent-rgb,201,162,39),0.1)":"var(--surface)",
                          color:chosenRace===name?"var(--accent)":"var(--text)", transition:"all 0.15s" }}>
                        {chosenRace===name && "✓ "}{name}
                      </div>
                    ))}
                  </div>

                  {/* Show inherited skill proficiency picker if the chosen race has one */}
                  {chosenRace && ancestralSkillFeat && (
                    <div style={{ padding:"10px 12px", background:"rgba(0,0,0,0.15)", borderRadius:8,
                      border:"1px solid var(--border)", marginBottom:8 }}>
                      <div style={{ fontSize:12, color:"var(--accent)", marginBottom:8, fontFamily:"var(--font-display)" }}>
                        Inherited from {chosenRace} — choose {ancestralSkillFeat.count} skill{ancestralSkillFeat.count!==1?"s":""}
                      </div>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                        {(ancestralSkillFeat.from === "all" ? Object.keys(SKILLS_MAP).sort() : (ancestralSkillFeat.from||[])).map(skill => {
                          const key    = "Ancestral Legacy Skills";
                          const picked = choices?.[key] || [];
                          const max    = ancestralSkillFeat.count || 2;
                          const isChosen = picked.includes(skill);
                          const canPick  = isChosen || picked.length < max;
                          return (
                            <div key={skill} onClick={() => {
                              if (!canPick && !isChosen) return;
                              const next = isChosen ? picked.filter(s=>s!==skill) : [...picked, skill];
                              onChoice && onChoice(key, next);
                            }} style={{ padding:"4px 10px", borderRadius:16, cursor:canPick||isChosen?"pointer":"not-allowed",
                              fontSize:12, transition:"all 0.15s",
                              border:`1px solid ${isChosen?"var(--accent)":"var(--border)"}`,
                              background:isChosen?"rgba(var(--accent-rgb,201,162,39),0.15)":"var(--surface)",
                              color:isChosen?"var(--accent)":canPick?"var(--text)":"var(--text-dim)",
                              opacity:!canPick&&!isChosen?0.45:1 }}>
                              {isChosen?"✓ ":""}{skill}
                            </div>
                          );
                        })}
                      </div>
                      {(() => { const p = choices?.["Ancestral Legacy Skills"]||[]; return p.length > 0 && (
                        <div style={{ fontSize:12, color:"var(--accent)", marginTop:8 }}>Selected: {p.join(", ")} ({p.length}/{ancestralSkillFeat.count||2})</div>
                      ); })()}
                      {(ancestralSpecies?.speed > 30 || ancestralSpecies?.climbSpeed || ancestralSpecies?.swimSpeed || ancestralSpecies?.flySpeed) && (
                        <div style={{ fontSize:12, color:"var(--text-muted)", marginTop:8 }}>
                          Also inherits:
                          {ancestralSpecies?.speed > 30 && <span style={{ marginLeft:6 }}>🏃 Speed {ancestralSpecies.speed}ft</span>}
                          {ancestralSpecies?.climbSpeed && <span style={{ marginLeft:6 }}>🧗 Climb {ancestralSpecies.climbSpeed}ft</span>}
                          {ancestralSpecies?.swimSpeed && <span style={{ marginLeft:6 }}>🏊 Swim {ancestralSpecies.swimSpeed}ft</span>}
                          {ancestralSpecies?.flySpeed && <span style={{ marginLeft:6 }}>🦅 Fly {ancestralSpecies.flySpeed}ft</span>}
                        </div>
                      )}
                    </div>
                  )}

                  {chosenRace && !ancestralSkillFeat && (
                    <div style={{ fontSize:12, color:"var(--text-muted)", padding:"8px 10px",
                      background:"rgba(0,0,0,0.1)", borderRadius:7, border:"1px solid var(--border)" }}>
                      {chosenRace} has no skill proficiency choices to inherit. You still gain any special movement speeds.
                    </div>
                  )}
                </>)}

                {standalone && (
                  <div style={{ padding:"10px 12px", background:"rgba(0,0,0,0.15)", borderRadius:8,
                    border:"1px solid var(--border)" }}>
                    <div style={{ fontSize:12, color:"var(--accent)", marginBottom:8, fontFamily:"var(--font-display)" }}>
                      Choose 2 skill proficiencies
                    </div>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                      {Object.keys(SKILLS_MAP).sort().map(skill => {
                        const key = "Ancestral Legacy Skills";
                        const picked = choices?.[key] || [];
                        const isPicked = isPicked => skillProfs?.includes(skill) && !isPicked;
                        const isChosen = picked.includes(skill);
                        const canPick  = isChosen || picked.length < 2;
                        return (
                          <div key={skill} onClick={() => {
                            if (!canPick && !isChosen) return;
                            const next = isChosen
                              ? picked.filter(s => s !== skill)
                              : [...picked, skill];
                            onChoice && onChoice(key, next);
                            onSkillToggle && onSkillToggle(skill);
                          }} style={{ padding:"4px 10px", borderRadius:16, cursor:canPick||isChosen?"pointer":"not-allowed",
                            fontSize:12, transition:"all 0.15s",
                            border:`1px solid ${isChosen?"var(--accent)":"var(--border)"}`,
                            background:isChosen?"rgba(var(--accent-rgb,201,162,39),0.15)":"var(--surface)",
                            color:isChosen?"var(--accent)":canPick?"var(--text)":"var(--text-dim)",
                            opacity:!canPick&&!isChosen?0.45:1 }}>
                            {isChosen?"✓ ":""}{skill}
                          </div>
                        );
                      })}
                    </div>
                    {(() => { const p = choices?.["Ancestral Legacy Skills"]||[]; return p.length > 0 && (
                      <div style={{ fontSize:12, color:"var(--accent)", marginTop:8 }}>Selected: {p.join(", ")} ({p.length}/2)</div>
                    ); })()}
                  </div>
                )}
              </div>
            );
          })()}
          {feature.type === "infusion_choice" && (() => {
            const countByLevel = feature.countByLevel || {"2":4};
            let maxCount = 0;
            for (const [lvl, cnt] of Object.entries(countByLevel)) {
              if ((charLevel||1) >= +lvl) maxCount = Math.max(maxCount, cnt);
            }
            const picked = Array.isArray(choices?.[feature.name]) ? choices[feature.name] : [];
            const infusions = feature.invocations || [];

            const toggle = inf => {
              if (locked) return;
              if ((charLevel||1) < (inf.levelReq||2)) return;
              const isPicked = picked.includes(inf.name);
              const next = isPicked
                ? picked.filter(n => n !== inf.name)
                : picked.length < maxCount ? [...picked, inf.name] : picked;
              onChoice && onChoice(feature.name, next);
            };

            return (
              <div>
                <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:10 }}>
                  Choose <strong style={{ color:"var(--accent)" }}>{maxCount}</strong> infusions known — {picked.length}/{maxCount} selected.
                  {(charLevel||1) < 6 && <span style={{ color:"var(--text-dim)", marginLeft:6 }}>(More unlock as you level up)</span>}
                </div>
                {/* Search */}
                <InfusionPicker
                  infusions={infusions}
                  picked={picked}
                  maxCount={maxCount}
                  charLevel={charLevel||1}
                  locked={locked}
                  onToggle={toggle}
                />
              </div>
            );
          })()}
          {!locked && feature.type === "eldritch_invocations" && (() => {
            const countByLevel = feature.countByLevel || {"2":2};
            let maxCount = 0;
            for (const [lvl, cnt] of Object.entries(countByLevel)) {
              if ((charLevel||1) >= +lvl) maxCount = Math.max(maxCount, cnt);
            }
            const picked = (choices?.[feature.name] || []);
            const pickedNames = Array.isArray(picked) ? picked : [];
            const pactBoon = choices?.["Pact Boon"] || "";

            const meetsPrereq = inv => {
              if (!inv.prereq) return true;
              if (inv.prereq.includes("Eldritch Blast")) {
                const spells = gameData?._charSpells || [];
                // Allow if they know Eldritch Blast or will — always allowed since it's a core cantrip
                return true;
              }
              if (inv.prereq.includes("Pact of the Blade")) return pactBoon.includes("Blade");
              if (inv.prereq.includes("Pact of the Chain")) return pactBoon.includes("Chain");
              if (inv.prereq.includes("Pact of the Tome"))  return pactBoon.includes("Tome");
              return true;
            };
            const meetsLevel = inv => (charLevel||1) >= (inv.levelReq||1);

            const toggle = inv => {
              if (!meetsLevel(inv) || !meetsPrereq(inv)) return;
              const isP = pickedNames.includes(inv.name);
              const newList = isP
                ? pickedNames.filter(n => n !== inv.name)
                : pickedNames.length < maxCount ? [...pickedNames, inv.name] : pickedNames;
              onChoice && onChoice(feature.name, newList);
            };

            return (
              <div>
                <div style={{fontSize:12,color:"var(--text-muted)",marginBottom:10}}>
                  Choose {maxCount} {feature.invocationLabel||"invocation"}{maxCount!==1?"s":""} — {pickedNames.length}/{maxCount} selected.
                  {charLevel >= 5 && " (More unlock at higher levels.)"}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                  {(feature.invocations||[]).map(inv => {
                    const isPicked = pickedNames.includes(inv.name);
                    const canLevel = meetsLevel(inv);
                    const canPrereq = meetsPrereq(inv);
                    const canPick = canLevel && canPrereq && (isPicked || pickedNames.length < maxCount);
                    return (
                      <button key={inv.name} onClick={()=>toggle(inv)}
                        style={{padding:"5px 12px",borderRadius:20,cursor:canPick||isPicked?"pointer":"not-allowed",
                          fontSize:12,fontFamily:"var(--font-display)",transition:"all 0.15s",
                          border:`1px solid ${isPicked?"var(--accent)":!canLevel||!canPrereq?"var(--border)":"var(--border)"}`,
                          background:isPicked?"rgba(var(--accent-rgb,201,162,39),0.15)":"var(--surface)",
                          color:isPicked?"var(--accent)":!canLevel||!canPrereq?"var(--text-dim)":"var(--text)",
                          opacity:!canLevel||!canPrereq?0.45:1,
                          position:"relative"}}>
                        {inv.name}
                        {inv.levelReq > 1 && !canLevel && <span style={{fontSize:9,marginLeft:4,color:"var(--text-dim)"}}>(lvl {inv.levelReq})</span>}
                        {inv.prereq && <span style={{fontSize:9,marginLeft:4,color:"var(--text-dim)"}}>*</span>}
                      </button>
                    );
                  })}
                </div>
                {/* Show descriptions for picked invocations */}
                {pickedNames.length > 0 && (
                  <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,overflow:"hidden"}}>
                    {pickedNames.map(name => {
                      const inv = (feature.invocations||[]).find(i=>i.name===name);
                      if (!inv) return null;
                      return (
                        <div key={name} style={{padding:"10px 14px",borderBottom:"1px solid var(--border)"}}>
                          <div style={{fontFamily:"var(--font-display)",color:"var(--accent)",fontSize:13,marginBottom:4}}>{inv.name}
                            {inv.prereq && <span style={{fontSize:10,color:"var(--text-dim)",marginLeft:8}}>Requires: {inv.prereq}</span>}
                            {inv.levelReq > 1 && <span style={{fontSize:10,color:"var(--text-dim)",marginLeft:8}}>Lvl {inv.levelReq}+</span>}
                          </div>
                          <div style={{fontSize:12,color:"var(--text-muted)",lineHeight:1.6}}>{inv.description}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
                {/* Book of Ancient Secrets — ritual spell picker */}
                {pickedNames.includes("Book of Ancient Secrets") && (() => {
                  const allRituals = (gameData?.spells || []).filter(s =>
                    s.ritual || (s.castingTime||'').includes('ritual')
                  );
                  const basKey  = "bas_required";   // first 2 level-1 rituals
                  const basExtra = "bas_extra";      // unlimited additional rituals
                  const required = (choices?.[basKey]  || []);
                  const extra    = (choices?.[basExtra] || []);
                  const allChosen = [...required, ...extra];

                  const toggleRequired = spell => {
                    const isIn = required.includes(spell.name);
                    const next = isIn
                      ? required.filter(n => n !== spell.name)
                      : required.length < 2 ? [...required, spell.name] : required;
                    onChoice && onChoice(basKey, next);
                  };
                  const toggleExtra = spell => {
                    const isIn = extra.includes(spell.name);
                    onChoice && onChoice(basExtra,
                      isIn ? extra.filter(n => n !== spell.name) : [...extra, spell.name]
                    );
                  };
                  const level1Rituals = allRituals.filter(s => s.level === 1);
                  const higherRituals = allRituals.filter(s => s.level > 1);
                  return (
                    <div style={{ marginTop:14, padding:"12px 14px", background:"rgba(0,0,0,0.2)", border:"1px solid var(--accent2)", borderRadius:8 }}>
                      <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13, marginBottom:4 }}>
                        Book of Ancient Secrets — Ritual Spells
                      </div>
                      <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:12, lineHeight:1.6 }}>
                        Choose 2 first-level ritual spells to inscribe at no cost. You can add more ritual spells of any level (up to half your Warlock level, rounded up) by spending 2 hours and 50gp per spell level when you find them.
                      </div>

                      {/* Required — 2 level 1 rituals */}
                      <div style={{ fontSize:11, color:"var(--accent)", textTransform:"uppercase", letterSpacing:1, marginBottom:6 }}>
                        Starting Rituals ({required.length}/2 chosen)
                      </div>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginBottom:14 }}>
                        {level1Rituals.map(spell => {
                          const isPicked = required.includes(spell.name);
                          const inExtra  = extra.includes(spell.name);
                          const canPick  = isPicked || (required.length < 2 && !inExtra);
                          return (
                            <div key={spell.name} onClick={() => !inExtra && canPick && toggleRequired(spell)}
                              style={{ padding:"4px 10px", borderRadius:16, cursor:(canPick&&!inExtra)?"pointer":"not-allowed",
                                fontSize:12, transition:"all 0.15s",
                                border:`1px solid ${isPicked?"var(--accent)":inExtra?"var(--border)":"var(--border)"}`,
                                background:isPicked?"rgba(var(--accent-rgb,201,162,39),0.15)":"var(--surface)",
                                color:isPicked?"var(--accent)":canPick?"var(--text)":"var(--text-dim)",
                                opacity:(!canPick&&!isPicked)||inExtra?0.4:1 }}>
                              {isPicked?"✓ ":""}{spell.name}
                              <span style={{fontSize:9,color:"var(--text-dim)",marginLeft:4}}>{spell.school}</span>
                            </div>
                          );
                        })}
                      </div>

                      {/* Additional — unlimited, any level ritual */}
                      <div style={{ fontSize:11, color:"var(--accent)", textTransform:"uppercase", letterSpacing:1, marginBottom:6 }}>
                        Additional Rituals ({extra.length} added — costs gp &amp; time in-game)
                      </div>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
                        {[...level1Rituals, ...higherRituals].map(spell => {
                          const inReq   = required.includes(spell.name);
                          const isPicked = extra.includes(spell.name);
                          return (
                            <div key={spell.name} onClick={() => !inReq && toggleExtra(spell)}
                              style={{ padding:"4px 10px", borderRadius:16, cursor:inReq?"not-allowed":"pointer",
                                fontSize:12, transition:"all 0.15s",
                                border:`1px solid ${isPicked?"var(--success)":inReq?"var(--border)":"var(--border)"}`,
                                background:isPicked?"rgba(39,174,96,0.12)":"var(--surface)",
                                color:isPicked?"var(--success)":inReq?"var(--text-dim)":"var(--text-muted)",
                                opacity:inReq?0.4:1 }}>
                              {isPicked?"✓ ":""}{spell.name}
                              <span style={{fontSize:9,color:"var(--text-dim)",marginLeft:4}}>Lvl {spell.level}</span>
                            </div>
                          );
                        })}
                      </div>
                      {allChosen.length > 0 && (
                        <div style={{ marginTop:10, fontSize:12, color:"var(--text-muted)", lineHeight:1.6 }}>
                          <span style={{color:"var(--accent)"}}>In your Book:</span> {allChosen.join(", ")}
                        </div>
                      )}
                    </div>
                  );
                })()}

                {/* Legend for prereq */}
                {(feature.invocations||[]).some(i=>i.prereq) && (
                  <div style={{fontSize:10,color:"var(--text-dim)",marginTop:6}}>* = has a prerequisite (hover/select to see). Pact Boon prereqs become available after choosing your Pact Boon.</div>
                )}
              </div>
            );
          })()}

          {/* spell_choice — pick N spells from a class list at a given level */}
          {!locked && feature.type === "spell_choice" && (() => {
            const allSpells = (gameData?.spells || []).filter(s =>
              (s.classes || []).includes(feature.spellList) &&
              (feature.spellLevel !== undefined ? s.level === feature.spellLevel : s.level <= (feature.maxLevel || 9))
            );
            const myGrants = (racialSpells || []).filter(s => s.sourceFeature === feature.name);
            const needed = feature.count || 1;
            const remaining = needed - myGrants.length;
            return (
              <div>
                <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
                  Choose <strong style={{ color:"var(--accent)" }}>{needed}</strong> {feature.spellLevel === 0 ? "cantrip" : "spell"}{needed>1?"s":""} from the {feature.spellList} list.
                  {feature.spellcastingAbility && <span style={{ marginLeft:6, color:"var(--accent)" }}>({ABILITY_SHORT[feature.spellcastingAbility]} for spellcasting)</span>}
                  {remaining > 0
                    ? <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({remaining} remaining)</span>
                    : <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>}
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:5, maxHeight:240, overflowY:"auto" }}>
                  {allSpells.map(spell => {
                    const alreadyGranted = myGrants.some(s => s.name === spell.name);
                    const alreadyKnown = (feature.allowDuplicate !== true) &&
                      !alreadyGranted && false; // intentional: racial and class spells can overlap
                    const canAdd = alreadyGranted || remaining > 0;
                    return (
                      <div key={spell.name} onClick={() => canAdd && onRacialSpellToggle && onRacialSpellToggle(spell.name, feature.name, spell)}
                        style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                          padding:"7px 10px", borderRadius:7, cursor: canAdd ? "pointer" : "not-allowed",
                          background: alreadyGranted ? "rgba(var(--accent-rgb,201,162,39),0.08)" : "var(--surface)",
                          border:`1px solid ${alreadyGranted ? "var(--accent)" : "var(--border)"}`,
                          opacity: !canAdd ? 0.4 : 1 }}>
                        <div>
                          <span style={{ fontFamily:"var(--font-display)", color: alreadyGranted ? "var(--accent)" : "var(--text)", fontSize:13 }}>
                            {alreadyGranted && "✓ "}{spell.name}
                          </span>
                          <span style={{ fontSize:11, color:"var(--text-muted)", marginLeft:8 }}>{spell.school}</span>
                          {spell.combat?.damage && <span style={{ fontSize:11, color:"var(--danger)", marginLeft:8 }}>{spell.combat.damage} {spell.combat.damageType}</span>}
                        </div>
                        <span style={{ fontSize:10, color: alreadyGranted ? "var(--danger)" : "var(--text-dim)" }}>
                          {alreadyGranted ? "× Remove" : "+ Pick"}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}

          {/* spell_grant — racial spells auto-granted at certain levels */}
          {feature.type === "spell_grant" && (() => {
            const level = charLevel || 1;
            const allSpells = gameData?.spells || [];
            const toAutoGrant = (feature.grants || []).filter(grant => {
              const available = level >= (grant.minCharLevel || 1);
              const isGranted = (racialSpells || []).some(s => s.name === grant.spellName);
              return available && !isGranted;
            });
            if (toAutoGrant.length > 0 && onRacialSpellToggle) {
              setTimeout(() => {
                toAutoGrant.forEach(grant => {
                  const spell = allSpells.find(s => s.name.toLowerCase() === grant.spellName.toLowerCase());
                  onRacialSpellToggle(grant.spellName, feature.name, spell);
                });
              }, 0);
            }
            return (
              <div>
                <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
                  Spells granted by your heritage — automatically known and don't count against your spell limit.
                  {feature.spellcastingAbility && <span style={{ marginLeft:6, color:"var(--accent)" }}>({ABILITY_SHORT[feature.spellcastingAbility]} for spellcasting)</span>}
                </div>
                {(feature.grants || []).map(grant => {
                  const spell = allSpells.find(s => s.name.toLowerCase() === grant.spellName.toLowerCase());
                  const available = level >= (grant.minCharLevel || 1);
                  const isGranted = (racialSpells || []).some(s => s.name === grant.spellName);
                  return (
                    <div key={grant.spellName} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 12px",
                      marginBottom:6, borderRadius:8, background:"var(--surface)",
                      border:`1px solid ${isGranted ? "var(--accent2)" : "var(--border)"}`,
                      opacity: available ? 1 : 0.45 }}>
                      <div style={{ flex:1 }}>
                        <span style={{ fontFamily:"var(--font-display)", color: isGranted ? "var(--accent)" : available ? "var(--text)" : "var(--text-dim)", fontSize:14 }}>
                          {grant.spellName}
                        </span>
                        {spell && <span style={{ fontSize:11, color:"var(--text-dim)", marginLeft:8 }}>{spell.level===0?"Cantrip":`Level ${spell.level}`} • {spell.school}</span>}
                        {!available && <span style={{ fontSize:11, color:"var(--text-dim)", marginLeft:8 }}>unlocks at level {grant.minCharLevel}</span>}
                      </div>
                      {isGranted && <span style={{ fontSize:10, color:"var(--accent2)", padding:"2px 6px", border:"1px solid var(--accent2)", borderRadius:4 }}>✓ Granted</span>}
                      {available && !isGranted && <span style={{ fontSize:11, color:"var(--text-dim)", fontStyle:"italic" }}>granting…</span>}
                    </div>
                  );
                })}
              </div>
            );
          })()}

          {/* Feat-or-ASI toggle on asi features */}
          {!locked && feature.type === "asi" && onFeatChoice && (() => {
            const hasFeat = !!featChoices?.[feature.name];
            const chosenFeat = featChoices?.[feature.name];
            const allFeats = gameData?.feats || [];
            const char = { abilities: currentAbilities || {}, spells: [] }; // minimal char for prereqs

            const meetsPrereqs = feat => {
              if (!feat.prerequisites) return true;
              const prereqs = feat.prerequisites;
              if (prereqs.ability) {
                for (const [ab, min] of Object.entries(prereqs.ability)) {
                  if ((currentAbilities?.[ab] || 10) < min) return false;
                }
              }
              return true;
            };

            return (
              <div style={{ marginTop:10 }}>
                {/* Toggle buttons */}
                <div style={{ display:"flex", gap:8, marginBottom:12 }}>
                  <button onClick={() => { if(hasFeat) onFeatChoice(feature.name, null); }}
                    style={{ padding:"6px 16px", borderRadius:6, cursor:"pointer", fontSize:13,
                      border:`1px solid ${!hasFeat?"var(--accent)":"var(--border)"}`,
                      background:!hasFeat?"var(--accent)":"var(--surface)",
                      color:!hasFeat?"var(--bg)":"var(--text-muted)" }}>
                    +2 / +1+1 Ability Score
                  </button>
                  <button onClick={() => { if(!hasFeat) onFeatChoice(feature.name, "__pending__"); }}
                    style={{ padding:"6px 16px", borderRadius:6, cursor:"pointer", fontSize:13,
                      border:`1px solid ${hasFeat?"var(--accent)":"var(--border)"}`,
                      background:hasFeat?"var(--accent)":"var(--surface)",
                      color:hasFeat?"var(--bg)":"var(--text-muted)" }}>
                    🏆 Take a Feat
                  </button>
                </div>

                {/* ASI widgets — only shown when not taking a feat */}
                {!hasFeat && (() => {
                  const asi = asiChoices?.[feature.name] || {};
                  const spent = Object.values(asi).reduce((s,v)=>s+v,0);
                  const rem = 2 - spent;
                  return (
                    <div>
                      <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:10 }}>
                        Spend <strong style={{ color:"var(--accent)" }}>2 points</strong>: put both in one ability (+2) or split across two (+1/+1).
                        {rem > 0 ? <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({rem} left)</span>
                                 : <span style={{ color:"var(--success)", marginLeft:6 }}>✓</span>}
                      </div>
                      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
                        {Object.keys(ABILITY_NAMES).map(ab => {
                          const bonus = asi[ab] || 0;
                          const total = (currentAbilities?.[ab] || 10) + bonus;
                          const canAdd = rem > 0 && bonus < 2;
                          return (
                            <div key={ab} style={{ padding:8, borderRadius:8, textAlign:"center",
                              background:"var(--surface)", border:`1px solid ${bonus>0?"var(--accent)":"var(--border)"}` }}>
                              <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{ABILITY_SHORT[ab]}</div>
                              <div style={{ fontSize:16, fontFamily:"var(--font-display)", color:bonus>0?"var(--accent)":"var(--text)" }}>
                                {total}{bonus>0&&<span style={{ fontSize:11 }}> (+{bonus})</span>}
                              </div>
                              <div style={{ display:"flex", gap:4, justifyContent:"center", marginTop:4 }}>
                                <button onClick={()=>{ if(bonus<=0)return; onAsiChange(feature.name,{...asi,[ab]:bonus-1}); }}
                                  style={{ width:22,height:22,borderRadius:4,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",cursor:bonus>0?"pointer":"not-allowed",fontSize:13,opacity:bonus>0?1:0.3,lineHeight:1 }}>−</button>
                                <button onClick={()=>{ if(!canAdd)return; onAsiChange(feature.name,{...asi,[ab]:bonus+1}); }}
                                  style={{ width:22,height:22,borderRadius:4,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",cursor:canAdd?"pointer":"not-allowed",fontSize:13,opacity:canAdd?1:0.3,lineHeight:1 }}>+</button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}

                {/* Feat picker */}
                {hasFeat && (
                  <div>
                    {chosenFeat && chosenFeat !== "__pending__" ? (
                      <div style={{ padding:"10px 14px", background:"rgba(var(--accent-rgb,201,162,39),0.08)", border:"1px solid var(--accent)", borderRadius:8, marginBottom:10 }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                          <span style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:15 }}>🏆 {chosenFeat}</span>
                          <button onClick={()=>onFeatChoice(feature.name,"__pending__")} style={{ padding:"3px 10px", borderRadius:6, fontSize:12, cursor:"pointer", border:"1px solid var(--border)", background:"transparent", color:"var(--text-muted)" }}>Change</button>
                        </div>
                        {allFeats.find(f=>f.name===chosenFeat)?.description && (
                          <div style={{ fontSize:12, color:"var(--text-muted)", marginTop:6, lineHeight:1.5 }}>
                            {allFeats.find(f=>f.name===chosenFeat).description.slice(0,180)}{allFeats.find(f=>f.name===chosenFeat).description.length>180?"…":""}
                          </div>
                        )}
                        {/* Sub-choice (e.g. Elemental Adept damage type) */}
                        {(() => {
                          const featDef = allFeats.find(f=>f.name===chosenFeat);
                          const sc = featDef?.subChoice;
                          if (!sc) return null;
                          const subKey = `${feature.name}__sub`;
                          const curSub = (featChoices||{})[subKey] || "";
                          return (
                            <div style={{ marginTop:10, paddingTop:10, borderTop:"1px solid var(--accent2)" }}>
                              <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:6 }}>{sc.label}</div>
                              {sc.type === "select" && (
                                <select value={curSub} onChange={e=>onFeatChoice(subKey, e.target.value)} style={{ width:"100%", background:"var(--surface)", border:`1px solid ${curSub?"var(--accent)":"#e67e22"}`, color:"var(--text)", padding:"8px 10px", borderRadius:6, fontSize:13, fontFamily:"var(--font-body)", cursor:"pointer" }}>
                                  <option value="">— choose —</option>
                                  {sc.options.map(o=><option key={o} value={o}>{o}</option>)}
                                </select>
                              )}
                              {(sc.type === "skills" || sc.type === "weapons") && (
                                <div style={{ fontSize:12, color:"var(--text-dim)", fontStyle:"italic" }}>
                                  Choose {sc.count} {sc.type === "skills" ? "skills or tools" : "weapons"} on the relevant section of your sheet.
                                </div>
                              )}
                            </div>
                          );
                        })()}
                      </div>
                    ) : (
                      <div>
                        <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:8 }}>Choose a feat:</div>
                        <div style={{ maxHeight:300, overflowY:"auto", display:"flex", flexDirection:"column", gap:5 }}>
                          {allFeats.map(feat => {
                            const eligible = meetsPrereqs(feat);
                            return (
                              <div key={feat.name} onClick={()=> eligible && onFeatChoice(feature.name, feat.name)}
                                style={{ padding:"8px 12px", borderRadius:8, cursor:eligible?"pointer":"not-allowed",
                                  background:"var(--surface)", border:"1px solid var(--border)",
                                  opacity: eligible ? 1 : 0.4, transition:"all 0.15s" }}
                                onMouseEnter={e=>{ if(eligible) e.currentTarget.style.borderColor="var(--accent)"; }}
                                onMouseLeave={e=>{ e.currentTarget.style.borderColor="var(--border)"; }}>
                                <div style={{ display:"flex", justifyContent:"space-between" }}>
                                  <span style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:13 }}>{feat.name}</span>
                                  {!eligible && <span style={{ fontSize:10, color:"var(--text-dim)" }}>prereqs not met</span>}
                                </div>
                                <div style={{ fontSize:11, color:"var(--text-dim)", marginTop:3, lineHeight:1.4 }}>
                                  {feat.description.slice(0, 120)}{feat.description.length>120?"…":""}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ============================================================
// ABILITY ROLLER
// ============================================================
function AbilityRoller({ abilities, onChange, char, setChar }) {
  const saved = char._abilityMethod;
  const [method, setMethod] = useState(saved || "standard");
  const [rolls,  setRolls]  = useState(char._rolls || {});
  const [pb, setPb] = useState(char._pb || { str:8, dex:8, con:8, int:8, wis:8, cha:8 });
  const STANDARD = [15, 14, 13, 12, 10, 8];
  const [assigned, setAssigned] = useState(char._assigned || {});
  const [manualRolls, setManualRolls] = useState({});

  const persist = (patch) => setChar(c => ({...c, ...patch}));

  const setMethodP = m => { setMethod(m); persist({_abilityMethod:m}); };

  const PB_COST  = { 8:0, 9:1, 10:2, 11:3, 12:4, 13:5, 14:7, 15:9 };
  const MAX_PTS  = 27;
  const usedPts  = Object.values(pb).reduce((s, v) => s + (PB_COST[v] || 0), 0);

  const rollAll = () => {
    // Roll 6 independent values — 4d6 drop lowest each
    const pool = Array.from({length: 6}, () => {
      const dice = [1,2,3,4].map(() => Math.floor(Math.random() * 6) + 1).sort((a,b) => a-b);
      return { total: dice.slice(1).reduce((a,b) => a+b, 0), dice };
    });
    // Clear any previous assignments
    setAssigned({});
    persist({_rolls: pool, _assigned: {}});
    setRolledPool(pool);
    onChange(Object.keys(abilities).reduce((acc, ab) => ({ ...acc, [ab]: 8 }), {}));
  };

  const [rolledPool, setRolledPool] = useState(
    Array.isArray(char._rolls) ? char._rolls : []
  );

  // Standard array: which values are still in the pool
  const usedValues = Object.values(assigned);
  const pool = STANDARD.filter((v, i) => {
    // Allow duplicates in STANDARD correctly
    let used = 0;
    for (const val of usedValues) if (val === v) used++;
    let poolCount = 0;
    for (const sv of STANDARD) if (sv === v) poolCount++;
    return i < poolCount - used + STANDARD.slice(0, i).filter(sv => sv === v).length;
  });
  // Simpler: pool = STANDARD minus one entry per assignment
  const poolRemaining = [...STANDARD];
  for (const v of usedValues) {
    const idx = poolRemaining.indexOf(v);
    if (idx !== -1) poolRemaining.splice(idx, 1);
  }

  const assignStat = (ab, val) => {
    const newAssigned = { ...assigned, [ab]: val };
    setAssigned(newAssigned);
    persist({_assigned:newAssigned});
    onChange({ ...abilities, ...Object.fromEntries(Object.entries(newAssigned)) });
  };
  const clearStat = (ab) => {
    const newAssigned = { ...assigned };
    delete newAssigned[ab];
    setAssigned(newAssigned);
    persist({_assigned:newAssigned});
    onChange({ ...abilities, [ab]: 8 });
  };

  const setPbVal = (ab, val) => {
    const np = {...pb, [ab]:val};
    setPb(np);
    persist({_pb:np});
    onChange({...abilities, ...np});
  };

  const mBtn = a => ({ padding:"6px 16px", borderRadius:6, marginRight:8, cursor:"pointer", fontSize:13,
    fontFamily:"var(--font-body)", transition:"all 0.2s",
    border:`1px solid ${a ? "var(--accent)" : "var(--border)"}`,
    background: a ? "var(--accent)" : "transparent", color: a ? "var(--bg)" : "var(--text)" });
  const grid = { display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 };
  const card = { background:"var(--card)", border:"1px solid var(--border)", borderRadius:8, padding:14, marginBottom:10 };
  const lbl  = { fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 };
  const mod  = { display:"inline-block", padding:"2px 8px", borderRadius:4, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--accent)", fontSize:13, marginLeft:6 };
  const pbB  = { width:28, height:28, borderRadius:4, border:"1px solid var(--border)", background:"var(--surface)", color:"var(--text)", cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" };

  return (
    <div>
      <div style={{ marginBottom:16 }}>
        {[["standard","Standard Array"],["pointbuy","Point Buy"],["roll","Roll Dice"],["manual","Manual"]].map(([m,l]) =>
          <button key={m} style={mBtn(method === m)} onClick={() => setMethodP(m)}>{l}</button>)}
      </div>

      {/* ── Standard Array ── */}
      {method === "standard" && (
        <div>
          {/* Pool of remaining values */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:8 }}>
              Available scores — click a stat box to assign, click again to clear:
            </div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {[...new Set(STANDARD)].map(v => {
                const count = poolRemaining.filter(x => x === v).length;
                return count > 0 ? (
                  <div key={v} style={{ padding:"6px 16px", background:"var(--card)", border:"1px solid var(--accent2)", borderRadius:8, fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:18, position:"relative" }}>
                    {v}
                    {count > 1 && <span style={{ position:"absolute", top:-4, right:-4, width:14, height:14, borderRadius:"50%", background:"var(--accent)", fontSize:9, color:"var(--bg)", display:"flex", alignItems:"center", justifyContent:"center" }}>{count}</span>}
                  </div>
                ) : null;
              })}
              {poolRemaining.length === 0 && <span style={{ fontSize:12, color:"var(--success)" }}>✓ All scores assigned</span>}
            </div>
          </div>
          {/* Stat boxes */}
          <div style={grid}>{Object.keys(abilities).map(ab => {
            const val = assigned[ab];
            const isAssigned = val !== undefined;
            return (
              <div key={ab} style={{ ...card, border:`1px solid ${isAssigned ? "var(--accent)" : "var(--border)"}`, cursor:"pointer", position:"relative" }}
                onClick={() => {
                  if (isAssigned) { clearStat(ab); return; }
                  if (poolRemaining.length === 0) return;
                  // Assign the highest remaining value
                  assignStat(ab, poolRemaining[0]);
                }}>
                <div style={lbl}>{ABILITY_SHORT[ab]}</div>
                {isAssigned ? (
                  <>
                    <div style={{ fontSize:26, fontFamily:"var(--font-display)", color:"var(--accent)", marginTop:4 }}>{val}</div>
                    <div style={{ fontSize:11, color:"var(--text-dim)", marginTop:2 }}>click to clear</div>
                  </>
                ) : (
                  <div style={{ fontSize:15, color:"var(--text-dim)", marginTop:8, fontStyle:"italic" }}>
                    {poolRemaining.length > 0 ? "click to assign" : "—"}
                  </div>
                )}
                {isAssigned && <span style={mod}>{modStr(calcMod(val))}</span>}
              </div>
            );
          })}</div>
          <p style={{ fontSize:11, color:"var(--text-dim)", marginTop:4 }}>
            Scores are assigned in order from the pool. Click a filled box to return its value to the pool.
          </p>
        </div>
      )}

      {/* ── Point Buy ── */}
      {method === "pointbuy" && (
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <p style={{ color:"var(--text-muted)", fontSize:13, margin:0 }}>Scores 8–15. Cost: 14=7pts, 15=9pts.</p>
            <span style={{ fontFamily:"var(--font-display)", color: usedPts > MAX_PTS ? "var(--danger)" : "var(--success)" }}>{usedPts}/{MAX_PTS} pts</span>
          </div>
          <div style={grid}>{Object.keys(pb).map(ab => (
            <div key={ab} style={card}>
              <div style={lbl}>{ABILITY_SHORT[ab]}</div>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
                <button style={pbB} onClick={() => { const v = Math.max(8, pb[ab]-1); setPbVal(ab, v); }}>−</button>
                <span style={{ fontSize:22, fontFamily:"var(--font-display)", color:"var(--accent)", minWidth:30, textAlign:"center" }}>{pb[ab]}</span>
                <button style={pbB} onClick={() => {
                  const nv = Math.min(15, pb[ab]+1);
                  const cost = Object.entries({...pb,[ab]:nv}).reduce((s,[,v]) => s + (PB_COST[v] || 0), 0);
                  if (cost <= MAX_PTS) setPbVal(ab, nv);
                }}>+</button>
              </div>
              <span style={mod}>{modStr(calcMod(pb[ab]))}</span>
            </div>
          ))}</div>
        </div>
      )}

      {/* ── Roll Dice ── */}
      {method === "roll" && (
        <div>
          <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:16, flexWrap:"wrap" }}>
            <button onClick={rollAll} style={{ ...mBtn(false), background:"var(--accent)", color:"var(--bg)" }}>🎲 Roll (4d6 drop lowest)</button>
            {rolledPool.length > 0 && (
              <button onClick={() => { setAssigned({}); persist({_assigned:{}}); onChange(Object.keys(abilities).reduce((acc,ab)=>({...acc,[ab]:8}),{})); setRolledPool([]); }}
                style={{ ...mBtn(false) }}>↺ Reroll</button>
            )}
          </div>

          {rolledPool.length === 0 ? (
            <div style={{ textAlign:"center", padding:"28px 0", color:"var(--text-muted)", fontSize:13, fontStyle:"italic" }}>
              Click Roll to generate 6 scores, then assign them to your stats.
            </div>
          ) : (<>
            {/* Pool of rolled values */}
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:8 }}>
                Click a score to select it, then click a stat box to assign it. Hover for dice breakdown.
              </div>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                {rolledPool.map((r, i) => {
                  const usedByIndex = Object.values(assigned);
                  const isAssignedOut = usedByIndex.includes(i);
                  const isSelected = rolledPool._selected === i;
                  return (
                    <div key={i}
                      onClick={() => {
                        if (isAssignedOut) return;
                        setRolledPool(prev => {
                          const next = [...prev];
                          next._selected = prev._selected === i ? undefined : i;
                          return next;
                        });
                      }}
                      title={`Rolled: [${r.dice.join(", ")}] — dropped ${r.dice[0]}, kept ${r.dice.slice(1).join("+")}`}
                      style={{ padding:"8px 16px", borderRadius:10, cursor:isAssignedOut?"not-allowed":"pointer",
                        background:isAssignedOut?"var(--surface)":isSelected?"var(--accent)":"var(--card)",
                        border:`2px solid ${isAssignedOut?"var(--border)":isSelected?"var(--accent)":"var(--accent2)"}`,
                        color:isAssignedOut?"var(--text-dim)":isSelected?"var(--bg)":"var(--accent)",
                        fontFamily:"var(--font-display)", fontSize:22, opacity:isAssignedOut?0.35:1,
                        transition:"all 0.15s", minWidth:56, textAlign:"center" }}>
                      {r.total}
                      <div style={{ fontSize:9, color:isAssignedOut?"var(--text-dim)":isSelected?"rgba(0,0,0,0.45)":"var(--text-dim)", marginTop:2 }}>
                        [{r.dice.slice(1).join("+")}]
                      </div>
                    </div>
                  );
                })}
              </div>
              {rolledPool._selected !== undefined && (
                <div style={{ marginTop:8, fontSize:12, color:"var(--accent)", fontStyle:"italic" }}>
                  ✦ {rolledPool[rolledPool._selected]?.total} selected — click a stat below to assign it
                </div>
              )}
            </div>

            {/* Stat boxes for assignment */}
            <div style={grid}>{Object.keys(abilities).map(ab => {
              const assignedIdx = assigned[ab];
              const isAssigned  = assignedIdx !== undefined;
              const val         = isAssigned ? rolledPool[assignedIdx]?.total : null;
              const canAssign   = rolledPool._selected !== undefined && !isAssigned;
              return (
                <div key={ab} style={{ ...card,
                  border:`2px solid ${isAssigned?"var(--accent)":canAssign?"var(--accent)88":"var(--border)"}`,
                  cursor: isAssigned || canAssign ? "pointer" : "default",
                  background: canAssign ? "rgba(201,162,39,0.04)" : "var(--surface)",
                  transition:"all 0.15s"
                }}
                  onClick={() => {
                    const sel = rolledPool._selected;
                    if (isAssigned) {
                      // Unassign — clear this stat
                      const newAssigned = { ...assigned };
                      delete newAssigned[ab];
                      setAssigned(newAssigned);
                      persist({_assigned: newAssigned});
                      onChange({ ...abilities, [ab]: 8 });
                    } else if (sel !== undefined) {
                      // Assign selected pool value
                      const newAssigned = { ...assigned, [ab]: sel };
                      setAssigned(newAssigned);
                      persist({_assigned: newAssigned});
                      onChange({ ...abilities, [ab]: rolledPool[sel].total });
                      setRolledPool(prev => { const n=[...prev]; n._selected=undefined; return n; });
                    }
                  }}>
                  <div style={lbl}>{ABILITY_SHORT[ab]}</div>
                  {isAssigned ? (<>
                    <div style={{ fontSize:28, fontFamily:"var(--font-display)", color:"var(--accent)", marginTop:4, lineHeight:1 }}>{val}</div>
                    <div style={{ fontSize:10, color:"var(--text-dim)", marginTop:3 }}>click to clear</div>
                    <span style={mod}>{modStr(calcMod(val))}</span>
                  </>) : (
                    <div style={{ fontSize:12, color:canAssign?"var(--accent)":"var(--text-dim)", marginTop:10, fontStyle:"italic" }}>
                      {canAssign ? "← assign" : "—"}
                    </div>
                  )}
                </div>
              );
            })}</div>

            <div style={{ marginTop:10, fontSize:12, color:"var(--text-muted)" }}>
              {Object.keys(abilities).length - Object.keys(assigned).length > 0
                ? `${Object.keys(abilities).length - Object.keys(assigned).length} stat${Object.keys(abilities).length - Object.keys(assigned).length!==1?"s":""} still need a score`
                : <span style={{ color:"var(--success)" }}>✓ All stats assigned!</span>}
            </div>
          </>)}
        </div>
      )}

      {/* ── Manual ── */}
      {method === "manual" && (
        <div>
          <p style={{ fontSize:13, color:"var(--text-muted)", marginBottom:14 }}>
            Enter any value between 3 and 18 for each stat (the range possible with standard dice rolls).
          </p>
          <div style={grid}>{Object.keys(abilities).map(ab => (
            <div key={ab} style={{ ...card, border:`1px solid ${abilities[ab] !== 10 ? "var(--accent)" : "var(--border)"}` }}>
              <div style={lbl}>{ABILITY_SHORT[ab]}</div>
              <input
                type="number" min={3} max={18}
                value={abilities[ab]}
                onChange={e => {
                  const n = parseInt(e.target.value, 10);
                  if (!isNaN(n) && n >= 3 && n <= 18) onChange({ ...abilities, [ab]: n });
                }}
                style={{ width:"100%", background:"var(--surface)", border:"1px solid var(--border)", color:"var(--accent)", padding:"6px 8px", borderRadius:6, fontSize:26, fontFamily:"var(--font-display)", textAlign:"center", marginTop:6, boxSizing:"border-box" }}
              />
              <span style={mod}>{modStr(calcMod(abilities[ab]))}</span>
            </div>
          ))}</div>
        </div>
      )}
    </div>
  );

}
