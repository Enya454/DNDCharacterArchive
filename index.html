                {Object.entries(itemTypes || {}).map(([k, v]) => <option key={k} value={k}>{v.label || k}</option>)}
              </select>
            </div>
            <div><label style={lbl}>Qty</label><input type="number" style={inp} value={ni.quantity} min={1} onChange={e => setNi({ ...ni, quantity:+e.target.value })} /></div>
            <div><label style={lbl}>Weight</label><input type="number" style={inp} value={ni.weight} min={0} onChange={e => setNi({ ...ni, weight:+e.target.value })} /></div>
          </div>
          <div style={{ marginBottom:10 }}><label style={lbl}>Description</label><input style={inp} value={ni.description} onChange={e => setNi({ ...ni, description:e.target.value })} placeholder="Optional…" /></div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={addItem} style={{ padding:"8px 20px", background:"var(--accent)", border:"none", color:"var(--bg)", borderRadius:6, cursor:"pointer", fontFamily:"var(--font-display)" }}>Add</button>
            <button onClick={() => setShowAdd(false)} style={{ padding:"8px 20px", background:"transparent", border:"1px solid var(--border)", color:"var(--text)", borderRadius:6, cursor:"pointer" }}>Cancel</button>
          </div>
        </div>
      )}

      {inv.length === 0 && !showAdd && (
        <div style={{ textAlign:"center", padding:44, color:"var(--text-muted)" }}>
          <div style={{ fontSize:44, marginBottom:12 }}>🎒</div>
          <div>Your pack is empty.</div>
        </div>
      )}

      {Object.entries(grouped).map(([type, items]) => (
        <div key={type} style={{ marginBottom:16 }}>
          <div style={{ fontSize:11, color:tc(type), textTransform:"uppercase", letterSpacing:1, marginBottom:7, paddingBottom:4, borderBottom:"1px solid var(--border)" }}>
            {tl(type)} ({items.length})
          </div>
          {items.map(item => (
            <div key={item.id} style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:10, padding:12, marginBottom:7, display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ width:8, height:8, borderRadius:"50%", background:tc(item.type), flexShrink:0 }} />
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontFamily:"var(--font-display)", fontSize:14 }}>{item.name}</span>
                  {item.equipped && <span style={{ fontSize:10, padding:"2px 6px", background:"rgba(39,174,96,0.15)", border:"1px solid var(--success)", borderRadius:4, color:"var(--success)" }}>Equipped</span>}
                </div>
                {item.description && <div style={{ fontSize:12, color:"var(--text-muted)", marginTop:2 }}>{item.description}</div>}
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                <input type="number" value={item.quantity} min={1} onChange={e => uq(item.id, +e.target.value)}
                  style={{ ...inp, width:50, textAlign:"center", padding:"4px 0" }} />
                {["weapon","armor","shield"].includes(item.type) && (
                  <button onClick={() => teq(item.id)} style={{ padding:"4px 10px", borderRadius:6, fontSize:12, cursor:"pointer", background:"transparent",
                    border:`1px solid ${item.equipped ? "var(--success)" : "var(--border)"}`,
                    color: item.equipped ? "var(--success)" : "var(--text-muted)" }}>
                    {item.equipped ? "Unequip" : "Equip"}
                  </button>
                )}
                <button onClick={() => rem(item.id)} style={{ width:28, height:28, borderRadius:6, border:"1px solid var(--danger)", background:"transparent", color:"var(--danger)", cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// ============================================================
// FEATURES TAB (character sheet view)
// ============================================================
function FeaturesTab({ char, gameData }) {
  const { classes, species:speciesDb } = gameData;
  const classData   = classes?.[char.class];
  const speciesData = speciesDb?.[char.species];
  const [open, setOpen] = useState({});
  const toggle = name => setOpen(o => ({ ...o, [name]:!o[name] }));

  const allFeatures = [
    ...(classData?.features || []),
    ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || [])
  ].sort((a, b) => a.level - b.level);

  const FeatureRow = ({ feat, isSpecies }) => {
    const locked  = !isSpecies && char.level < feat.level;
    const chosen  = char.featureChoices?.[feat.name];
    const isOpen  = open[feat.name + (isSpecies ? "_sp" : "")];
    const toggleKey = feat.name + (isSpecies ? "_sp" : "");
    return (
      <div style={ws.fCard(locked)}>
        <div style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer" }} onClick={() => toggle(toggleKey)}>
          <span style={{ fontFamily:"var(--font-display)", color: locked ? "var(--text-dim)" : "var(--accent)", fontSize:14, flex:1 }}>{feat.name}</span>
          {locked   && <span style={ws.lockBadge}>Lvl {feat.level}</span>}
          {!locked && feat.level > 1 && !isSpecies && <span style={{ fontSize:10, color:"var(--text-dim)", marginLeft:4 }}>Lvl {feat.level}</span>}
          {chosen   && <span style={{ fontSize:11, color:"var(--success)", padding:"1px 8px", borderRadius:10, border:"1px solid var(--success)", maxWidth:160, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{chosen.split("—")[0].trim()}</span>}
          <span style={{ color:"var(--text-dim)", fontSize:11 }}>{isOpen ? "▲" : "▼"}</span>
        </div>
        {isOpen && (
          <div style={{ marginTop:10, paddingTop:10, borderTop:"1px solid var(--border)" }}>
            <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.6, margin:0 }}>{feat.description}</p>
            {chosen && (
              <div style={{ marginTop:8, padding:"6px 10px", background:"rgba(201,162,39,0.08)", borderRadius:6, fontSize:12, color:"var(--accent)" }}>
                ✓ Chosen: {chosen}
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  return (
    <div>
      {speciesData && (
        <div style={{ marginBottom:24 }}>
          <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13, textTransform:"uppercase", letterSpacing:1, marginBottom:12 }}>
            {char.species} Species Traits
          </div>
          {(speciesData.features || []).map(feat => <FeatureRow key={feat.name} feat={feat} isSpecies={true} />)}
        </div>
      )}
      {classData && (
        <div>
          <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13, textTransform:"uppercase", letterSpacing:1, marginBottom:12 }}>
            {char.class}{char.subclass ? ` — ${char.subclass}` : ""} Features
          </div>
          {allFeatures.map((feat, i) => <FeatureRow key={`${feat.name}-${i}`} feat={feat} isSpecies={false} />)}
        </div>
      )}
    </div>
  );
}

  const [cu, setCu] = useState(char.customMusicUrl || "");

    <div>
      <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:10, padding:16, marginBottom:16 }}>
        <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", marginBottom:12 }}>Visual Theme</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))", gap:10 }}>
          {Object.entries(themes || {}).map(([k, t]) => (
            <div key={k} onClick={() => onUpdate({ ...char, theme:k })} style={{
              padding:12, borderRadius:8, cursor:"pointer", textAlign:"center", transition:"all 0.2s",
              border:`2px solid ${char.theme === k ? t.accent : "var(--border)"}`,
              background: "var(--surface)"
            }}>
              <div style={{ width:26, height:26, borderRadius:"50%", background:t.accent, margin:"0 auto 6px", border:`3px solid ${t.accentSecondary || t.accent}` }} />
              <div style={{ fontSize:13 }}>{t.name}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:10, padding:16, marginBottom:16 }}>
        <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", marginBottom:12 }}>Background Music</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14 }}>
          {tracks.map(t => (
            <div key={t.id} onClick={() => onUpdate({ ...char, music:t.id })} style={{
              padding:"10px 14px", borderRadius:8, cursor:"pointer", fontSize:13, transition:"all 0.2s",
              border:`1px solid ${char.music === t.id ? "var(--accent)" : "var(--border)"}`,
              background: char.music === t.id ? "rgba(201,162,39,0.08)" : "var(--surface)"
            }}>
              {char.music === t.id ? "🎵 " : "♪ "}{t.name}
              {!t.url && <span style={{ fontSize:10, color:"var(--text-dim)", marginLeft:6 }}>(no URL)</span>}
            </div>
          ))}
        </div>
        <div>
          <label style={{ display:"block", color:"var(--text-muted)", fontSize:12, textTransform:"uppercase", marginBottom:6 }}>Custom Music URL (.mp3 / .ogg)</label>
          <div style={{ display:"flex", gap:8 }}>
            <input value={cu} onChange={e => setCu(e.target.value)} placeholder="https://example.com/music.mp3"
              style={{ flex:1, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"8px 12px", borderRadius:6, fontSize:13, fontFamily:"var(--font-body)" }} />
            <button onClick={() => onUpdate({ ...char, music:"custom", customMusicUrl:cu })}
              style={{ padding:"8px 16px", background:"var(--accent)", border:"none", color:"var(--bg)", borderRadius:6, cursor:"pointer", fontFamily:"var(--font-display)", fontSize:13 }}>Set</button>
          </div>

      <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:10, padding:16 }}>
        <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", marginBottom:12 }}>Character Info</div>
        <div style={{ fontSize:13, color:"var(--text-muted)", lineHeight:2.2 }}>
          <div>Created: {char.createdAt ? new Date(char.createdAt).toLocaleDateString() : "—"}</div>
          <div>Updated: {char.updatedAt ? new Date(char.updatedAt).toLocaleDateString() : "—"}</div>
          <div style={{ fontSize:11, color:"var(--text-dim)", marginTop:4 }}>ID: {char.id}</div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// CHARACTER SHEET
// ============================================================
function CharacterSheet({ char:initial, gameData, onBack, onDelete }) {
  const [char, setChar]   = useState(initial);
  const [tab,  setTab]    = useState("stats");
  const [saved, setSaved] = useState(false);
  const audioRef  = useRef(null);
  const saveTimer = useRef(null);

  const { classes, species:speciesDb, themes, music } = gameData;
  const theme       = themes?.[char.theme] || themes?.[Object.keys(themes || {})[0]] || {};
  const classData   = classes?.[char.class];
  const speciesData = speciesDb?.[char.species];
  const pb          = profBonus(char.level);
  const saves       = getSavingThrows(char, classes);
  const skills      = getSkillBonuses(char);
  const tracks      = music?.tracks || [];

  const upd = useCallback(u => {
    const s = { ...u, updatedAt: new Date().toISOString() };
    setChar(s);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const all = loadChars();
      const idx = all.findIndex(c => c.id === s.id);
      if (idx >= 0) all[idx] = s; else all.push(s);
      saveChars(all); setSaved(true); setTimeout(() => setSaved(false), 2000);
    }, 800);
  }, []);

  useEffect(() => {
    const t = tracks.find(t => t.id === char.music);
    const url = char.music === "custom" ? char.customMusicUrl : t?.url;
    if (audioRef.current) {
      if (url) { audioRef.current.src = url; audioRef.current.play().catch(() => {}); }
      else     { audioRef.current.pause(); audioRef.current.src = ""; }
    }
  }, [char.music, char.customMusicUrl]);

  const TABS = [
    { id:"stats",     l:"⚔️ Stats"      },
    { id:"spells",    l:"✨ Spells"     },
    { id:"inventory", l:"🎒 Inventory"  },
    { id:"features",  l:"⭐ Features"   },
    { id:"notes",     l:"📜 Notes"      },
    { id:"settings",  l:"⚙️ Settings"  },
  ];

  const ts = active => ({
    padding:"10px 16px", borderRadius:"8px 8px 0 0", cursor:"pointer", fontSize:13,
    whiteSpace:"nowrap", transition:"all 0.15s", fontFamily:theme.fontBody || "serif",
    background: active ? theme.card   : "transparent",
    color:      active ? theme.accent : theme.textMuted,
    border:     `1px solid ${active ? theme.border : "transparent"}`,
    borderBottom: active ? `1px solid ${theme.card}` : "transparent",
  });

  const isSpellcaster = classData?.spellcaster || (char.subclass && classData?.subclasses?.[char.subclass]?.spellcaster);

  const qs = [
    { l:"HP",       v:`${char.hp.current}/${char.hp.max}`,
      c: char.hp.current < char.hp.max / 4 ? theme.danger : char.hp.current < char.hp.max / 2 ? "#f39c12" : theme.success },
    { l:"AC",       v: calcAC(char) },
    { l:"Init",     v: modStr(calcMod(char.abilities.dex)) },
    { l:"Speed",    v: `${speciesData?.speed || 30}ft` },
    { l:"Prof",     v: `+${pb}` },
    { l:"Pass Perc",v: 10 + (skills["Perception"]?.value || 0) },
    ...(isSpellcaster ? [{ l:"Spell DC", v: calcSpellDC(char, classes) || "—" }] : []),
  ];

  return (
    <TW themeKey={char.theme} themes={themes}>
      <audio ref={audioRef} loop style={{ display:"none" }} />

      {/* Sticky header */}
      <div style={{ background:theme.gradientHero || theme.bg, borderBottom:`1px solid ${theme.border}`, padding:"16px 20px", position:"sticky", top:0, zIndex:10 }}>
        <div style={{ display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
          <button onClick={onBack} style={{ background:"transparent", border:`1px solid ${theme.border}`, color:theme.textMuted, padding:"6px 14px", borderRadius:6, cursor:"pointer", fontFamily:theme.fontBody, fontSize:13 }}>← Back</button>
          <div style={{ flex:1, minWidth:200 }}>
            <div style={{ fontFamily:theme.fontDisplay, fontSize:22, color:theme.accent }}>{char.name}</div>
            <div style={{ fontSize:13, color:theme.textMuted, marginTop:2 }}>
              {[char.species, char.subclass ? `${char.class} (${char.subclass})` : char.class, `Level ${char.level}`, char.background, char.alignment].filter(Boolean).join(" • ")}
            </div>
          </div>
          <div style={{ opacity:saved?1:0, transition:"opacity 0.3s", padding:"4px 12px", borderRadius:20, background:"rgba(39,174,96,0.15)", border:"1px solid var(--success)", color:"var(--success)", fontSize:12 }}>✓ Saved</div>
          {char.music && char.music !== "none" && <span>🎵</span>}
          <button onClick={() => { if (confirm("Delete this character permanently?")) onDelete(char.id); }}
            style={{ background:"transparent", border:`1px solid ${theme.danger}`, color:theme.danger, padding:"6px 12px", borderRadius:6, cursor:"pointer", fontSize:13 }}>Delete</button>
        </div>

        {/* Quick stats */}
        <div style={{ display:"flex", gap:10, marginTop:12, flexWrap:"wrap", alignItems:"center" }}>
          {qs.map(q => (
            <div key={q.l} style={{ textAlign:"center", padding:"5px 12px", background:"rgba(0,0,0,0.3)", border:`1px solid ${theme.border}`, borderRadius:8, minWidth:56 }}>
              <div style={{ fontSize:10, color:theme.textMuted, textTransform:"uppercase", letterSpacing:1 }}>{q.l}</div>
              <div style={{ fontFamily:theme.fontDisplay, fontSize:17, color:q.c || theme.accent, lineHeight:1.3 }}>{q.v}</div>
            </div>
          ))}
          <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:6 }}>
            <span style={{ fontSize:12, color:theme.textMuted }}>Inspiration</span>
            <div onClick={() => upd({ ...char, inspiration:!char.inspiration })} style={{
              width:28, height:28, borderRadius:6, cursor:"pointer", display:"flex", alignItems:"center",
              justifyContent:"center", fontSize:18, transition:"all 0.2s",
              border:`2px solid ${char.inspiration ? "#ffd700" : theme.border}`,
              background: char.inspiration ? "rgba(255,215,0,0.18)" : "transparent"
            }}>{char.inspiration ? "✦" : ""}</div>
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{ padding:"0 20px 48px", maxWidth:1200, margin:"0 auto" }}>
        <div style={{ display:"flex", gap:4, marginTop:22, borderBottom:`1px solid ${theme.border}`, flexWrap:"wrap" }}>
          {TABS.map(t => <button key={t.id} style={ts(tab === t.id)} onClick={() => setTab(t.id)}>{t.l}</button>)}
        </div>

        <div style={{ background:theme.card, border:`1px solid ${theme.border}`, borderRadius:"0 8px 8px 8px", padding:20 }}>

          {/* STATS TAB */}
          {tab === "stats" && (
            <div style={{ display:"grid", gridTemplateColumns:"260px 1fr", gap:22 }}>
              {/* Left: abilities + saves */}
              <div>
                {/* Bonus breakdown */}
                {(() => {
                  const sData = speciesData;
                  const hasChoices = Object.values(char.speciesAbilityChoices||{}).some(v=>v>0);
                  const hasASI = Object.values(char.asiChoices||{}).some(v=>Object.values(v).some(n=>n>0));
                  if (!sData && !hasASI) return null;
                  const rows = [];
                  if (sData && Object.keys(sData.abilityBonuses||{}).some(ab=>sData.abilityBonuses[ab]>0))
                    rows.push({ label:`${char.species} (fixed)`, vals: sData.abilityBonuses });
                  if (hasChoices)
                    rows.push({ label:`${char.species} (choice)`, vals: char.speciesAbilityChoices });
                  Object.entries(char.asiChoices||{}).filter(([,v])=>Object.values(v).some(n=>n>0))
                    .forEach(([feat,vals]) => rows.push({ label:`ASI: ${feat}`, vals }));
                  if (rows.length === 0) return null;
                  return (
                    <div style={{ marginBottom:14 }}>
                      <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, marginBottom:8 }}>Bonus Breakdown</div>
                      <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, overflow:"hidden" }}>
                        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                          <thead>
                            <tr style={{ background:"rgba(0,0,0,0.2)" }}>
                              <td style={{ padding:"4px 8px", color:"var(--text-dim)" }}>Source</td>
                              {Object.keys(char.abilities).map(ab=><td key={ab} style={{ padding:"4px 6px", textAlign:"center", color:"var(--text-dim)", textTransform:"uppercase" }}>{ABILITY_SHORT[ab]}</td>)}
                            </tr>
                          </thead>
                          <tbody>
                            {rows.map((row,i)=>(
                              <tr key={i} style={{ borderTop:"1px solid var(--border)" }}>
                                <td style={{ padding:"4px 8px", color:"var(--text-muted)", whiteSpace:"nowrap", maxWidth:90, overflow:"hidden", textOverflow:"ellipsis" }}>{row.label}</td>
                                {Object.keys(char.abilities).map(ab=>{ const v=row.vals[ab]||0; return <td key={ab} style={{ padding:"4px 6px", textAlign:"center", color:v>0?"var(--success)":"var(--text-dim)", fontFamily:"var(--font-display)" }}>{v>0?`+${v}`:""}</td>; })}
                              </tr>
                            ))}
                            <tr style={{ borderTop:"2px solid var(--accent2)" }}>
                              <td style={{ padding:"4px 8px", color:"var(--accent)", fontFamily:"var(--font-display)", fontSize:11 }}>TOTAL</td>
                              {Object.keys(char.abilities).map(ab=>{
                                const t = char.abilities[ab]; // already finalised on sheet
                                const over = t > 20;
                                return <td key={ab} style={{ padding:"4px 6px", textAlign:"center", fontFamily:"var(--font-display)", color: over?"var(--danger)":"var(--accent)", fontSize:14 }}>
                                  {t}
                                  {over&&<div style={{ fontSize:9, color:"var(--danger)" }}>⚠ over cap</div>}
                                </td>;
                              })}
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                })()}

                <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, marginBottom:10 }}>Ability Scores</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:9 }}>
                  {Object.keys(char.abilities).map(ab => {
                    const score = char.abilities[ab];
                    return (
                      <div key={ab} style={{ textAlign:"center", padding:12, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:12 }}>
                        <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{ABILITY_SHORT[ab]}</div>
                        <div style={{ fontSize:28, fontFamily:"var(--font-display)", color:"var(--accent)", width:50, height:50, borderRadius:"50%", border:"2px solid var(--accent2)", display:"flex", alignItems:"center", justifyContent:"center", margin:"7px auto" }}>{score}</div>
                        <div style={{ fontSize:15, color:"var(--text)" }}>{modStr(calcMod(score))}</div>
                      </div>
                    );
                  })}
                </div>

                <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, margin:"18px 0 8px" }}>Saving Throws</div>
                <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                  {Object.entries(saves).map(([ab, sv]) => (
                    <div key={ab} style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 10px", background:"var(--surface)", borderRadius:6, border:"1px solid var(--border)" }}>
                      <span style={{ width:10, height:10, borderRadius:"50%", flexShrink:0, display:"inline-block",
                        background: sv.proficient ? "var(--accent)" : "transparent",
                        border:`2px solid ${sv.proficient ? "var(--accent)" : "var(--border)"}` }} />
                      <span style={{ flex:1, fontSize:13 }}>{ABILITY_NAMES[ab]}</span>
                      <span style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:14 }}>{modStr(sv.value)}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Right: HP, skills, proficiencies */}
              <div>
                <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, marginBottom:8 }}>Hit Points</div>
                <HPTracker hp={char.hp} onUpdate={hp => upd({ ...char, hp })} />

                <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, margin:"18px 0 8px" }}>Skills</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:5 }}>
                  {Object.entries(skills).map(([sk, d]) => (
                    <div key={sk} style={{ display:"flex", alignItems:"center", gap:6, padding:"5px 10px", background:"var(--surface)", borderRadius:6, border:"1px solid var(--border)" }}>
                      <span style={{ width:10, height:10, flexShrink:0, display:"inline-block",
                        borderRadius: d.expertise ? 0 : "50%", transform: d.expertise ? "rotate(45deg)" : "none",
                        background: d.proficient || d.expertise ? "var(--accent)" : "transparent",
                        border:`2px solid ${d.proficient || d.expertise ? "var(--accent)" : "var(--border)"}` }} />
                      <span style={{ flex:1, fontSize:12, color: d.proficient ? "var(--text)" : "var(--text-muted)" }}>{sk}</span>
                      <span style={{ fontSize:10, color:"var(--text-dim)" }}>({ABILITY_SHORT[SKILLS_MAP[sk]]})</span>
                      <span style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13, minWidth:28, textAlign:"right" }}>{modStr(d.value)}</span>
                    </div>
                  ))}
                </div>

                {classData && (
                  <>
                    <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, margin:"18px 0 8px" }}>Proficiencies</div>
                    <div style={{ padding:12, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:8, fontSize:13, lineHeight:1.9 }}>
                      <div><span style={{ color:"var(--text-muted)" }}>Armor: </span>{(classData.armorProficiencies || []).join(", ") || "None"}</div>
                      <div><span style={{ color:"var(--text-muted)" }}>Weapons: </span>{(classData.weaponProficiencies || []).join(", ")}</div>
                      <div><span style={{ color:"var(--text-muted)" }}>Saves: </span>{(classData.savingThrows || []).map(ab => ABILITY_NAMES[ab]).join(", ")}</div>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

          {tab === "spells"    && <SpellsTab    char={char} gameData={gameData} onUpdate={upd} />}
          {tab === "inventory" && <InventoryTab  char={char} gameData={gameData} onUpdate={upd} />}
          {tab === "features"  && <FeaturesTab   char={char} gameData={gameData} />}
          {tab === "notes"     && <NotesTab       char={char} onUpdate={upd} />}
          {tab === "settings"  && <SettingsTab    char={char} gameData={gameData} onUpdate={upd} />}
        </div>
      </div>
    </TW>
  );
}

// ============================================================
// CHARACTER CARD (home screen)
// ============================================================
function CharacterCard({ char, gameData, onClick }) {
  const { themes } = gameData;
  const theme = themes?.[char.theme] || themes?.[Object.keys(themes || {})[0]] || {};
  const hp    = char.hp || { current:0, max:1 };
  const pct   = Math.min(100, (hp.current / Math.max(1, hp.max)) * 100);
  const hpC   = pct > 50 ? theme.success : pct > 25 ? "#f39c12" : theme.danger;
  const label = char.subclass ? `${char.class} (${char.subclass})` : char.class;

  return (
    <div onClick={onClick} style={{ background:theme.card, border:`1px solid ${theme.border}`, borderRadius:14, padding:20, cursor:"pointer", transition:"all 0.22s", position:"relative", overflow:"hidden" }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = theme.accent; e.currentTarget.style.transform = "translateY(-3px)"; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = theme.border; e.currentTarget.style.transform = "translateY(0)"; }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:3, background:`linear-gradient(90deg,${theme.accent},${theme.accentSecondary || theme.accent})` }} />
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
        <div>
          <div style={{ fontFamily:theme.fontDisplay, color:theme.accent, fontSize:20, lineHeight:1.2 }}>{char.name}</div>
          <div style={{ fontSize:13, color:theme.textMuted, marginTop:4 }}>
            <span style={{ color:theme.text }}>{char.species}</span>
            {char.species && label ? " · " : ""}<span>{label}</span>
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontFamily:theme.fontDisplay, color:theme.accent, fontSize:28 }}>{char.level}</div>
          <div style={{ fontSize:10, color:theme.textMuted, textTransform:"uppercase", letterSpacing:1 }}>Level</div>
        </div>
      </div>
      <div style={{ marginBottom:12 }}>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:theme.textMuted, marginBottom:4 }}>
          <span>Hit Points</span><span style={{ color:hpC }}>{hp.current}/{hp.max}</span>
        </div>
        <div style={{ height:5, background:theme.bg, borderRadius:3, overflow:"hidden" }}>
          <div style={{ height:"100%", width:`${pct}%`, background:hpC, borderRadius:3, transition:"width 0.3s" }} />
        </div>
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
        <span style={{ color:theme.textMuted }}>{char.background}</span>
        <div style={{ display:"flex", gap:8 }}>
          {char.music && char.music !== "none" && <span>🎵</span>}
          <span style={{ color:theme.textDim }}>{char.alignment}</span>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// ROOT APP
// ============================================================
function App() {
  const { data:gameData, error } = useGameData();
  const [characters, setCharacters] = useState(() => loadChars());
  const [view,   setView]   = useState("home");
  const [selId,  setSelId]  = useState(null);
  const selChar = characters.find(c => c.id === selId);

  // Loading
  if (!gameData && !error) return (
    <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0", fontFamily:"serif" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"#c9a227", fontSize:28, marginBottom:12 }}>⚔️ Tome of Heroes</div>
        <div style={{ color:"#8a8070" }}>Loading game data…</div>
      </div>
    </div>
  );

  // Error
  if (error) return (
    <div style={{ background:"#0d0d0f", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"#e8e0d0", fontFamily:"serif" }}>
      <div style={{ textAlign:"center", maxWidth:560, padding:32 }}>
        <div style={{ fontSize:48, marginBottom:16 }}>⚠️</div>
        <div style={{ fontFamily:"'Cinzel Decorative',serif", color:"#c9a227", fontSize:22, marginBottom:12 }}>Could Not Load Game Data</div>
        <div style={{ background:"#1a0a0a", border:"1px solid #5a1a1a", borderRadius:8, padding:16, marginBottom:20, fontSize:13, color:"#c0392b", textAlign:"left", fontFamily:"monospace", wordBreak:"break-all" }}>{error}</div>
        <div style={{ color:"#8a8070", fontSize:14, lineHeight:1.8 }}>
          Make sure <strong style={{ color:"#c9a227" }}>tome-data.json</strong> is in the same folder and you are using a local server.<br />
          Quick server: <code style={{ color:"#c9a227" }}>python -m http.server 8000</code><br />
          Then visit: <code style={{ color:"#c9a227" }}>http://localhost:8000</code><br />
          Validate JSON: <strong style={{ color:"#c9a227" }}>jsonlint.com</strong>
        </div>
      </div>
    </div>
  );

  const saveChar = char => {
    const upd = characters.find(c => c.id === char.id)
      ? characters.map(c => c.id === char.id ? char : c)
      : [...characters, char];
    setCharacters(upd); saveChars(upd); setSelId(char.id); setView("sheet");
  };
  const delChar = id => {
    const upd = characters.filter(c => c.id !== id);
    setCharacters(upd); saveChars(upd); setView("home");
  };

  if (view === "create") return <CharacterCreationWizard gameData={gameData} onSave={saveChar} onCancel={() => setView("home")} />;
  if (view === "sheet" && selChar) return <CharacterSheet char={selChar} gameData={gameData} onBack={() => setView("home")} onDelete={delChar} />;

  const themes = gameData.themes || {};
  const dt     = themes[Object.keys(themes)[0]] || {};

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Philosopher:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
      `}</style>
      <div style={{ background:dt.bg || "#0d0d0f", minHeight:"100vh", fontFamily:dt.fontBody || "serif", color:dt.text || "#e8e0d0" }}>

        {/* Hero banner */}
        <div style={{ background:dt.gradientHero || dt.bg, borderBottom:`1px solid ${dt.border}`, padding:"42px 24px 34px", textAlign:"center", position:"relative", overflow:"hidden" }}>
          <div style={{ position:"absolute", inset:0, opacity:0.03,
            backgroundImage:"repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(201,162,39,0.5) 40px,rgba(201,162,39,0.5) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(201,162,39,0.5) 40px,rgba(201,162,39,0.5) 41px)" }} />
          <div style={{ fontFamily:dt.fontDisplay, fontSize:"clamp(26px,5vw,50px)", color:dt.accent, letterSpacing:2, textShadow:`0 0 40px ${dt.accentSecondary}`, position:"relative" }}>
            ⚔️ TOME OF HEROES
          </div>
          <div style={{ color:dt.textMuted, fontSize:15, marginTop:8, fontStyle:"italic", position:"relative" }}>Your personal D&amp;D 5e character compendium</div>
          <button onClick={() => setView("create")} style={{
            marginTop:24, padding:"14px 36px", background:dt.accent, border:"none", color:dt.bg || "#0d0d0f",
            borderRadius:10, cursor:"pointer", fontFamily:dt.fontDisplay, fontSize:16, letterSpacing:1,
            boxShadow:`0 4px 20px ${dt.accentSecondary}`, transition:"all 0.2s", position:"relative"
          }}
            onMouseEnter={e => e.currentTarget.style.transform = "scale(1.04)"}
            onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"}>
            + Create New Character
          </button>
        </div>

        {/* Character grid */}
        <div style={{ maxWidth:1100, margin:"0 auto", padding:"32px 24px" }}>
          {characters.length === 0 ? (
            <div style={{ textAlign:"center", padding:"80px 20px" }}>
              <div style={{ fontSize:64, marginBottom:18 }}>📖</div>
              <div style={{ fontFamily:dt.fontDisplay, fontSize:24, color:dt.textMuted, marginBottom:10 }}>The tome is empty</div>
              <div style={{ color:dt.textDim, fontSize:15 }}>Create your first character to begin your adventure</div>
            </div>
          ) : (
            <>
              <div style={{ fontFamily:dt.fontDisplay, color:dt.textMuted, fontSize:12, textTransform:"uppercase", letterSpacing:2, marginBottom:18 }}>
                {characters.length} {characters.length === 1 ? "Hero" : "Heroes"} Registered
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))", gap:18 }}>
                {characters.map(c => <CharacterCard key={c.id} char={c} gameData={gameData} onClick={() => { setSelId(c.id); setView("sheet"); }} />)}
              </div>
            </>
          )}
        </div>

        <div style={{ textAlign:"center", padding:20, borderTop:`1px solid ${dt.border}`, color:dt.textDim, fontSize:12, fontStyle:"italic" }}>
          Tome of Heroes • Edit <strong style={{ color:dt.textMuted }}>tome-data.json</strong> to customise species, classes, spells, themes &amp; more
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
