      8%   { opacity: 1; }

      100% { transform: translateY(-130vh)   translateX(18px)  rotate(20deg); opacity: 0; }

    @keyframes floatUpSway {
      0%   { transform: translateY(0)        translateX(0px)   rotate(0deg);  opacity: 0; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Data loader ──
const useGameData = () => {
  const [data, setData]   = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => {
    fetch("./tome-data.json")
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status} — could not load tome-data.json`); return r.json(); })
      .then(setData)
      .catch(err => setError(err.message));
  }, []);
  return { data, error };
};

// ── Constants ──
const ABILITY_NAMES = { str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma" };
const ABILITY_SHORT = { str:"STR",dex:"DEX",con:"CON",int:"INT",wis:"WIS",cha:"CHA" };
const SKILLS_MAP = {
  Acrobatics:"dex","Animal Handling":"wis",Arcana:"int",Athletics:"str",
  Deception:"cha",History:"int",Insight:"wis",Intimidation:"cha",
  Investigation:"int",Medicine:"wis",Nature:"int",Perception:"wis",
  Performance:"cha",Persuasion:"cha",Religion:"int","Sleight of Hand":"dex",
  Stealth:"dex",Survival:"wis"
};

// ── Math helpers ──
const calcMod   = s => Math.floor((s - 10) / 2);
const modStr    = m => m >= 0 ? `+${m}` : `${m}`;
const profBonus = l => Math.ceil(l / 4) + 1;
const calcHP    = (cd, level, conMod) => Math.max(1, (cd.hitDie + conMod) + Math.floor((cd.hitDie / 2) + 1 + conMod) * (level - 1));
// ── Armor / weapon helpers ──

// Look up an item's library entry by name (checks armor, weapons, gear libraries)
const lookupLibraryItem = (itemName, gameData) => {
  const name = itemName?.toLowerCase().trim();
  if (!name) return null;
  for (const a of gameData?.armor || [])   if (a.name.toLowerCase() === name) return { ...a, _lib:"armor" };
  for (const w of gameData?.weapons || []) if (w.name.toLowerCase() === name) return { ...w, _lib:"weapon" };
  for (const g of gameData?.gear || [])    if (g.name.toLowerCase() === name) return { ...g, _lib:"gear" };
  return null;
};

// Check if a character is proficient with an item given their class/subclass
const isItemProficient = (item, char, classes) => {
  const cd = classes?.[char.class];
  if (!cd) return false;
  const allProfs = [
    ...(cd.armorProficiencies || []),
    ...(cd.weaponProficiencies || []),
    ...(cd.toolProficiencies || []),
  ];
  const subProfs = char.subclass ? [
    ...(cd.subclasses?.[char.subclass]?.armorProficiencies || []),
    ...(cd.subclasses?.[char.subclass]?.weaponProficiencies || []),
  ] : [];
  const combined = [...allProfs, ...subProfs].map(p => p.toLowerCase());

  // Direct name match
  if (combined.includes(item.name?.toLowerCase())) return true;
  // Proficiency group match (e.g. "Simple", "Martial", "Light", "Medium")
  const pg = item.proficiencyGroup?.toLowerCase();
  if (pg && combined.some(p => p.includes(pg))) return true;
  // Category-based fallbacks
  if (["simpleWeapon","simpleRanged"].includes(item.category) && combined.some(p => p.includes("simple"))) return true;
  if (["martialWeapon","martialRanged"].includes(item.category) && combined.some(p => p.includes("martial"))) return true;
  if (item.category === "lightArmor"  && combined.some(p => p.includes("light"))) return true;
  if (item.category === "mediumArmor" && (combined.some(p => p.includes("medium")) || combined.some(p => p.includes("all armor")))) return true;
  if (item.category === "heavyArmor"  && (combined.some(p => p.includes("heavy")) || combined.some(p => p.includes("all armor")))) return true;
  if (item.category === "shield"      && combined.some(p => p.includes("shield"))) return true;
  return false;
};

// Full AC calculation using armor library
const calcAC = (char, gameData) => {
  const dex = calcMod(char.abilities?.dex || 10);
  const con = calcMod(char.abilities?.con || 10);
  const wis = calcMod(char.abilities?.wis || 10);
  const equipped = (char.inventory || []).filter(i => i.equipped);

  // Find equipped armor and shield from library
  let bodyArmor = null, hasShield = false, shieldAC = 2;
  for (const item of equipped) {
    const lib = lookupLibraryItem(item.name, gameData);
    if (!lib) continue;
    if (lib._lib === "armor") {
      if (lib.category === "shield") { hasShield = true; shieldAC = lib.acBase || 2; }
      else bodyArmor = lib;
    }
    // Fallback: type-tagged armor
    if (!lib && item.type === "shield") hasShield = true;
  }
  // Also check type-tagged items without library entries
  if (!hasShield && equipped.some(i => i.type === "shield")) hasShield = true;
  if (!bodyArmor && equipped.some(i => i.type === "armor")) {
    // Rough fallback: assume leather (11+dex)
    bodyArmor = { acBase:11, acDexCap:null, category:"lightArmor" };
  }

  let ac;
  if (bodyArmor) {
    if (bodyArmor.acDexCap === 0) {
      ac = bodyArmor.acBase; // Heavy — no dex
    } else if (bodyArmor.acDexCap != null) {
      ac = bodyArmor.acBase + Math.min(dex, bodyArmor.acDexCap); // Medium — capped dex
    } else {
      ac = bodyArmor.acBase + dex; // Light — full dex
    }
  } else {
    // Unarmored
    if (char.class === "Barbarian") ac = 10 + dex + con;
    else if (char.class === "Monk") ac = 10 + dex + wis;
    else ac = 10 + dex;
  }
  if (hasShield) ac += shieldAC;
  return ac;
};

// Returns stealth disadvantage status from equipped armor
const hasStealthDisadvantage = (char, gameData) => {
  return (char.inventory || [])
    .filter(i => i.equipped)
    .some(i => {
      const lib = lookupLibraryItem(i.name, gameData);
      return lib?.stealthDisadvantage === true;
    });
};

// Strength requirement not met?
const strRequirementMet = (char, gameData) => {
  const issues = (char.inventory || [])
    .filter(i => i.equipped)
    .map(i => {
      const lib = lookupLibraryItem(i.name, gameData);
      if (lib?.strengthReq && (char.abilities?.str || 10) < lib.strengthReq)
        return `${i.name} requires STR ${lib.strengthReq}`;
      return null;
    }).filter(Boolean);
  return issues;
};


// ── Spellcasting helpers ──
// Returns the effective spellcasting info for a character, checking class then subclass
const getSpellcastingInfo = (char, classes) => {
  const cd = classes?.[char.class];
  if (!cd) return null;
  // Full class spellcaster
  if (cd.spellcaster) return {
    ability: cd.spellcastingAbility,
    table: cd.spellcastingTable,
    spellList: char.class,
  };
  // Subclass spellcaster (Eldritch Knight, Arcane Trickster)
  const sub = char.subclass && cd.subclasses?.[char.subclass];
  if (sub?.spellcaster) return {
    ability: sub.spellcastingAbility,
    table: sub.spellcastingTable,
    spellList: sub.spellcastingTable?.spellList || char.class,
  };
  return null;
};

// Get the row from the spellcasting table for this character's level
const getSpellcastingRow = (info, level) => {
  if (!info?.table?.table) return null;
  return info.table.table[String(level)] || null;
};

// Compute limits: { cantripsKnown, spellsKnown, isPrepared, maxSlotLevel, slots[], pact }
const getSpellLimits = (char, classes) => {
  const info = getSpellcastingInfo(char, classes);
  if (!info) return null;
  const row = getSpellcastingRow(info, char.level);
  if (!row) return null;

  const type = info.table?.type;
  const ab = info.ability;
  const mod = calcMod(char.abilities[ab] || 10);
  const lvl = char.level || 1;

  // Max slot level = highest level with >0 slots
  const slots = row.slots || [];
  const maxSlotLevel = slots.reduce((max, count, idx) => count > 0 ? idx + 1 : max, 0);

  let spellsKnown = null;
  let isPrepared = false;
  let preparedCount = null;

  if (type === "known" || type === "known_third") {
    spellsKnown = row.spellsKnown || 0;
  } else if (type === "prepared") {
    isPrepared = true;
    const formula = info.table.preparedFormula || "level + abilityModifier";
    if (formula.includes("halfLevel")) {
      preparedCount = Math.max(1, Math.ceil(lvl / 2) + mod);
    } else {
      preparedCount = Math.max(1, lvl + mod);
    }
    spellsKnown = preparedCount;
  } else if (type === "pact") {
    spellsKnown = row.spellsKnown || 0;
  }

  return {
    cantripsKnown: row.cantrips || 0,
    spellsKnown,
    isPrepared,
    preparedCount,
    maxSlotLevel,
    slots,
    type,
    ability: ab,
    pactSlotLevel: row.pactSlotLevel || null,
    pactSlots: row.pactSlots || null,
    spellList: info.spellList,
  };
};

const calcSpellDC  = (char, classes) => {
  const info = getSpellcastingInfo(char, classes);
  if (!info) return null;
  return 8 + profBonus(char.level) + calcMod(char.abilities[info.ability] || 10);
};
const calcSpellAtk = (char, classes) => {
  const info = getSpellcastingInfo(char, classes);
  if (!info) return null;
  return profBonus(char.level) + calcMod(char.abilities[info.ability] || 10);
};

// Produces a compact combat line for inline display on spell cards, e.g.:
// "Ranged spell attack • 1d10 fire • +1d10 at 5th/11th/17th"
// "Con save • 2d8 thunder • +1d8 per slot • pushed 10 ft on fail"
// charLevel is used to show current cantrip damage tier
const spellCombatLine = (spell, charLevel) => {
  const c = spell.combat;
  if (!c) return null;
  const parts = [];

  // Attack type
  if (c.attack === "ranged") parts.push("Ranged spell attack");
  else if (c.attack === "melee") parts.push("Melee spell attack");
  else if (c.save) parts.push(`${ABILITY_SHORT[c.save] || c.save.toUpperCase()} save`);

  // Damage / healing — apply cantrip scaling
  if (c.damage) {
    let dmg = c.damage;
    if (c.cantripScale) {
      // Standard cantrip scaling: +1 die at 5th, 11th, 17th
      const tiers = [1, 5, 11, 17];
      const tier = tiers.filter(t => (charLevel || 1) >= t).length;
      // tier 1 = base, tier 2 = 2x, etc.
      const base = c.cantripScale; // e.g. "1d10"
      const match = base.match(/^(\d+)(d\d+)$/);
      if (match) {
        dmg = `${tier}${match[2]}`;
      }
    }
    parts.push(`${dmg} ${c.damageType || ""}`.trim());
  } else if (c.healing) {
    parts.push(`Heals ${c.healing}${c.healSlotScale ? ` (${c.healSlotScale})` : ""}`);
  }

  // Slot scaling
  if (c.slotScale && !c.cantripScale) parts.push(c.slotScale + " per slot");
  // Cantrip scaling note
  if (c.cantripScale) {
    const lvl = charLevel || 1;
    const nextTier = lvl < 5 ? 5 : lvl < 11 ? 11 : lvl < 17 ? 17 : null;
    if (nextTier) parts.push(`+1 die at ${nextTier}th`);
  }

  // Notes
  if (c.notes) parts.push(c.notes);

  return parts.length > 0 ? parts.join(" • ") : null;
};


const getSavingThrows = (char, classes) => {
  const cd = classes?.[char.class], pb = profBonus(char.level);
  return Object.keys(ABILITY_NAMES).reduce((acc, ab) => {
    const mod = calcMod(char.abilities[ab]), prof = cd?.savingThrows?.includes(ab) || false;
    acc[ab] = { value: mod + (prof ? pb : 0), proficient: prof };
    return acc;
  }, {});
};
const getSkillBonuses = char => {
  const pb = profBonus(char.level);
  return Object.keys(SKILLS_MAP).reduce((acc, skill) => {
    const ab = SKILLS_MAP[skill], mod = calcMod(char.abilities[ab]);
    const prof = char.skillProficiencies?.includes(skill) || false;
    const exp  = char.skillExpertise?.includes(skill) || false;
    acc[skill] = { value: mod + (exp ? pb * 2 : prof ? pb : 0), proficient: prof, expertise: exp };
    return acc;
  }, {});
};

// ── Theme wrapper ──
const TW = ({ themeKey, themes, children, charCustom }) => {
  const t = themes?.[themeKey] || themes?.[Object.keys(themes || {})[0]] || {};
  // charCustom overrides individual tokens if set
  const cc = charCustom || {};
  const bg  = cc.bgColor  || t.bg      || "#0d0d0f";
  const g1  = cc.bgG1    || "rgba(60,20,100,0.22)";
  const g2  = cc.bgG2    || "rgba(80,40,10,0.18)";
  const accent = cc.accentColor|| t.accent  || "#c9a227";

  const fontB  = cc.fontBody   || t.fontBody    || "serif";

    <div style={{
      "--bg":bg,"--surface":t.surface,"--card":t.card,"--border":t.border,

  );
};

const ws = {

// ============================================================
// SKILL PICKER — source-aware: shows skills already taken by
// other sources, lets this source claim/displace them
// ============================================================
// skillSources: { "Perception": "Class", "Stealth": "Background" ... }
// thisSource:   label for this picker e.g. "Bard Class" or "College of Lore"
// ownedByThis:  skills currently owned by THIS source
function SkillPicker({ title, count, from, allSkills, current, onToggle, skillSources, thisSource, ownedByThis }) {
  const pool = from === "all" ? allSkills : (from || []);
  const sel  = ownedByThis || current || [];  // skills this source has picked
  const remaining = count - sel.length;
  return (
    <div>
      <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
        {title} — choose <strong style={{ color:"var(--accent)" }}>{count}</strong>
        {remaining > 0
          ? <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({remaining} remaining)</span>
          : <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>}
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:6 }}>
        {pool.map(skill => {
          const ownedHere  = sel.includes(skill);
          const otherSource = skillSources && !ownedHere ? skillSources[skill] : null;
          const canAdd = ownedHere || sel.length < count;
          return (
            <div key={skill} onClick={() => canAdd && onToggle(skill)} style={{
              display:"flex", alignItems:"center", gap:8, padding:"7px 12px", borderRadius:6,
              transition:"all 0.15s", cursor: canAdd ? "pointer" : "not-allowed",
              background: ownedHere ? "rgba(201,162,39,0.08)" : otherSource ? "rgba(41,128,185,0.08)" : "var(--surface)",
              border:`1px solid ${ownedHere ? "var(--accent)" : otherSource ? "var(--info)" : "var(--border)"}`,
              opacity: !canAdd && !otherSource ? 0.4 : 1
            }}>
              <span style={{ width:12, height:12, borderRadius:"50%", flexShrink:0, display:"inline-block",
                background: ownedHere ? "var(--accent)" : otherSource ? "var(--info)" : "transparent",
                border:`2px solid ${ownedHere ? "var(--accent)" : otherSource ? "var(--info)" : "var(--border)"}` }}/>
              <span style={{ fontSize:13, flex:1 }}>{skill}</span>
              <span style={{ fontSize:10, color:"var(--text-muted)" }}>({ABILITY_SHORT[SKILLS_MAP[skill] || "str"]})</span>
              {otherSource && (
                <span style={{ fontSize:10, color:"var(--info)", marginLeft:4, fontStyle:"italic" }}>via {otherSource}</span>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// FEATURE PANEL — source-aware, completion-highlighted,
// ASI-capable interactive feature panel
// ============================================================
function FeaturePanel({ feature, locked, choices, onChoice, skillProfs, onSkillToggle,
    expertiseProfs, onExpertiseToggle, allSkills, languages, languageSources,
    onLanguageChoice, languageList, autoLanguages, thisLanguageSource,
    subclass, onSubclassChoice, subclasses, source,
    asiChoices, onAsiChange, currentAbilities, skillSources, thisSource,
    gameData, charLevel, racialSpells, onRacialSpellToggle, featChoices, onFeatChoice }) {

  const [open, setOpen] = useState(!locked);
  const chosen = choices?.[feature.name];

  // ── Completeness ──
  const isComplete = (() => {
    if (locked) return true;
    switch (feature.type) {
      case "passive":            return true;
      case "choice":             return !!chosen;
      case "subclass_choice":    return !!subclass;
      case "proficiency_choice": {
        const owned = skillSources && thisSource
          ? Object.entries(skillSources).filter(([,s]) => s === thisSource).map(([sk]) => sk)
          : (skillProfs || []);
        return owned.length >= (feature.count || 0);
      }
      case "expertise_choice":   return (expertiseProfs || []).length >= (feature.count || 0);
      case "language_choice":    {
        const autoL = autoLanguages || [];
        const src = thisLanguageSource || "";
        const myPicks = (languages || []).filter(l => (languageSources||{})[l] === src && !autoL.includes(l));
        return myPicks.length >= (feature.count || 0);
      }
      case "asi":                {
        // Complete if: feat chosen OR ability scores filled
        if (featChoices?.[feature.name]) return true;
        return (Object.values(asiChoices?.[feature.name] || {}).reduce((s,v)=>s+v,0)) >= 2;
      }
      case "asi_points":         return Object.values(asiChoices?.[feature.name] || {}).filter(v=>v>0).length >= (feature.points || 2);
      case "spell_choice":       {
        const myGrants = (racialSpells || []).filter(s => s.sourceFeature === feature.name);
        return myGrants.length >= (feature.count || 1);
      }
      case "spell_grant":        return true; // auto-granted, always complete
      default:                   return true;
    }
  })();


  return (
    <div style={{ padding:"14px 16px", borderRadius:8, marginBottom:10, opacity: locked ? 0.55 : 1,
      border:`1px solid ${locked ? "var(--border)" : !isComplete ? "#e67e22" : "var(--border)"}`,
      background: locked ? "rgba(0,0,0,0.2)" : !isComplete ? "rgba(230,126,34,0.05)" : "var(--surface)" }}>

      <div style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer" }} onClick={() => setOpen(o => !o)}>
        <span style={{ fontFamily:"var(--font-display)", color: locked ? "var(--text-dim)" : "var(--accent)", fontSize:14, flex:1 }}>
          {feature.name}
        </span>
        {source && !locked && (
          <span style={{ fontSize:10, padding:"1px 7px", borderRadius:10, background:"rgba(155,89,182,0.15)", border:"1px solid #9b59b6", color:"#9b59b6", whiteSpace:"nowrap" }}>
            {source}
          </span>
        )}
        {locked && <span style={{ display:"inline-block", padding:"1px 8px", borderRadius:10, background:"rgba(255,255,255,0.06)", border:"1px solid var(--border)", color:"var(--text-dim)", fontSize:10 }}>Lvl {feature.level}</span>}
        {!locked && !isComplete && <span style={{ fontSize:10, padding:"1px 8px", borderRadius:10, background:"rgba(230,126,34,0.15)", border:"1px solid #e67e22", color:"#e67e22", whiteSpace:"nowrap" }}>⚠ incomplete</span>}
        {!locked && isComplete && feature.type !== "passive" && <span style={{ fontSize:10, padding:"1px 8px", borderRadius:10, background:"rgba(39,174,96,0.15)", border:"1px solid var(--success)", color:"var(--success)" }}>✓</span>}
        {!locked && chosen && feature.type === "choice" && (
          <span style={{ fontSize:10, color:"var(--text-muted)", maxWidth:120, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{chosen.split("—")[0].trim()}</span>
        )}
        {!locked && subclass && feature.type === "subclass_choice" && (
          <span style={{ fontSize:10, color:"var(--text-muted)" }}>{subclass}</span>
        )}
        <span style={{ color:"var(--text-dim)", fontSize:11 }}>{open ? "▲" : "▼"}</span>
      </div>

      {open && (
        <div style={{ marginTop:12, paddingTop:12, borderTop:"1px solid var(--border)" }}>
          <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.6, margin:"0 0 12px" }}>{feature.description}</p>

          {/* Simple choice */}
          {!locked && feature.type === "choice" && feature.options && (
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))", gap:8 }}>
              {feature.options.map(opt => (
                <div key={opt} onClick={() => onChoice(feature.name, opt)} style={{
                  padding:"8px 12px", borderRadius:8, cursor:"pointer", fontSize:13, transition:"all 0.15s",
                  border:`1px solid ${chosen === opt ? "var(--accent)" : "var(--border)"}`,
                  background: chosen === opt ? "rgba(201,162,39,0.1)" : "var(--surface)",
                  color: chosen === opt ? "var(--accent)" : "var(--text)"
                }}>
                  {chosen === opt && "✓ "}{opt}
                </div>
              ))}
            </div>
          )}

          {/* Subclass choice */}
          {!locked && feature.type === "subclass_choice" && subclasses && (
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:8 }}>
              {Object.entries(subclasses).map(([sc, scData]) => (
                <div key={sc} onClick={() => onSubclassChoice(sc)} style={{
                  padding:"10px 14px", borderRadius:8, cursor:"pointer", fontSize:13, transition:"all 0.15s",
                  border:`1px solid ${subclass === sc ? "var(--accent)" : "var(--border)"}`,
                  background: subclass === sc ? "rgba(201,162,39,0.1)" : "var(--surface)",
                  color: subclass === sc ? "var(--accent)" : "var(--text)"
                }}>
                  {subclass === sc && "✓ "}{sc}
                  {scData?.features?.[0] && <div style={{ fontSize:11, color:"var(--text-muted)", marginTop:3 }}>{scData.features[0].name}…</div>}
                </div>
              ))}
            </div>
          )}

          {/* Skill proficiency picker */}
          {!locked && feature.type === "proficiency_choice" && (
            <SkillPicker title="Skill proficiencies" count={feature.count}
              from={feature.from} allSkills={allSkills}
              current={skillProfs} onToggle={onSkillToggle}
              skillSources={skillSources} thisSource={thisSource}
              ownedByThis={skillSources && thisSource
                ? Object.entries(skillSources).filter(([,s]) => s === thisSource).map(([sk]) => sk)
                : undefined} />
          )}

          {/* Expertise — only shows currently proficient skills, fixing the stale-state bug */}
          {!locked && feature.type === "expertise_choice" && (
            <div>
              <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
                Choose <strong style={{ color:"var(--accent)" }}>{feature.count}</strong> proficient skills for expertise (×2 prof bonus).
                {(expertiseProfs||[]).length >= feature.count && <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>}
              </div>
              {(skillProfs||[]).length === 0
                ? <p style={{ fontSize:12, color:"var(--text-dim)" }}>Select skill proficiencies first.</p>
                : <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:6 }}>
                    {(skillProfs||[]).map(skill => {
                      const isSel = (expertiseProfs||[]).includes(skill);
                      const canAdd = isSel || (expertiseProfs||[]).length < feature.count;
                      return (
                        <div key={skill} onClick={() => canAdd && onExpertiseToggle(skill)} style={{
                          display:"flex", alignItems:"center", gap:8, padding:"7px 12px", borderRadius:6,
                          cursor: canAdd ? "pointer" : "not-allowed", transition:"all 0.15s",
                          background: isSel ? "rgba(201,162,39,0.12)" : "var(--surface)",
                          border:`1px solid ${isSel ? "var(--accent)" : "var(--border)"}`,
                          opacity: !canAdd ? 0.4 : 1
                        }}>
                          <span style={{ width:12, height:12, borderRadius:0, transform:"rotate(45deg)", flexShrink:0, display:"inline-block",
                            background: isSel ? "var(--accent)" : "transparent",
                            border:`2px solid ${isSel ? "var(--accent)" : "var(--border)"}` }}/>
                          <span style={{ fontSize:13 }}>{skill} ×2</span>
                        </div>
                      );
                    })}
                  </div>
              }
            </div>
          )}

          {/* Language choice */}
          {!locked && feature.type === "language_choice" && (() => {
            const autoLangs = autoLanguages || [];
            const sources   = languageSources || {};
            const mySource  = thisLanguageSource || "";

            // Languages this source has chosen
            const myChosen = (languages || []).filter(l => sources[l] === mySource && !autoLangs.includes(l));
            // Languages chosen by OTHER sources (shown as taken but not mine to deselect)
            const otherChosen = (languages || []).filter(l => sources[l] && sources[l] !== mySource && !autoLangs.includes(l));
            // Languages that were picked by me but are now auto-granted (slot freed)
            const coveredBySpecies = myChosen.filter(l => autoLangs.includes(l)); // shouldn't happen but safety

            const remaining = feature.count - myChosen.length;
            const isComplete = remaining <= 0;

            return (
              <div>
                <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
                  Choose <strong style={{ color:"var(--accent)" }}>{feature.count}</strong> language(s) for <em>{mySource}</em>.
                  {isComplete
                    ? <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>
                    : <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({remaining} remaining)</span>}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:6 }}>
                  {(languageList || []).map(lang => {
                    const isAuto    = autoLangs.includes(lang);
                    const isMine    = myChosen.includes(lang);
                    const isOthers  = otherChosen.includes(lang);
                    // Can add if: not auto, not taken by another source, (mine already OR have remaining slots)
                    const canAdd    = !isAuto && !isOthers && (isMine || remaining > 0);
                    return (
                      <div key={lang} onClick={() => !isAuto && !isOthers && canAdd && onLanguageChoice(lang)} style={{
                        padding:"6px 10px", borderRadius:6, fontSize:13, transition:"all 0.15s",
                        cursor: isAuto || isOthers ? "default" : canAdd ? "pointer" : "not-allowed",
                        background: isAuto
                          ? "rgba(100,100,200,0.12)"
                          : isMine
                            ? "rgba(201,162,39,0.08)"
                            : isOthers
                              ? "rgba(100,100,100,0.08)"
                              : "var(--surface)",
                        border:`1px solid ${isAuto ? "var(--info)" : isMine ? "var(--accent)" : isOthers ? "var(--border)" : "var(--border)"}`,
                        opacity: (!isAuto && !isMine && (!canAdd || isOthers)) ? 0.4 : 1,
                        display:"flex", alignItems:"center", justifyContent:"space-between", gap:4
                      }}>
                        <span>{isAuto ? "🔒 " : isMine ? "✓ " : ""}{lang}</span>
                        {isAuto   && <span style={{ fontSize:10, color:"var(--info)" }}>species</span>}
                        {isOthers && <span style={{ fontSize:10, color:"var(--text-dim)" }}>{sources[lang]}</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}

          {/* ASI — +2 to one ability or +1/+1 to two, capped at 20 */}
          {/* asi rendered inside the feat-or-ASI block below */}

          {/* asi_points — species flexible bonus e.g. Half-Elf +1/+1, stackable */}
          {!locked && feature.type === "asi_points" && (() => {
            const totalPts = feature.points || 2;
            const asi = asiChoices?.[feature.name] || {};
            const spent = Object.values(asi).reduce((s,v)=>s+(v||0),0);
            const rem = totalPts - spent;
            const excluded = feature.exclude || [];
            return (
              <div>
                <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:12 }}>
                  Spend <strong style={{ color:"var(--accent)" }}>{totalPts} point{totalPts>1?"s":""}</strong> — one point per ability, across {totalPts} different abilities{excluded.length?` (not ${excluded.map(ab=>ABILITY_SHORT[ab]).join(", ")})`:""}.
                  {rem > 0 ? <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({rem} point{rem>1?"s":""} left)</span>
                           : <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
                  {Object.keys(ABILITY_NAMES).filter(ab => !excluded.includes(ab)).map(ab => {
                    const base = currentAbilities?.[ab] || 10;
                    const bonus = asi[ab] || 0;
                    const total = base + bonus;
                    const atMax = bonus >= 1;
                    return (
                      <div key={ab} style={{ padding:10, borderRadius:8, textAlign:"center",
                        background:"var(--surface)", border:`1px solid ${bonus>0?"var(--accent)":"var(--border)"}` }}>
                        <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{ABILITY_SHORT[ab]}</div>
                        <div style={{ fontSize:18, fontFamily:"var(--font-display)", color:bonus>0?"var(--accent)":"var(--text)" }}>
                          {total}{bonus>0&&<span style={{ fontSize:12 }}> (+{bonus})</span>}
                        </div>
                        <div style={{ display:"flex", gap:4, justifyContent:"center", marginTop:6 }}>
                          <button onClick={() => { if(bonus<=0)return; onAsiChange(feature.name,{...asi,[ab]:bonus-1}); }}
                            style={{ width:24,height:24,borderRadius:4,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",cursor:bonus>0?"pointer":"not-allowed",fontSize:14,opacity:bonus>0?1:0.3,lineHeight:1 }}>−</button>
                          <button onClick={() => { if(rem<=0||atMax)return; onAsiChange(feature.name,{...asi,[ab]:bonus+1}); }}
                            style={{ width:24,height:24,borderRadius:4,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",cursor:rem>0&&!atMax?"pointer":"not-allowed",fontSize:14,opacity:rem>0&&!atMax?1:0.3,lineHeight:1 }}>+</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}

          {/* spell_grant — racial spells auto-added at certain levels */}
          {feature.type === "spell_grant" && (() => {
            const level = charLevel || 1;
            const allSpells = gameData?.spells || [];
            return (
              <div>
                <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
                  Spells granted by your heritage. They are always known and don't count against your spell limit.
                  {feature.spellcastingAbility && <span style={{ marginLeft:6, color:"var(--accent)" }}>({ABILITY_SHORT[feature.spellcastingAbility]} for spellcasting)</span>}
                </div>
                {(feature.grants || []).map(grant => {
                  const spell = allSpells.find(s => s.name.toLowerCase() === grant.spellName.toLowerCase());
                  const available = level >= (grant.minCharLevel || 1);
                  const isGranted = (racialSpells || []).some(s => s.name === grant.spellName);
                  return (
                    <div key={grant.spellName} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 12px",
                      marginBottom:6, borderRadius:8, background:"var(--surface)",
                      border:`1px solid ${isGranted ? "var(--accent2)" : "var(--border)"}`,
                      opacity: available ? 1 : 0.45 }}>
                      <div style={{ flex:1 }}>
                        <span style={{ fontFamily:"var(--font-display)", color: isGranted ? "var(--accent)" : available ? "var(--text)" : "var(--text-dim)", fontSize:14 }}>
                          {grant.spellName}
                        </span>
                        {spell && <span style={{ fontSize:11, color:"var(--text-dim)", marginLeft:8 }}>{spell.level===0?"Cantrip":`Level ${spell.level}`} • {spell.school}</span>}
                        {!available && <span style={{ fontSize:11, color:"var(--text-dim)", marginLeft:8 }}>unlocks at level {grant.minCharLevel}</span>}
                      </div>
                      {available && !locked && (
                        <button onClick={() => onRacialSpellToggle && onRacialSpellToggle(grant.spellName, feature.name, spell)}
                          style={{ padding:"3px 12px", borderRadius:6, fontSize:12, cursor:"pointer",
                            border:`1px solid ${isGranted?"var(--danger)":"var(--accent)"}`,
                            background: isGranted?"transparent":"var(--accent)",
                            color: isGranted?"var(--danger)":"var(--bg)" }}>
                          {isGranted ? "Remove" : "+ Grant"}
                        </button>
                      )}
                      {isGranted && <span style={{ fontSize:10, color:"var(--accent2)", padding:"2px 6px", border:"1px solid var(--accent2)", borderRadius:4 }}>Racial</span>}
                    </div>
                  );
                })}
              </div>
            );
          })()}

          {/* spell_choice — pick N spells from a class list at a given level */}
          {!locked && feature.type === "spell_choice" && (() => {
            const allSpells = (gameData?.spells || []).filter(s =>
              (s.classes || []).includes(feature.spellList) &&
              (feature.spellLevel !== undefined ? s.level === feature.spellLevel : s.level <= (feature.maxLevel || 9))
            );
            const myGrants = (racialSpells || []).filter(s => s.sourceFeature === feature.name);
            const needed = feature.count || 1;
            const remaining = needed - myGrants.length;
            return (
              <div>
                <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:10 }}>
                  Choose <strong style={{ color:"var(--accent)" }}>{needed}</strong> {feature.spellLevel === 0 ? "cantrip" : "spell"}{needed>1?"s":""} from the {feature.spellList} list.
                  {feature.spellcastingAbility && <span style={{ marginLeft:6, color:"var(--accent)" }}>({ABILITY_SHORT[feature.spellcastingAbility]} for spellcasting)</span>}
                  {remaining > 0
                    ? <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({remaining} remaining)</span>
                    : <span style={{ color:"var(--success)", marginLeft:6 }}>✓ complete</span>}
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:5, maxHeight:240, overflowY:"auto" }}>
                  {allSpells.map(spell => {
                    const alreadyGranted = myGrants.some(s => s.name === spell.name);
                    const alreadyKnown = (feature.allowDuplicate !== true) &&
                      !alreadyGranted && false; // intentional: racial and class spells can overlap
                    const canAdd = alreadyGranted || remaining > 0;
                    return (
                      <div key={spell.name} onClick={() => canAdd && onRacialSpellToggle && onRacialSpellToggle(spell.name, feature.name, spell)}
                        style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                          padding:"7px 10px", borderRadius:7, cursor: canAdd ? "pointer" : "not-allowed",
                          background: alreadyGranted ? "rgba(201,162,39,0.08)" : "var(--surface)",
                          border:`1px solid ${alreadyGranted ? "var(--accent)" : "var(--border)"}`,
                          opacity: !canAdd ? 0.4 : 1 }}>
                        <div>
                          <span style={{ fontFamily:"var(--font-display)", color: alreadyGranted ? "var(--accent)" : "var(--text)", fontSize:13 }}>
                            {alreadyGranted && "✓ "}{spell.name}
                          </span>
                          <span style={{ fontSize:11, color:"var(--text-muted)", marginLeft:8 }}>{spell.school}</span>
                          {spell.combat?.damage && <span style={{ fontSize:11, color:"var(--danger)", marginLeft:8 }}>{spell.combat.damage} {spell.combat.damageType}</span>}
                        </div>
                        <span style={{ fontSize:10, color: alreadyGranted ? "var(--danger)" : "var(--text-dim)" }}>
                          {alreadyGranted ? "× Remove" : "+ Pick"}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}

          {/* Feat-or-ASI toggle on asi features */}
          {!locked && feature.type === "asi" && onFeatChoice && (() => {
            const hasFeat = !!featChoices?.[feature.name];
            const chosenFeat = featChoices?.[feature.name];
            const allFeats = gameData?.feats || [];
            const char = { abilities: currentAbilities || {}, spells: [] }; // minimal char for prereqs

            const meetsPrereqs = feat => {
              if (!feat.prerequisites) return true;
              const prereqs = feat.prerequisites;
              if (prereqs.ability) {
                for (const [ab, min] of Object.entries(prereqs.ability)) {
                  if ((currentAbilities?.[ab] || 10) < min) return false;
                }
              }
              return true;
            };

            return (
              <div style={{ marginTop:10 }}>
                {/* Toggle buttons */}
                <div style={{ display:"flex", gap:8, marginBottom:12 }}>
                  <button onClick={() => { if(hasFeat) onFeatChoice(feature.name, null); }}
                    style={{ padding:"6px 16px", borderRadius:6, cursor:"pointer", fontSize:13,
                      border:`1px solid ${!hasFeat?"var(--accent)":"var(--border)"}`,
                      background:!hasFeat?"var(--accent)":"var(--surface)",
                      color:!hasFeat?"var(--bg)":"var(--text-muted)" }}>
                    +2 / +1+1 Ability Score
                  </button>
                  <button onClick={() => { if(!hasFeat) onFeatChoice(feature.name, "__pending__"); }}
                    style={{ padding:"6px 16px", borderRadius:6, cursor:"pointer", fontSize:13,
                      border:`1px solid ${hasFeat?"var(--accent)":"var(--border)"}`,
                      background:hasFeat?"var(--accent)":"var(--surface)",
                      color:hasFeat?"var(--bg)":"var(--text-muted)" }}>
                    🏆 Take a Feat
                  </button>
                </div>

                {/* ASI widgets — only shown when not taking a feat */}
                {!hasFeat && (() => {
                  const asi = asiChoices?.[feature.name] || {};
                  const spent = Object.values(asi).reduce((s,v)=>s+v,0);
                  const rem = 2 - spent;
                  return (
                    <div>
                      <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:10 }}>
                        Spend <strong style={{ color:"var(--accent)" }}>2 points</strong>: put both in one ability (+2) or split across two (+1/+1).
                        {rem > 0 ? <span style={{ color:"var(--text-dim)", marginLeft:6 }}>({rem} left)</span>
                                 : <span style={{ color:"var(--success)", marginLeft:6 }}>✓</span>}
                      </div>
                      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
                        {Object.keys(ABILITY_NAMES).map(ab => {
                          const bonus = asi[ab] || 0;
                          const total = (currentAbilities?.[ab] || 10) + bonus;
                          const canAdd = rem > 0 && bonus < 2;
                          return (
                            <div key={ab} style={{ padding:8, borderRadius:8, textAlign:"center",
                              background:"var(--surface)", border:`1px solid ${bonus>0?"var(--accent)":"var(--border)"}` }}>
                              <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 }}>{ABILITY_SHORT[ab]}</div>
                              <div style={{ fontSize:16, fontFamily:"var(--font-display)", color:bonus>0?"var(--accent)":"var(--text)" }}>
                                {total}{bonus>0&&<span style={{ fontSize:11 }}> (+{bonus})</span>}
                              </div>
                              <div style={{ display:"flex", gap:4, justifyContent:"center", marginTop:4 }}>
                                <button onClick={()=>{ if(bonus<=0)return; onAsiChange(feature.name,{...asi,[ab]:bonus-1}); }}
                                  style={{ width:22,height:22,borderRadius:4,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",cursor:bonus>0?"pointer":"not-allowed",fontSize:13,opacity:bonus>0?1:0.3,lineHeight:1 }}>−</button>
                                <button onClick={()=>{ if(!canAdd)return; onAsiChange(feature.name,{...asi,[ab]:bonus+1}); }}
                                  style={{ width:22,height:22,borderRadius:4,border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)",cursor:canAdd?"pointer":"not-allowed",fontSize:13,opacity:canAdd?1:0.3,lineHeight:1 }}>+</button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}

                {/* Feat picker */}
                {hasFeat && (
                  <div>
                    {chosenFeat && chosenFeat !== "__pending__" ? (
                      <div style={{ padding:"10px 14px", background:"rgba(201,162,39,0.08)", border:"1px solid var(--accent)", borderRadius:8, marginBottom:10 }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                          <span style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:15 }}>🏆 {chosenFeat}</span>
                          <button onClick={()=>onFeatChoice(feature.name,"__pending__")} style={{ padding:"3px 10px", borderRadius:6, fontSize:12, cursor:"pointer", border:"1px solid var(--border)", background:"transparent", color:"var(--text-muted)" }}>Change</button>
                        </div>
                        {allFeats.find(f=>f.name===chosenFeat)?.description && (
                          <div style={{ fontSize:12, color:"var(--text-muted)", marginTop:6, lineHeight:1.5 }}>
                            {allFeats.find(f=>f.name===chosenFeat).description.slice(0,180)}{allFeats.find(f=>f.name===chosenFeat).description.length>180?"…":""}
                          </div>
                        )}
                        {/* Sub-choice (e.g. Elemental Adept damage type) */}
                        {(() => {
                          const featDef = allFeats.find(f=>f.name===chosenFeat);
                          const sc = featDef?.subChoice;
                          if (!sc) return null;
                          const subKey = `${feature.name}__sub`;
                          const curSub = (featChoices||{})[subKey] || "";
                          return (
                            <div style={{ marginTop:10, paddingTop:10, borderTop:"1px solid var(--accent2)" }}>
                              <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:6 }}>{sc.label}</div>
                              {sc.type === "select" && (
                                <select value={curSub} onChange={e=>onFeatChoice(subKey, e.target.value)} style={{ width:"100%", background:"var(--surface)", border:`1px solid ${curSub?"var(--accent)":"#e67e22"}`, color:"var(--text)", padding:"8px 10px", borderRadius:6, fontSize:13, fontFamily:"var(--font-body)", cursor:"pointer" }}>
                                  <option value="">— choose —</option>
                                  {sc.options.map(o=><option key={o} value={o}>{o}</option>)}
                                </select>
                              )}
                              {(sc.type === "skills" || sc.type === "weapons") && (
                                <div style={{ fontSize:12, color:"var(--text-dim)", fontStyle:"italic" }}>
                                  Choose {sc.count} {sc.type === "skills" ? "skills or tools" : "weapons"} on the relevant section of your sheet.
                                </div>
                              )}
                            </div>
                          );
                        })()}
                      </div>
                    ) : (
                      <div>
                        <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:8 }}>Choose a feat:</div>
                        <div style={{ maxHeight:300, overflowY:"auto", display:"flex", flexDirection:"column", gap:5 }}>
                          {allFeats.map(feat => {
                            const eligible = meetsPrereqs(feat);
                            return (
                              <div key={feat.name} onClick={()=> eligible && onFeatChoice(feature.name, feat.name)}
                                style={{ padding:"8px 12px", borderRadius:8, cursor:eligible?"pointer":"not-allowed",
                                  background:"var(--surface)", border:"1px solid var(--border)",
                                  opacity: eligible ? 1 : 0.4, transition:"all 0.15s" }}
                                onMouseEnter={e=>{ if(eligible) e.currentTarget.style.borderColor="var(--accent)"; }}
                                onMouseLeave={e=>{ e.currentTarget.style.borderColor="var(--border)"; }}>
                                <div style={{ display:"flex", justifyContent:"space-between" }}>
                                  <span style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:13 }}>{feat.name}</span>
                                  {!eligible && <span style={{ fontSize:10, color:"var(--text-dim)" }}>prereqs not met</span>}
                                </div>
                                <div style={{ fontSize:11, color:"var(--text-dim)", marginTop:3, lineHeight:1.4 }}>
                                  {feat.description.slice(0, 120)}{feat.description.length>120?"…":""}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ============================================================
// ABILITY ROLLER
// ============================================================
function AbilityRoller({ abilities, onChange }) {
  const [method, setMethod] = useState("standard");
  const [rolls,  setRolls]  = useState({});
  const [pb, setPb] = useState({ str:8, dex:8, con:8, int:8, wis:8, cha:8 });
  // Standard array pool allocation
  const STANDARD = [15, 14, 13, 12, 10, 8];
  const [assigned, setAssigned] = useState({}); // ab -> value
  const [manualRolls, setManualRolls] = useState({}); // ab -> string input

  // Point Buy
  const PB_COST  = { 8:0, 9:1, 10:2, 11:3, 12:4, 13:5, 14:7, 15:9 };
  const MAX_PTS  = 27;
  const usedPts  = Object.values(pb).reduce((s, v) => s + (PB_COST[v] || 0), 0);

  const rollAll = () => {
    const nr = {}, na = {};
    Object.keys(abilities).forEach(ab => {
      const dice = [1,2,3,4].map(() => Math.floor(Math.random() * 6) + 1).sort((a,b) => a-b);
      nr[ab] = { rolls:dice, total:dice.slice(1).reduce((a,b) => a+b, 0) };
      na[ab] = nr[ab].total;
    });
    setRolls(nr); setManualRolls({}); onChange(na);
  };

  // Standard array: which values are still in the pool
  const usedValues = Object.values(assigned);
  const pool = STANDARD.filter((v, i) => {
    // Allow duplicates in STANDARD correctly
    let used = 0;
    for (const val of usedValues) if (val === v) used++;
    let poolCount = 0;
    for (const sv of STANDARD) if (sv === v) poolCount++;
    return i < poolCount - used + STANDARD.slice(0, i).filter(sv => sv === v).length;
  });
  // Simpler: pool = STANDARD minus one entry per assignment
  const poolRemaining = [...STANDARD];
  for (const v of usedValues) {
    const idx = poolRemaining.indexOf(v);
    if (idx !== -1) poolRemaining.splice(idx, 1);
  }

  const assignStat = (ab, val) => {
    const newAssigned = { ...assigned, [ab]: val };
    setAssigned(newAssigned);
    onChange({ ...abilities, ...Object.fromEntries(Object.entries(newAssigned)) });
  };
  const clearStat = (ab) => {
    const newAssigned = { ...assigned };
    delete newAssigned[ab];
    setAssigned(newAssigned);
    onChange({ ...abilities, [ab]: 8 });
  };

  const mBtn = a => ({ padding:"6px 16px", borderRadius:6, marginRight:8, cursor:"pointer", fontSize:13,
    fontFamily:"var(--font-body)", transition:"all 0.2s",
    border:`1px solid ${a ? "var(--accent)" : "var(--border)"}`,
    background: a ? "var(--accent)" : "transparent", color: a ? "var(--bg)" : "var(--text)" });
  const grid = { display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 };
  const card = { background:"var(--card)", border:"1px solid var(--border)", borderRadius:8, padding:14, marginBottom:10 };
  const lbl  = { fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1 };
  const mod  = { display:"inline-block", padding:"2px 8px", borderRadius:4, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--accent)", fontSize:13, marginLeft:6 };
  const pbB  = { width:28, height:28, borderRadius:4, border:"1px solid var(--border)", background:"var(--surface)", color:"var(--text)", cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" };

  return (
    <div>
      <div style={{ marginBottom:16 }}>
        {[["standard","Standard Array"],["pointbuy","Point Buy"],["roll","Roll Dice"]].map(([m,l]) =>
          <button key={m} style={mBtn(method === m)} onClick={() => setMethod(m)}>{l}</button>)}
      </div>

      {/* ── Standard Array ── */}
      {method === "standard" && (
        <div>
          {/* Pool of remaining values */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:8 }}>
              Available scores — click a stat box to assign, click again to clear:
            </div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {[...new Set(STANDARD)].map(v => {
                const count = poolRemaining.filter(x => x === v).length;
                return count > 0 ? (
                  <div key={v} style={{ padding:"6px 16px", background:"var(--card)", border:"1px solid var(--accent2)", borderRadius:8, fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:18, position:"relative" }}>
                    {v}
                    {count > 1 && <span style={{ position:"absolute", top:-4, right:-4, width:14, height:14, borderRadius:"50%", background:"var(--accent)", fontSize:9, color:"var(--bg)", display:"flex", alignItems:"center", justifyContent:"center" }}>{count}</span>}
                  </div>
                ) : null;
              })}
              {poolRemaining.length === 0 && <span style={{ fontSize:12, color:"var(--success)" }}>✓ All scores assigned</span>}
            </div>
          </div>
          {/* Stat boxes */}
          <div style={grid}>{Object.keys(abilities).map(ab => {
            const val = assigned[ab];
            const isAssigned = val !== undefined;
            return (
              <div key={ab} style={{ ...card, border:`1px solid ${isAssigned ? "var(--accent)" : "var(--border)"}`, cursor:"pointer", position:"relative" }}
                onClick={() => {
                  if (isAssigned) { clearStat(ab); return; }
                  if (poolRemaining.length === 0) return;
                  // Assign the highest remaining value
                  assignStat(ab, poolRemaining[0]);
                }}>
                <div style={lbl}>{ABILITY_SHORT[ab]}</div>
                {isAssigned ? (
                  <>
                    <div style={{ fontSize:26, fontFamily:"var(--font-display)", color:"var(--accent)", marginTop:4 }}>{val}</div>
                    <div style={{ fontSize:11, color:"var(--text-dim)", marginTop:2 }}>click to clear</div>
                  </>
                ) : (
                  <div style={{ fontSize:15, color:"var(--text-dim)", marginTop:8, fontStyle:"italic" }}>
                    {poolRemaining.length > 0 ? "click to assign" : "—"}
                  </div>
                )}
                {isAssigned && <span style={mod}>{modStr(calcMod(val))}</span>}
              </div>
            );
          })}</div>
          <p style={{ fontSize:11, color:"var(--text-dim)", marginTop:4 }}>
            Scores are assigned in order from the pool. Click a filled box to return its value to the pool.
          </p>
        </div>
      )}

      {/* ── Point Buy ── */}
      {method === "pointbuy" && (
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <p style={{ color:"var(--text-muted)", fontSize:13, margin:0 }}>Scores 8–15. Cost: 14=7pts, 15=9pts.</p>
            <span style={{ fontFamily:"var(--font-display)", color: usedPts > MAX_PTS ? "var(--danger)" : "var(--success)" }}>{usedPts}/{MAX_PTS} pts</span>
          </div>
          <div style={grid}>{Object.keys(pb).map(ab => (
            <div key={ab} style={card}>
              <div style={lbl}>{ABILITY_SHORT[ab]}</div>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
                <button style={pbB} onClick={() => { const v = Math.max(8, pb[ab]-1); const n = {...pb,[ab]:v}; setPb(n); onChange(n); }}>−</button>
                <span style={{ fontSize:22, fontFamily:"var(--font-display)", color:"var(--accent)", minWidth:30, textAlign:"center" }}>{pb[ab]}</span>
                <button style={pbB} onClick={() => {
                  const nv = Math.min(15, pb[ab]+1);
                  const cost = Object.entries({...pb,[ab]:nv}).reduce((s,[,v]) => s + (PB_COST[v] || 0), 0);
                  if (cost <= MAX_PTS) { const n = {...pb,[ab]:nv}; setPb(n); onChange(n); }
                }}>+</button>
              </div>
              <span style={mod}>{modStr(calcMod(pb[ab]))}</span>
            </div>
          ))}</div>
        </div>
      )}

      {/* ── Roll Dice ── */}
      {method === "roll" && (
        <div>
          <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:16, flexWrap:"wrap" }}>
            <button onClick={rollAll} style={{ ...mBtn(false), background:"var(--accent)", color:"var(--bg)" }}>🎲 Roll All (4d6 drop lowest)</button>
            <span style={{ fontSize:12, color:"var(--text-muted)" }}>or enter your own rolls below:</span>
          </div>
          <div style={grid}>{Object.keys(abilities).map(ab => (
            <div key={ab} style={{ ...card, border:`1px solid ${abilities[ab] !== 10 || rolls[ab] ? "var(--accent)" : "var(--border)"}` }}>
              <div style={lbl}>{ABILITY_SHORT[ab]}</div>
              <input
                type="number" min={3} max={18}
                value={manualRolls[ab] !== undefined ? manualRolls[ab] : abilities[ab]}
                onChange={e => {
                  const raw = e.target.value;
                  setManualRolls(r => ({...r, [ab]: raw}));
                  const n = parseInt(raw, 10);
                  if (!isNaN(n) && n >= 3 && n <= 18) {
                    setRolls(r => ({...r, [ab]: null}));
                    onChange({ ...abilities, [ab]: n });
                  }
                }}
                style={{ width:"100%", background:"var(--surface)", border:"1px solid var(--border)", color:"var(--accent)", padding:"6px 8px", borderRadius:6, fontSize:26, fontFamily:"var(--font-display)", textAlign:"center", marginTop:6, boxSizing:"border-box" }}
              />
              {rolls[ab] && <div style={{ fontSize:11, color:"var(--text-muted)", marginTop:4 }}>[{rolls[ab].rolls.join(", ")}] drop lowest</div>}
              <span style={mod}>{modStr(calcMod(abilities[ab]))}</span>
            </div>
          ))}</div>
          <p style={{ fontSize:11, color:"var(--text-dim)", marginTop:4 }}>
            Click "Roll All" to auto-roll, or type any value 3–18 directly into each box.
          </p>
        </div>
      )}
    </div>
  );
}

// ── LIBRARY ITEM ADDER ──────────────────────────────────────
// Shared by wizard equipment step and inventory tab.
// Two tabs: browse the weapon/gear library (with stats) or
// type a custom item.
// ────────────────────────────────────────────────────────────
const CATEGORY_LABELS = {
  simpleWeapon:     "Simple Weapons",
  simpleRanged:     "Simple Ranged",
  martialWeapon:    "Martial Weapons",
  martialRanged:    "Martial Ranged",
  lightArmor:       "Light Armor",
  mediumArmor:      "Medium Armor",
  heavyArmor:       "Heavy Armor",
  shield:           "Shields",
  musicalInstrument:"Musical Instruments",
  arcaneFocus:      "Arcane Foci",
  druidicFocus:     "Druidic Foci",
  holySymbol:       "Holy Symbols",
  artisanTool:      "Artisan's Tools",
  gamingSet:        "Gaming Sets",
  tool:             "Tools",
};

function LibraryItemAdder({ gameData, onAdd }) {
  const { weapons:weaponLib=[], gear:gearLib=[], armor:armorLib=[], itemTypes={} } = gameData;
  const [tab, setTab]           = useState("library");
  const [category, setCategory] = useState("simpleWeapon");
  const [search, setSearch]     = useState("");
  const [customName, setCustomName] = useState("");
  const [customType, setCustomType] = useState("weapon");
  const [customDesc, setCustomDesc] = useState("");
  const [qty, setQty]           = useState(1);
  const [added, setAdded]       = useState(null);

  const allLibrary = [...weaponLib, ...armorLib, ...gearLib];
  const categories = [...new Set(allLibrary.map(i => i.category))];

  const inCategory = allLibrary.filter(it =>
    it.category === category &&
    (!search || it.name.toLowerCase().includes(search.toLowerCase()))
  );

  const flashAdded = name => { setAdded(name); setTimeout(()=>setAdded(null), 1200); };

  const addFromLibrary = it => {
    const isWeapon = !!it.damage;
    const isArmor  = it._lib === "armor" || it.acBase !== undefined;
    const isShield  = it.category === "shield";
    const desc = it.damage
      ? `${it.damage} ${it.damageType}${it.properties?.length?" — "+it.properties.join(", "):""}${it.range?" — Range "+it.range:""}`
      : it.acFormula
        ? `AC: ${it.acFormula}${it.stealthDisadvantage?" — Stealth disadv.":""}${it.strengthReq?` — Str ${it.strengthReq}+ required`:""}`
        : (it.description||"");
    const type = isWeapon ? "weapon" : (isShield ? "shield" : (isArmor ? "armor" : "misc"));
    // Auto-equip: always for weapons; only if slot empty for armor/shield
    const autoEquip = isWeapon; // armor auto-equip handled at add-to-inventory level in onAdd
    onAdd({ id:Date.now()+Math.random(), name:it.name, type, quantity:qty, weight:it.weight||0, description:desc, equipped:autoEquip });
    flashAdded(it.name);
  };

  const addCustom = () => {
    if (!customName) return;
    onAdd({ id:Date.now(), name:customName, type:customType, quantity:qty, weight:0, description:customDesc, equipped:false });
    setCustomName(""); setCustomDesc("");
    flashAdded(customName);
  };

  const inp = { background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"8px 12px", borderRadius:6, fontSize:13, fontFamily:"var(--font-body)", boxSizing:"border-box" };
  const tabBtn = a => ({ padding:"6px 16px", borderRadius:"6px 6px 0 0", cursor:"pointer", fontSize:12, fontFamily:"var(--font-display)", transition:"all 0.15s", marginRight:4, border:`1px solid ${a?"var(--accent)":"var(--border)"}`, borderBottom:a?"1px solid var(--card)":"1px solid var(--border)", background:a?"var(--card)":"var(--surface)", color:a?"var(--accent)":"var(--text-muted)" });

  return (
    <div>
      <div style={{ display:"flex", marginBottom:0 }}>
        <button style={tabBtn(tab==="library")} onClick={()=>setTab("library")}>From Library</button>
        <button style={tabBtn(tab==="custom")}  onClick={()=>setTab("custom")}>Custom</button>
      </div>

      <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:"0 8px 8px 8px", padding:14 }}>

        {/* ── Library tab ── */}
        {tab==="library" && (
          <div>
            {/* Category pills */}
            <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:10 }}>
              {categories.map(cat=>(
                <button key={cat} onClick={()=>{ setCategory(cat); setSearch(""); }} style={{
                  padding:"3px 10px", borderRadius:20, cursor:"pointer", fontSize:11, transition:"all 0.15s",
                  border:`1px solid ${category===cat?"var(--accent)":"var(--border)"}`,
                  background:category===cat?"var(--accent)":"var(--surface)",
                  color:category===cat?"var(--bg)":"var(--text-muted)"
                }}>{CATEGORY_LABELS[cat]||cat}</button>
              ))}
            </div>

            {/* Search */}
            <input style={{...inp,width:"100%",marginBottom:10}} value={search}
              onChange={e=>setSearch(e.target.value)}
              placeholder={`Search ${CATEGORY_LABELS[category]||category}…`}/>

            {/* Item rows */}
            <div style={{ maxHeight:260, overflowY:"auto", display:"flex", flexDirection:"column", gap:4 }}>
              {inCategory.length===0 && <div style={{fontSize:13,color:"var(--text-dim)",padding:"8px 0"}}>No items found.</div>}
              {inCategory.map(it=>{
                const justAdded = added===it.name;
                return (
                  <div key={it.name} style={{ display:"flex", alignItems:"center", gap:10, padding:"7px 10px", background:"var(--surface)", borderRadius:6, border:`1px solid ${justAdded?"var(--success)":"var(--border)"}`, transition:"border-color 0.3s" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <span style={{ fontSize:13, color:"var(--text)", fontWeight:500 }}>{it.name}</span>
                      <span style={{ fontSize:11, color:"var(--text-muted)", marginLeft:10 }}>
                        {it.damage && <span style={{color:"var(--danger)",marginRight:8}}>{it.damage} {it.damageType}</span>}
                        {it.acFormula && <span style={{color:"var(--info)",marginRight:8}}>AC: {it.acFormula}</span>}
                        {it.properties?.length>0 && <span style={{marginRight:8}}>{it.properties.join(", ")}</span>}
                        {it.range && <span style={{marginRight:8}}>Range {it.range}</span>}
                        {it.stealthDisadvantage && <span style={{color:"#e67e22",marginRight:8}}>Stealth disadv.</span>}
                        {it.strengthReq>0 && <span style={{color:"var(--text-dim)",marginRight:8}}>Str {it.strengthReq}+</span>}
                        {it.weight>0 && <span style={{color:"var(--text-dim)"}}>{it.weight} lb</span>}
                        {!it.damage && !it.acFormula && it.description && <span style={{color:"var(--text-dim)"}}>{it.description}</span>}
                      </span>
                    </div>
                    <button onClick={()=>addFromLibrary(it)} style={{
                      padding:"4px 12px", borderRadius:6, fontSize:12, cursor:"pointer", flexShrink:0,
                      border:`1px solid ${justAdded?"var(--success)":"var(--accent)"}`,
                      background:justAdded?"var(--success)":"var(--accent)",
                      color:"var(--bg)", transition:"all 0.2s"
                    }}>{justAdded?"✓":"+ Add"}</button>
                  </div>
                );
              })}
            </div>

            {/* Qty */}
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:10, fontSize:12, color:"var(--text-muted)" }}>
              Quantity:
              <button onClick={()=>setQty(q=>Math.max(1,q-1))} style={{...inp,width:26,height:26,padding:0,textAlign:"center",cursor:"pointer",lineHeight:1}}>−</button>
              <span style={{fontFamily:"var(--font-display)",color:"var(--accent)",minWidth:20,textAlign:"center"}}>{qty}</span>
              <button onClick={()=>setQty(q=>q+1)} style={{...inp,width:26,height:26,padding:0,textAlign:"center",cursor:"pointer",lineHeight:1}}>+</button>
            </div>
          </div>
        )}

        {/* ── Custom tab ── */}
        {tab==="custom" && (
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              <div>
                <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:4}}>Name</div>
                <input style={{...inp,width:"100%"}} value={customName} onChange={e=>setCustomName(e.target.value)}
                  placeholder="Item name…" onKeyDown={e=>e.key==="Enter"&&addCustom()}/>
              </div>
              <div>
                <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:4}}>Type</div>
                <select style={{...inp,width:"100%"}} value={customType} onChange={e=>setCustomType(e.target.value)}>
                  {Object.entries(itemTypes).map(([k,v])=><option key={k} value={k}>{v.label||k}</option>)}
                </select>
              </div>
            </div>
            <div>
              <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:4}}>Description (optional)</div>
              <input style={{...inp,width:"100%"}} value={customDesc} onChange={e=>setCustomDesc(e.target.value)} placeholder="Stats, notes…"/>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{fontSize:12,color:"var(--text-muted)"}}>Qty:</span>
              <button onClick={()=>setQty(q=>Math.max(1,q-1))} style={{...inp,width:26,height:26,padding:0,textAlign:"center",cursor:"pointer",lineHeight:1}}>−</button>
              <span style={{fontFamily:"var(--font-display)",color:"var(--accent)",minWidth:20,textAlign:"center"}}>{qty}</span>
              <button onClick={()=>setQty(q=>q+1)} style={{...inp,width:26,height:26,padding:0,textAlign:"center",cursor:"pointer",lineHeight:1}}>+</button>
              <button onClick={addCustom} style={{ marginLeft:"auto", padding:"8px 20px", background:"var(--accent)", border:"none", color:"var(--bg)", borderRadius:6, cursor:"pointer", fontFamily:"var(--font-display)", fontSize:13 }}>
                {added?"✓ Added!":"Add to Inventory"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function WizardEquipmentStep({ char, setChar, gameData }) {
  const { classes, backgrounds, itemTypes, weapons:weaponLib=[], gear:gearLib=[], armor:armorLib=[] } = gameData;
  const classData = classes?.[char.class];
  const bgData    = backgrounds?.[char.background];

  const [mode, setMode]         = useState("equipment");
  const [choices, setChoices]   = useState({});
  const [pickSels, setPickSels] = useState({});
  const [rolledGold, setRolledGold] = useState(null);
  const [customName, setCustomName] = useState("");
  const [customType, setCustomType] = useState("weapon");

  const goldDice  = classData?.startingGoldDice || "3d4";
  const diceMatch = goldDice.match(/^(\d+)d(\d+)$/);
  const numDice   = diceMatch ? +diceMatch[1] : 3;
  const dieSize   = diceMatch ? +diceMatch[2] : 4;

  const libraryForCategory = cat => {
    if (!cat) return [];
    return [...weaponLib, ...armorLib, ...gearLib].filter(w => w.category === cat);
  };

  const rollGold = () => {
    const total = Array.from({length:numDice}, ()=>Math.floor(Math.random()*dieSize)+1)
      .reduce((a,b)=>a+b,0) * 10;
    setRolledGold(total);
  };

  const resolveItem = (item, pickKey) => {
    if (!item.pick) return item;
    const selName = pickSels[pickKey];
    if (!selName) return null;
    const lib = libraryForCategory(item.pick);
    const found = lib.find(l => l.name === selName);
    if (!found) return null;
    return {
      name: found.name,
      qty: item.qty || 1,
      type: found.damage ? "weapon" : (found.acBase !== undefined ? (found.category==="shield"?"shield":"armor") : "misc"),
      weight: found.weight || 0,
      description: found.damage
        ? `${found.damage} ${found.damageType}${found.properties?.length ? " — " + found.properties.join(", ") : ""}${found.range ? " — Range " + found.range : ""}`
        : found.acFormula
          ? `AC: ${found.acFormula}${found.stealthDisadvantage?" — Stealth disadv.":""}${found.strengthReq?` — Str ${found.strengthReq}+ required`:""}`
          : (found.description || ""),
      personal: false,
    };
  };

  const getEquipmentItems = () => {
    const items = [];
    (classData?.startingEquipment || []).forEach((group, gi) => {
      if (!group) return;
      if (group.fixed) {
        (group.fixed || []).forEach(it => { if (it) items.push(it); });
      } else if (group.options) {
        const oi = choices[`class-${gi}`] ?? 0;
        const option = group.options[oi] || group.options[0] || [];
        option.forEach((it, ii) => {
          if (!it) return;
          if (it.pick) {
            const resolved = resolveItem(it, `class-${gi}-${oi}-${ii}`);
            if (resolved) items.push(resolved);
            // silently drop unresolved picks (player hasn't chosen yet)
          } else {
            items.push(it);
          }
        });
      }
    });
    (bgData?.startingItems || []).forEach(it => { if (it) items.push(it); });
    return items;
  };

  // Expand qty>1 items: "Two handaxes" → 2× "Handaxe" by matching the library
  const allLib = [...weaponLib, ...armorLib, ...gearLib];
  const expandItems = rawItems => {
    const expanded = [];
    for (const it of rawItems) {
      if (!it) continue;
      if (it.gold && !it.name) continue; // pure gold entry, handled separately
      if (!it.name) { expanded.push(it); continue; }
      const qty = it.qty || 1;
      if (qty <= 1) { expanded.push(it); continue; }
      const rawName  = String(it.name);
      const baseName = rawName.replace(/^\d+\s+/i, "").replace(/s$/i, "");
      const libMatch = allLib.find(l =>
        l.name.toLowerCase() === rawName.toLowerCase() ||
        l.name.toLowerCase() === baseName.toLowerCase()
      );
      if (libMatch) {
        for (let i = 0; i < qty; i++) {
          expanded.push({
            ...it,
            name: libMatch.name,
            qty: 1,
            type: libMatch.damage ? "weapon"
                : libMatch.acBase !== undefined ? (libMatch.category === "shield" ? "shield" : "armor")
                : (it.type || "misc"),
          });
        }
      } else {
        expanded.push(it);
      }
    }
    return expanded;
  };

  const applyEquipment = () => {
    try {
      const rawItems = expandItems(getEquipmentItems());
      let goldBonus = 0;
      const invItems = [], personalItems = [];
      const equippedArmor   = new Set();
      const equippedShields = new Set();

      rawItems.forEach(it => {
        if (!it) return;
        if (it.gold && !it.type?.match(/weapon|armor|shield/)) { goldBonus += (it.gold || 0); }
        if (!it.name) return; // skip nameless entries
        const type = it.type || "misc";
        let equip = false;
        if (type === "weapon") {
          equip = true;
        } else if (type === "armor") {
          if (!equippedArmor.has("armor")) { equip = true; equippedArmor.add("armor"); }
        } else if (type === "shield") {
          if (!equippedShields.has("shield")) { equip = true; equippedShields.add("shield"); }
        }
        const obj = {
          id: Date.now() + Math.random(),
          name: it.name,
          type,
          quantity: it.qty || 1,
          weight: it.weight || 0,
          description: it.description || "",
          equipped: equip,
        };
        if (it.personal) personalItems.push(obj);
        else invItems.push(obj);
      });

      setChar(c => ({
        ...c,
        inventory: [...(c.inventory || []), ...invItems],
        personalItems: [...(c.personalItems || []), ...personalItems],
        currencies: { ...c.currencies, gp: (c.currencies?.gp || 0) + goldBonus },
      }));
    } catch(err) {
      console.error("applyEquipment error:", err);
      alert("Something went wrong applying equipment. Check the console for details.");
    }
  };

  const applyGold = () => {
    if (rolledGold===null) return;
    setChar(c => ({ ...c, currencies:{...c.currencies,gp:(c.currencies?.gp||0)+rolledGold} }));
    setRolledGold(null);
  };

  const addCustom = () => {
    if (!customName) return;
    setChar(c => ({ ...c, inventory:[...(c.inventory||[]),{id:Date.now(),name:customName,type:customType,quantity:1,weight:0,description:"",equipped:false}] }));
    setCustomName("");
  };

  const removeItem = id => setChar(c => ({ ...c, inventory:c.inventory.filter(i=>i.id!==id) }));
  const setCurrency = (coin,val) => setChar(c => ({ ...c, currencies:{...c.currencies,[coin]:Math.max(0,+val||0)} }));

  const inp  = { background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"8px 12px", borderRadius:8, fontSize:14, fontFamily:"var(--font-body)", boxSizing:"border-box" };
  const mBtn = a => ({ padding:"10px 24px", borderRadius:8, cursor:"pointer", fontSize:13, fontFamily:"var(--font-display)", letterSpacing:0.5, transition:"all 0.2s", border:`1px solid ${a?"var(--accent)":"var(--border)"}`, background:a?"var(--accent)":"var(--surface)", color:a?"var(--bg)":"var(--text)" });

  const groups   = classData?.startingEquipment || [];
  const currency = char.currencies || {cp:0,sp:0,ep:0,gp:0,pp:0};
  const inv      = char.inventory || [];

  // Render one item in an option — handles pick items with dropdown
  const renderOptionItem = (it, pickKey) => {
    if (!it.pick) {
      return (
        <span key={it.name} style={{ color:"var(--text)" }}>
          {it.qty>1?`${it.qty}× `:""}
          <strong>{it.name}</strong>
          {it.description && <span style={{ color:"var(--text-dim)", fontSize:11, marginLeft:4 }}>{it.description}</span>}
        </span>
      );
    }
    const lib = libraryForCategory(it.pick);
    const selName = pickSels[pickKey] || "";
    const selItem = lib.find(l=>l.name===selName);
    return (
      <div key={pickKey} style={{ display:"flex", flexDirection:"column", gap:4 }}>
        <div style={{ fontSize:12, color:"var(--text-muted)" }}>Choose {it.name}:</div>
        <select value={selName} onChange={e=>setPickSels(p=>({...p,[pickKey]:e.target.value}))} style={{...inp,fontSize:13}}>
          <option value="">— select —</option>
          {lib.map(w=>(
            <option key={w.name} value={w.name}>
              {w.name}{w.damage?` (${w.damage} ${w.damageType}${w.properties?.length?" — "+w.properties.join(", "):""})`:""}
            </option>
          ))}
        </select>
        {selItem && (
          <div style={{ fontSize:11, color:"var(--text-dim)", paddingLeft:4 }}>
            {selItem.damage && <span style={{color:"var(--danger)",marginRight:8}}>{selItem.damage} {selItem.damageType}</span>}
            {selItem.properties?.length>0 && <span style={{marginRight:8}}>{selItem.properties.join(", ")}</span>}
            {selItem.range && <span>Range {selItem.range}</span>}
            {selItem.description && !selItem.damage && <span>{selItem.description}</span>}
          </div>
        )}
      </div>
    );
  };

  return (
    <div>
      {/* Mode toggle */}
      <div style={{display:"flex",gap:10,marginBottom:20}}>
        <button style={mBtn(mode==="equipment")} onClick={()=>setMode("equipment")}>⚔️ Choose by Equipment</button>
        <button style={mBtn(mode==="gold")}      onClick={()=>setMode("gold")}>🪙 Choose by Gold</button>
      </div>

      {/* ── Equipment mode ── */}
      {mode==="equipment" && (
        <div>
          {!classData
            ? <p style={{color:"var(--text-muted)",fontSize:13}}>Select a class first.</p>
            : <>
              <div style={{fontFamily:"var(--font-display)",color:"var(--accent)",fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
                {char.class} Starting Equipment
              </div>
              {groups.map((group,gi)=>{
                if (group.fixed) return (
                  <div key={gi} style={{marginBottom:12,padding:"10px 14px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8}}>
                    <div style={{fontSize:11,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>You always get</div>
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      {group.fixed.map(it=>(
                        <div key={it.name} style={{fontSize:13}}>
                          {it.qty>1?`${it.qty}× `:""}
                          <strong>{it.name}</strong>
                          {it.description&&<span style={{color:"var(--text-dim)",fontSize:11,marginLeft:6}}>{it.description}</span>}
                        </div>
                      ))}
                    </div>
                  </div>
                );
                const chosenOi = choices[`class-${gi}`] ?? 0;
                return (
                  <div key={gi} style={{marginBottom:14}}>
                    <div style={{fontSize:11,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Choice {gi+1} — pick one</div>
                    <div style={{display:"flex",flexDirection:"column",gap:6}}>
                      {group.options.map((option,oi)=>{
                        const isSel = chosenOi===oi;
                        return (
                          <div key={oi} style={{
                            padding:"12px 14px",borderRadius:8,transition:"all 0.15s",
                            border:`1px solid ${isSel?"var(--accent)":"var(--border)"}`,
                            background:isSel?"rgba(201,162,39,0.08)":"var(--surface)"
                          }}>
