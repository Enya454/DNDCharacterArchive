// PERSONAL ITEMS SECTION (used in InventoryTab)
// ============================================================
function PersonalItemsSection({ char, onUpdate }) {
  const [newPersonal, setNewPersonal] = useState("");
  const personal = char.personalItems || [];
  const add = () => {
    if (!newPersonal) return;
    onUpdate({ ...char, personalItems:[...personal, {id:Date.now(), name:newPersonal, description:""}] });
    setNewPersonal("");
  };
  const rem = id => onUpdate({ ...char, personalItems: personal.filter(p => p.id !== id) });
  return (
    <div style={{ marginTop:24 }}>
      <div style={{ fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:10, paddingTop:16, borderTop:"1px solid var(--border)" }}>
        Personal Effects &amp; Mementos
        <span style={{ color:"var(--text-dim)", fontSize:10, marginLeft:8, textTransform:"none", letterSpacing:0 }}>Trinkets, tokens, and flavour items</span>
      </div>
      {personal.length === 0 && <div style={{ fontSize:13, color:"var(--text-dim)", marginBottom:10 }}>None yet.</div>}
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
        {personal.map(p => (
          <div key={p.id} style={{ display:"flex", alignItems:"center", gap:6, padding:"5px 10px", background:"rgba(100,100,200,0.08)", border:"1px solid rgba(100,100,200,0.3)", borderRadius:8, fontSize:13 }}>
            <span style={{ color:"var(--text)" }}>{p.name}</span>
            <button onClick={() => rem(p.id)} style={{ background:"transparent", border:"none", color:"var(--danger)", cursor:"pointer", fontSize:14, lineHeight:1, padding:0 }}>×</button>
          </div>
        ))}
      </div>
      <div style={{ display:"flex", gap:8 }}>
        <input value={newPersonal} onChange={e => setNewPersonal(e.target.value)} placeholder="Add personal item, memento, or trinket…"
          onKeyDown={e => e.key==="Enter"&&add()}
          style={{ flex:1, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"7px 12px", borderRadius:6, fontSize:13, fontFamily:"var(--font-body)" }}/>
        <button onClick={add} style={{ padding:"7px 16px", background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text-muted)", borderRadius:6, cursor:"pointer", fontSize:13 }}>Add</button>
      </div>
    </div>
  );
}

// ============================================================
// INVENTORY TAB
// ============================================================
function InventoryTab({ char, gameData, onUpdate }) {
  const { itemTypes } = gameData;
  const [showAdd, setShowAdd] = useState(false);
  const inv  = char.inventory || [];
  const curr = char.currencies || { cp:0, sp:0, ep:0, gp:0, pp:0 };
  const tw   = inv.reduce((s, i) => s + (i.weight || 0) * (i.quantity || 1), 0);
  const cap  = char.abilities.str * 15;

  const rem  = id      => onUpdate({ ...char, inventory:inv.filter(i => i.id !== id) });
  const teq  = id      => onUpdate({ ...char, inventory:inv.map(i => i.id === id ? { ...i, equipped:!i.equipped } : i) });
  const uq   = (id,qty)=> onUpdate({ ...char, inventory:inv.map(i => i.id === id ? { ...i, quantity:Math.max(1,qty) } : i) });
  const ucu  = (t, v)  => onUpdate({ ...char, currencies:{ ...curr, [t]:Math.max(0, +v || 0) } });

  const inp  = { background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)", padding:"8px 10px", borderRadius:6, fontSize:14, fontFamily:"var(--font-body)", width:"100%", boxSizing:"border-box" };
  const lbl  = { display:"block", color:"var(--text-muted)", fontSize:11, textTransform:"uppercase", letterSpacing:1, marginBottom:4 };
  const tc   = t => itemTypes?.[t]?.color || "var(--text-muted)";
  const tl   = t => itemTypes?.[t]?.label || t;

  const grouped = {};
  inv.forEach(item => { const g = item.type || "misc"; if (!grouped[g]) grouped[g] = []; grouped[g].push(item); });

  return (
    <div>
      {/* Currency */}
      <div style={{ background:"var(--card)", border:"1px solid var(--border)", borderRadius:10, padding:16, marginBottom:18 }}>
        <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", marginBottom:12, fontSize:13 }}>CURRENCY</div>
        <div style={{ display:"flex", gap:14, flexWrap:"wrap" }}>
          {[["cp","Copper","#b87333"],["sp","Silver","#c0c0c0"],["ep","Electrum","#a8bba8"],["gp","Gold","#ffd700"],["pp","Platinum","#e5e4e2"]].map(([t, n, c]) => (
            <div key={t} style={{ textAlign:"center", minWidth:64 }}>
              <div style={{ width:30, height:30, borderRadius:"50%", background:c, margin:"0 auto 4px", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:"bold", color:"#333" }}>{t.toUpperCase()}</div>
              <input type="number" value={curr[t]} onChange={e => ucu(t, e.target.value)}
                style={{ ...inp, width:64, textAlign:"center", fontSize:16, padding:"4px 0" }} />
              <div style={{ fontSize:10, color:"var(--text-muted)", marginTop:2 }}>{n}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <span style={{ fontSize:13, color:"var(--text-muted)" }}>
          Weight: <strong style={{ color: tw > cap ? "var(--danger)" : "var(--text)" }}>{tw} lbs</strong>
          <span style={{ color:"var(--text-dim)" }}> / {cap} lbs</span>
        </span>
        <button onClick={() => setShowAdd(!showAdd)} style={{ padding:"8px 16px", background:"var(--accent)", border:"none", color:"var(--bg)", borderRadius:8, cursor:"pointer", fontFamily:"var(--font-display)", fontSize:13 }}>
          {showAdd ? "▲ Hide Adder" : "+ Add Item"}
        </button>
      </div>

      {showAdd && (
        <div style={{ marginBottom:16 }}>
          <LibraryItemAdder
            gameData={gameData}
            onAdd={item => { onUpdate({ ...char, inventory:[...inv, item] }); }}
          />
        </div>
      )}

      {inv.length === 0 && !showAdd && (
        <div style={{ textAlign:"center", padding:44, color:"var(--text-muted)" }}>
          <div style={{ fontSize:44, marginBottom:12 }}>🎒</div>
          <div>Your pack is empty.</div>
        </div>
      )}

      {Object.entries(grouped).map(([type, items]) => (
        <div key={type} style={{ marginBottom:16 }}>
          <div style={{ fontSize:11, color:tc(type), textTransform:"uppercase", letterSpacing:1, marginBottom:7, paddingBottom:4, borderBottom:"1px solid var(--border)" }}>
            {tl(type)} ({items.length})
          </div>
          {items.map(item => {
            const lib = lookupLibraryItem(item.name, gameData);
            const proficient = lib ? isItemProficient(lib, char, gameData.classes) : null;
            const isEquippable = ["weapon","armor","shield"].includes(item.type) || lib?.category?.includes("Armor") || lib?.category === "shield";
            const canEquip = isEquippable || (lib && (lib._lib === "armor" || lib._lib === "weapon"));
            const showEquip = canEquip || ["weapon","armor","shield"].includes(item.type);
            const stealthDisadv = item.equipped && lib?.stealthDisadvantage;
            const strReq = item.equipped && lib?.strengthReq && (char.abilities?.str||10) < lib.strengthReq;
            return (
              <div key={item.id} style={{ background:"var(--card)", border:`1px solid ${item.equipped?"var(--accent2)":"var(--border)"}`, borderRadius:10, padding:12, marginBottom:7 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ width:8, height:8, borderRadius:"50%", background:tc(item.type), flexShrink:0 }} />
                  <div style={{ flex:1, minWidth:0 }}>
                    {/* Name row */}
                    <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                      <span style={{ fontFamily:"var(--font-display)", fontSize:14 }}>{item.name}</span>
                      {item.equipped && <span style={{ fontSize:10, padding:"2px 6px", background:"rgba(39,174,96,0.15)", border:"1px solid var(--success)", borderRadius:4, color:"var(--success)" }}>Equipped</span>}
                      {/* Proficiency badge */}
                      {proficient !== null && (
                        <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4,
                          background: proficient ? "rgba(39,174,96,0.12)" : "rgba(230,126,34,0.12)",
                          border:`1px solid ${proficient?"var(--success)":"#e67e22"}`,
                          color: proficient ? "var(--success)" : "#e67e22" }}>
                          {proficient ? "✓ Proficient" : "⚠ Not proficient"}
                        </span>
                      )}
                      {/* Stealth disadvantage badge */}
                      {stealthDisadv && <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4, background:"rgba(230,126,34,0.12)", border:"1px solid #e67e22", color:"#e67e22" }}>⚠ Stealth disadv.</span>}
                      {/* Str requirement warning */}
                      {strReq && <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4, background:"rgba(192,57,43,0.12)", border:"1px solid var(--danger)", color:"var(--danger)" }}>⚠ STR {lib.strengthReq} required</span>}
                    </div>
                    {/* Stats row from library */}
                    {lib && (
                      <div style={{ fontSize:11, color:"var(--text-muted)", marginTop:3, display:"flex", gap:10, flexWrap:"wrap" }}>
                        {lib.damage && (() => {
                          const isRanged = lib.range && !lib.properties?.includes("thrown");
                          const isFin = lib.properties?.includes("finesse");
                          const mod = isFin
                            ? Math.max(calcMod(char.abilities.str), calcMod(char.abilities.dex))
                            : isRanged ? calcMod(char.abilities.dex) : calcMod(char.abilities.str);
                          const sign = mod > 0 ? "+" : "−";
                          const dmgStr = mod === 0 ? `${lib.damage} ${lib.damageType}`
                            : `${lib.damage} ${sign} ${Math.abs(mod)} ${lib.damageType}`;
                          return <span style={{ color:"var(--danger)" }}>{dmgStr}</span>;
                        })()}
                        {lib.acFormula && <span style={{ color:"var(--info)" }}>AC: {lib.acFormula}</span>}
                        {lib.properties?.length > 0 && <span>{lib.properties.join(", ")}</span>}
                        {lib.range && <span>Range {lib.range}</span>}
                        {lib.stealthDisadvantage && !item.equipped && <span style={{ color:"#e67e22" }}>Stealth disadvantage</span>}
                        {lib.strengthReq > 0 && <span style={{ color:"var(--text-dim)" }}>Str {lib.strengthReq}+</span>}
                        {(item.weight||lib.weight) > 0 && <span style={{ color:"var(--text-dim)" }}>{item.weight||lib.weight} lb</span>}
                      </div>
                    )}
                    {/* Custom description (if no library entry or extra notes) */}
                    {item.description && !lib && <div style={{ fontSize:12, color:"var(--text-muted)", marginTop:2 }}>{item.description}</div>}
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
                    <input type="number" value={item.quantity} min={1} onChange={e => uq(item.id, +e.target.value)}
                      style={{ ...inp, width:50, textAlign:"center", padding:"4px 0" }} />
                    {showEquip && (
                      <button onClick={() => teq(item.id)} style={{ padding:"4px 10px", borderRadius:6, fontSize:12, cursor:"pointer", background:"transparent",
                        border:`1px solid ${item.equipped ? "var(--success)" : "var(--border)"}`,
                        color: item.equipped ? "var(--success)" : "var(--text-muted)" }}>
                        {item.equipped ? "Unequip" : "Equip"}
                      </button>
                    )}
                    <button onClick={() => rem(item.id)} style={{ width:28, height:28, borderRadius:6, border:"1px solid var(--danger)", background:"transparent", color:"var(--danger)", cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ))}

      {/* Personal Items */}
      <PersonalItemsSection char={char} onUpdate={onUpdate} />
    </div>
  );
}

// ============================================================
// FEATURES TAB (character sheet view)
// ============================================================
function FeatureRow({ feat, isSpecies, isSubrace, char, open, toggle, featList, ws }) {
  const locked  = !isSpecies && !isSubrace && char.level < feat.level;
  const chosen  = char.featureChoices?.[feat.name];
  const chosenFeat = char.featChoices?.[feat.name];
  const toggleKey = feat.name + (isSpecies ? "_sp" : isSubrace ? "_sr" : "");
  const isOpen = open[toggleKey];
  return (
    <div style={ws.fCard(locked)}>
      <div style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer" }} onClick={() => toggle(toggleKey)}>
        <span style={{ fontFamily:"var(--font-display)", color: locked ? "var(--text-dim)" : "var(--accent)", fontSize:14, flex:1 }}>{feat.name}</span>
        {feat.type === "asi" && chosenFeat && chosenFeat !== "__pending__" && (
          <span style={{ fontSize:11, padding:"1px 8px", borderRadius:10, background:"rgba(var(--accent-rgb,201,162,39),0.12)", border:"1px solid var(--accent)", color:"var(--accent)" }}>🏆 {chosenFeat}</span>
        )}
        {feat.type === "asi" && !chosenFeat && (
          <span style={{ fontSize:11, padding:"1px 8px", borderRadius:10, background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text-dim)" }}>ASI</span>
        )}
        {locked   && <span style={ws.lockBadge}>Lvl {feat.level}</span>}
        {!locked && feat.level > 1 && !isSpecies && !isSubrace && <span style={{ fontSize:10, color:"var(--text-dim)" }}>Lvl {feat.level}</span>}
        {chosen   && <span style={{ fontSize:11, color:"var(--success)", padding:"1px 8px", borderRadius:10, border:"1px solid var(--success)" }}>{(Array.isArray(chosen) ? chosen.join(", ") : String(chosen).split("—")[0].trim())}</span>}
        <span style={{ color:"var(--text-dim)", fontSize:11 }}>{isOpen ? "▲" : "▼"}</span>
      </div>
      {isOpen && (
        <div style={{ marginTop:10, paddingTop:10, borderTop:"1px solid var(--border)" }}>
          <p style={{ fontSize:14, color:"var(--text-muted)", lineHeight:1.7, margin:0 }}>{feat.description}</p>
          {chosen && (
            <div style={{ marginTop:8, padding:"6px 10px", background:"rgba(var(--accent-rgb,201,162,39),0.08)", borderRadius:6, fontSize:12, color:"var(--accent)" }}>✓ Chosen: {chosen}</div>
          )}
          {feat.type === "asi" && chosenFeat && chosenFeat !== "__pending__" && (
            <div style={{ marginTop:8, padding:"8px 12px", background:"rgba(var(--accent-rgb,201,162,39),0.08)", border:"1px solid var(--accent)", borderRadius:8 }}>
              <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:14, marginBottom:4 }}>🏆 {chosenFeat}</div>
              <div style={{ fontSize:12, color:"var(--text-muted)", lineHeight:1.5 }}>
                {(featList||[]).find(f=>f.name===chosenFeat)?.description}
              </div>
            </div>
          )}
          {feat.type === "asi" && !chosenFeat && (() => {
            const asi = char.asiChoices?.[feat.name] || {};
            const bonuses = Object.entries(asi).filter(([,v])=>v>0);
            return bonuses.length > 0 ? (
              <div style={{ marginTop:8, padding:"6px 10px", background:"rgba(39,174,96,0.08)", borderRadius:6, fontSize:12, color:"var(--success)" }}>
                ✓ {bonuses.map(([ab,v])=>`+${v} ${ABILITY_SHORT[ab]}`).join(", ")}
              </div>
            ) : null;
          })()}
        </div>
      )}
    </div>
  );
}

function FeaturesTab({ char, gameData }) {
  const { classes, species:speciesDb, feats:featList=[] } = gameData;
  const classData   = classes?.[char.class];
  const speciesData = speciesDb?.[char.species];
  const subraceData = char.subrace ? speciesData?.subraces?.[char.subrace] : null;
  const [filter, setFilter] = useState("all");

  const classFeatures = [
    ...(classData?.features || [])
      .filter(f => char.level >= (f.level || 1))
      .map(f => ({ ...f, _group:"class", _label: char.class, _sublabel: char.class }))
      .sort((a, b) => (a.level||0) - (b.level||0)),
    ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || [])
      .filter(f => char.level >= (f.level || 1))
      .map(f => ({ ...f, _group:"class", _label: char.subclass, _sublabel: char.subclass }))
      .sort((a, b) => (a.level||0) - (b.level||0)),
  ];

  const racialSpellGrants = [
    ...(speciesData?.features || []).filter(f => f.type === "spell_grant"),
    ...(subraceData?.features || []).filter(f => f.type === "spell_grant"),
  ];

  const specialFeatures = [
    ...(speciesData?.features || [])
      .filter(f => f.type !== "spell_grant")
      .map(f => ({ ...f, _group:"special", _label: char.species })),
    ...(subraceData?.features || [])
      .filter(f => f.type !== "spell_grant")
      .map(f => ({ ...f, _group:"special", _label: char.subrace })),
    ...Object.entries(char.featChoices || {})
      .filter(([, v]) => v && v !== "__pending__")
      .map(([, featName]) => {
        const feat = featList.find(f => f.name === featName);
        return feat ? { ...feat, _group:"special", _label:"Feat", _isFeat:true } : null;
      })
      .filter(Boolean),
  ];

  const shown = filter === "class" ? classFeatures
    : filter === "special" ? specialFeatures
    : [...classFeatures, ...specialFeatures];

  const grouped = [];
  let lastLabel = null;
  for (const feat of shown) {
    if (feat._label !== lastLabel) {
      grouped.push({ type:"header", label: feat._label, group: feat._group });
      lastLabel = feat._label;
    }
    grouped.push({ type:"feature", feat });
  }
  if (filter !== "class" && racialSpellGrants.length > 0) {
    grouped.push({ type:"spellgrants", grants: racialSpellGrants });
  }

  const renderFeature = (feat, idx) => {
    const key = feat.name + (feat._label||"") + idx;
    const chosen     = char.featureChoices?.[feat.name];
    const chosenFeat = char.featChoices?.[feat.name];
    const asiChoices = char.asiChoices?.[feat.name];
    const invList    = feat.type === "eldritch_invocations"
      ? (char.featureChoices?.[feat.name] || []) : null;
    return (
      <div key={key} style={{ marginBottom:14, padding:"14px 16px",
        background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:8 }}>
          <span style={{ fontFamily:"var(--font-display)", fontSize:15, color:"var(--accent)" }}>{feat.name}</span>
          {feat.level > 1 && feat._group === "class" && (
            <span style={{ fontSize:10, padding:"1px 6px", borderRadius:4,
              background:"rgba(255,255,255,0.05)", border:"1px solid var(--border)", color:"var(--text-dim)" }}>
              Lvl {feat.level}
            </span>
          )}
          {feat._sublabel && feat._sublabel !== char.class && (
            <span style={{ fontSize:10, padding:"1px 6px", borderRadius:4,
              background:"rgba(var(--accent-rgb,201,162,39),0.08)", border:"1px solid rgba(var(--accent-rgb,201,162,39),0.25)", color:"var(--accent2)" }}>
              {feat._sublabel}
            </span>
          )}
          {feat._isFeat && (
            <span style={{ fontSize:10, padding:"1px 6px", borderRadius:4,
              background:"rgba(var(--accent-rgb,201,162,39),0.08)", border:"1px solid rgba(201,162,39,0.3)", color:"var(--accent)" }}>
              🏆 Feat
            </span>
          )}
        </div>
        <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.75, margin:"0 0 0 0" }}>{feat.description}</p>
        {chosen && !Array.isArray(chosen) && feat.type === "choice" && (
          <div style={{ marginTop:10, padding:"8px 12px", background:"rgba(201,162,39,0.06)", border:"1px solid var(--accent)", borderRadius:8 }}>
            <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>Your Choice</div>
            <div style={{ fontSize:13, color:"var(--accent)", lineHeight:1.6 }}>{chosen}</div>
          </div>
        )}
        {feat.type === "eldritch_invocations" && invList?.length > 0 && (
          <div style={{ marginTop:10 }}>
            <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Active Invocations ({invList.length})</div>
            {invList.map(name => {
              const inv = (feat.invocations||[]).find(i=>i.name===name);
              return (
                <div key={name} style={{ padding:"8px 12px", background:"rgba(201,162,39,0.04)", border:"1px solid rgba(var(--accent-rgb,201,162,39),0.18)", borderRadius:7, marginBottom:6 }}>
                  <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:13, marginBottom:4 }}>
                    {name}{inv?.prereq && <span style={{ fontSize:10, color:"var(--text-dim)", marginLeft:8 }}>Requires: {inv.prereq}</span>}
                  </div>
                  {inv?.description && <div style={{ fontSize:12, color:"var(--text-muted)", lineHeight:1.65 }}>{inv.description}</div>}
                </div>
              );
            })}
            {invList.includes("Book of Ancient Secrets") && (() => {
              const all = [...(char.featureChoices?.["bas_required"]||[]), ...(char.featureChoices?.["bas_extra"]||[])];
              return all.length > 0 ? (
                <div style={{ padding:"8px 12px", background:"rgba(41,128,185,0.06)", border:"1px solid rgba(41,128,185,0.3)", borderRadius:7 }}>
                  <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>Ritual Spells in Book of Shadows</div>
                  <div style={{ fontSize:13, color:"var(--info)" }}>{all.join(", ")}</div>
                </div>
              ) : null;
            })()}
          </div>
        )}
        {feat.name === "Pact Boon" && chosen?.includes("Tome") && (() => {
          const tc = char.featureChoices?.["pact_tome_cantrips"] || [];
          return tc.length > 0 ? (
            <div style={{ marginTop:10, padding:"8px 12px", background:"rgba(201,162,39,0.04)", border:"1px solid rgba(var(--accent-rgb,201,162,39),0.18)", borderRadius:7 }}>
              <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>Book of Shadows Cantrips</div>
              <div style={{ fontSize:13, color:"var(--accent)" }}>{tc.join(", ")}</div>
            </div>
          ) : null;
        })()}
        {chosenFeat && chosenFeat !== "__pending__" && (() => {
          const fd = featList.find(f=>f.name===chosenFeat);
          return (
            <div style={{ marginTop:10, padding:"10px 14px", background:"rgba(201,162,39,0.06)", border:"1px solid var(--accent)", borderRadius:8 }}>
              <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:14, marginBottom:6 }}>🏆 {chosenFeat}</div>
              {fd?.description && <div style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.7 }}>{fd.description}</div>}
            </div>
          );
        })()}
        {feat.type === "asi" && !chosenFeat && (() => {
          const bonuses = Object.entries(asiChoices||{}).filter(([,v])=>v>0);
          return bonuses.length > 0 ? (
            <div style={{ marginTop:10, padding:"7px 12px", background:"rgba(39,174,96,0.08)", border:"1px solid var(--success)", borderRadius:7 }}>
              <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:3 }}>Ability Score Increases</div>
              <div style={{ fontSize:13, color:"var(--success)" }}>{bonuses.map(([ab,v])=>`+${v} ${ABILITY_SHORT[ab]}`).join(", ")}</div>
            </div>
          ) : null;
        })()}
      </div>
    );
  };

  const renderSpellGrants = (grants) => {
    const level = char.level || 1;
    const allGranted = grants.flatMap(g => (g.grants||[]).map(gr => ({ ...gr, source: g.name })));
    const available = allGranted.filter(g => level >= (g.minCharLevel || 1));
    const upcoming  = allGranted.filter(g => level <  (g.minCharLevel || 1));
    if (available.length === 0 && upcoming.length === 0) return null;
    return (
      <div key="spell-grants" style={{ marginBottom:14, padding:"14px 16px", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:10 }}>
        <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:15, marginBottom:8 }}>Heritage Spells</div>
        <p style={{ fontSize:13, color:"var(--text-muted)", lineHeight:1.75, margin:"0 0 10px 0" }}>
          Your ancestry grants you the following spells. These are always available and do not count against your spell limit.
        </p>
        {available.map(g => (
          <div key={g.spellName} style={{ display:"flex", alignItems:"center", gap:10, padding:"6px 10px", background:"rgba(201,162,39,0.04)", borderRadius:6, border:"1px solid rgba(var(--accent-rgb,201,162,39),0.15)", marginBottom:5 }}>
            <span style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:13, flex:1 }}>{g.spellName}</span>
            <span style={{ fontSize:11, color:"var(--text-dim)" }}>{g.uses === null || g.uses === undefined ? "At will" : `${g.uses}× / ${g.recharge === "long" ? "Long Rest" : "Short Rest"}`}</span>
            <span style={{ fontSize:10, color:"var(--accent2)", padding:"1px 6px", border:"1px solid var(--accent2)", borderRadius:4 }}>✓ Unlocked</span>
          </div>
        ))}
        {upcoming.map(g => (
          <div key={g.spellName} style={{ display:"flex", alignItems:"center", gap:10, padding:"6px 10px", background:"rgba(255,255,255,0.02)", borderRadius:6, border:"1px solid var(--border)", marginBottom:5, opacity:0.5 }}>
            <span style={{ fontFamily:"var(--font-display)", color:"var(--text-dim)", fontSize:13, flex:1 }}>{g.spellName}</span>
            <span style={{ fontSize:11, color:"var(--text-dim)" }}>Unlocks at level {g.minCharLevel}</span>
          </div>
        ))}
      </div>
    );
  };

  const pill = active => ({
    padding:"5px 16px", borderRadius:20, cursor:"pointer", fontSize:12,
    fontFamily:"var(--font-display)", letterSpacing:0.5, transition:"all 0.15s",
    border:`1px solid ${active?"var(--accent)":"var(--border)"}`,
    background: active?"rgba(var(--accent-rgb,201,162,39),0.12)":"transparent",
    color: active?"var(--accent)":"var(--text-muted)",
  });

  return (
    <div>
      <div style={{ display:"flex", gap:8, marginBottom:20 }}>
        <button style={pill(filter==="all")}     onClick={()=>setFilter("all")}>All</button>
        <button style={pill(filter==="class")}   onClick={()=>setFilter("class")}>⚔️ Class Features</button>
        <button style={pill(filter==="special")} onClick={()=>setFilter("special")}>✦ Special Features</button>
        <span style={{ marginLeft:"auto", fontSize:12, color:"var(--text-dim)", alignSelf:"center" }}>{shown.length} feature{shown.length!==1?"s":""}</span>
      </div>
      {grouped.map((item, i) => {
        if (item.type === "header") return (
          <div key={`h-${item.label}-${i}`} style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10, marginTop: i > 0 ? 20 : 0 }}>
            <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase", letterSpacing:2, flexShrink:0 }}>{item.label}</div>
            <div style={{ flex:1, height:1, background:"rgba(201,162,39,0.2)" }}/>
            <div style={{ fontSize:10, color:"var(--text-dim)", flexShrink:0 }}>{item.group === "class" ? "⚔️ Class" : "✦ Special"}</div>
          </div>
        );
        if (item.type === "spellgrants") return renderSpellGrants(item.grants);
        return renderFeature(item.feat, i);
      })}
      {shown.length === 0 && (
        <div style={{ textAlign:"center", padding:40, color:"var(--text-muted)", fontSize:13, fontStyle:"italic" }}>No features to display.</div>
      )}
    </div>
  );
}

// DOCUMENTS TAB — link Google Drive / Docs files to a character
// ============================================================
function DocumentsTab({ char, onUpdate, session, readOnly }) {
  const docs    = char.documents || [];
  const [adding,     setAdding]     = useState(false);
  const [url,        setUrl]        = useState("");
  const [label,      setLabel]      = useState("");
  const [visibility, setVisibility] = useState("public");
  const [error,      setError]      = useState(null);

  const parseDriveUrl = raw => {
    const docMatch   = raw.match(/\/document\/d\/([a-zA-Z0-9_-]+)/);
    const sheetMatch = raw.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    const slideMatch = raw.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
    const fileMatch  = raw.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    const id   = (docMatch||sheetMatch||slideMatch||fileMatch)?.[1] || null;
    const type = docMatch ? "doc" : sheetMatch ? "sheet" : slideMatch ? "slide" : "file";
    return { id, type };
  };

  const iconFor   = type => ({ doc:"📄", sheet:"📊", slide:"📑", file:"📎" })[type] || "📎";
  const colourFor = type => ({ doc:"#4285f4", sheet:"#0f9d58", slide:"#f4b400", file:"#9e9e9e" })[type] || "#9e9e9e";
  const visIcon   = v => ({ public:"🌐", dm:"🎲", private:"🔒" })[v] || "🌐";
  const visLabel  = v => ({ public:"Public", dm:"DM Only", private:"Private" })[v] || "Public";
  const visColour = v => ({ public:"var(--success)", dm:"#f4b400", private:"var(--text-dim)" })[v] || "var(--success)";

  const addFromUrl = () => {
    if (!url.trim()) { setError("Please enter a URL."); return; }
    const { id, type } = parseDriveUrl(url);
    const doc = {
      id:         id || Date.now().toString(),
      label:      label.trim() || "Untitled Document",
      url:        url.trim(),
      type,
      visibility,
      addedAt:    new Date().toISOString(),
    };
    onUpdate({ ...char, documents: [...docs, doc] });
    setAdding(false); setUrl(""); setLabel(""); setVisibility("public"); setError(null);
  };

  const removeDoc = id => onUpdate({ ...char, documents: docs.filter(d => d.id !== id) });

  const setDocVisibility = (id, vis) => onUpdate({
    ...char,
    documents: docs.map(d => d.id === id ? { ...d, visibility: vis } : d)
  });

  return (
    <div style={{ padding:"4px 0" }}>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div style={{ fontSize:13, color:"var(--text-muted)" }}>
          {docs.length === 0 ? "No documents linked yet." : `${docs.length} document${docs.length !== 1 ? "s" : ""} linked`}
        </div>
        {!readOnly && !adding && (
          <button onClick={()=>setAdding(true)}
            style={{ padding:"6px 14px", borderRadius:7, cursor:"pointer", fontSize:12,
              border:"1px solid var(--accent)", background:"rgba(var(--accent-rgb,201,162,39),0.1)",
              color:"var(--accent)" }}>
            + Add Document
          </button>
        )}
      </div>

      {/* Add form */}
      {adding && (
        <div style={{ padding:"14px", background:"var(--surface)", border:"1px solid var(--border)", borderRadius:9, marginBottom:16 }}>
          <div style={{ fontSize:12, color:"var(--text-muted)", marginBottom:10 }}>
            Paste a Google Docs, Sheets, Slides, or Drive link
          </div>
          <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://docs.google.com/…"
            style={{ width:"100%", background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)",
              padding:"9px 12px", borderRadius:7, fontSize:13, boxSizing:"border-box", marginBottom:8 }}/>
          <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Label (e.g. Session Notes, Backstory…)"
            style={{ width:"100%", background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text)",
              padding:"9px 12px", borderRadius:7, fontSize:13, boxSizing:"border-box", marginBottom:10 }}/>
          {/* Visibility selector */}
          <div style={{ marginBottom:10 }}>
            <div style={{ fontSize:11, color:"var(--text-muted)", marginBottom:6 }}>Visibility</div>
            <div style={{ display:"flex", gap:6 }}>
              {["public","dm","private"].map(v => (
                <div key={v} onClick={()=>setVisibility(v)}
                  style={{ flex:1, padding:"7px 4px", borderRadius:7, cursor:"pointer", textAlign:"center",
                    border:`1px solid ${visibility===v?"var(--accent)":"var(--border)"}`,
                    background:visibility===v?"rgba(var(--accent-rgb,201,162,39),0.1)":"var(--surface)",
                    transition:"all 0.15s" }}>
                  <div style={{ fontSize:14 }}>{visIcon(v)}</div>
                  <div style={{ fontSize:10, color:visibility===v?"var(--accent)":"var(--text-muted)", marginTop:2 }}>{visLabel(v)}</div>
                </div>
              ))}
            </div>
          </div>
          {error && <div style={{ fontSize:12, color:"var(--danger)", marginBottom:8 }}>{error}</div>}
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={addFromUrl}
              style={{ flex:1, padding:"8px", borderRadius:7, cursor:"pointer", fontSize:13,
                border:"1px solid var(--accent)", background:"rgba(var(--accent-rgb,201,162,39),0.1)", color:"var(--accent)" }}>
              Add Document
            </button>
            <button onClick={()=>{setAdding(false);setUrl("");setLabel("");setVisibility("public");setError(null);}}
              style={{ padding:"8px 16px", borderRadius:7, cursor:"pointer", fontSize:13,
                border:"1px solid var(--border)", background:"transparent", color:"var(--text-muted)" }}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* Empty state */}
      {docs.length === 0 && !adding && (
        <div style={{ textAlign:"center", padding:"40px 0", color:"var(--text-dim)", fontSize:13, fontStyle:"italic" }}>
          Paste links to Google Docs, Sheets, or any Drive file for quick access to backstory, session notes, and more.
        </div>
      )}

      {/* Document cards */}
      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {docs.map(doc => {
          const rgb = colourFor(doc.type).replace('#','').match(/../g).map(x=>parseInt(x,16)).join(',');
          const vis = doc.visibility || "public";
          return (
            <div key={doc.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 14px",
              background:"var(--surface)", border:"1px solid var(--border)", borderRadius:9, transition:"border-color 0.15s" }}
              onMouseEnter={e=>e.currentTarget.style.borderColor="var(--accent)"}
              onMouseLeave={e=>e.currentTarget.style.borderColor="var(--border)"}>
              <div style={{ width:36, height:36, borderRadius:8, flexShrink:0, display:"flex",
                alignItems:"center", justifyContent:"center", fontSize:20,
                background:`rgba(${rgb},0.12)` }}>
                {iconFor(doc.type)}
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:14,
                  overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                  {doc.label}
                </div>
                <div style={{ fontSize:11, color:"var(--text-dim)", marginTop:2, display:"flex", alignItems:"center", gap:8 }}>
                  <span>{doc.type === "doc" ? "Google Doc" : doc.type === "sheet" ? "Google Sheet" : doc.type === "slide" ? "Google Slides" : "Drive File"}</span>
                  <span style={{ color:visColour(vis) }}>{visIcon(vis)} {visLabel(vis)}</span>
                </div>
              </div>
              <div style={{ display:"flex", gap:6, flexShrink:0, alignItems:"center" }}>
                {/* Visibility toggle */}
                {!readOnly && (
                  <select value={vis} onChange={e=>setDocVisibility(doc.id, e.target.value)}
                    style={{ background:"var(--surface)", border:"1px solid var(--border)", color:"var(--text-muted)",
                      borderRadius:6, padding:"4px 6px", fontSize:11, cursor:"pointer" }}>
                    <option value="public">🌐 Public</option>
                    <option value="dm">🎲 DM Only</option>
                    <option value="private">🔒 Private</option>
                  </select>
                )}
                <a href={doc.url} target="_blank" rel="noopener noreferrer"
                  style={{ padding:"5px 12px", borderRadius:6, fontSize:12, textDecoration:"none",
                    border:"1px solid var(--border)", background:"var(--surface)", color:"var(--text-muted)",
                    cursor:"pointer", display:"inline-block" }}>
                  Open ↗
                </a>
                {!readOnly && (
                  <button onClick={()=>removeDoc(doc.id)}
                    style={{ padding:"5px 10px", borderRadius:6, fontSize:12, cursor:"pointer",
                      border:"1px solid var(--border)", background:"transparent", color:"var(--text-dim)" }}>
                    ×
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const setShareMode = async (mode) => {

            <div key={mode} onClick={()=>!shareLoading&&setShareMode(mode)}

function WeaponCard({ item, lib, proficient, hitBonus, abilMod }) {
  const [open, setOpen] = useState(false);
  const isRanged = lib?.range && !lib?.properties?.includes("thrown");

  const damageDice = lib?.damage || null;
  const damageStr = (() => {
    if (!lib?.damage) return item.description || "—";
    if (abilMod === 0) return `${lib.damage} ${lib.damageType}`;
    const sign = abilMod > 0 ? "+" : "−";
    return `${lib.damage} ${sign} ${Math.abs(abilMod)} ${lib.damageType}`;
  })();

  return (
    <div style={{ marginBottom:2 }}>
      {/* Compact row */}
      <div onClick={()=>setOpen(o=>!o)} style={{ display:"grid", gridTemplateColumns:"1fr 70px 90px 110px 28px", gap:0,
        padding:"7px 12px", cursor:"pointer", borderRadius:open?0:6, transition:"all 0.15s",
        background:open?"rgba(201,162,39,0.07)":"var(--surface)",
        border:`1px solid ${open?"var(--accent)":"var(--border)"}`,
        borderBottom: open ? "none" : `1px solid ${open?"var(--accent)":"var(--border)"}`,
        alignItems:"center" }}>
        {/* Name */}
        <div style={{ display:"flex", alignItems:"center", gap:6, minWidth:0 }}>
          <span style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:13, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.name}</span>
          {!proficient && <span style={{ fontSize:9, color:"#e67e22", padding:"1px 4px", border:"1px solid #e67e22", borderRadius:3, flexShrink:0 }}>!</span>}
        </div>
        {/* Range */}
        <div style={{ fontSize:11, color:"var(--text-muted)" }}>{lib?.range || "5 ft"}</div>
        {/* To Hit */}
        <div style={{ fontFamily:"var(--font-display)", color:"var(--info)", fontSize:15 }}>{modStr(hitBonus)}</div>
        {/* Damage */}
        <div style={{ fontSize:12, color:"var(--danger)" }}>
          {damageDice && <span style={{ fontFamily:"var(--font-display)" }}>{damageDice}</span>}
          {abilMod !== 0 && <span style={{ fontSize:11 }}> {abilMod>0?"+":"−"} {Math.abs(abilMod)}</span>}
          {!damageDice && <span style={{ color:"var(--text-dim)" }}>—</span>}
          {lib?.damageType && <span style={{ fontSize:10, color:"rgba(192,57,43,0.7)", marginLeft:3 }}>{lib.damageType}</span>}
        </div>
        {/* Expand toggle */}
        <div style={{ color:"var(--text-dim)", fontSize:10, textAlign:"right" }}>{open?"▲":"▼"}</div>
      </div>

      {/* Expanded details */}
      {open && (
        <div style={{ padding:"10px 14px", background:"rgba(0,0,0,0.15)", border:"1px solid var(--accent)", borderTop:"none", borderRadius:"0 0 6px 6px", marginBottom:4 }}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:8 }}>
            {[
              ["Type",       isRanged ? "Ranged" : "Melee"],
              ["Properties", lib?.properties?.join(", ") || "—"],
              ["Proficiency",proficient ? "✓ Yes" : "✗ No (no prof bonus to hit)"],
              ["Hit Bonus",  modStr(hitBonus)],
              ["Damage",     damageStr],
              ["Ability",    isRanged ? "DEX" : lib?.properties?.includes("finesse") ? "STR/DEX" : "STR"],
            ].map(([l,v])=>(
              <div key={l}>
                <div style={{ fontSize:9, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1, marginBottom:2 }}>{l}</div>
                <div style={{ fontSize:12, color:"var(--text)" }}>{v}</div>
              </div>
            ))}
          </div>
          {lib?.description && <div style={{ fontSize:11, color:"var(--text-dim)", fontStyle:"italic" }}>{lib.description}</div>}
        </div>
      )}
    </div>
  );
}

// ── FeatureAction — with uses tracking and rest buttons ──
function FeatureAction({ feat, char, onUpdate }) {
  const [open, setOpen] = useState(false);

  // Compute max uses
  const computeMax = uses => {
    if (!uses) return null;
    let max = uses.max;
    if (max === "charismaModifier")    max = Math.max(1, calcMod(char.abilities.cha));
    else if (max === "charismaModifier+1") max = Math.max(1, calcMod(char.abilities.cha) + 1);
    else if (max === "level*5")        max = char.level * 5;
    return max;
  };

  const maxUses = computeMax(feat.uses);
  const usesKey = `uses_${feat.name}`;
  const spentKey = `spent_${feat.name}`;

  // Spent uses stored on char.actionUses: { "uses_Rage": 2, ... }
  const spent = char.actionUses?.[spentKey] || 0;
  const remaining = maxUses !== null ? Math.max(0, maxUses - spent) : null;

  const markUsed = () => {
    if (remaining === null || remaining <= 0) return;
    onUpdate({ ...char, actionUses: { ...(char.actionUses||{}), [spentKey]: spent + 1 } });
  };
  const recover = (n) => {
    const newSpent = Math.max(0, spent - (n || maxUses));
    onUpdate({ ...char, actionUses: { ...(char.actionUses||{}), [spentKey]: newSpent } });
  };

  const restLabel = feat.uses?.per === "short" ? "Short Rest" : feat.uses?.per === "long" ? "Long Rest" : feat.uses?.per === "turn" ? "Next Turn" : null;

  return (
    <div style={{ background:"var(--surface)", border:`1px solid ${open?"var(--accent)":"var(--border)"}`, borderRadius:8, padding:"10px 12px", marginBottom:6, transition:"border-color 0.15s" }}>
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        {/* Name + note — click to expand */}
        <div style={{ flex:1, cursor:"pointer" }} onClick={()=>setOpen(o=>!o)}>
          <span style={{ fontFamily:"var(--font-display)", color:"var(--text)", fontSize:14 }}>{feat.name}</span>
          {feat.note && <span style={{ fontSize:11, color:"var(--text-muted)", marginLeft:8 }}>{feat.note}</span>}
        </div>

        {/* Uses tracker — only if limited */}
        {maxUses !== null && (
          <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
            {/* Pip dots — filled = available, empty = spent. Click filled to spend, click empty to restore */}
            <div style={{ display:"flex", gap:4 }}>
              {Array.from({length: maxUses}).map((_, i) => {
                const isSpent = i >= remaining; // pips filled from left, spent from right
                return (
                  <div key={i}
                    onClick={() => {
                      if (!isSpent) markUsed();     // filled pip → spend one
                      else if (spent > 0) recover(1); // empty pip → restore one
                    }}
                    style={{ width:14, height:14, borderRadius:"50%", cursor:"pointer",
                      border:`2px solid ${isSpent ? "var(--border)" : "var(--accent)"}`,
                      background: isSpent ? "transparent" : "var(--accent)",
                      transition:"all 0.15s" }}/>
                );
              })}
            </div>
            {/* Remaining count */}
            <span style={{ fontSize:12, color: remaining > 0 ? "var(--accent)" : "var(--text-dim)", fontFamily:"var(--font-display)", minWidth:28, textAlign:"center" }}>
              {remaining}/{maxUses}
            </span>
            {/* Use button */}
            {remaining > 0 && (
              <button onClick={markUsed} style={{ padding:"2px 8px", borderRadius:5, fontSize:11, cursor:"pointer", background:"rgba(var(--accent-rgb,201,162,39),0.15)", border:"1px solid var(--accent)", color:"var(--accent)" }}>Use</button>
            )}
            {/* Recover button */}
            {spent > 0 && restLabel && (
              <button onClick={recover} style={{ padding:"2px 8px", borderRadius:5, fontSize:11, cursor:"pointer", background:"rgba(39,174,96,0.1)", border:"1px solid var(--success)", color:"var(--success)" }}>↺ {restLabel}</button>
            )}
          </div>
        )}
        <span style={{ color:"var(--text-dim)", fontSize:10, cursor:"pointer", flexShrink:0 }} onClick={()=>setOpen(o=>!o)}>{open?"▲":"▼"}</span>
      </div>
      {open && feat.description && (
        <div style={{ marginTop:8, paddingTop:8, borderTop:"1px solid var(--border)", fontSize:13, color:"var(--text-muted)", lineHeight:1.6 }}>
          {feat.description}
        </div>
      )}
    </div>
  );
}

// ============================================================
// ACTIONS TAB
// ============================================================
function ActionsTab({ char, gameData, onUpdate }) {
  const { classes, species:speciesDb, standardActions=[] } = gameData;
  const classData   = classes?.[char.class];
  const speciesData = speciesDb?.[char.species];
  const subraceData = char.subrace ? speciesData?.subraces?.[char.subrace] : null;
  const pb          = profBonus(char.level);

  const [section, setSection] = useState("all");
  const show = key => section === "all" || section === key;

  const equippedWeapons = (char.inventory || []).filter(i => i.equipped && i.type === "weapon");

  const allClassFeats = [
    ...(classData?.features || []),
    ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || []),
  ];
  const extraAttackFeat = allClassFeats
    .filter(f => f.attackCount && char.level >= f.level)
    .sort((a, b) => b.attackCount - a.attackCount)[0];
  const attackCount = extraAttackFeat?.attackCount || 1;

  const weaponStats = item => {
    const lib = lookupLibraryItem(item.name, gameData);
    const proficient = lib ? isItemProficient(lib, char, classes) : false;
    const abilMod = lib?.properties?.includes("finesse")
      ? Math.max(calcMod(char.abilities.str), calcMod(char.abilities.dex))
      : lib?.category?.includes("Ranged") || lib?.category === "simpleRanged" || lib?.category === "martialRanged"
        ? calcMod(char.abilities.dex)
        : calcMod(char.abilities.str);
    const hitBonus = abilMod + (proficient ? pb : 0);
    return { lib, proficient, hitBonus, abilMod };
  };

  const allFeatures = [
    ...(classData?.features || []),
    ...((char.subclass && classData?.subclasses?.[char.subclass]?.features) || []),
    ...(speciesData?.features || []),
    ...(subraceData?.features || []),
  ].filter(f => f.actionType && char.level >= (f.level || 1));

  const byType = type => allFeatures.filter(f => f.actionType === type);

  const sHead = label => (
    <div style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:11, textTransform:"uppercase",
      letterSpacing:2, margin:"18px 0 8px", paddingBottom:5, borderBottom:"1px solid rgba(201,162,39,0.2)" }}>
      {label}
    </div>
  );

  const NAV = [
    ["all",      "All"],
    ["weapons",  "⚔️ Weapons"],
    ["standard", "📋 Standard"],
    ["class",    "⭐ Class & Racial"],
    ["bonus",    "⚡ Bonus"],
    ["reaction", "🔄 Reactions"],
  ];

  return (
    <div>
      {/* ── Category filter ── */}
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:4, paddingBottom:10, borderBottom:"1px solid var(--border)" }}>
        {NAV.map(([key, label]) => {
          const active = section === key;
          return (
            <button key={key} onClick={()=>setSection(key)} style={{
              padding:"5px 12px", borderRadius:20, cursor:"pointer", fontSize:12,
              fontFamily:"var(--font-display)", transition:"all 0.15s",
              border:`1px solid ${active?"var(--accent)":"var(--border)"}`,
              background:active?"rgba(201,162,39,0.1)":"var(--surface)",
              color:active?"var(--accent)":"var(--text-muted)" }}>
              {label}
            </button>
          );
        })}
      </div>

      {show("weapons") && (<>
        {sHead(`⚔️ Weapon Attacks${attackCount > 1 ? ` — ${attackCount} per Attack Action` : ""}`)}
        {equippedWeapons.length === 0
          ? <div style={{ fontSize:13, color:"var(--text-dim)", fontStyle:"italic" }}>No weapons equipped. Equip in Inventory.</div>
          : <><WeaponTableHeader/>{equippedWeapons.map(item => {
              const { lib, proficient, hitBonus, abilMod } = weaponStats(item);
              return <WeaponCard key={item.id} item={item} lib={lib} proficient={proficient} hitBonus={hitBonus} abilMod={abilMod}/>;
            })}</>
        }
      </>)}

      {show("standard") && (<>
        {sHead("📋 Standard Actions")}
        <StandardActionList actions={standardActions.filter(a=>a.actionType==="action")} />
      </>)}

      {show("class") && (byType("action").length > 0 || byType("special").length > 0) && (<>
        {sHead("⭐ Class & Racial Actions")}
        {byType("action").map(f=><FeatureAction key={f.name} feat={f} char={char} onUpdate={onUpdate}/>)}
        {byType("special").map(f=><FeatureAction key={f.name} feat={f} char={char} onUpdate={onUpdate}/>)}
      </>)}

      {show("bonus") && (<>
        {sHead("⚡ Bonus Actions")}
        <StandardActionList actions={standardActions.filter(a=>a.actionType==="bonus")} />
        {byType("bonus").map(f=><FeatureAction key={f.name} feat={f} char={char} onUpdate={onUpdate}/>)}
      </>)}

      {show("reaction") && (<>
        {sHead("🔄 Reactions")}
        <StandardActionList actions={standardActions.filter(a=>a.actionType==="reaction")} />
        {byType("reaction").map(f=><FeatureAction key={f.name} feat={f} char={char} onUpdate={onUpdate}/>)}
      </>)}

      {section === "all" && standardActions.filter(a=>a.actionType==="free").length > 0 && (<>
        {sHead("Other")}
        <StandardActionList actions={standardActions.filter(a=>a.actionType==="free")} />
      </>)}
    </div>
  );
}

// ============================================================
// REST MODAL
// ============================================================
function RestModal({ type, char, classData, onConfirm, onCancel }) {
  const isShort = type === "short";
  const hitDie  = classData?.hitDie || 8;
  const maxDice = char.hitDice?.max || char.level || 1;
  const curDice = char.hitDice?.current ?? maxDice;
  const conMod  = calcMod(char.abilities?.con || 10);

  const [diceToSpend, setDiceToSpend] = useState(0);

  const hpGain = (() => {
    if (!isShort || diceToSpend === 0) return 0;
    // Each die rolls average = (hitDie/2 + 0.5), we'll show expected; actual uses avg
    let total = 0;
    for (let i = 0; i < diceToSpend; i++) {
      total += Math.floor(Math.random() * hitDie) + 1 + conMod;
    }
    return Math.max(0, total);
  })();

  // What gets recovered
  const shortRecoveries = [
    "Action Surge (Fighter)",
    "Second Wind (Fighter)",
    "Bardic Inspiration (if Font of Inspiration)",
    "Ki points (Monk)",
    "Pact Magic slots (Warlock)",
    "Dark One's Luck (Fiend Warlock)",
  ].filter(r => {
    if (r.includes("Fighter") && char.class !== "Fighter") return false;
    if (r.includes("Monk") && char.class !== "Monk") return false;
    if (r.includes("Bard") && char.class !== "Bard") return false;
    if (r.includes("Warlock") && char.class !== "Warlock") return false;
    return true;
  });

  const longRecoveries = [
    "All HP restored to maximum",
    "Temporary HP cleared",
    "All spell slots restored",
    "Hit dice restored (up to half your maximum)",
    "All long rest abilities restored",
    "All short rest abilities restored (Warlock pact slots, Action Surge, etc.)",
    "All racial/heritage spell uses restored",
  ];

  const [rolled, setRolled] = useState(false);
  const [rolledHp, setRolledHp] = useState(0);

  const rollDice = () => {
    let total = 0;
    for (let i = 0; i < diceToSpend; i++) {
      total += Math.floor(Math.random() * hitDie) + 1 + conMod;
    }
    setRolledHp(Math.max(0, total));
    setRolled(true);
  };

  const confirm = () => {
    if (isShort) {
      const newHp = Math.min(char.hp.max, char.hp.current + (rolled ? rolledHp : 0));
      const newDice = Math.max(0, curDice - diceToSpend);
      onConfirm({
        hp: { ...char.hp, current: newHp },
        hitDice: { ...char.hitDice, current: newDice },
        // Clear short-rest action uses
        actionUses: Object.fromEntries(
          Object.entries(char.actionUses || {}).filter(([k]) => !k.startsWith("spent_") || true)
          // We clear uses tagged "short" — stored feature data has .uses.per
        ),
        spellSlots: char.class === "Warlock" ? {} : char.spellSlots,
      });
    } else {
      // Long rest: restore everything
      const restoredDice = Math.min(maxDice, curDice + Math.max(1, Math.floor(maxDice / 2)));
      onConfirm({
        hp:         { ...char.hp, current: char.hp.max, temp: 0 },
        hitDice:    { ...char.hitDice, current: restoredDice },
        spellSlots: {},
        actionUses: {}, // clears ALL uses — short and long rest abilities
      });
    }
  };

  const s = { padding:"10px 14px", borderRadius:8, background:"rgba(0,0,0,0.2)", border:"1px solid var(--border)", marginBottom:10, fontSize:13, color:"var(--text-muted)", lineHeight:1.7 };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.75)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center" }}
      onClick={e=>e.target===e.currentTarget&&onCancel()}>
      <div style={{ background:"var(--card)", border:`1px solid ${isShort?"var(--border)":"var(--accent)"}`, borderRadius:14, padding:28, maxWidth:460, width:"90%", boxShadow:"0 8px 48px rgba(0,0,0,0.7)" }}>
        <div style={{ fontFamily:"var(--font-display)", color: isShort?"var(--text)":"var(--accent)", fontSize:18, marginBottom:6 }}>
          {isShort ? "⏳ Short Rest" : "🌙 Long Rest"}
        </div>
        <div style={{ fontSize:13, color:"var(--text-muted)", marginBottom:16 }}>
          {isShort ? "Take a short rest (~1 hour). Spend hit dice to recover HP." : "Take a long rest (~8 hours). Restore HP, spell slots, and abilities."}
        </div>

        {isShort ? (<>
          <div style={s}>
            <div style={{ marginBottom:8, color:"var(--text)", fontFamily:"var(--font-display)", fontSize:14 }}>
              Hit Dice: {curDice}/{maxDice} (d{hitDie}) remaining
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ color:"var(--text-muted)", fontSize:13 }}>Dice to spend:</span>
              <button onClick={()=>setDiceToSpend(d=>Math.max(0,d-1))} style={{ width:28,height:28,borderRadius:6,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",cursor:"pointer",fontSize:16 }}>−</button>
              <span style={{ fontFamily:"var(--font-display)", color:"var(--accent)", fontSize:20, minWidth:24, textAlign:"center" }}>{diceToSpend}</span>
              <button onClick={()=>setDiceToSpend(d=>Math.min(curDice,d+1))} style={{ width:28,height:28,borderRadius:6,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",cursor:"pointer",fontSize:16 }}>+</button>
              {diceToSpend > 0 && !rolled && (
                <button onClick={rollDice} style={{ padding:"5px 14px",borderRadius:7,border:"1px solid var(--accent)",background:"rgba(201,162,39,0.1)",color:"var(--accent)",cursor:"pointer",fontSize:13,fontFamily:"var(--font-display)" }}>Roll</button>
              )}
              {rolled && <span style={{ color:"var(--success)", fontFamily:"var(--font-display)", fontSize:16 }}>+{rolledHp} HP</span>}
            </div>
            {diceToSpend > 0 && <div style={{ marginTop:6, fontSize:12, color:"var(--text-dim)" }}>
              Rolling {diceToSpend}d{hitDie} + {conMod >= 0 ? `+${conMod*diceToSpend}` : `${conMod*diceToSpend}`} CON ({conMod} per die)
            </div>}
          </div>
          {shortRecoveries.length > 0 && (
            <div style={s}>
              <div style={{ color:"var(--text)", marginBottom:4, fontFamily:"var(--font-display)", fontSize:13 }}>Also recovered:</div>
              {shortRecoveries.map(r=><div key={r} style={{ fontSize:12 }}>✓ {r}</div>)}
            </div>
          )}
        </>) : (
          <div style={s}>
            <div style={{ color:"var(--text)", marginBottom:6, fontFamily:"var(--font-display)", fontSize:13 }}>On long rest you recover:</div>
            {longRecoveries.map(r=><div key={r} style={{ fontSize:12, marginBottom:2 }}>✓ {r}</div>)}
            <div style={{ marginTop:8, fontSize:12, color:"var(--accent)" }}>
              Hit dice restored: {Math.min(maxDice, curDice + Math.max(1, Math.floor(maxDice/2)))} / {maxDice}
            </div>
          </div>
        )}

        <div style={{ display:"flex", gap:10, marginTop:16 }}>
          <button onClick={onCancel} style={{ flex:1, padding:"10px", borderRadius:8, border:"1px solid var(--border)", background:"transparent", color:"var(--text-muted)", cursor:"pointer", fontSize:13 }}>Cancel</button>
          <button onClick={confirm}
            disabled={isShort && diceToSpend > 0 && !rolled}
            style={{ flex:2, padding:"10px", borderRadius:8, border:`1px solid ${isShort?"var(--border)":"var(--accent)"}`,
              background:isShort?"var(--surface)":"var(--accent)",
              color:isShort?"var(--text)":"var(--bg)",
              cursor:(isShort&&diceToSpend>0&&!rolled)?"not-allowed":"pointer", fontSize:13,
              fontFamily:"var(--font-display)", opacity:(isShort&&diceToSpend>0&&!rolled)?0.5:1 }}>
            {isShort ? (diceToSpend > 0 && !rolled ? "Roll dice first" : "Take Short Rest") : "Take Long Rest"}
          </button>
        </div>
      </div>
    </div>
  );
}

function CharacterSheet({ char:initial, gameData, session, onBack, onDelete, onEdit, cloudSync, readOnly }) {
  const [char, setChar]   = useState(initial);
  const [tab,  setTab]    = useState("actions");
  const [saved, setSaved] = useState(false);
  const [imgError, setImgError] = useState(false);
  const [shareModal, setShareModal] = useState(false);
  const [shareCopied, setShareCopied] = useState(false);
  const [dmCopied,    setDmCopied]    = useState(false);
  const [restModal, setRestModal] = useState(null); // null | "short" | "long"
  const fileRef    = useRef(null);
  const saveTimer  = useRef(null);

  const { classes, species:speciesDb, themes, music } = gameData;
  const theme       = themes?.[char.theme] || themes?.[Object.keys(themes || {})[0]] || {};
  const classData   = classes?.[char.class];
  const speciesData = speciesDb?.[char.species];
  const subraceData = char.subrace ? speciesData?.subraces?.[char.subrace] : null;
  const pb          = profBonus(char.level);
  const saves       = getSavingThrows(char, classes);
  const skills      = getSkillBonuses(char);
  const isSpellcaster = !!getSpellcastingInfo(char, classes);

  const cloudSyncRef = useRef(cloudSync);
  useEffect(() => { cloudSyncRef.current = cloudSync; }, [cloudSync]);

  const upd = useCallback(u => {
    const s = { ...u, updatedAt: new Date().toISOString() };
    console.log("[upd] saving char:", s.name, "inv:", (s.inventory||[]).length, "items", s.id);
    setChar(s);
    // Save to localStorage immediately (no debounce) so refreshing always works
    const all = loadChars();
    const idx = all.findIndex(c => c.id === s.id);
    console.log("[upd] localStorage chars:", all.length, "found at idx:", idx);
    if (idx >= 0) all[idx] = s; else all.push(s);
    saveChars(all);
    // Cloud sync debounced to avoid hammering Supabase on every keystroke
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      if (cloudSyncRef.current) cloudSyncRef.current(s);
      setSaved(true); setTimeout(() => setSaved(false), 2000);
    }, 800);
  }, []);



  // Profile picture upload
  const handleImageUpload = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = "";
    const reader = new FileReader();
    reader.onload = ev => {
      const img = ev.target.result;
      const updated = { ...char, profileImage: img, updatedAt: new Date().toISOString() };
      setChar(updated);
      setImgError(false);
      // Save locally
      const all = loadChars();
      const idx = all.findIndex(x => x.id === initial.id);
      if (idx >= 0) all[idx] = updated; else all.push(updated);
      saveChars(all);
      // Save to cloud
      if (cloudSync) cloudSync(updated);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    };
    reader.readAsDataURL(file);
  };

  const TABS = [
    { id:"actions",    l:"⚔️ Actions"    },
    ...(isSpellcaster ? [{ id:"spells", l:"✨ Spells" }] : []),
    { id:"inventory",  l:"🎒 Inventory"  },
    { id:"features",   l:"⭐ Features"   },
    { id:"background", l:"📜 Background" },
    { id:"notes",      l:"✏️ Notes"      },
    { id:"documents",  l:"📁 Documents"  },
    ...(!readOnly ? [{ id:"settings", l:"⚙️ Settings" }] : []),
  ];

  const ts = active => ({
    padding:"7px 14px", cursor:"pointer", fontSize:13, whiteSpace:"nowrap",
    transition:"all 0.15s", fontFamily:theme.fontBody || "serif",
    background: active ? "var(--card)" : "transparent",
    color:      active ? theme.accent : "var(--text-muted)",
    border:     `1px solid ${active ? "var(--border)" : "transparent"}`,
    borderBottom: active ? `1px solid ${"var(--card)"}` : "none",
    borderRadius:"6px 6px 0 0",
  });

  const T = k => theme[k] || "var(--"+k.replace(/([A-Z])/g,m=>"-"+m.toLowerCase())+")";

  // HP colour
  const hpPct = char.hp.max > 0 ? char.hp.current / char.hp.max : 0;
  const hpColour = hpPct > 0.5 ? theme.success : hpPct > 0.25 ? "#f39c12" : theme.danger;

  // Stealthy / str warnings
  const stealthDisadv = hasStealthDisadvantage(char, gameData);
  const strWarnings   = strRequirementMet(char, gameData);

  // Build all speeds for the character
  const allSpeeds = (() => {
    const speeds = [];
    const spd = subraceData?.speed || speciesData?.speed || 30;
    speeds.push({ label: "Walk", value: `${spd}ft` });
    const climb = subraceData?.climbSpeed || speciesData?.climbSpeed;
    const swim  = subraceData?.swimSpeed  || speciesData?.swimSpeed;
    const fly   = subraceData?.flySpeed   || speciesData?.flySpeed;
    // Dhampir spider climb
    const hasSpiderClimb = [...(speciesData?.features||[]),...(subraceData?.features||[])].some(f => f.name === "Spider Climb");
    if (hasSpiderClimb) speeds.push({ label: "Climb", value: `${spd}ft` });
    if (climb && !hasSpiderClimb) speeds.push({ label: "Climb", value: `${climb}ft` });
    if (swim)  speeds.push({ label: "Swim",  value: `${swim}ft`  });
    if (fly)   speeds.push({ label: "Fly",   value: `${fly}ft`   });
    return speeds;
  })();

  // Quick combat stats (beside HP)
  const combatStats = [
    { l:"AC",       v: calcAC(char, gameData) },
    { l:"Init",     v: modStr(calcMod(char.abilities.dex)) },
    { l:"Prof",     v: `+${pb}` },
    { l:"Pass Perc",v: 10 + (skills["Perception"]?.value || 0) },
    ...(isSpellcaster ? [
      { l:"Spell DC",  v: calcSpellDC(char, classes) ?? "—" },
      { l:"Spell Atk", v: modStr(calcSpellAtk(char, classes) ?? 0) },
    ] : []),
  ];

  const [speedOpen, setSpeedOpen] = useState(false);

  const sectionLabel = txt => (
    <div style={{ fontFamily:theme.fontDisplay, color:"var(--accent-text)", fontSize:10, textTransform:"uppercase", letterSpacing:2, marginBottom:8, marginTop:16, paddingBottom:4, borderBottom:`1px solid rgba(var(--accent-rgb,201,162,39),0.15)` }}>{txt}</div>
  );

  return (
    <TW themeKey={char.theme} themes={themes} charCustom={char.custom || {}}>
      <input ref={fileRef} type="file" accept="image/*" onChange={handleImageUpload} style={{ display:"none" }}/>

      {/* ── Rest Modal ── */}
      {restModal && <RestModal
        type={restModal}
        char={char}
        classData={classData}
        onConfirm={(updates) => { upd({...char, ...updates}); setRestModal(null); }}
        onCancel={() => setRestModal(null)}
      />}
      {/* ── Sticky top bar ── */}
      <div style={{ background:"var(--card)", borderBottom:"2px solid var(--accent)", padding:"8px 16px", position:"sticky", top:0, zIndex:20 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <button onClick={onBack} style={{ background:"transparent", border:`1px solid ${"var(--border)"}`, color:"var(--text-muted)", padding:"4px 10px", borderRadius:6, cursor:"pointer", fontFamily:theme.fontBody, fontSize:12, flexShrink:0 }}>← Back</button>
          {/* Name */}
          <div style={{ flexShrink:0, minWidth:0 }}>
            <div style={{ fontFamily:theme.fontDisplay, fontSize:18, color:"var(--accent-text)", lineHeight:1.1 }}>{char.name}</div>
            <div style={{ fontSize:10, color:"var(--text-muted)", whiteSpace:"nowrap" }}>
              {[char.species && (char.subrace ? `${char.species} (${char.subrace})` : char.species), char.subclass ? `${char.class} (${char.subclass})` : char.class, `Lvl ${char.level}`].filter(Boolean).join(" · ")}
            </div>
          </div>
          {/* HP — compact inline with controls */}
          <div style={{ display:"flex", alignItems:"center", gap:6, flex:1, minWidth:0, margin:"0 8px" }}>
            <span style={{ fontFamily:theme.fontDisplay, fontSize:20, color:hpColour, lineHeight:1, flexShrink:0 }}>{char.hp.current}</span>
            <span style={{ color:"var(--text-dim)", fontSize:13, flexShrink:0 }}>/{char.hp.max}</span>
            {char.hp.temp > 0 && <span style={{ fontSize:10, color:theme.info, flexShrink:0 }}>+{char.hp.temp}</span>}
            <div style={{ flex:1, height:7, background:"var(--bg)", borderRadius:4, overflow:"hidden", minWidth:40 }}>
              <div style={{ height:"100%", width:`${Math.max(0,Math.min(100,(char.hp.current/Math.max(1,char.hp.max))*100))}%`, background:hpColour, borderRadius:4, transition:"all 0.3s" }}/>
            </div>
            <span style={{ fontSize:9, color:"var(--text-dim)", flexShrink:0 }}>HP</span>
            {/* Inline DMG / Heal controls */}
            <input id="hp-delta" placeholder="±" style={{ width:42, background:"var(--surface)", border:`1px solid ${"var(--border)"}`, color:"var(--text)", padding:"3px 5px", borderRadius:5, fontSize:13, textAlign:"center", fontFamily:theme.fontBody, flexShrink:0 }}
              onKeyDown={e => {
                if (e.key !== "Enter") return;
                const v = parseInt(e.target.value);
                if (isNaN(v) || v <= 0) return;
                upd({ ...char, hp: { ...char.hp, current: Math.min(char.hp.max, Math.max(0, char.hp.current - v)) } });
                e.target.value = "";
              }}/>
            <button onClick={()=>{ const el=document.getElementById("hp-delta"); const v=parseInt(el?.value); if(!isNaN(v)&&v>0){upd({...char,hp:{...char.hp,current:Math.min(char.hp.max,Math.max(0,char.hp.current-v))}}); if(el)el.value=""; } }} style={{ padding:"3px 7px", background:"rgba(192,57,43,0.15)", border:`1px solid ${theme.danger}`, color:theme.danger, borderRadius:5, cursor:"pointer", fontSize:11, flexShrink:0 }}>DMG</button>
            <button onClick={()=>{ const el=document.getElementById("hp-delta"); const v=parseInt(el?.value); if(!isNaN(v)&&v>0){upd({...char,hp:{...char.hp,current:Math.min(char.hp.max,char.hp.current+v)}}); if(el)el.value=""; } }} style={{ padding:"3px 7px", background:"rgba(39,174,96,0.15)", border:`1px solid ${theme.success}`, color:theme.success, borderRadius:5, cursor:"pointer", fontSize:11, flexShrink:0 }}>Heal</button>
            <button onClick={()=>setRestModal("short")} style={{ padding:"3px 6px", background:"var(--surface)", border:`1px solid ${"var(--border)"}`, color:"var(--text-muted)", borderRadius:5, cursor:"pointer", fontSize:10, flexShrink:0 }}>Short Rest</button>
            <button onClick={()=>setRestModal("long")}  style={{ padding:"3px 6px", background:"var(--surface)", border:"1px solid var(--accent)", color:"var(--accent-text)", borderRadius:5, cursor:"pointer", fontSize:10, flexShrink:0 }}>Long Rest</button>
          </div>
          {/* Controls */}
          <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
            <div style={{ opacity:saved?1:0, transition:"opacity 0.3s", padding:"2px 8px", borderRadius:20, background:"rgba(39,174,96,0.15)", border:`1px solid ${theme.success}`, color:theme.success, fontSize:10 }}>✓ Saved</div>
            {!readOnly && <>
              <div onClick={()=>upd({...char,inspiration:!char.inspiration})} title="Inspiration" style={{ width:22,height:22,borderRadius:5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,transition:"all 0.2s", border:`2px solid ${char.inspiration?"#ffd700":"var(--border)"}`, background:char.inspiration?"rgba(255,215,0,0.2)":"transparent" }}>{char.inspiration?"✦":"✧"}</div>
              {(char.shareMode === "public" || char.shareMode === "dm") && (
                <div style={{ display:"flex", gap:4 }}>

                  <button onClick={()=>{
                    navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?share=${char.id}-dm`);
