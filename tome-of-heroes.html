<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tome of Heroes — D&D 5e Character Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Philosopher:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 15px; }
    /* Ensure display font is always available — loaded from head link tag */
    :root { --default-display-font: 'Cinzel Decorative', serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d0d0f; }
    ::-webkit-scrollbar-thumb { background: #3a3a45; border-radius: 3px; }
    input, textarea, select { outline: none; }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }

    /* ── Character sheet readability boosts ── */
    /* Bump ALL small text in the sheet up a notch */
    [data-sheet] { font-size: 14px; }
    [data-sheet] .text-sm  { font-size: 13px; }
    [data-sheet] .text-xs  { font-size: 12px; }

    /* Tab labels */
    .sheet-tab-label { font-size: 13px !important; }

    /* Left column labels readable */
    .sheet-section-label { font-size: 11px !important; letter-spacing: 1.5px; }

    /* ── Floating symbol animations ── */
    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

    /* ── Crystal & Gem animations ── */
    @keyframes gemFloat {
      0%   { transform: translateY(0)      translateX(0px)   rotate(0deg)   scale(1);    opacity: 0; }
      6%   { opacity: 1; }
      30%  { transform: translateY(-30vh)  translateX(14px)  rotate(60deg)  scale(1.1);  }
      60%  { transform: translateY(-65vh)  translateX(-10px) rotate(140deg) scale(0.9);  }
      88%  { opacity: 0.9; }
      100% { transform: translateY(-120vh) translateX(8px)   rotate(200deg) scale(0.7);  opacity: 0; }
    }
    @keyframes gemSway {
      0%   { transform: translateY(0)      translateX(0px)   rotate(0deg)   scale(1);    opacity: 0; }
      6%   { opacity: 1; }
      25%  { transform: translateY(-25vh)  translateX(-18px) rotate(45deg)  scale(1.15); }
      50%  { transform: translateY(-55vh)  translateX(22px)  rotate(120deg) scale(0.95); }
      75%  { transform: translateY(-88vh)  translateX(-12px) rotate(175deg) scale(0.85); }
      90%  { opacity: 0.8; }
      100% { transform: translateY(-125vh) translateX(6px)   rotate(210deg) scale(0.6);  opacity: 0; }
    }
    @keyframes glint {
      0%,100% { opacity: 0;   transform: scale(0.4) rotate(0deg);   }
      10%     { opacity: 0;   }
      15%     { opacity: 1;   transform: scale(1.4) rotate(15deg);  }
      20%     { opacity: 0.3; transform: scale(0.8) rotate(25deg);  }
      25%     { opacity: 0.9; transform: scale(1.2) rotate(35deg);  }
      30%     { opacity: 0;   transform: scale(0.5) rotate(45deg);  }
    }
    @keyframes prismPulse {
      0%   { opacity: 0.06; filter: hue-rotate(0deg); }
      25%  { opacity: 0.14; filter: hue-rotate(30deg); }
      50%  { opacity: 0.08; filter: hue-rotate(-20deg); }
      75%  { opacity: 0.16; filter: hue-rotate(50deg); }
      100% { opacity: 0.06; filter: hue-rotate(0deg); }
    }
    @keyframes prismaticSweep {
      0%   { opacity: 0;    transform: translateX(-60%) skewX(-8deg); }
      15%  { opacity: 0.18; }
      50%  { opacity: 0.10; transform: translateX(0%)   skewX(0deg); }
      85%  { opacity: 0.18; }
      100% { opacity: 0;    transform: translateX(60%)  skewX(8deg); }
    }
    .crystal-prism {
      position: fixed; pointer-events: none; z-index: 0;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(105deg,
        transparent 0%,
        rgba(80,180,255,0.06) 20%,
        rgba(160,80,255,0.08) 35%,
        rgba(80,220,200,0.05) 50%,
        rgba(120,80,255,0.07) 65%,
        rgba(60,160,255,0.06) 80%,
        transparent 100%
      );
      animation: prismaticSweep 14s ease-in-out infinite;
    }
    .crystal-prism-2 {
      position: fixed; pointer-events: none; z-index: 0;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(75deg,
        transparent 0%,
        rgba(120,60,255,0.05) 25%,
        rgba(60,200,255,0.07) 45%,
        rgba(200,80,255,0.06) 60%,
        rgba(80,255,200,0.04) 75%,
        transparent 100%
      );
      animation: prismaticSweep 19s ease-in-out infinite reverse;
      animation-delay: -7s;
    }
    /* Prevent any content from expanding the character sheet width */
    .sheet-tab-content * {
      max-width: 100%;
      box-sizing: border-box;
    }
    .sheet-tab-content p,
    .sheet-tab-content div,
    .sheet-tab-content span {
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .sheet-tab-content pre {
      white-space: pre-wrap;
      max-width: 100%;
      overflow-x: hidden;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0)        translateX(0px)   rotate(0deg);  opacity: 0; }
      8%   { opacity: 1; }
      88%  { opacity: 0.7; }
      100% { transform: translateY(-130vh)   translateX(18px)  rotate(20deg); opacity: 0; }
    }
    @keyframes floatUpSway {
      0%   { transform: translateY(0)        translateX(0px)   rotate(0deg);  opacity: 0; }
      8%   { opacity: 1; }
      33%  { transform: translateY(-40vh)    translateX(22px)  rotate(5deg);  }
      66%  { transform: translateY(-85vh)    translateX(-14px) rotate(12deg); }
      88%  { opacity: 0.7; }
      100% { transform: translateY(-130vh)   translateX(8px)   rotate(20deg); opacity: 0; }
    }

    /* Snow falls DOWN */
    @keyframes snowfall {
      0%   { transform: translateY(-10vh) translateX(0px)   rotate(0deg);  opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 0.8; }
      100% { transform: translateY(110vh)  translateX(30px)  rotate(360deg); opacity: 0; }
    }
    @keyframes snowfallSway {
      0%   { transform: translateY(-10vh) translateX(0px)   rotate(0deg);  opacity: 0; }
      5%   { opacity: 1; }
      25%  { transform: translateY(25vh)  translateX(-20px) rotate(90deg); }
      50%  { transform: translateY(55vh)  translateX(15px)  rotate(180deg); }
      75%  { transform: translateY(80vh)  translateX(-10px) rotate(270deg); }
      100% { transform: translateY(110vh) translateX(5px)   rotate(360deg); opacity: 0; }
    }

    /* God rays / crepuscular light */
    @keyframes godRaySweep {
      0%   { opacity: 0;    transform: rotate(-2deg) scaleX(1);   }
      15%  { opacity: 1;    }
      50%  { opacity: 0.6;  transform: rotate(2deg)  scaleX(1.08); }
      85%  { opacity: 1;    }
      100% { opacity: 0;    transform: rotate(-2deg) scaleX(1);   }
    }
    @keyframes godRaySweep2 {
      0%   { opacity: 0;    transform: rotate(1deg)  scaleX(1);   }
      20%  { opacity: 0.7;  }
      50%  { opacity: 0.4;  transform: rotate(-1deg) scaleX(1.05); }
      80%  { opacity: 0.7;  }
      100% { opacity: 0;    transform: rotate(1deg)  scaleX(1);   }
    }

    .god-ray {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      top: -20vh;
      transform-origin: top center;
    }

    /* Frost rime at the edges */
    @keyframes frostPulse {
      0%,100% { opacity: 0.35; }
      50%      { opacity: 0.55; }
    }
    .frost-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(180,220,255,0.12) 0%, transparent 35%),
        radial-gradient(ellipse at 100% 0%, rgba(160,210,255,0.10) 0%, transparent 30%),
        radial-gradient(ellipse at 0% 100%, rgba(180,220,255,0.10) 0%, transparent 30%),
        radial-gradient(ellipse at 100% 100%, rgba(140,200,255,0.08) 0%, transparent 25%);
      animation: frostPulse 6s ease-in-out infinite;
    }

    /* ── Fire & Ember animations ── */
    @keyframes emberRise {
      0%   { transform: translateY(0)     translateX(0px)   scale(1);    opacity: 0; }
      5%   { opacity: 1; }
      30%  { transform: translateY(-30vh) translateX(12px)  scale(0.85); }
      60%  { transform: translateY(-65vh) translateX(-8px)  scale(0.6);  }
      85%  { opacity: 0.6; }
      100% { transform: translateY(-105vh)translateX(5px)   scale(0.2);  opacity: 0; }
    }
    @keyframes emberRiseSway {
      0%   { transform: translateY(0)     translateX(0px)   scale(1);    opacity: 0; }
      5%   { opacity: 1; }
      25%  { transform: translateY(-25vh) translateX(-15px) scale(0.9);  }
      50%  { transform: translateY(-55vh) translateX(18px)  scale(0.65); }
      75%  { transform: translateY(-80vh) translateX(-6px)  scale(0.4);  }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-108vh)translateX(10px)  scale(0.1);  opacity: 0; }
    }
    @keyframes flamePulse {
      0%,100% { opacity: 0.55; transform: scaleX(1)   scaleY(1); }
      25%     { opacity: 0.75; transform: scaleX(1.04) scaleY(1.02); }
      50%     { opacity: 0.45; transform: scaleX(0.96) scaleY(0.98); }
      75%     { opacity: 0.70; transform: scaleX(1.02) scaleY(1.03); }
    }
    @keyframes flamePulse2 {
      0%,100% { opacity: 0.40; transform: scaleX(1)   scaleY(1); }
      33%     { opacity: 0.60; transform: scaleX(1.06) scaleY(1.04); }
      66%     { opacity: 0.30; transform: scaleX(0.94) scaleY(0.97); }
    }
    @keyframes heatHaze {
      0%,100% { opacity: 0.18; }
      50%     { opacity: 0.30; }
    }
    @media (max-width: 640px) {
      .ws-page { padding: 12px 8px !important; }
      .ws-card  { padding: 12px 10px !important; }
    }
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    @keyframes heroGlow {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 0.85; }
    }
    @keyframes titlePulse {
      0%,100% { filter: drop-shadow(0 0 8px rgba(201,162,39,0.5)); }
      50%      { filter: drop-shadow(0 0 22px rgba(201,162,39,0.85)) drop-shadow(0 0 50px rgba(180,100,255,0.2)); }
    }

    /* Each symbol starts AT or BELOW the bottom of the viewport
       (top: 100vh to 120vh) and floats upward */
    .mystic-symbol {
      position: fixed;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      font-style: normal;
      line-height: 1;
      will-change: transform, opacity;
    }

    .tome-title-text {
      background: linear-gradient(135deg, #f0d060 0%, #c9a227 35%, #fff8dc 60%, #c9a227 80%, #8b6914 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite, titlePulse 3s ease-in-out infinite;
    }

    /* Subtle radial glow overlays */
    .bg-glow-tl {
      position: fixed; top: -20%; left: -10%; width: 60vw; height: 60vw;
      background: radial-gradient(ellipse, rgba(120,60,220,0.08) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
    .bg-glow-br {
      position: fixed; bottom: -20%; right: -10%; width: 55vw; height: 55vw;
      background: radial-gradient(ellipse, rgba(201,162,39,0.07) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
    .bg-glow-center {
      position: fixed; top: 30%; left: 30%; width: 40vw; height: 40vw;
      background: radial-gradient(ellipse, rgba(30,80,180,0.05) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
  </style>
</head>
<body>
<div id="root"></div>

<!-- ============================================================
  Game data lives in tome-data.json in the same folder.
  Edit that file to customise species, classes, backgrounds,
  spells, themes, music and more.

  RUNNING LOCALLY (browsers block fetch() on file://)
    Python  : python -m http.server 8000
    Node.js : npx serve .
    VS Code : Live Server extension → "Go Live"
  Then open http://localhost:8000
  GitHub Pages needs no extra steps.
  ============================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="./tome-app.js"></script>
</body>
</html>
